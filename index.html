EVENT: gunroom_intro
Title: The Gunroom
Place: ship
Tags: ship
Urgent
Once
Requires: day 2 or more, after 09:00, before 17:00

Mr Treharne brings the warrant officers aft to make their bows, in order of precedence and of their own opinion of themselves.

{master}, the master: {master_about}

{surgeon}, the surgeon: {surgeon_about}

{boatswain}, the boatswain: {boatswain_about}

{gunner}, the gunner: {gunner_about}

{carpenter}, the carpenter: {carpenter_about}

CHOICE: Say a civil word to each of them
Effects: gunroom +0.5; pass 30 minutes

CHOICE: Ask them to dine with you on Sunday
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to the whole gunroom.
Effects: cabin_stores -1; gunroom +1; gossip
Text: They come, in their best coats, and eat a great deal, and drink your health, and by the third bottle are talking freely, as you meant they should. {gossip}
Log: The gunroom dined with me.

CHOICE: Nod to them, and get on with the day's business


EVENT: gunroom_dinner
Title: The Gunroom Dines Aft
Effects: cabin_stores -1; gunroom +0.5; gossip; pass 3 hours

The gunroom dines with you in the great cabin: the lieutenant, the master, the surgeon and the purser, with Kinvig behind your chair and the decanter going round with the sun.

[if feud_lt_master] Mr Treharne and {master} address each other only through you, and only when they must.

Over the port the talk loosens, as you meant it should. {gossip}

CHOICE: Give them the King, and the ship
Log: The gunroom dined with me.


EVENT: master_drunk
Title: The Master
Place: sea
Tags: sea
Watch chance: 25
Requires: master_drunk, at_sea, not master_relieved, not master_arrested

{master} comes on deck at the change of the watch smelling strongly of rum. When he lays off the course on the slate his hand is not steady, and the reckoning he gives you is a bold one.

[if master is old_navy] He tells you, unasked, that he was navigating ships before you were breeched.

CHOICE: Send him below, and have Mr Treharne keep the reckoning
Effects: set master_relieved; clear master_drunk; reveal master drunkard; master_loyalty -1
Text: He goes, with the dignity of a man who knows exactly how drunk he is. Mr Treharne takes the slate without a word.
Log: The master being unfit for duty, ordered him below.

CHOICE: Overlook it
Effects: clear master_drunk; reveal master drunkard
Text: You say nothing. The master goes on working his reckoning, and you go on wondering about it.

CHOICE: Put him under arrest
Effects: set master_arrested; clear master_drunk; reveal master drunkard; master_loyalty -2
Text: He is sent below under arrest, and Mr Treharne keeps the reckoning until you choose to release him. The gunroom is very quiet at dinner.
Log: Put the master under arrest for drunkenness.


EVENT: reckoning_out
Title: The Reckoning
Place: sea
Tags: sea
Urgent
Requires: reckoning_out
Effects: clear reckoning_out

The land has come up a long way from where the master's reckoning put it. {master} looks at the chart, and at the land, and at the chart again, and says that the current hereabouts is very deceptive.

CHOICE: Accept it

CHOICE: Ask Mr Treharne quietly what he thinks
Effects: reveal master drunkard
Text: Mr Treharne considers. [His answer depends on what he knows, and he says only what he knows.] 'The current is what it always was, sir,' he says at last, which is as much as one officer will say of another.

CHOICE: Tell {master} you expect a better reckoning
Effects: master_loyalty -0.5
Text: 'Aye aye, sir,' says the master, stiffly.


EVENT: surgeon_drunk
Title: The Sick-Bay
Tags: sea, ship
Watch chance: 15
Requires: surgeon_drunk, sick 3 or more

The surgeon's mate comes aft to say that {surgeon} is indisposed, and that there are men in the sick-bay he does not know what to do for.

CHOICE: Send Kinvig to him with a pot of strong coffee
Effects: clear surgeon_drunk; reveal surgeon drunkard; surgeon_loyalty -0.5
Text: Kinvig goes, and comes back, and says only, 'He's up, sir.'

CHOICE: Go down to the sick-bay yourself
Effects: clear surgeon_drunk; reveal surgeon drunkard; morale +0.2; pass 1 hour
Text: You go down, and the sick men see you go down. It does them more good, very likely, than anything the surgeon would have done.

CHOICE: Let it be
Effects: clear surgeon_drunk; sick +2


EVENT: offence_drunk
Title: Drunk on Duty
Tags: sea, ship
Weight: 1, +0.4 per leniency, -0.15 per severity, -0.6 if boatswain is methodist
Requires: day 2 or more
Effects: pick man

The boatswain's mate brings {man}, seaman, to the mast: found drunk in his watch, with a bottle of wine stowed in the cable-tier, and a great deal to say about it.

CHOICE: Let him off with a warning
Effects: punish pass; morale +0.1
Text: He goes forward grinning. So, a little later, does the story.

CHOICE: Stop his grog for a week
Effects: punish grog
Log: Stopped {man}'s grog for a week, for drunkenness.

CHOICE: Have him started
Effects: punish start; morale -0.1
Text: The boatswain's mate starts him forward with a rope's end, as he has started a great many men before.
Log: Started {man}, seaman, for drunkenness.

CHOICE: Seize him up, and give him a dozen
Effects: punish flog; morale -0.3
Text: All hands are turned up to witness punishment. The grating is rigged, the Articles of War are read, and he takes his dozen without a sound. The people go back to their work in silence.
Log: Punished {man}, seaman, with twelve lashes for drunkenness.


EVENT: offence_theft
Title: A Thief
Tags: sea, ship
Weight: 0.7, +0.3 per leniency, -0.1 per severity
Requires: day 3 or more
Effects: pick man

{man}'s messmates bring him aft themselves: a silver watch belonging to one of them has been found in his bag. They stand round him in a ring, and there is no doubt at all what they expect.

CHOICE: Let him off with a warning
Effects: punish pass; morale -0.4
Text: The messmates go forward without a word. That night {man} is found at the foot of the fore-hatch with two black eyes, and nobody saw anything.

CHOICE: Stop his grog, and turn him out of the mess
Effects: punish grog; morale -0.1
Log: Stopped {man}'s grog, for theft.

CHOICE: Seize him up, and give him a dozen
Effects: punish flog; morale +0.1
Text: He is flogged at the gangway before the ship's company. Theft from a messmate is the one crime the lower deck will not forgive, and nobody pities him.
Log: Punished {man}, seaman, with twelve lashes for theft.


EVENT: offence_insolence
Title: Insolence
Tags: sea, ship
Weight: 0.8, +0.3 per leniency, +0.8 if old_faction, -0.1 per severity
Requires: day 3 or more
Effects: pick man

{boatswain} comes aft, very red in the face. {man}, one of the late captain's men, has told him in the hearing of the whole watch what he may do with his orders.

CHOICE: Let it pass
Effects: punish pass; boatswain_loyalty -0.5
Text: {boatswain} hears your decision, says 'Aye aye, sir,' in a voice like a closing door, and goes forward.

CHOICE: Have him started
Effects: punish start; morale -0.1
Log: Started {man}, seaman, for insolence to the boatswain.

CHOICE: Seize him up, and give him a dozen
Effects: punish flog; morale -0.3; boatswain_loyalty +0.5
Log: Punished {man}, seaman, with twelve lashes for insolence to his superior officer.


EVENT: sea_lawyer_petition
Title: A Petition
Tags: sea, ship
Once
Weight: 2
Requires: sea_lawyer, day 4 or more
Effects: pick man; reveal sea_lawyer

{man}, an able seaman of the larboard watch, comes aft with his hat in one hand and a paper in the other: a petition from the people, written out fair, setting forth that the beef is short of weight, and quoting the purser's instructions chapter and verse.

CHOICE: Hear him out, and look into it
Effects: morale +0.5; reveal purser light_fingered
Text: You read it through. It is well written, very well written, and some of it is true.

CHOICE: Tell him the proper course is through his officers
Effects: morale -0.3

CHOICE: Disrate him, and stop his grog
Effects: punish grog; morale -0.5; clear sea_lawyer
Text: He hears it without a change of face, and goes forward, and the forecastle hears it too.
Log: Disrated {man}, able seaman, and stopped his grog, for presenting a petition contrary to the Articles of War.


EVENT: irish_cornish
Title: A Fight Below
Tags: sea, ship
Once
Weight: 2
Requires: irish_gang, day 3 or more
Effects: reveal irish_gang

There is a roar from the berth-deck, and the officer of the watch comes aft to report a fight: the Irishmen from the Plymouth press against the Cornishmen of the starboard watch, with mess kids and a capstan bar, and three men already in the sick-bay.

CHOICE: Flog the ringleaders of both parties
Effects: punish flog; morale -0.3; sick +2
Log: Punished the ringleaders of a riot on the berth-deck, twelve lashes each.

CHOICE: Mess them apart, and keep them apart
Effects: sick +2
Text: The purser's steward redraws the messes. It answers, after a fashion.

CHOICE: Put them to work together under {boatswain}
Effects: sick +2
Chance 40, +12 per boatswain_leadership:
Effects: clear irish_gang; morale +0.4
Text: {boatswain} works them together for a week at the dirtiest jobs in the ship, until they hate him a great deal more than they hate each other. It is a kind of peace.
Otherwise:
Effects: morale -0.3
Text: It ends in another fight, in the hold this time.


EVENT: jonah
Title: A Jonah
Tags: sea
Once
Weight: 2
Requires: jonah, day 6 or more
Effects: pick man; reveal jonah

The people have decided who the Jonah is: {man}, a landsman with a squint and a habit of whistling in the dog watches. Nobody will mess with him, and the cook will not serve him.

CHOICE: Take him aft as your own servant, where they cannot get at him
Effects: clear jonah; morale +0.2
Text: Kinvig receives him with silent contempt, and teaches him to clean silver.

CHOICE: Tell them it is a heathen superstition
Effects: morale -0.3
Text: They hear you respectfully, and go on believing it.

CHOICE: Promise to put him ashore at the first opportunity
Effects: set jonah_to_land; clear jonah; morale +0.3


EVENT: old_faction
Title: The Late Captain's Men
Tags: sea, ship
Once
Requires: old_faction, day 3 or more
Effects: reveal old_faction

The late captain's followers have kept together since you came aboard: the same mess, the same watch, the same way of looking at a new officer as though he were weather. Their leader is the captain of the foretop, a big quiet man named Hext, whom the others mind before they mind anyone.

CHOICE: Break them up among the watches
Effects: clear old_faction; morale -0.3
Text: The watch bill is redrawn. They take it as it is meant.

CHOICE: Rate Hext boatswain's mate
Effects: clear old_faction; morale +0.3; boatswain_loyalty -0.5
Text: Hext touches his hat and says nothing. The late captain's men are your men now, more or less, and {boatswain} has a mate he did not choose.

CHOICE: Leave them be


EVENT: gunroom_feud
Title: A Quarrel at Dinner
Tags: sea, ship
Once
Requires: feud_lt_master, day 3 or more
Effects: reveal feud_lt_master

Mr Treharne and {master} fall out at dinner in the gunroom, over a point of the reckoning, in voices that carry through the bulkhead to the cabin. By the time the steward brings the cheese they have reached the subject of each other's characters.

CHOICE: Send for them both, and make them shake hands
Chance 45, +10 per lieutenant_leadership:
Effects: clear feud_lt_master; lieutenant_loyalty +0.5; master_loyalty +0.5
Text: They shake hands, stiffly, in your presence. Whether it holds is another matter, but it is a beginning.
Otherwise:
Effects: lieutenant_loyalty -0.5; master_loyalty -0.5
Text: They shake hands, because you tell them to, and do not speak again for a week.

CHOICE: Take Mr Treharne's part
Effects: lieutenant_loyalty +1; master_loyalty -1

CHOICE: Take the master's part
Effects: lieutenant_loyalty -1; master_loyalty +1


EVENT: scurvy
Title: The Scurvy
Tags: sea
Urgent
Once
Requires: scurvy, at_sea

{surgeon} comes aft with a grave face. There is scurvy in the ship: spongy gums, old wounds opening again, men too weak to go aloft who were well a fortnight since. Lemon juice would stop it, or fresh greens; he has neither.

CHOICE: Bear up for Mahon, and fresh provisions
Requires: not voyage homeward
Effects: voyage homeward; set returned_for_scurvy
Log: The scurvy being in the ship, bore up for Mahon.

CHOICE: Stand on, and trust to the end of the cruise
Effects: morale -0.3


EVENT: burial
Title: Burial at Sea
Tags: sea
Urgent
Requires: death, at_sea
Effects: clear death

{dead} is sewn into his hammock by the sailmaker, with two round shot at his feet and the last stitch through his nose, as the custom is. The ship's company is turned up, the colours half-masted, and the body laid on a grating at the gangway under the flag.

CHOICE: Read the service yourself
Effects: morale +0.2
Text: You read it from the prayer book, as steadily as you can. At "we therefore commit his body to the deep" the grating is tilted, and he is gone.
Log: Committed the body of {dead} to the deep.

CHOICE: Have Mr Treharne read it
Log: Committed the body of {dead} to the deep.


EVENT: round_robin
Title: A Round Robin
Tags: sea, ship
Urgent
Once
Requires: morale -3 or less, day 5 or more

A paper is found nailed to the capstan at dawn: a round robin, its signatures written in a circle so that no man's name stands first. It sets out the people's grievances in plain words, and says that they will not bear them much longer.

CHOICE: Read it aloud to the ship's company, and answer it
Effects: morale +1.2; severity -1
Text: You read it out, every word, and answer every point of it, and promise what you can promise. They hear you in a silence that is not hostile, quite.
Log: A paper of grievances being found, read it to the ship's company and answered it.

CHOICE: Find the man who wrote it, and flog him
Effects: punish flog; morale -1; severity +2
Text: Nobody will say who wrote it, and in the end it is the sea-lawyer who is seized up, because it might as well be him.
Log: Punished a seaman with twelve lashes for mutinous assembly.

CHOICE: Have it taken down, and say nothing
Effects: morale -0.5
</script>

# ------------------------------------------------------------
# Written orders, as the player reads them under Orders.
# A line starting with ">" is set to the right, like a signature.

ORDERS: cruise_catalan
Heading: A cruise on the coast of Catalonia
Go to: cape_sebastian
Cruise: cape_sebastian to cape_salou
Station: 42 days

By Sir Robert Lessingham, Knight of the Most Honourable Order of the Bath, Vice-Admiral of the White, and Commander-in-Chief of His Majesty's Ships and Vessels employed and to be employed in the Mediterranean.

You are hereby required and directed, so soon as His Majesty's Sloop under your command shall be in all respects ready, to put to sea and proceed off the coast of Catalonia, where you are to cruise between Cape San Sebastián and Cape Salou for the annoyance of the enemy and the protection of the trade of His Majesty's subjects, taking or destroying all such ships and vessels belonging to the enemy as you may fall in with.

You are to continue upon this service for the space of six weeks, unless want of provisions or other unavoidable circumstance shall oblige you to return sooner, and then repair to Port Mahon for further orders.

You are to be particularly careful not to molest the ships and vessels of powers in amity with His Majesty, unless they shall be found carrying the property of the enemy or contraband of war.

> Given under my hand at Port Mahon, {issued}.
> R. Lessingham

To {name} Esquire, Commander of His Majesty's Sloop *{ship}*.

> By command of the Vice-Admiral,
> Thos. Pardoe


ORDERS: convoy_toulon
Heading: Victuallers to the squadron off Toulon
Go to: toulon
Convoy speed: 5 knots
Station: 0 days

By Sir Robert Lessingham, Knight of the Most Honourable Order of the Bath, Vice-Admiral of the White, and Commander-in-Chief of His Majesty's Ships and Vessels employed and to be employed in the Mediterranean.

You are hereby required and directed to take under your protection the victuallers named in the margin, and so soon as they and His Majesty's Sloop under your command shall be in all respects ready, to proceed with them with all convenient dispatch to the squadron employed off Toulon, and there deliver them to the senior officer, together with the letter herewith enclosed.

You are to use every means in your power to keep the said victuallers together and protect them from the enemy, and on no account to part company with them, nor to go in chase out of sight of them, upon any pretence whatever.

Having delivered them, you are to return without loss of time to Port Mahon for further orders.

In the margin: the *Ann and Mary*, the *Providence*, and the *Three Brothers*, victuallers.

> Given under my hand at Port Mahon, {issued}.
> R. Lessingham

To {name} Esquire, Commander of His Majesty's Sloop *{ship}*.

> By command of the Vice-Admiral,
> Thos. Pardoe


ORDERS: despatches_hebe
Heading: Despatches for the Hebe off Barcelona
Go to: barcelona
Cruise: barcelona to cape_salou
Station: 14 days

By Sir Robert Lessingham, Knight of the Most Honourable Order of the Bath, Vice-Admiral of the White, and Commander-in-Chief of His Majesty's Ships and Vessels employed and to be employed in the Mediterranean.

You are hereby required and directed to receive from my Secretary the packet herewith delivered, addressed to Captain Wyatt of His Majesty's Ship *Hebe*, and to proceed with all possible dispatch off Barcelona, where you will find the *Hebe* cruising, and deliver the said packet into Captain Wyatt's own hand, taking his receipt for the same.

Having so done, you are at liberty to cruise for the space of fourteen days between Barcelona and Cape Salou for the annoyance of the enemy, and then to return to Port Mahon for further orders.

Should you at any time be in danger of capture, you are to sink the packet, which is weighted for that purpose.

> Given under my hand at Port Mahon, {issued}.
> R. Lessingham

To {name} Esquire, Commander of His Majesty's Sloop *{ship}*.

> By command of the Vice-Admiral,
> Thos. Pardoe
</script>

<script type="text/plain" class="content" data-name="Glossary">
GLOSSARY
Master and Commander | commander | commanders: The rank between lieutenant and post-captain, carrying command of a sloop. "Master and Commander" was the older title; the Admiralty shortened it to "Commander" in 1794, though the long form lingered in speech. Aboard his own ship a commander is called "Captain" by courtesy.
post-captain | made post: A captain on the Navy List, commanding a rated ship of twenty guns or more. Once posted, an officer rose by seniority alone towards an admiral's flag.
sloop: In Navy usage, any vessel commanded by a commander rather than a post-captain, usually of ten to eighteen guns, whether ship- or brig-rigged.
brig-sloop | brig: A sloop rigged as a brig: two masts, both square-rigged. Handier and cheaper than a ship-rigged sloop, and the commonest small cruiser of the war.
Commander-in-Chief | Admiral: The admiral commanding all the King's ships on a station, here the Mediterranean. He issues orders, fills vacancies, and takes a share of every prize taken under his command.
Vice-Admiral | Vice-Admiral of the White: The flag rank between rear-admiral and admiral. Each flag rank was divided by the colour of its squadron (Red, White and Blue), and an officer rose through them by seniority alone.
Order of the Bath | Most Honourable Order of the Bath: An order of knighthood given, among others, to admirals for distinguished service. It entitled the holder to "Sir".
flag captain: The captain of an admiral's flagship, and very often his right hand.
secretary: An admiral's secretary was a civilian who ran his correspondence and orders. A great deal of patronage passed through his hands.
commission: The written appointment of an officer to a particular ship. Read aloud to the ship's company, it gives him his authority over them.
reading in | read yourself in: Taking command by reading one's commission aloud to the assembled ship's company. Until he has done so, a new captain has no authority aboard.
orders | sealed: Written instructions from a superior. Every orders began "You are hereby required and directed", and an officer who departed from them answered for it.
all convenient dispatch | all possible dispatch: Formulas in orders. "Convenient" allowed a little latitude; "possible" allowed none.
in all respects ready: The phrase in orders meaning stored, watered, manned and fit for sea.
annoyance of the enemy: The phrase in cruising orders for attacking his trade and shipping.
in amity: At peace with. Neutral ships could be stopped and searched, but taking one without cause cost the captor heavy damages.
contraband of war: Goods a neutral may not carry to a belligerent, such as arms, powder, and naval stores. Their discovery made a neutral ship lawful prize.
coasting trade: Small vessels carrying goods from port to port along a coast. Spain, with bad roads, depended on it.
victualler | victuallers: A merchant ship hired to carry provisions out to the fleet.
squadron off Toulon: The British ships keeping watch on the French fleet in Toulon. Victuallers and despatches were forever being sent to it.
packet: A bundle of official letters. Despatches were weighted with lead, so that they could be sunk if capture threatened.
eighth: Under the prize rules, one eighth of every prize went to the flag officer under whose orders the captor sailed, whether he had been within a hundred miles of it or not.
storeship: A vessel carrying naval stores (cordage, canvas, spars, provisions) out to a foreign station.
bumboat: A shore boat that sells fruit, drink, tobacco and small wares to ships in harbour.
ruined fort: Fort St Philip at the mouth of Mahon harbour, demolished by the Spanish after they retook Minorca in 1782. The British found it in ruins when they captured the island again in 1798.
Mahon | Port Mahon: The capital and harbour of Minorca, one of the finest anchorages in the Mediterranean, and in British hands from 1798.
Minorcan: A native of Minorca. The islanders speak their own form of Catalan, and many remembered an earlier British occupation that ended in 1782.
island tongue: Minorcan, a form of Catalan. "Allà" means "there".
Governor | His Excellency: The general commanding the garrison of Minorca, who also governed the island. A distant and exalted figure to a sea officer.
garrison | regiment | redcoats: The British soldiers holding Minorca. The army and the navy dined together, gambled together, and did not much like one another.
card | leave your card: A newly arrived officer left his visiting card at the houses of people of consequence. An invitation, or nothing, followed.
whist | rubber: The favourite card game of officers of both services, played by four in two partnerships. A rubber is the best of three games.
half-crown points | half-crown: A half-crown was two shillings and sixpence. At half-crown points a bad evening could cost a commander a week's pay.
quadrilles: A dance for four couples in a square, newly fashionable.
lace: Gold lace on a uniform coat. The amount of it showed rank, and to some degree vanity.
epaulette: The gold shoulder ornament ordered for sea officers in 1795. A commander wore one on the left shoulder; a post-captain one on the right until he had three years' seniority, then two.
guinea | guineas: A gold coin worth twenty-one shillings.
prize agent | agent for prizes | navy agent | agent: A man of business who drew a sea officer's pay and saw his prizes through the courts and the sale, for a commission. Many advanced money against pay or prizes to come. Some failed, and took their clients' money with them.
letter of attorney: The paper by which an officer gave his agent power to act and receive money for him.
counting-house: A merchant's office, where his clerks kept his books.
five per cent | per cent: Five per cent a year was the most interest the usury laws allowed a lender to charge.
exchange on London: The rate at which bills of exchange drawn on London could be bought or sold abroad; the merchant's barometer.
Master Attendant: The officer of a dockyard in charge of the ships in harbour, their moorings, and the masting and rigging of them.
Navy Board: The board that built, repaired and stored the King's ships and ran the dockyards. It sent out stores, generally the wrong ones.
requisitions: Written demands for stores, made out in the proper form and countersigned. Without one, nothing could be issued.
mast pond: A pond where mast timber was kept under water so that it would not dry and split.
sheer hulk: An old hull fitted with sheers, a tall lifting frame, for stepping and taking out ships' masts.
caulkers | seams: Caulkers drive oakum into the seams between a ship's planks and pay them over with hot pitch to keep the water out.
Ordnance | Storekeeper of the Ordnance | Ordnance wharf | gun wharf: The Board of Ordnance, separate from the Navy, supplied the fleet's guns, powder and shot from its own gun wharfs, under its own storekeepers. A ship's guns could not be changed without an order.
carronade | carronades: A short, light gun of large bore, first cast by the Carron Company in Scotland. Devastating at close range, poor at long, and worked by fewer men than a long gun. Mounted on a slide rather than a wheeled carriage.
six-pounder | six-pounders | long guns: A long gun firing a six-pound ball: accurate, and good at long range, but light in weight of metal.
weight of metal: The total weight of shot a ship can fire in one broadside.
slides: The mounting of a carronade, which recoils along a slide pivoted at the ship's side rather than on wheels.
sway: To hoist something heavy, such as a gun or a mast.
lighter: A flat-bottomed barge for carrying goods and guns between ship and shore.
privateer: A privately owned ship of war, licensed by her government to take enemy merchant ships for profit.
surveyors: Dockyard officers who examined a captured ship to decide whether she was worth buying into the service.
over-sparred: Carrying masts and yards too large for her hull: fast, but crank and wet.
Navy List | followers: A senior officer's followers were the junior officers and men he took with him from ship to ship, and pushed for promotion.
most obedient humble servant: The ordinary close of a formal letter.
sanding: Sprinkling fine sand over wet ink to dry it.
claret: Red wine of Bordeaux. In wartime it came by prize, or by smugglers, or with a story attached.
Manxman: A native of the Isle of Man.
capstan: The great upright drum, turned by men pushing on bars, that heaves in the anchor cable.
cable | cables: The great rope by which a ship rides to her anchor. As a measure of distance, a cable is a tenth of a sea mile, about two hundred yards.
unmoor | moorings: A ship moored in harbour lay to two anchors or to a fixed mooring; unmooring was the first business of getting under way.
falls off | gathers way: A ship falls off when her head swings away from the wind, and gathers way as she begins to move through the water.
topsails: The second sails up each mast and the workhorse of the square rig; a ship under topsails alone is under easy control.
hospital: The naval hospital at Mahon, built by the British on its own island in the harbour in the early years of the century before.
polacre: A Mediterranean merchant vessel whose masts are single poles without tops. Common out of Naples, Genoa and the Levant.
prize: An enemy vessel captured at sea. Once condemned by a prize court, she and her cargo are sold and the proceeds shared among the captors.
yards: The spars across the masts from which the square sails hang. In harbour a smart ship keeps them "square", at exact right angles to the keel.
Boat ahoy: The hail to an approaching boat. The answer told the ship who was in it: an officer's boat answered "Aye aye", a captain's boat answered with the name of his ship.
side-boys: Boys or seamen stationed at the gangway to attend an officer coming aboard.
boatswain's call: The boatswain's silver pipe, used to pass orders and to pipe officers over the side.
gangway: The opening in the ship's side where people come aboard.
battens: Wooden steps fixed up the ship's side.
waist: The middle part of the upper deck, between the quarterdeck and the forecastle.
launch: The largest of a ship's boats, used for heavy work such as carrying out anchors and fetching water.
midshipman: A young gentleman serving as an officer in training. After six years at sea and an examination he might be made lieutenant.
gunroom: In a sloop, the mess of the lieutenant, master, surgeon and purser.
cable-tier: The place deep in the ship where the great anchor cables are coiled down.
seventy-four: A ship of the line of seventy-four guns, the backbone of the battle fleet.
quarterdeck: The raised deck aft, from which the ship is commanded. The captain's ground.
break of the quarterdeck: The forward edge of the quarterdeck, where it drops to the waist.
breechings: The heavy ropes that check a gun's recoil.
galley: The ship's kitchen.
berth-deck: The deck below, where the men sling their hammocks.
complement: The number of men a ship is established to carry.
the people | her people: The ship's company below the officers.
captains of the tops: Leading seamen, each in charge of the men working one mast's rigging aloft.
gunner's mates: Petty officers under the gunner, in charge of the guns and their crews.
prime seamen: Experienced sailors who can hand, reef and steer.
receiving ship: A hulk where pressed men and volunteers were held until drafted to ships.
press | pressed: The impressment service, which took seafaring men for the Navy by force.
all hands: The whole ship's company.
turned up: Called on deck by the boatswain and his mates.
fleet action: A battle between fleets of ships of the line.
marines: Soldiers carried aboard for sentry duty, musketry and boarding. A sloop had perhaps fifteen, under a sergeant.
great cabin: The captain's quarters at the stern.
swinging cot: A wooden-framed canvas bed slung from the deck beams.
quarter-gallery: A small enclosed gallery projecting from the stern quarter, holding the captain's privy.
at quarters: At action stations, when every man goes to his place for battle.
steward: The captain's servant, who keeps his table, wine and private stores.
cabin stores: A captain bought his own table: wine, poultry, livestock and delicacies, at his own expense. Entertaining was expected of him, and it ruined many.
cross them | crossed: Writing a second set of lines across the first, at right angles, to save paper and postage.
lieutenant of marines: A marine officer. A sloop rarely carried one.
vouchers: The receipts and certificates by which a purser accounted for every issue of stores.
officer of the watch: The officer in charge of the deck during a watch.
counter: The overhanging part of the stern, above the waterline.
topmast: The second section of a mast, above the lower mast. A spare was carried in case one was carried away.
purser: The warrant officer responsible for the ship's provisions and slops, who kept the accounts of them and was widely believed to profit by them.
forenoon: The forenoon watch, eight o'clock until noon.
two bells | four bells | eight bells: Time aboard is struck on the ship's bell every half hour, one stroke more each time, until eight bells ends the four-hour watch and the count begins again.
first watch: The watch from eight in the evening until midnight.
watch: One of the divisions of the ship's day, mostly of four hours: the first watch (8 p.m. to midnight), middle, morning, forenoon, afternoon, and the two short dog watches between 4 and 8 p.m.
fortnight: Two weeks.
start | started: To beat a man with a rope's end or a rattan, on the spot, without ceremony. Officially frowned on; universal.
grog: The daily ration of spirits or wine. Stopping a man's grog was the mildest punishment, and keenly felt.
a dozen | twelve lashes | flogged | flog | seize him up: A captain could award up to twelve lashes with the cat-o'-nine-tails without a court-martial. The man was seized up (tied) to a grating at the gangway, before the whole ship's company.
grating: A wooden lattice hatch cover, rigged upright at the gangway for a flogging.
Articles of War: The thirty-six articles, read aloud regularly, setting out the crimes of the service and their punishments. Most ended "shall suffer death, or such other punishment as a court-martial shall think fit".
to the mast: Brought before the captain at the mainmast, to answer a charge.
sea-lawyer: A seaman who knows the regulations and his rights, and says so. Officers loathed them.
round robin: A petition with the names signed in a circle, so that no man could be singled out as the ringleader.
Jonah: A man believed to bring bad luck to a ship.
tarpaulin: An officer who came up from the lower deck, rather than as a young gentleman.
disrate | disrated: To reduce a man from a higher rating, such as able seaman, to a lower.
captain of the foretop: The leading seaman of the men who work the foremast aloft.
boatswain's mate: A petty officer under the boatswain, who drives the people to their work and administers punishment.
sick-bay | sick list: The space set apart for the sick, and the surgeon's daily list of men unfit for duty.
surgeon's mate: The surgeon's assistant; often not much less qualified than the surgeon.
Haslar: The great naval hospital at Gosport, near Portsmouth.
Trinity House: The corporation that licensed pilots and, in this period, examined masters for the Navy.
quadrant: The instrument for measuring the sun's altitude; the sextant was replacing it.
mess kids: Small wooden tubs in which each mess drew its food from the galley.
messes | mess | messmates: The people ate in messes of six or eight men at a table between the guns, and messmates were a man's family at sea.
hammock: The people slept in canvas hammocks slung from the beams; a man who died at sea was buried in his.
round shot at his feet: To sink the body. The sailmaker's last stitch through the nose was, by tradition, to make sure the man was dead.
Methodist: A follower of John Wesley's evangelical movement; in the Navy, a man who would not drink or swear, and was a trial to his messmates.
rattan: A cane carried by boatswains and their mates for starting the men.
run down the latitude | parallel: Sailing due east or west along a known latitude until the land comes up. A navigator who could find his latitude by the sun but not his longitude would aim deliberately to one side of his landfall, so as to know which way to turn.
fresh departure: A new starting point for the reckoning, taken from a known landmark.
dead reckoning | reckoning: Working out the ship's position from her courses and the distances run by the log, without sight of land or sun. Errors from current, leeway and bad steering accumulate with every watch.
noon sight | meridian altitude | observed latitude: The sun's height above the horizon at noon, measured with a quadrant or sextant, which gives the ship's latitude. It needs a clear sky and a clear horizon.
latitude: Distance north of the equator, in degrees and minutes. A minute of latitude is a sea mile.
longitude: Distance east of Greenwich, in degrees and minutes. At sea it could be found only by a chronometer or by laborious lunar observations; most sloops relied on dead reckoning for it.
chronometer: A sea-going clock, keeping Greenwich time to find the longitude. Expensive, and seldom issued to a sloop; her captain might buy one.
lead | deep-sea lead | leadsman | by the mark: A lead weight on a marked line, hove to find the depth of water. The hollow in its base, armed with tallow, brought up a sample of the bottom. "By the mark five" means five fathoms, read off a leather mark on the line.
fathoms | fathom: Six feet. Soundings and line were measured in fathoms.
chains: Small platforms outside the ship's side, where the leadsman stands to heave the lead.
offing | good offing: Distance from the shore. A good offing is sea room enough to be safe.
landfall | made the land | make the land: The first sight of land after a passage, and the moment of finding out how good the reckoning was.
lee shore: A coast with the wind blowing onto it. In a gale, the most feared thing at sea: a ship that cannot claw off to windward is driven ashore.
claw off | clawing off: To work to windward off a lee shore against a gale.
lying off and on | lay off and on: Keeping a safe distance from the land, standing towards it and away by turns, waiting for daylight or clear weather.
breakers: The surf of waves breaking on rocks or shoals: at night, the sound is often the only warning.
aground | took the ground | hard and fast: Touching or stuck on the bottom.
kedge: A small anchor, carried out by the boats, by which a ship can heave herself off the ground or along a channel.
start the water: To empty the water casks, to lighten the ship.
best bower | bowers: The two great anchors carried at the bows.
loom of the land: The dark shape of land seen at night against the sky.
Columbretes: A cluster of small volcanic islets off the coast of Valencia, a danger in the dark.
Planier light: A lighthouse on a rock off Marseille, lit since 1774; one of the few lights on this coast.
Cette: The port in Languedoc later called Sète.
Ciudadela: The old capital of Minorca, at the western end of the island.
Iviza: The island the Spaniards call Ibiza.
Medas | the Medas: Rocky islets off the Catalan coast near Estartit.
Hormigas | las Hormigas: Rocks off Cape San Sebastián, "the ants".
Isla del Aire: The low island off the south-east point of Minorca, near the entrance to Mahon.
port: The left-hand side of the ship, looking forward. In this period "larboard" was the usual word, but "port" was already used in helm orders, because "larboard" was too easily misheard as "starboard" in a gale.
weather gauge: The position to windward of an enemy. The ship that holds it can choose when and whether to engage; the one to leeward must take the fight as it comes, or run.
broadside | broadsides: All the guns on one side of a ship, fired together; or the side itself.
larboard: The left-hand side of the ship, looking forward. (Later called port.)
starboard: The right-hand side of the ship, looking forward.
rake | raked | raking: To fire into an enemy along her length, across her bows or stern, where she cannot answer and every shot runs the length of her deck.
point-blank | point-blank range: So close that a gun laid level hits without allowing for the fall of the shot: a cable or less.
close range: Within two or three cables, where shot from any gun does real harm.
long range | long gunshot: Five or six cables, where long guns can still hit and carronades seldom do.
extreme range: As far as a gun will carry, where a hit is luck.
out of gunshot: Beyond the reach of any gun.
double-shotted: With two round shot rammed down on one charge: more damage at point-blank, wild beyond it, and slower to load.
cleared for action | clear for action: With the bulkheads struck, the decks sanded, the boats towed or hoisted out, and every man at his station.
fighting sail: Topsails and jib, with the courses brailed up, so that the ship answers quickly and needs few men aloft.
crowd sail | crowding sail: To set every sail she will carry, to chase or escape.
back the main-topsail | aback: To brace the main-topsail round so that the wind presses it backwards, stopping the ship.
luff: To bring the ship's head closer to the wind.
bear away: To turn the ship's head away from the wind.
in stays: Head to wind, in the middle of tacking, with the sails shivering and no way on her.
strike | struck | strike your colours | hauls down her colours: To haul down the flag in surrender.
colours: A ship's national flag. A ship might sail under false colours, but must hoist her true ones before firing.
corvette: A French name for a sloop or small ship of war, of about twenty guns: in British terms, a post ship or a large sloop.
letter of marque: A private merchant ship commissioned by her government to take enemy prizes in passing: armed, but not built for fighting.
polacre-ship: A Mediterranean merchant vessel with pole masts in one piece, quick and handy.
privateer brig: A privately owned two-masted ship of war, commissioned to take enemy merchant ships for profit.
well: The lowest part of the hold, round the pump shafts, where the water collects and is sounded.
shot-holes | shot-plugs: Holes made by shot. Below the waterline the carpenter stops them with tapered wooden plugs, kept ready by the hundred.
yardarm to yardarm: So close that the ends of the ships' yards overlap.
by the board | goes by the board: Of a mast: broken off and fallen over the side.
hull down: So far off that only her masts and sails show above the horizon.
glass: A telescope; or a sand-glass, by which the watch was timed and the lead hove and the log run.
Mistral: The cold north-westerly wind that pours down the Rhône valley into the Gulf of Lion, often for days together, raising a short, steep, dangerous sea.
Tramontana: A cold northerly wind off the mountains, "from beyond the mountains".
Levanter: An easterly wind, damp and hazy, bringing poor visibility and rain.
Sirocco: A hot, humid southerly wind off the African desert, carrying fine red dust.
westerly blow: A spell of westerly wind, with cloud and squalls of rain.
calm | flat calm: No wind at all. A sailing ship becalmed is helpless, but for boats and sweeps.
light airs | light breezes | gentle breezes | moderate breezes | fresh breezes | strong breezes | moderate gale | fresh gale | strong gale | whole gale | storm: The seaman's words for the strength of the wind, from barely moving the sails to a wind no ship can show canvas to. Admiral Beaufort put numbers to them a few years later.
point | points: One of the thirty-two divisions of the compass, eleven and a quarter degrees. A square-rigged ship can sail no closer than about six points to the wind.
lying her course | lie her course: Able to steer straight for her destination with the wind as it is.
close-hauled: Sailing as close to the wind as she will, her yards braced hard round.
beating | beat up | board and board: Working to windward by sailing close-hauled first on one tack and then the other, zigzagging towards a destination the wind blows from.
tack | tacking | go about | Ready about: To turn the ship's head through the wind, from one tack to the other. Quick, and it gains ground, but it can fail.
wear | wearing | wear round: To turn the ship's stern through the wind. Slow and certain, but it loses ground to leeward.
missed stays | miss stays | missing stays: To fail in tacking: the ship comes up into the wind and hangs there, and falls back on the old tack. Commoner in heavy weather and with a poor crew.
taken aback: With the wind on the wrong side of the sails, pressing them back against the masts. Dangerous in a blow.
press of sail | crack on: Carrying as much sail as the ship will bear: faster, and harder on spars, sails and nerves.
snug | snugged down | reefed: Under shortened sail, with the topsails reefed (made smaller by tying part of them up to the yard). Slower and safer.
close-reefed: With every reef taken in, the sail as small as it can be made.
heave to | hove to | lying to: To stop the ship at sea by setting the sails to work against one another, so that she rides out a gale making little or no way.
sweeps: Long oars, worked through the gun ports, which could move a small ship slowly in a calm.
knots: The ship's speed in sea miles an hour, measured by the log-line, a knotted line run out astern for a timed half-minute.
league | leagues: Three sea miles.
foul: Of the wind: blowing from where the ship wants to go.
slant: A shift of wind in the ship's favour.
dog-vane: A small vane of cork and feathers on the weather side, showing the helmsman the wind.
topgallants | royals: The sails above the topsails, set in fair weather and the first taken in when it blows.
lee guns: On the side away from the wind; in a strong wind the ship heels that way, and her lee guns go under.
fore-topmast | cap: The fore-topmast is the second section of the foremast, joined to the lower mast at the cap.
top-hamper: Everything aloft: masts, yards, rigging and sails.
woolding: Rope wound tight round a fished spar to bind the splints to it.
capstan bars: The long wooden bars, shipped in the capstan head, that the men push to turn it.
fidded: Of a topmast, set up in place and secured by its fid, a wooden or iron pin.
bolt-ropes: The ropes sewn round the edge of a sail to strengthen it.
taffrail: The rail round the top of the stern.
awnings | windsails: Awnings are canvas sheets spread over the deck against the sun; windsails are canvas funnels rigged to send fresh air down the hatchways.
steerage way: Enough way through the water for the rudder to act.
biscuit | bread: Ship's biscuit, baked hard to keep. "Bread" in the Navy meant biscuit. A pound a day per man.
pease: Dried split peas, boiled into a thick soup. Half a pint, four days a week.
oatmeal: Boiled with water into burgoo for breakfast. A pint, three days a week.
beef | pork | pieces: Salt meat came in casks of pieces of a fixed weight: four pounds of beef, two of pork, before boiling. Casks were numbered, and opening one was entered in the log, with the number of pieces found and any shortfall.
firkin | firkins: A small cask; a firkin of butter held 56 pounds.
hogshead | hogsheads: A cask of about 63 gallons.
puncheon | puncheons: A large cask of about 72 gallons, the usual cask for spirits.
butt | butts: A large cask of about 108 gallons, the usual cask for water.
bushel | bushels: A measure of dry goods: eight gallons, or 64 pints.
allowance | full allowance | two-thirds allowance: The ration. On "two-thirds allowance" (six men sharing four men's food) the men were paid short-allowance money for what they went without, eventually.
purser's eighth: A purser was allowed one-eighth of most provisions for waste and leakage, so that the men's "pound" was fourteen ounces. Anything he kept back beyond that was fraud.
purser's steward: The purser's assistant, who kept the bread-room and issued the provisions.
agent victualler: The Victualling Board's officer at a foreign port, who supplied ships with provisions.
victualling yard: A naval establishment for storing and issuing provisions. Gibraltar had one.
contractor: A merchant engaged to supply fresh provisions to the fleet. Contractors were widely believed to grow rich on it.
lemon juice: Issued against scurvy, mixed with sugar. Its use was ordered throughout the fleet in these years, though not every captain troubled with it.
scurvy: The sailor's disease, from want of fresh food. Lemon juice and fresh greens keep it off.
survey: A formal inspection by three officers, whose signed report the Navy accepted as evidence. Stores were condemned, and accounts corrected, only by survey.
condemned: Declared unfit by survey, and so removed from the purser's charge.
watering place: A spring or fountain where ships filled their water casks, carried to and fro in the boats.
masthead | the masthead: The lookout, posted high on the mast, who sees a sail or land long before the deck does.
lee bow: Ahead and to the side away from the wind.
private signal: A secret signal by which British warships recognised each other at sea. It was changed regularly and guarded closely.
sail of the line: A ship of the line of battle: a two- or three-decker of sixty-four guns or more.
standing off and on: Sailing back and forth off a harbour or coast, keeping watch on it.
drum beats to quarters | beats to quarters: The drum roll calling every man to his station for action, or for exercise.
cast loose: Freed from the lashings that secure a gun at sea.
gun captains: The leading men of each gun's crew, who aim and fire it.
gunner: The warrant officer in charge of the guns, powder and shot, who answers for every round to the Board of Ordnance.
boatswain: The warrant officer in charge of the rigging, sails, anchors and cables, and of driving the men to their work.
carpenter: The warrant officer in charge of the hull, masts and boats, and of stopping leaks.
master: The warrant officer responsible for navigation, and for the stowage of the hold.
sailmaker: The petty officer who makes and mends the sails.
bend: To make a sail fast to its yard, ready for setting.
squall: A sudden, violent gust of wind, often with rain.
treenail: A wooden peg, used in place of an iron bolt, that fastens a ship's planks to her frames.
fore peak: The narrow space right forward in the bottom of the ship.
pumps | the pumps: The chain pumps, worked by hand, that clear the water a ship makes. Every wooden ship leaks some; the question is how much.
inches an hour | inches of water: Water rising in the well, measured with a sounding rod. A tight ship might make an inch or two an hour.
oakum: Old rope picked apart into loose fibre, driven into seams to make them watertight.
bread-room: The lined compartment aft where the biscuit is kept, as dry, and as free of rats, as can be managed.
brimstone: Sulphur, burnt to smoke out rats and vermin.
grape: Grapeshot: a cluster of small iron balls fired together, murderous at close range.
round shot: Solid iron balls, the ordinary ammunition of a great gun.
spars: Masts, yards and booms, or the spare timbers carried to replace them.
fished: Splinted, as a broken limb is splinted, with lengths of timber bound round a sprung spar.
sprung: Of a mast or yard: cracked, but still standing.

/* ---------- the compass: 32 points, numbered clockwise from north ---------- */

  return parts.length > 1 ? `${w(parts[0])} by ${w(parts[1])}` : w(parts[0]);
}
function eightPoint(i){ return POINTS[(Math.round(i / 4) % 8) * 4]; }
function pointsApart(a, b){ const d = ((a - b) % 32 + 32) % 32; return Math.min(d, 32 - d); }
const FORCE_LOG = ['Calm', 'Light airs', 'Light breezes', 'Gentle breezes', 'Moderate breezes', 'Fresh breezes', 'Strong breezes', 'Moderate gales', 'Fresh gales', 'Strong gales', 'Whole gales', 'A storm'];
const FORCE_PROSE = ['a flat calm', 'light airs', 'a light breeze', 'a gentle breeze', 'a moderate breeze', 'a fresh breeze', 'a strong breeze', 'a moderate gale', 'a fresh gale', 'a strong gale', 'a whole gale', 'a storm'];
const SEA_WORDS = ['a smooth sea', 'a smooth sea', 'a slight sea', 'a slight sea', 'a moderate sea', 'a moderate sea', 'a rough sea', 'a rough sea', 'a high sea', 'a high sea', 'a very high sea', 'a very high sea'];

function fmtSpan(mins){
  if (mins >= 1440){ const d = Math.floor(mins / 1440); return d + (d === 1 ? ' day' : ' days'); }
  const h = Math.floor(mins / 60); return h + (h === 1 ? ' hour' : ' hours');
}

/* ============================================================
   CONTENT PARSER
   ============================================================ */
const EVENT_KEYS = new Set(['title','place','requires','weight','effects','effect','log','tags','watch chance']);
const CHOICE_KEYS = new Set(['requires','needs','why not','effects','effect','log','text','next','greyed']);
const blankBranch = () => ({ effects: [], text: '', next: null });

function splitOutsideQuotes(str, sepRe){
  const out = []; let cur = '', q = false;
  for (const ch of str){
    if (ch === '"') { q = !q; cur += ch; continue; }
    if (!q && sepRe.test(ch)) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseValue(name, raw){
  if (MONEY.has(name)) return parseMoney(raw);
  const n = parseFloat(String(raw).replace(/^\+/, ''));
  return isNaN(n) ? null : n;
}
/* weights are kept in ounces, liquids in fluid ounces (sixteen to the pint), counted things as numbers */
function parseMeasure(str, dimHint){
  const m = String(str).trim().match(/^(\d+(?:\.\d+)?)\s*(lb|oz|pints?|quarts?|gallons?)?$/i);
  if (!m) return null;
  const n = +m[1], u = (m[2] || '').toLowerCase();
  if (!u) return { dim: 'n', base: n };
  if (u === 'lb') return { dim: 'w', base: n * 16 };
  if (u === 'oz') return { dim: dimHint === 'v' ? 'v' : 'w', base: n };
  if (u.startsWith('pint')) return { dim: 'v', base: n * 16 };
  if (u.startsWith('quart')) return { dim: 'v', base: n * 32 };
  return { dim: 'v', base: n * 128 };
}
function unitMins(n, u){
  u = u.toLowerCase();
  return u.startsWith('minute') ? n : u.startsWith('hour') ? n * 60 : u.startsWith('watch') ? n * 240 : n * 1440;
}

function parseConds(str, where, prob){
  const out = [];
  for (const part0 of splitOutsideQuotes(str.replace(/\band\b/gi, ','), /,/)){
    const part = part0.trim(); let m;
    if ((m = part.match(/^(not\s+)?(lieutenant|master|surgeon|purser|boatswain|gunner|carpenter)\s+is\s+([a-z_]+)$/i))) out.push({ type: 'trait', post: m[2].toLowerCase(), trait: m[3].toLowerCase(), neg: !!m[1] });
    else if ((m = part.match(/^(not\s+)?(night|day)$/i))) out.push({ type: 'night', neg: (!!m[1]) !== (m[2].toLowerCase() === 'day') });
    else if ((m = part.match(/^(not\s+|no\s+)?weather\s+([a-z0-9_]+)$/i))) out.push({ type: 'weather', name: m[2].toLowerCase(), neg: !!m[1] });
    else if ((m = part.match(/^(not\s+)?wind\s+from\s+(\S+)$/i))){
      const pt = parsePoint(m[2]);
      if (pt == null) prob('error', where, `"${m[2]}" is not a point of the compass.`);
      else out.push({ type: 'wind', point: pt, neg: !!m[1] });
    }
    else if ((m = part.match(/^(?:not|no)\s+voyage\s+([a-z0-9_]+)$/i))) out.push({ type: 'voyage', name: m[1].toLowerCase(), neg: true });
    else if ((m = part.match(/^(?:not|no)\s+([a-z0-9_]+)$/i))) out.push({ type: 'flag', name: m[1].toLowerCase(), neg: true });
    else if ((m = part.match(/^place\s+([a-z0-9_]+)$/i))) out.push({ type: 'place', name: m[1].toLowerCase() });
    else if ((m = part.match(/^voyage\s+([a-z0-9_]+)$/i))) out.push({ type: 'voyage', name: m[1].toLowerCase() });
    else if ((m = part.match(/^(before|after)\s+(\d{1,2})[:.](\d{2})$/i))) out.push({ type: 'tod', op: m[1].toLowerCase(), at: (+m[2]) * 60 + (+m[3]) });
    else if ((m = part.match(/^([a-z0-9_]+)\s+(\d+(?:\.\d+)?)\s*(minutes?|hours?|watch(?:es)?|days?)\s+or\s+(more|less)$/i)))
      out.push({ type: 'timer', name: m[1].toLowerCase(), mins: unitMins(+m[2], m[3]), op: m[4].toLowerCase() === 'more' ? '>=' : '<=' });
    else if ((m = part.match(/^([a-z0-9_]+)\s+(.+?)\s+or\s+(more|less)$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[2]);
      if (v == null) prob('error', where, `I could not read the amount "${m[2]}" in "${part}".`);
      else out.push({ type: 'cmp', name, op: m[3].toLowerCase() === 'more' ? '>=' : '<=', value: v });
    }
    else if ((m = part.match(/^([a-z0-9_]+)\s*(>=|<=|==|=|>|<)\s*(.+)$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[3]);
      if (v == null) prob('error', where, `I could not read the amount "${m[3]}" in "${part}".`);
      else out.push({ type: 'cmp', name, op: m[2] === '==' ? '=' : m[2], value: v });
    }
    else if ((m = part.match(/^([a-z0-9_]+)$/i))) out.push({ type: 'flag', name: m[1].toLowerCase(), neg: false });
    else prob('error', where, `I could not understand the requirement "${part}".`);
  }
  return out;
}

/* "+20 if new_coat", "-10 if not friend_dawe", "+10 per standing" */
function parseMods(str, where, prob){
  const mods = [];
  for (const part of String(str).split(',').map(s => s.trim()).filter(Boolean)){
    let m;
    if ((m = part.match(/^([+-])\s*(\d+(?:\.\d+)?)\s+if\s+(.+)$/i))) mods.push({ n: (m[1] === '-' ? -1 : 1) * +m[2], conds: parseConds(m[3], where, prob) });
    else if ((m = part.match(/^([+-])\s*(\d+(?:\.\d+)?)\s+per\s+([a-z0-9_]+)$/i))) mods.push({ n: (m[1] === '-' ? -1 : 1) * +m[2], per: m[3].toLowerCase() });
    else prob('error', where, `I could not understand "${part}". Write it like "+20 if new_coat" or "+10 per standing".`);
  }
  return mods;
}

function parseEffects(str, where, prob){
  const out = [];
  for (const part of splitOutsideQuotes(str, /;/)){
    let m;
    if ((m = part.match(/^log\s+"?(.*?)"?$/i))) out.push({ op: 'log', text: m[1] });
    else if ((m = part.match(/^set\s+([a-z0-9_]+)$/i))) out.push({ op: 'flag', name: m[1].toLowerCase(), on: true });
    else if ((m = part.match(/^clear\s+([a-z0-9_]+)$/i))) out.push({ op: 'flag', name: m[1].toLowerCase(), on: false });
    else if ((m = part.match(/^start\s+([a-z0-9_]+)$/i))) out.push({ op: 'start', name: m[1].toLowerCase() });
    else if ((m = part.match(/^stop\s+([a-z0-9_]+)$/i))) out.push({ op: 'stop', name: m[1].toLowerCase() });
    else if ((m = part.match(/^orders\s+([a-z0-9_]+)$/i))) out.push({ op: 'orders', name: m[1].toLowerCase(), where });
    else if ((m = part.match(/^store\s+([a-z0-9_]+)\s*([+-])\s*(\d+(?:\.\d+)?)(?:\s+"([^"]*)")?$/i))) out.push({ op: 'store', name: m[1].toLowerCase(), value: (m[2] === '-' ? -1 : 1) * +m[3], label: m[4] || '', where });
    else if ((m = part.match(/^empty\s+([a-z0-9_]+)(?:\s+"([^"]*)")?$/i))) out.push({ op: 'empty', name: m[1].toLowerCase(), label: m[2] || '', where });
    else if ((m = part.match(/^fill\s+([a-z0-9_]+)(?:\s+"([^"]*)")?$/i))) out.push({ op: 'fill', name: m[1].toLowerCase(), label: m[2] || '', where });
    else if (/^condemn$/i.test(part)) out.push({ op: 'condemn' });
    else if (/^survey$/i.test(part)) out.push({ op: 'survey' });
    else if (/^forecast$/i.test(part)) out.push({ op: 'forecast' });
    else if (/^put to sea$/i.test(part)) out.push({ op: 'puttosea' });
    else if ((m = part.match(/^drill\s+(gunnery|seamanship)\s+(\d+(?:\.\d+)?)$/i))) out.push({ op: 'drill', what: m[1].toLowerCase(), n: +m[2] });
    else if ((m = part.match(/^reveal\s+(lieutenant|master|surgeon|purser|boatswain|gunner|carpenter)\s+([a-z_]+)$/i))) out.push({ op: 'reveal', post: m[1].toLowerCase(), trait: m[2].toLowerCase() });
    else if ((m = part.match(/^reveal\s+([a-z_]+)$/i))) out.push({ op: 'revealflag', name: m[1].toLowerCase() });
    else if ((m = part.match(/^gunroom\s*([+-])\s*(\d+(?:\.\d+)?)$/i))) out.push({ op: 'gunroom', n: (m[1] === '-' ? -1 : 1) * +m[2] });
    else if (/^pick man$/i.test(part)) out.push({ op: 'pickman' });
    else if (/^gossip$/i.test(part)) out.push({ op: 'gossip' });
    else if ((m = part.match(/^punish\s+(flog|start|grog|pass)$/i))) out.push({ op: 'punish', how: m[1].toLowerCase() });
    else if (/^sound$/i.test(part)) out.push({ op: 'sound' });
    else if (/^stand off$/i.test(part)) out.push({ op: 'standoff' });
    else if (/^refloat$/i.test(part)) out.push({ op: 'refloat' });
    else if ((m = part.match(/^allowance\s+(short|full)$/i))) out.push({ op: 'allowance', short: m[1].toLowerCase() === 'short' });
    else if ((m = part.match(/^voyage\s+([a-z0-9_]+)(?:\s+(\d+(?:\.\d+)?)\s*(watch(?:es)?|days?|hours?))?$/i))) out.push({ op: 'voyage', name: m[1].toLowerCase(), watches: m[2] ? unitMins(+m[2], m[3]) / 240 : null });
    else if ((m = part.match(/^roll\s+([a-z0-9_]+)\s+(\d+(?:\.\d+)?)$/i))) out.push({ op: 'roll', name: m[1].toLowerCase(), chance: +m[2] });
    else if ((m = part.match(/^pass\s+(\d+)\s*(minutes?|hours?|watch(?:es)?|days?)$/i))) out.push({ op: 'pass', mins: unitMins(+m[1], m[2]) });
    else if ((m = part.match(/^until\s+(\d{1,2})[:.](\d{2})$/i))) out.push({ op: 'until', at: (+m[1]) * 60 + (+m[2]) });
    else if ((m = part.match(/^place\s+([a-z0-9_]+)$/i))) out.push({ op: 'place', name: m[1].toLowerCase() });
    else if ((m = part.match(/^([a-z0-9_]+)\s*([+-])\s*(.+?)(?:\s+"([^"]*)")?$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[3]);
      if (v == null) prob('error', where, `I could not read the amount in "${part}".`);
      else out.push({ op: 'add', name, value: m[2] === '-' ? -v : v, label: m[4] || '' });
    }
    else if ((m = part.match(/^([a-z0-9_]+)\s*=\s*(.+?)(?:\s+"([^"]*)")?$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[2]);
      if (v == null) prob('error', where, `I could not read the amount in "${part}".`);
      else out.push({ op: 'setvar', name, value: v, label: m[3] || '' });
    }
    else prob('error', where, `I could not understand the effect "${part}".`);
  }
  return out;
}

function parseNext(v, where, prob){
  const s = v.trim(); let m;
  if (/^end$/i.test(s)) return { type: 'end' };
  if ((m = s.match(/^any\s+([a-z0-9_]+)$/i))) return { type: 'any', tag: m[1].toLowerCase() };
  if ((m = s.match(/^watch(?:es)?(?:\s+(\d+))?$/i))) return { type: 'watches', n: m[1] ? +m[1] : 1 };
  if (/^[a-z0-9_]+$/i.test(s)) return { type: 'go', id: s };
  prob('error', where, `"Next: ${s}" should name one event, or say "any <place>" or "end".`);
  return null;
}

function parseContent(blocks){
  const P = { settings: {}, events: {}, order: [], orders: {}, ship: {}, stores: {}, storeOrder: [], weather: {}, sailing: {}, vessels: {}, actions: {}, gunnery: {}, chartRaw: {}, landRaw: [], placeRaw: [], dangerRaw: [], currentRaw: [], officers: {}, officerOrder: [], traits: {}, crewFlags: {}, gauges: {}, crew: {}, glossary: [], problems: [], stats: { words: 0 } };
  const prob = (sev, where, msg) => P.problems.push({ sev, where, msg });

  /* money values must be known before anything is parsed */
  MONEY = new Set(['money']);
  for (const blk of blocks){
    const m = blk.text.match(/^\s*money values\s*:\s*(.+)$/im);
    if (m) m[1].split(',').map(s => s.trim().toLowerCase()).filter(Boolean).forEach(n => MONEY.add(n));
  }

  for (const blk of blocks){
    const lines = blk.text.replace(/\r/g, '').split('\n');
    let section = null, ev = null, ch = null, target = null, lastKey = null, ord = null, sto = null, wx = null, kv = null, geo = null;
    let para = [], paraLine = 0;
    const where = i => `${blk.name}, line ${i + 1}`;
    const flushPara = () => {
      if (!para.length) return;
      if (section === 'orders' && ord){ ord.paras.push({ text: para.join(' '), sig: false }); }
      else if (ev){
        let text = para.join(' '), cond = null, m;
        if ((m = text.match(/^\[if\s+([^\]]+)\]\s*(.*)$/i))){ cond = parseConds(m[1], `${blk.name}, line ${paraLine}`, prob); text = m[2]; }
        ev.paras.push({ text, cond, line: paraLine });
      }
      para = [];
    };

    lines.forEach((raw, i) => {
      const t = raw.trim(); let m;
      if (t.startsWith('#')) return;
      if (t === ''){ flushPara(); if (lastKey !== 'gloss') lastKey = null; if (kv) kv.lines.push(''); return; }

      if (/^settings$/i.test(t)){ flushPara(); section = 'settings'; ev = ch = ord = kv = null; return; }
      if (/^SHIP$/.test(t)){ flushPara(); section = 'ship'; ev = ch = ord = kv = null; return; }
      if (/^SAILING$/.test(t)){ flushPara(); section = 'sailing'; ev = ch = ord = kv = null; return; }
      if (/^GUNNERY$/.test(t)){ flushPara(); section = 'gunnery'; ev = ch = ord = kv = null; return; }
      if (/^CREW$/.test(t)){ flushPara(); section = 'crew'; ev = ch = ord = kv = null; return; }
      if ((m = t.match(/^(OFFICER|TRAIT|FLAG|GAUGE)\s*:\s*(.*)$/))){
        flushPara(); section = m[1].toLowerCase(); ev = ch = ord = kv = null;
        const id = m[2].trim().toLowerCase();
        const store = { officer: P.officers, trait: P.traits, flag: P.crewFlags, gauge: P.gauges }[section];
        if (store[id]) prob('error', where(i), `There are two ${section}s called "${id}".`);
        geo = store[id] = { id, f: {}, flags: {}, where: where(i) };
        if (section === 'officer') P.officerOrder.push(id);
        return;
      }
      if (section === 'crew'){
        if ((m = t.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){ const k = m[1].toLowerCase(); P.crew[k] = (k === 'men' && P.crew.men ? P.crew.men + ', ' : '') + m[2].trim(); }
        else if (P.crew.men) P.crew.men += ', ' + t;
        return;
      }
      if (section === 'officer' || section === 'trait' || section === 'flag' || section === 'gauge'){
        if (/^(hidden)$/i.test(t)){ geo.flags.hidden = true; return; }
        if ((m = t.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){ geo.f[m[1].toLowerCase()] = m[2].trim(); return; }
        prob('warn', where(i), `"${short(t)}" is not something a ${section} has.`);
        return;
      }
      if (/^(CHART|CURRENTS)$/.test(t)){ flushPara(); section = t.toLowerCase(); ev = ch = ord = kv = null; return; }
      if ((m = t.match(/^(LAND|PLACE|DANGER)\s*:\s*(.*)$/))){
        flushPara(); section = m[1].toLowerCase(); ev = ch = ord = kv = null;
        geo = { id: m[2].trim().toLowerCase(), f: {}, coords: [], flags: {}, where: where(i) };
        P[section + 'Raw'].push(geo); return;
      }
      if (section === 'chart'){
        if ((m = t.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){ const k = m[1].toLowerCase(); if (k === 'shelf') (P.chartRaw.shelf = P.chartRaw.shelf || []).push(m[2].trim()); else P.chartRaw[k] = m[2].trim(); }
        else prob('warn', where(i), 'Chart lines should look like "Home: mahon".');
        return;
      }
      if (section === 'currents'){
        if ((m = t.match(/^(north of|south of|east of|west of|elsewhere)\s*(-?\d+(?:\.\d+)?)?\s*:\s*(\d+(?:\.\d+)?)\s*knots?\s+setting\s+(\S+)$/i)) && parsePoint(m[4]) != null)
          P.currentRaw.push({ cond: m[1].toLowerCase().split(' ')[0], v: m[2] != null ? +m[2] : 0, knots: +m[3], toward: parsePoint(m[4]) * 11.25 });
        else prob('error', where(i), `I could not read the current "${short(t)}". Write it like "north of 42.3: 0.5 knots setting SW".`);
        return;
      }
      if (section === 'land' || section === 'place' || section === 'danger'){
        if (/^(minor|uncharted)$/i.test(t)){ geo.flags[t.toLowerCase()] = true; return; }
        if ((m = t.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){ geo.f[m[1].toLowerCase()] = m[2].trim(); return; }
        if (section === 'land'){
          for (const pair of t.split(',').map(x => x.trim()).filter(Boolean)){
            const c = pair.split(/\s+/).map(Number);
            if (c.length !== 2 || c.some(isNaN)) prob('error', where(i), `"${pair}" should be a latitude and a longitude, like "41.37 2.19".`);
            else geo.coords.push(c);
          }
          return;
        }
        prob('warn', where(i), `"${short(t)}" is not something a ${section} has.`);
        return;
      }
      if ((m = t.match(/^(VESSEL|ACTION)\s*:\s*(.*)$/))){
        flushPara(); section = m[1].toLowerCase(); ev = ch = ord = null;
        const id = m[2].trim().toLowerCase(), store = section === 'vessel' ? P.vessels : P.actions;
        if (store[id]) prob('error', where(i), `There are two ${section}s called "${id}".`);
        kv = store[id] = { id, f: {}, lines: [], where: where(i) };
        return;
      }
      if ((m = t.match(/^WEATHER\s*:\s*(.*)$/))){
        flushPara(); section = 'weather'; ev = ch = ord = kv = null;
        const id = m[1].trim().toLowerCase();
        if (P.weather[id]) prob('error', where(i), `There are two kinds of weather called "${id}".`);
        wx = P.weather[id] = { id, called: id, from: 0, span: 31, force: [2, 4], lasts: [1, 2], sky: '', signs: '', log: '', follows: [], where: where(i) };
        return;
      }
      if ((m = t.match(/^STORE\s*:\s*(.*)$/))){
        flushPara(); section = 'store'; ev = ch = ord = kv = null;
        const id = m[1].trim().toLowerCase();
        if (!/^[a-z0-9_]+$/.test(id)) prob('error', where(i), `The store name "${id}" should use only letters, numbers and underscores.`);
        if (P.stores[id]) prob('error', where(i), `There are two stores called "${id}".`);
        sto = P.stores[id] = { id, name: id, unit: ['cask', 'casks'], dim: 'n', size: 1, ration: null, officer: 'purser', capacity: 0, keeps: 0, bad: 0, badWord: 'bad', short: 0, pieces: 0, instead: null, only: null, bought: false, logOpen: false, stock: [], where: where(i), rationRaw: null };
        P.storeOrder.push(id); return;
      }
      if (/^glossary$/i.test(t)){ flushPara(); section = 'glossary'; ev = ch = ord = kv = null; lastKey = null; return; }
      if ((m = t.match(/^ORDERS\s*:\s*(.*)$/))){
        flushPara(); section = 'orders'; ev = ch = kv = null;
        const id = m[1].trim().toLowerCase();
        if (P.orders[id]) prob('error', where(i), `There are two sets of orders called "${id}".`);
        ord = P.orders[id] = { id, heading: '', paras: [], where: where(i) };
        return;
      }
      if ((m = t.match(/^event\s*:\s*(.*)$/i))){
        flushPara(); section = 'event'; ch = null; ord = null; kv = null; target = null; lastKey = null;
        const id = m[1].trim();
        if (!/^[a-z0-9_]+$/i.test(id)) prob('error', where(i), `The event name "${id}" should use only letters, numbers and underscores.`);
        if (P.events[id]) prob('error', where(i), `There are two events called "${id}".`);
        ev = { id, title: '', place: null, requires: [], weight: 1, weightMods: [], watchChance: null, watchMods: [], effects: [], tags: [], once: false, oncePerSpell: false, start: false, ending: false, hub: false, urgent: false, paras: [], choices: [], where: where(i) };
        P.events[id] = ev; P.order.push(id); return;
      }

      if (section === 'settings'){
        if ((m = t.match(/^([^:]+):\s*(.*)$/))) P.settings[m[1].trim().toLowerCase()] = m[2].trim();
        else prob('warn', where(i), 'Settings lines should look like "name: value".');
        return;
      }
      if (section === 'glossary'){
        if ((m = t.match(/^([^:]+):\s*(.+)$/))){
          const terms = m[1].split('|').map(s => s.trim()).filter(Boolean);
          P.glossary.push({ terms, def: m[2].trim(), where: where(i) }); lastKey = 'gloss';
        } else prob('warn', where(i), 'Glossary lines should look like "term | other form: definition".');
        return;
      }
      if (section === 'gunnery'){
        if ((m = t.match(/^([a-z -]+?)\s*:\s*(.*)$/i))) P.gunnery[m[1].toLowerCase()] = m[2].trim();
        else prob('warn', where(i), 'Gunnery lines should look like "raking: 3".');
        return;
      }
      if (section === 'vessel' || section === 'action'){
        const keys = section === 'vessel'
          ? ['name', 'called', 'colours', 'armament', 'crew', 'hull', 'rigging', 'speed', 'closest', 'turning', 'gunnery', 'temperament', 'aims at', 'strikes at', 'powder']

        return;

      if (/^once per (spell|weather)$/i.test(t)){ flushPara(); ev.oncePerSpell = true; return; }

        else if (k === 'requires') ev.requires.push(...parseConds(v, where(i), prob));

}

function allEffectsOf(ev){
  const out = [...ev.effects];
  for (const ch of ev.choices) out.push(...ch.base.effects, ...ch.success.effects, ...ch.failure.effects);
  return out;
}

function validate(P, prob){

  if (!ids.length){ prob('error', 'Content', 'There are no events at all.'); return; }
  const starts = ids.filter(id => P.events[id].start);
  if (starts.length > 1) prob('warn', P.events[starts[1]].where, 'More than one event is marked "Start"; the first one is used.');
  P.startId = starts[0] || ids[0];

  const incoming = {};

  for (const id of ids){
    const ev = P.events[id];
    const words = ev.paras.reduce((n, p) => n + p.text.split(/\s+/).length, 0);
    P.stats.words += words;
    if (!ev.title) prob('warn', ev.where, `The event "${id}" has no Title.`);
    if (words > 150 && !ev.hub) prob('warn', ev.where, `"${id}" runs to ${words} words; on a phone the choices may fall below the fold. Aim for 150 or fewer.`);
    if (!ev.ending && !ev.choices.length) prob('error', ev.where, `"${id}" has no choices and is not marked "Ending", so the player would be stuck.`);
    if (ev.ending && ev.choices.length) prob('warn', ev.where, `"${id}" is an Ending, so its choices are never shown.`);
    const alwaysShown = ev.choices.filter(c => !c.requires.length).length;
    if (alwaysShown > 4 && !ev.hub) prob('warn', ev.where, `"${id}" always shows ${alwaysShown} choices; the design calls for two to four.`);
    if (ev.hub && !ev.place) prob('error', ev.where, `"${id}" is a Hub but has no Place.`);

      prob('error', e.where, `"${e.op} ${e.name}" names a store that does not exist.`);
    for (const e of allEffectsOf(ev)) if (e.op === 'orders'){
      ordersUsed.add(e.name);
      if (!P.orders[e.name]) prob('error', e.where, `"orders ${e.name}" names orders that have not been written.`);
    }
    for (const ch of ev.choices){
      const branches = [ch.base, ch.success, ch.failure];
      if (ch.chance != null && !ch.failure.text && !ch.failure.next && !ch.failure.effects.length)

      if (ch.why && !ch.needs.length) prob('warn', ch.where, `"${short(ch.text)}" has a "Why not" but no "Needs", so the reason is never shown.`);
      let hasNext = false;
      for (const b of branches){
        if (!b.next) continue;
        hasNext = true;
        if (b.next.type === 'go'){
          if (!P.events[b.next.id]) prob('error', b.nextWhere, `"Next: ${b.next.id}" names an event that does not exist.`);
          else incoming[b.next.id] = true;
        }
        if (b.next.type === 'any') anyTags.add(b.next.tag);
        if (b.next.type === 'watches') anyTags.add('sea');
      }
      const goesSomewhere = ch.base.next || (ch.chance != null && ch.success.next && ch.failure.next);
      if (!goesSomewhere && ev.place && !hasHub(P, ev.place))
        prob('error', ch.where, `"${short(ch.text)}" does not say where to go on every outcome, and there is no Hub for this place to fall back on.`);
    }
  }
  for (const id of ids){
    const ev = P.events[id];
    if (id === P.startId || incoming[id]) continue;
    if (ev.hub || ev.tags.some(t => anyTags.has(t))) continue;
    prob('warn', ev.where, `Nothing leads to "${id}" yet.`);
  }
  for (const t of anyTags){
    if (!ids.some(id => P.events[id].tags.includes(t)) && !hasHub(P, t))
      prob('error', 'Content', `Something says "Next: any ${t}", but no event has that tag and there is no Hub for that place.`);
  }
  for (const id of Object.keys(P.weather)){
    for (const f of P.weather[id].follows) if (!P.weather[f.id]) prob('error', P.weather[id].where, `"${id}" is followed by "${f.id}", which is not described.`);
    if (!P.weather[id].follows.length) prob('warn', P.weather[id].where, `Nothing follows "${id}", so once it comes it never goes.`);
  }
  if (P.settings['first weather'] && !P.weather[P.settings['first weather'].toLowerCase()]) prob('error', 'Settings', `"first weather: ${P.settings['first weather']}" is not described.`);
  for (const id of Object.keys(P.orders)){
    if (!ordersUsed.has(id)) prob('warn', P.orders[id].where, `The orders "${id}" are never given.`);
    if (!P.orders[id].heading) prob('warn', P.orders[id].where, `The orders "${id}" have no Heading.`);
  }
  const seen = {};
  for (const g of P.glossary) for (const t of g.terms){
    const k = normTerm(t);
    if (seen[k]) prob('warn', g.where, `The glossary term "${t}" appears twice.`);
    seen[k] = true;
  }
}

/* ============================================================

let content = null;
let state = null;
let downloadsApi = null;
let prefs = { scale: 1 };

function surname(){ const p = (state && state.name || '').trim().split(/\s+/); return p[p.length - 1] || 'Captain'; }
function placeName(p){
  const base = content.settings['place.' + p] || (p ? p.charAt(0).toUpperCase() + p.slice(1) : '');
  if (p === 'sea' && state.voyage) return `${base}, ${content.settings['voyage.' + state.voyage.name] || state.voyage.name}`;
  return base;
}
function getVar(name){
  if (name === 'money') return state.money;
  if (name === 'day') return Math.floor(state.minutes / 1440) + 1;
  if (name === 'hour') return clockOf(state.minutes).h;
  if (name === 'master_skill') return masterSkill();
  if (name === 'hands') return handsSeamanship();
  const om = name.match(/^(lieutenant|master|surgeon|purser|boatswain|gunner|carpenter)_(seamanship|gunnery|leadership|sobriety|skill|loyalty)$/);
  if (om && state.officers) return offAttr(om[1], om[2]);
  if (name in state.vars) return state.vars[name];
  if (content.stores[name]) return state.stores && state.stores[name] ? state.stores[name].book / content.stores[name].size : 0;
  const m = name.match(/^([a-z0-9_]+)_days$/);
  if (m && content.stores[m[1]]) return daysOf(m[1]);

  if (name === 'force') return state.weather ? state.weather.force : 0;
  if (name === 'knots') return Math.round(state.lastSpeed || 0);
  if (name === 'miles_to_run'){ if (!state.nav) return 0; const t = navTarget(); return t && t !== 'standoff' ? Math.round(hyp({ x: state.nav.rx, y: state.nav.ry }, t)) : 0; }

}
function setVar(name, v){
  if (name === 'money'){ state.money = v; return; }
  const om = name.match(/^(lieutenant|master|surgeon|purser|boatswain|gunner|carpenter)_loyalty$/);
  if (om && state.officers && state.officers[om[1]]){ state.officers[om[1]].loyalty = Math.max(-3, Math.min(3, v)); return; }

}

function condMet(c){
  switch (c.type){
    case 'flag': return !!state.flags[c.name] !== c.neg;
    case 'place': return state.place === c.name;
    case 'voyage': return (!!state.voyage && state.voyage.name === c.name) !== !!c.neg;
    case 'trait': return hasTrait(c.post, c.trait) !== !!c.neg;
    case 'night': return isNight(state.minutes) !== !!c.neg;
    case 'weather': return (!!state.weather && state.weather.sys === c.name) !== !!c.neg;
    case 'wind': return (!!state.weather && state.weather.force >= 1 && pointsApart(state.weather.dir, c.point) <= 2) !== !!c.neg;
    case 'tod': { const now = minuteOfDay(state.minutes); return c.op === 'before' ? now < c.at : now >= c.at; }
    case 'timer': {
      const s = state.timers[c.name]; if (s == null) return false;
      const el = state.minutes - s; return c.op === '>=' ? el >= c.mins : el <= c.mins;
    }

  const v = getVar(c.name);
  switch (c.op){
    case '>=': return v >= c.value; case '<=': return v <= c.value;

function condsMet(list){ return list.every(condMet); }
function modded(base, mods){

  return v;
}
function whyNot(ch){
  if (ch.why) return subst(ch.why);

  if (c && c.type === 'cmp' && MONEY.has(c.name) && c.op.startsWith('>')) return `You have not ${fmtMoney(c.value)} to spare.`;
  return 'Not open to you now.';
}

function ordersHeading(){ const o = state.orders && content.orders[state.orders]; return o ? o.heading : 'none'; }
function subst(s){
  return String(s).replace(/\{(\w+)\}/g, (all, k0) => {
    const k = k0.toLowerCase();
    switch (k){
      case 'name': return state.name;
      case 'surname': return surname();
      case 'ship': return content.settings.ship || 'the sloop';
      case 'date': return fmtDate(state.minutes);
      case 'issued': return fmtDate(state.ordersAt != null ? state.ordersAt : state.minutes);
      case 'place': return placeName(state.place);
      case 'orders': return ordersHeading().replace(/^./, c => c.toLowerCase());
      case 'day': return String(getVar('day'));
    }
    if (MONEY.has(k)) return fmtMoney(getVar(k));
    if (POSTS.includes(k)) return offName(k);
    const pa = k.match(/^(lieutenant|master|surgeon|purser|boatswain|gunner|carpenter)_about$/); if (pa){ const x = officer(pa[1]); return x ? x.d.about : ''; }
    if (k === 'man') return state.man || pickMan();
    if (k === 'dead') return state.dead || 'a seaman';
    if (k === 'gossip') return state.gossipText || '';
    const bad = state.lastBad && content.stores[state.lastBad.id];
    if (k === 'bad_item') return bad ? bad.name.toLowerCase() : 'stores';
    if (k === 'bad_no') return state.lastBad ? String(state.lastBad.no) : '';
    if (k === 'bad_word') return bad ? bad.badWord : 'bad';
