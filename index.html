<script type="text/plain" class="content" data-name="Glossary">
GLOSSARY
Master and Commander | commander | commanders: The rank between lieutenant and post-captain, carrying command of a sloop. "Master and Commander" was the older title; the Admiralty shortened it to "Commander" in 1794, though the long form lingered in speech. Aboard his own ship a commander is called "Captain" by courtesy.
post-captain | made post: A captain on the Navy List, commanding a rated ship of twenty guns or more. Once posted, an officer rose by seniority alone towards an admiral's flag.
sloop: In Navy usage, any vessel commanded by a commander rather than a post-captain, usually of ten to eighteen guns, whether ship- or brig-rigged.
brig-sloop | brig: A sloop rigged as a brig: two masts, both square-rigged. Handier and cheaper than a ship-rigged sloop, and the commonest small cruiser of the war.
Commander-in-Chief | Admiral: The admiral commanding all the King's ships on a station, here the Mediterranean. He issues orders, fills vacancies, and takes a share of every prize taken under his command.
Vice-Admiral | Vice-Admiral of the White: The flag rank between rear-admiral and admiral. Each flag rank was divided by the colour of its squadron (Red, White and Blue), and an officer rose through them by seniority alone.
Order of the Bath | Most Honourable Order of the Bath: An order of knighthood given, among others, to admirals for distinguished service. It entitled the holder to "Sir".
flag captain: The captain of an admiral's flagship, and very often his right hand.
secretary: An admiral's secretary was a civilian who ran his correspondence and orders. A great deal of patronage passed through his hands.
commission: The written appointment of an officer to a particular ship. Read aloud to the ship's company, it gives him his authority over them.
reading in | read yourself in: Taking command by reading one's commission aloud to the assembled ship's company. Until he has done so, a new captain has no authority aboard.
orders | sealed: Written instructions from a superior. Every orders began "You are hereby required and directed", and an officer who departed from them answered for it.
all convenient dispatch | all possible dispatch: Formulas in orders. "Convenient" allowed a little latitude; "possible" allowed none.
in all respects ready: The phrase in orders meaning stored, watered, manned and fit for sea.
annoyance of the enemy: The phrase in cruising orders for attacking his trade and shipping.
in amity: At peace with. Neutral ships could be stopped and searched, but taking one without cause cost the captor heavy damages.
contraband of war: Goods a neutral may not carry to a belligerent, such as arms, powder, and naval stores. Their discovery made a neutral ship lawful prize.
coasting trade: Small vessels carrying goods from port to port along a coast. Spain, with bad roads, depended on it.
victualler | victuallers: A merchant ship hired to carry provisions out to the fleet.
squadron off Toulon: The British ships keeping watch on the French fleet in Toulon. Victuallers and despatches were forever being sent to it.
packet: A bundle of official letters. Despatches were weighted with lead, so that they could be sunk if capture threatened.
eighth: Under the prize rules, one eighth of every prize went to the flag officer under whose orders the captor sailed, whether he had been within a hundred miles of it or not.
storeship: A vessel carrying naval stores (cordage, canvas, spars, provisions) out to a foreign station.
bumboat: A shore boat that sells fruit, drink, tobacco and small wares to ships in harbour.
ruined fort: Fort St Philip at the mouth of Mahon harbour, demolished by the Spanish after they retook Minorca in 1782. The British found it in ruins when they captured the island again in 1798.
Mahon | Port Mahon: The capital and harbour of Minorca, one of the finest anchorages in the Mediterranean, and in British hands from 1798.
Minorcan: A native of Minorca. The islanders speak their own form of Catalan, and many remembered an earlier British occupation that ended in 1782.
island tongue: Minorcan, a form of Catalan. "Allà" means "there".
Governor | His Excellency: The general commanding the garrison of Minorca, who also governed the island. A distant and exalted figure to a sea officer.
garrison | regiment | redcoats: The British soldiers holding Minorca. The army and the navy dined together, gambled together, and did not much like one another.
card | leave your card: A newly arrived officer left his visiting card at the houses of people of consequence. An invitation, or nothing, followed.
whist | rubber: The favourite card game of officers of both services, played by four in two partnerships. A rubber is the best of three games.
half-crown points | half-crown: A half-crown was two shillings and sixpence. At half-crown points a bad evening could cost a commander a week's pay.
quadrilles: A dance for four couples in a square, newly fashionable.
lace: Gold lace on a uniform coat. The amount of it showed rank, and to some degree vanity.
epaulette: The gold shoulder ornament ordered for sea officers in 1795. A commander wore one on the left shoulder; a post-captain one on the right until he had three years' seniority, then two.
guinea | guineas: A gold coin worth twenty-one shillings.
prize agent | agent for prizes | navy agent | agent: A man of business who drew a sea officer's pay and saw his prizes through the courts and the sale, for a commission. Many advanced money against pay or prizes to come. Some failed, and took their clients' money with them.
letter of attorney: The paper by which an officer gave his agent power to act and receive money for him.
counting-house: A merchant's office, where his clerks kept his books.
five per cent | per cent: Five per cent a year was the most interest the usury laws allowed a lender to charge.
exchange on London: The rate at which bills of exchange drawn on London could be bought or sold abroad; the merchant's barometer.
Master Attendant: The officer of a dockyard in charge of the ships in harbour, their moorings, and the masting and rigging of them.
Navy Board: The board that built, repaired and stored the King's ships and ran the dockyards. It sent out stores, generally the wrong ones.
requisitions: Written demands for stores, made out in the proper form and countersigned. Without one, nothing could be issued.
mast pond: A pond where mast timber was kept under water so that it would not dry and split.
sheer hulk: An old hull fitted with sheers, a tall lifting frame, for stepping and taking out ships' masts.
caulkers | seams: Caulkers drive oakum into the seams between a ship's planks and pay them over with hot pitch to keep the water out.
Ordnance | Storekeeper of the Ordnance | Ordnance wharf | gun wharf: The Board of Ordnance, separate from the Navy, supplied the fleet's guns, powder and shot from its own gun wharfs, under its own storekeepers. A ship's guns could not be changed without an order.
carronade | carronades: A short, light gun of large bore, first cast by the Carron Company in Scotland. Devastating at close range, poor at long, and worked by fewer men than a long gun. Mounted on a slide rather than a wheeled carriage.
six-pounder | six-pounders | long guns: A long gun firing a six-pound ball: accurate, and good at long range, but light in weight of metal.
weight of metal: The total weight of shot a ship can fire in one broadside.
slides: The mounting of a carronade, which recoils along a slide pivoted at the ship's side rather than on wheels.
sway: To hoist something heavy, such as a gun or a mast.
lighter: A flat-bottomed barge for carrying goods and guns between ship and shore.
privateer: A privately owned ship of war, licensed by her government to take enemy merchant ships for profit.
surveyors: Dockyard officers who examined a captured ship to decide whether she was worth buying into the service.
over-sparred: Carrying masts and yards too large for her hull: fast, but crank and wet.
Navy List | followers: A senior officer's followers were the junior officers and men he took with him from ship to ship, and pushed for promotion.
most obedient humble servant: The ordinary close of a formal letter.
sanding: Sprinkling fine sand over wet ink to dry it.
claret: Red wine of Bordeaux. In wartime it came by prize, or by smugglers, or with a story attached.
Manxman: A native of the Isle of Man.
capstan: The great upright drum, turned by men pushing on bars, that heaves in the anchor cable.
cable | cables: The great rope by which a ship rides to her anchor. As a measure of distance, a cable is a tenth of a sea mile, about two hundred yards.
unmoor | moorings: A ship moored in harbour lay to two anchors or to a fixed mooring; unmooring was the first business of getting under way.
falls off | gathers way: A ship falls off when her head swings away from the wind, and gathers way as she begins to move through the water.
topsails: The second sails up each mast and the workhorse of the square rig; a ship under topsails alone is under easy control.
hospital: The naval hospital at Mahon, built by the British on its own island in the harbour in the early years of the century before.
polacre: A Mediterranean merchant vessel whose masts are single poles without tops. Common out of Naples, Genoa and the Levant.
prize: An enemy vessel captured at sea. Once condemned by a prize court, she and her cargo are sold and the proceeds shared among the captors.
yards: The spars across the masts from which the square sails hang. In harbour a smart ship keeps them "square", at exact right angles to the keel.
Boat ahoy: The hail to an approaching boat. The answer told the ship who was in it: an officer's boat answered "Aye aye", a captain's boat answered with the name of his ship.
side-boys: Boys or seamen stationed at the gangway to attend an officer coming aboard.
boatswain's call: The boatswain's silver pipe, used to pass orders and to pipe officers over the side.
gangway: The opening in the ship's side where people come aboard.
battens: Wooden steps fixed up the ship's side.
waist: The middle part of the upper deck, between the quarterdeck and the forecastle.
launch: The largest of a ship's boats, used for heavy work such as carrying out anchors and fetching water.
midshipman: A young gentleman serving as an officer in training. After six years at sea and an examination he might be made lieutenant.
gunroom: In a sloop, the mess of the lieutenant, master, surgeon and purser.
cable-tier: The place deep in the ship where the great anchor cables are coiled down.
seventy-four: A ship of the line of seventy-four guns, the backbone of the battle fleet.
quarterdeck: The raised deck aft, from which the ship is commanded. The captain's ground.
break of the quarterdeck: The forward edge of the quarterdeck, where it drops to the waist.
breechings: The heavy ropes that check a gun's recoil.
galley: The ship's kitchen.
berth-deck: The deck below, where the men sling their hammocks.
complement: The number of men a ship is established to carry.
the people | her people: The ship's company below the officers.
captains of the tops: Leading seamen, each in charge of the men working one mast's rigging aloft.
gunner's mates: Petty officers under the gunner, in charge of the guns and their crews.
prime seamen: Experienced sailors who can hand, reef and steer.
receiving ship: A hulk where pressed men and volunteers were held until drafted to ships.
press | pressed: The impressment service, which took seafaring men for the Navy by force.
all hands: The whole ship's company.
turned up: Called on deck by the boatswain and his mates.
fleet action: A battle between fleets of ships of the line.
marines: Soldiers carried aboard for sentry duty, musketry and boarding. A sloop had perhaps fifteen, under a sergeant.
great cabin: The captain's quarters at the stern.
swinging cot: A wooden-framed canvas bed slung from the deck beams.
quarter-gallery: A small enclosed gallery projecting from the stern quarter, holding the captain's privy.
at quarters: At action stations, when every man goes to his place for battle.
steward: The captain's servant, who keeps his table, wine and private stores.
cabin stores: A captain bought his own table: wine, poultry, livestock and delicacies, at his own expense. Entertaining was expected of him, and it ruined many.
cross them | crossed: Writing a second set of lines across the first, at right angles, to save paper and postage.
lieutenant of marines: A marine officer. A sloop rarely carried one.
vouchers: The receipts and certificates by which a purser accounted for every issue of stores.
officer of the watch: The officer in charge of the deck during a watch.
counter: The overhanging part of the stern, above the waterline.
topmast: The second section of a mast, above the lower mast. A spare was carried in case one was carried away.
purser: The warrant officer responsible for the ship's provisions and slops, who kept the accounts of them and was widely believed to profit by them.
forenoon: The forenoon watch, eight o'clock until noon.
two bells | four bells | eight bells: Time aboard is struck on the ship's bell every half hour, one stroke more each time, until eight bells ends the four-hour watch and the count begins again.
first watch: The watch from eight in the evening until midnight.
watch: One of the divisions of the ship's day, mostly of four hours: the first watch (8 p.m. to midnight), middle, morning, forenoon, afternoon, and the two short dog watches between 4 and 8 p.m.
fortnight: Two weeks.
biscuit | bread: Ship's biscuit, baked hard to keep. "Bread" in the Navy meant biscuit. A pound a day per man.
pease: Dried split peas, boiled into a thick soup. Half a pint, four days a week.
oatmeal: Boiled with water into burgoo for breakfast. A pint, three days a week.
beef | pork | pieces: Salt meat came in casks of pieces of a fixed weight: four pounds of beef, two of pork, before boiling. Casks were numbered, and opening one was entered in the log, with the number of pieces found and any shortfall.
firkin | firkins: A small cask; a firkin of butter held 56 pounds.
hogshead | hogsheads: A cask of about 63 gallons.
puncheon | puncheons: A large cask of about 72 gallons, the usual cask for spirits.
butt | butts: A large cask of about 108 gallons, the usual cask for water.
bushel | bushels: A measure of dry goods: eight gallons, or 64 pints.
allowance | full allowance | two-thirds allowance: The ration. On "two-thirds allowance" (six men sharing four men's food) the men were paid short-allowance money for what they went without, eventually.
purser's eighth: A purser was allowed one-eighth of most provisions for waste and leakage, so that the men's "pound" was fourteen ounces. Anything he kept back beyond that was fraud.
purser's steward: The purser's assistant, who kept the bread-room and issued the provisions.
agent victualler: The Victualling Board's officer at a foreign port, who supplied ships with provisions.
victualling yard: A naval establishment for storing and issuing provisions. Gibraltar had one.
contractor: A merchant engaged to supply fresh provisions to the fleet. Contractors were widely believed to grow rich on it.
lemon juice: Issued against scurvy, mixed with sugar. Its use was ordered throughout the fleet in these years, though not every captain troubled with it.
scurvy: The sailor's disease, from want of fresh food. Lemon juice and fresh greens keep it off.
survey: A formal inspection by three officers, whose signed report the Navy accepted as evidence. Stores were condemned, and accounts corrected, only by survey.
condemned: Declared unfit by survey, and so removed from the purser's charge.
watering place: A spring or fountain where ships filled their water casks, carried to and fro in the boats.
masthead | the masthead: The lookout, posted high on the mast, who sees a sail or land long before the deck does.
lee bow: Ahead and to the side away from the wind.
private signal: A secret signal by which British warships recognised each other at sea. It was changed regularly and guarded closely.
sail of the line: A ship of the line of battle: a two- or three-decker of sixty-four guns or more.
standing off and on: Sailing back and forth off a harbour or coast, keeping watch on it.
drum beats to quarters | beats to quarters: The drum roll calling every man to his station for action, or for exercise.
cast loose: Freed from the lashings that secure a gun at sea.
gun captains: The leading men of each gun's crew, who aim and fire it.
gunner: The warrant officer in charge of the guns, powder and shot, who answers for every round to the Board of Ordnance.
boatswain: The warrant officer in charge of the rigging, sails, anchors and cables, and of driving the men to their work.
carpenter: The warrant officer in charge of the hull, masts and boats, and of stopping leaks.
master: The warrant officer responsible for navigation, and for the stowage of the hold.
sailmaker: The petty officer who makes and mends the sails.
bend: To make a sail fast to its yard, ready for setting.
squall: A sudden, violent gust of wind, often with rain.
treenail: A wooden peg, used in place of an iron bolt, that fastens a ship's planks to her frames.
fore peak: The narrow space right forward in the bottom of the ship.
pumps | the pumps: The chain pumps, worked by hand, that clear the water a ship makes. Every wooden ship leaks some; the question is how much.
inches an hour | inches of water: Water rising in the well, measured with a sounding rod. A tight ship might make an inch or two an hour.
oakum: Old rope picked apart into loose fibre, driven into seams to make them watertight.
bread-room: The lined compartment aft where the biscuit is kept, as dry, and as free of rats, as can be managed.
brimstone: Sulphur, burnt to smoke out rats and vermin.
grape: Grapeshot: a cluster of small iron balls fired together, murderous at close range.
round shot: Solid iron balls, the ordinary ammunition of a great gun.
spars: Masts, yards and booms, or the spare timbers carried to replace them.
fished: Splinted, as a broken limb is splinted, with lengths of timber bound round a sprung spar.
sprung: Of a mast or yard: cracked, but still standing.

  else if (hm < 720){ name = 'Forenoon watch'; startAt = 480; }
  else if (hm < 960){ name = 'Afternoon watch'; startAt = 720; }
  else if (hm < 1080){ name = 'First dog watch'; startAt = 960; }
  else if (hm < 1200){ name = 'Last dog watch'; startAt = 1080; }
  else { name = 'First watch'; startAt = 1200; }
  const n = Math.floor((hm - startAt) / 30);
  let bell;
  if (startAt === 1080) bell = n === 0 ? 'four bells' : (BELLS[n] + (n === 1 ? ' bell' : ' bells'));
  else bell = n === 0 ? 'eight bells' : (BELLS[n] + (n === 1 ? ' bell' : ' bells'));
  return { name, bell };
}
function fmtHour(min){
  const c = clockOf(min); const h12 = ((c.h + 11) % 12) + 1;
  const ap = c.h < 12 ? 'a.m.' : 'p.m.';
  if (c.h === 12 && c.mi === 0) return 'noon';
  if (c.h === 0 && c.mi === 0) return 'midnight';
  return `${h12}${c.mi ? '.' + String(c.mi).padStart(2,'0') : ''} ${ap}`;
}
function fmtSpan(mins){
  if (mins >= 1440){ const d = Math.floor(mins / 1440); return d + (d === 1 ? ' day' : ' days'); }
  const h = Math.floor(mins / 60); return h + (h === 1 ? ' hour' : ' hours');
}

/* ============================================================
   CONTENT PARSER
   ============================================================ */
const EVENT_KEYS = new Set(['title','place','requires','weight','effects','effect','log','tags']);
const CHOICE_KEYS = new Set(['requires','needs','why not','effects','effect','log','text','next','greyed']);
const blankBranch = () => ({ effects: [], text: '', next: null });

function splitOutsideQuotes(str, sepRe){
  const out = []; let cur = '', q = false;
  for (const ch of str){
    if (ch === '"') { q = !q; cur += ch; continue; }
    if (!q && sepRe.test(ch)) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseValue(name, raw){
  if (MONEY.has(name)) return parseMoney(raw);
  const n = parseFloat(String(raw).replace(/^\+/, ''));
  return isNaN(n) ? null : n;
}
/* weights are kept in ounces, liquids in fluid ounces (sixteen to the pint), counted things as numbers */
function parseMeasure(str, dimHint){
  const m = String(str).trim().match(/^(\d+(?:\.\d+)?)\s*(lb|oz|pints?|quarts?|gallons?)?$/i);
  if (!m) return null;
  const n = +m[1], u = (m[2] || '').toLowerCase();
  if (!u) return { dim: 'n', base: n };
  if (u === 'lb') return { dim: 'w', base: n * 16 };
  if (u === 'oz') return { dim: dimHint === 'v' ? 'v' : 'w', base: n };
  if (u.startsWith('pint')) return { dim: 'v', base: n * 16 };
  if (u.startsWith('quart')) return { dim: 'v', base: n * 32 };
  return { dim: 'v', base: n * 128 };
}
function unitMins(n, u){
  u = u.toLowerCase();
  return u.startsWith('minute') ? n : u.startsWith('hour') ? n * 60 : u.startsWith('watch') ? n * 240 : n * 1440;
}

function parseConds(str, where, prob){
  const out = [];
  for (const part0 of splitOutsideQuotes(str.replace(/\band\b/gi, ','), /,/)){
    const part = part0.trim(); let m;
    if ((m = part.match(/^(?:not|no)\s+voyage\s+([a-z0-9_]+)$/i))) out.push({ type: 'voyage', name: m[1].toLowerCase(), neg: true });
    else if ((m = part.match(/^(?:not|no)\s+([a-z0-9_]+)$/i))) out.push({ type: 'flag', name: m[1].toLowerCase(), neg: true });
    else if ((m = part.match(/^place\s+([a-z0-9_]+)$/i))) out.push({ type: 'place', name: m[1].toLowerCase() });
    else if ((m = part.match(/^voyage\s+([a-z0-9_]+)$/i))) out.push({ type: 'voyage', name: m[1].toLowerCase() });
    else if ((m = part.match(/^(before|after)\s+(\d{1,2})[:.](\d{2})$/i))) out.push({ type: 'tod', op: m[1].toLowerCase(), at: (+m[2]) * 60 + (+m[3]) });
    else if ((m = part.match(/^([a-z0-9_]+)\s+(\d+(?:\.\d+)?)\s*(minutes?|hours?|watch(?:es)?|days?)\s+or\s+(more|less)$/i)))
      out.push({ type: 'timer', name: m[1].toLowerCase(), mins: unitMins(+m[2], m[3]), op: m[4].toLowerCase() === 'more' ? '>=' : '<=' });
    else if ((m = part.match(/^([a-z0-9_]+)\s+(.+?)\s+or\s+(more|less)$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[2]);
      if (v == null) prob('error', where, `I could not read the amount "${m[2]}" in "${part}".`);
      else out.push({ type: 'cmp', name, op: m[3].toLowerCase() === 'more' ? '>=' : '<=', value: v });
    }
    else if ((m = part.match(/^([a-z0-9_]+)\s*(>=|<=|==|=|>|<)\s*(.+)$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[3]);
      if (v == null) prob('error', where, `I could not read the amount "${m[3]}" in "${part}".`);
      else out.push({ type: 'cmp', name, op: m[2] === '==' ? '=' : m[2], value: v });
    }
    else if ((m = part.match(/^([a-z0-9_]+)$/i))) out.push({ type: 'flag', name: m[1].toLowerCase(), neg: false });
    else prob('error', where, `I could not understand the requirement "${part}".`);
  }
  return out;
}

/* "+20 if new_coat", "-10 if not friend_dawe", "+10 per standing" */
function parseMods(str, where, prob){
  const mods = [];
  for (const part of String(str).split(',').map(s => s.trim()).filter(Boolean)){
    let m;
    if ((m = part.match(/^([+-])\s*(\d+(?:\.\d+)?)\s+if\s+(.+)$/i))) mods.push({ n: (m[1] === '-' ? -1 : 1) * +m[2], conds: parseConds(m[3], where, prob) });
    else if ((m = part.match(/^([+-])\s*(\d+(?:\.\d+)?)\s+per\s+([a-z0-9_]+)$/i))) mods.push({ n: (m[1] === '-' ? -1 : 1) * +m[2], per: m[3].toLowerCase() });
    else prob('error', where, `I could not understand "${part}". Write it like "+20 if new_coat" or "+10 per standing".`);
  }
  return mods;
}

function parseEffects(str, where, prob){
  const out = [];
  for (const part of splitOutsideQuotes(str, /;/)){
    let m;
    if ((m = part.match(/^log\s+"?(.*?)"?$/i))) out.push({ op: 'log', text: m[1] });
    else if ((m = part.match(/^set\s+([a-z0-9_]+)$/i))) out.push({ op: 'flag', name: m[1].toLowerCase(), on: true });
    else if ((m = part.match(/^clear\s+([a-z0-9_]+)$/i))) out.push({ op: 'flag', name: m[1].toLowerCase(), on: false });
    else if ((m = part.match(/^start\s+([a-z0-9_]+)$/i))) out.push({ op: 'start', name: m[1].toLowerCase() });
    else if ((m = part.match(/^stop\s+([a-z0-9_]+)$/i))) out.push({ op: 'stop', name: m[1].toLowerCase() });
    else if ((m = part.match(/^orders\s+([a-z0-9_]+)$/i))) out.push({ op: 'orders', name: m[1].toLowerCase(), where });
    else if ((m = part.match(/^store\s+([a-z0-9_]+)\s*([+-])\s*(\d+(?:\.\d+)?)(?:\s+"([^"]*)")?$/i))) out.push({ op: 'store', name: m[1].toLowerCase(), value: (m[2] === '-' ? -1 : 1) * +m[3], label: m[4] || '', where });
    else if ((m = part.match(/^empty\s+([a-z0-9_]+)(?:\s+"([^"]*)")?$/i))) out.push({ op: 'empty', name: m[1].toLowerCase(), label: m[2] || '', where });
    else if ((m = part.match(/^fill\s+([a-z0-9_]+)(?:\s+"([^"]*)")?$/i))) out.push({ op: 'fill', name: m[1].toLowerCase(), label: m[2] || '', where });
    else if (/^condemn$/i.test(part)) out.push({ op: 'condemn' });
    else if (/^survey$/i.test(part)) out.push({ op: 'survey' });
    else if ((m = part.match(/^allowance\s+(short|full)$/i))) out.push({ op: 'allowance', short: m[1].toLowerCase() === 'short' });
    else if ((m = part.match(/^voyage\s+([a-z0-9_]+)(?:\s+(\d+(?:\.\d+)?)\s*(watch(?:es)?|days?|hours?))?$/i))) out.push({ op: 'voyage', name: m[1].toLowerCase(), watches: m[2] ? unitMins(+m[2], m[3]) / 240 : null });
    else if ((m = part.match(/^roll\s+([a-z0-9_]+)\s+(\d+(?:\.\d+)?)$/i))) out.push({ op: 'roll', name: m[1].toLowerCase(), chance: +m[2] });
    else if ((m = part.match(/^pass\s+(\d+)\s*(minutes?|hours?|watch(?:es)?|days?)$/i))) out.push({ op: 'pass', mins: unitMins(+m[1], m[2]) });
    else if ((m = part.match(/^until\s+(\d{1,2})[:.](\d{2})$/i))) out.push({ op: 'until', at: (+m[1]) * 60 + (+m[2]) });
    else if ((m = part.match(/^place\s+([a-z0-9_]+)$/i))) out.push({ op: 'place', name: m[1].toLowerCase() });
    else if ((m = part.match(/^([a-z0-9_]+)\s*([+-])\s*(.+?)(?:\s+"([^"]*)")?$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[3]);
      if (v == null) prob('error', where, `I could not read the amount in "${part}".`);
      else out.push({ op: 'add', name, value: m[2] === '-' ? -v : v, label: m[4] || '' });
    }
    else if ((m = part.match(/^([a-z0-9_]+)\s*=\s*(.+?)(?:\s+"([^"]*)")?$/i))){
      const name = m[1].toLowerCase(), v = parseValue(name, m[2]);
      if (v == null) prob('error', where, `I could not read the amount in "${part}".`);
      else out.push({ op: 'setvar', name, value: v, label: m[3] || '' });
    }
    else prob('error', where, `I could not understand the effect "${part}".`);
  }
  return out;
}

function parseNext(v, where, prob){
  const s = v.trim(); let m;
  if (/^end$/i.test(s)) return { type: 'end' };
  if ((m = s.match(/^any\s+([a-z0-9_]+)$/i))) return { type: 'any', tag: m[1].toLowerCase() };
  if ((m = s.match(/^watch(?:es)?(?:\s+(\d+))?$/i))) return { type: 'watches', n: m[1] ? +m[1] : 1 };
  if (/^[a-z0-9_]+$/i.test(s)) return { type: 'go', id: s };
  prob('error', where, `"Next: ${s}" should name one event, or say "any <place>" or "end".`);
  return null;
}

function parseContent(blocks){
  const P = { settings: {}, events: {}, order: [], orders: {}, ship: {}, stores: {}, storeOrder: [], glossary: [], problems: [], stats: { words: 0 } };
  const prob = (sev, where, msg) => P.problems.push({ sev, where, msg });

  /* money values must be known before anything is parsed */
  MONEY = new Set(['money']);
  for (const blk of blocks){
    const m = blk.text.match(/^\s*money values\s*:\s*(.+)$/im);
    if (m) m[1].split(',').map(s => s.trim().toLowerCase()).filter(Boolean).forEach(n => MONEY.add(n));
  }

  for (const blk of blocks){
    const lines = blk.text.replace(/\r/g, '').split('\n');
    let section = null, ev = null, ch = null, target = null, lastKey = null, ord = null, sto = null;
    let para = [], paraLine = 0;
    const where = i => `${blk.name}, line ${i + 1}`;
    const flushPara = () => {
      if (!para.length) return;
      if (section === 'orders' && ord){ ord.paras.push({ text: para.join(' '), sig: false }); }
      else if (ev){
        let text = para.join(' '), cond = null, m;
        if ((m = text.match(/^\[if\s+([^\]]+)\]\s*(.*)$/i))){ cond = parseConds(m[1], `${blk.name}, line ${paraLine}`, prob); text = m[2]; }
        ev.paras.push({ text, cond, line: paraLine });
      }
      para = [];
    };

    lines.forEach((raw, i) => {
      const t = raw.trim(); let m;
      if (t.startsWith('#')) return;
      if (t === ''){ flushPara(); if (lastKey !== 'gloss') lastKey = null; return; }

      if (/^settings$/i.test(t)){ flushPara(); section = 'settings'; ev = ch = ord = null; return; }
      if (/^SHIP$/.test(t)){ flushPara(); section = 'ship'; ev = ch = ord = null; return; }
      if ((m = t.match(/^STORE\s*:\s*(.*)$/))){
        flushPara(); section = 'store'; ev = ch = ord = null;
        const id = m[1].trim().toLowerCase();
        if (!/^[a-z0-9_]+$/.test(id)) prob('error', where(i), `The store name "${id}" should use only letters, numbers and underscores.`);
        if (P.stores[id]) prob('error', where(i), `There are two stores called "${id}".`);
        sto = P.stores[id] = { id, name: id, unit: ['cask', 'casks'], dim: 'n', size: 1, ration: null, officer: 'purser', capacity: 0, keeps: 0, bad: 0, badWord: 'bad', short: 0, pieces: 0, instead: null, only: null, bought: false, logOpen: false, stock: [], where: where(i), rationRaw: null };
        P.storeOrder.push(id); return;
      }
      if (/^glossary$/i.test(t)){ flushPara(); section = 'glossary'; ev = ch = ord = null; lastKey = null; return; }
      if ((m = t.match(/^ORDERS\s*:\s*(.*)$/))){
        flushPara(); section = 'orders'; ev = ch = null;
        const id = m[1].trim().toLowerCase();
        if (P.orders[id]) prob('error', where(i), `There are two sets of orders called "${id}".`);
        ord = P.orders[id] = { id, heading: '', paras: [], where: where(i) };
        return;
      }
      if ((m = t.match(/^event\s*:\s*(.*)$/i))){
        flushPara(); section = 'event'; ch = null; ord = null; target = null; lastKey = null;
        const id = m[1].trim();
        if (!/^[a-z0-9_]+$/i.test(id)) prob('error', where(i), `The event name "${id}" should use only letters, numbers and underscores.`);
        if (P.events[id]) prob('error', where(i), `There are two events called "${id}".`);
        ev = { id, title: '', place: null, requires: [], weight: 1, weightMods: [], effects: [], tags: [], once: false, start: false, ending: false, hub: false, urgent: false, paras: [], choices: [], where: where(i) };
        P.events[id] = ev; P.order.push(id); return;
      }

      if (section === 'settings'){
        if ((m = t.match(/^([^:]+):\s*(.*)$/))) P.settings[m[1].trim().toLowerCase()] = m[2].trim();
        else prob('warn', where(i), 'Settings lines should look like "name: value".');
        return;
      }
      if (section === 'glossary'){
        if ((m = t.match(/^([^:]+):\s*(.+)$/))){
          const terms = m[1].split('|').map(s => s.trim()).filter(Boolean);
          P.glossary.push({ terms, def: m[2].trim(), where: where(i) }); lastKey = 'gloss';
        } else prob('warn', where(i), 'Glossary lines should look like "term | other form: definition".');
        return;
      }
      if (section === 'ship'){
        if ((m = t.match(/^([a-z0-9_]+)\s*:\s*(.*)$/i))) P.ship[m[1].toLowerCase()] = m[2].trim();
        else prob('warn', where(i), 'Ship lines should look like "leak: 2".');
        return;
      }
      if (section === 'store'){
        if (/^log openings$/i.test(t)){ sto.logOpen = true; return; }
        if (/^bought$/i.test(t)){ sto.bought = true; return; }
        if (!(m = t.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){ prob('warn', where(i), 'Store lines should look like "Holds: 112 lb".'); return; }
        const k = m[1].toLowerCase(), v = m[2].trim();
        if (k === 'name') sto.name = v;
        else if (k === 'unit'){ const u = v.split('|').map(x => x.trim()); sto.unit = [u[0], u[1] || u[0] + 's']; }
        else if (k === 'holds'){ const ms = parseMeasure(v); if (!ms) prob('error', where(i), `I could not read "${v}". Write it like "112 lb", "108 gallons" or "1".`); else { sto.dim = ms.dim; sto.size = ms.base; } }
        else if (k === 'ration') sto.rationRaw = { v, where: where(i) };
        else if (k === 'kept by') sto.officer = v.toLowerCase();
        else if (k === 'capacity') sto.capacity = parseFloat(v) || 0;
        else if (k === 'keeps') sto.keeps = parseFloat(v) || 0;
        else if (k === 'bad') sto.bad = parseFloat(v) || 0;
        else if (k === 'bad word') sto.badWord = v;
        else if (k === 'short') sto.short = parseFloat(v) || 0;
        else if (k === 'pieces') sto.pieces = parseFloat(v) || 0;
        else if (k === 'instead of') sto.instead = v.toLowerCase();
        else if (k === 'only if') sto.only = parseConds(v, where(i), prob);
        else if (k === 'stock'){
          const sm = v.match(/^(\d+(?:\.\d+)?)\s+[a-z]+(?:,\s*nos?\.?\s*(\d+)(?:\s*[–-]\s*\d+)?)?(?:,\s*received\s+(\d{4}-\d{1,2}-\d{1,2}))?(?:\s+(?:from|of)\s+(.+))?$/i);
          if (!sm) prob('error', where(i), `I could not read the stock line "${short(v)}".`);
          else sto.stock.push({ qty: +sm[1], no: sm[2] ? +sm[2] : null, date: sm[3] || null, from: sm[4] || '' });
        }
        else prob('warn', where(i), `"${m[1]}" is not something a store has.`);
        return;
      }
      if (section === 'orders'){
        if ((m = t.match(/^heading\s*:\s*(.*)$/i))){ ord.heading = m[1].trim(); return; }
        if ((m = t.match(/^(passage|station|return)\s*:\s*(\d+(?:\.\d+)?)\s*(watch(?:es)?|days?|hours?)$/i))){ ord[m[1].toLowerCase()] = unitMins(+m[2], m[3]) / 240; return; }
        if (t.startsWith('>')){ flushPara(); ord.paras.push({ text: t.replace(/^>\s*/, ''), sig: true }); return; }
        if (!para.length) paraLine = i + 1;
        para.push(t); return;
      }
      if (section !== 'event'){ prob('warn', where(i), 'This line is not inside any EVENT, so it is ignored.'); return; }

      if ((m = t.match(/^choice\s*:\s*(.+)$/i))){
        flushPara();
        ch = { text: m[1].trim(), requires: [], needs: [], why: '', chance: null, chanceMods: [], base: blankBranch(), success: blankBranch(), failure: blankBranch(), where: where(i) };
        ev.choices.push(ch); target = ch.base; lastKey = null; return;
      }

      if (ch){
        if ((m = t.match(/^chance\s+(\d+)\s*%?(.*)$/i))){
          const rest = m[2].trim().replace(/:$/, '').trim().replace(/^,/, '').trim();
          ch.chance = +m[1]; ch.chanceMods = rest ? parseMods(rest, where(i), prob) : [];
          target = ch.success; lastKey = null;
          if (+m[1] > 100) prob('warn', where(i), 'A chance above 100 is treated as 100.');
          return;
        }
        if (/^otherwise\s*:?$/i.test(t)){
          if (ch.chance == null) prob('error', where(i), '"Otherwise" needs a "Chance" line before it.');
          target = ch.failure; lastKey = null; return;
        }
        if (/^greyed$/i.test(t)){ ch.needs.push(...ch.requires); ch.requires = []; return; }
        if ((m = t.match(/^([a-z]+(?: not)?)\s*:\s*(.*)$/i)) && CHOICE_KEYS.has(m[1].toLowerCase())){
          const k = m[1].toLowerCase(), v = m[2].trim(); lastKey = null;
          if (k === 'requires' || k === 'needs'){
            if (target !== ch.base) prob('error', where(i), `"${m[1]}" must come before any "Chance" line.`);
            ch[k].push(...parseConds(v, where(i), prob));
          }
          else if (k === 'why not' || k === 'greyed') ch.why = v;
          else if (k === 'effects' || k === 'effect') target.effects.push(...parseEffects(v, where(i), prob));
          else if (k === 'log') target.effects.push({ op: 'log', text: v.replace(/^"|"$/g, '') });
          else if (k === 'text'){ target.text += (target.text ? ' ' : '') + v; lastKey = 'text'; }
          else if (k === 'next'){ target.next = parseNext(v, where(i), prob); target.nextWhere = where(i); }
          return;
        }
        if (lastKey === 'text'){ target.text += ' ' + t; return; }
        prob('warn', where(i), `I could not tell what this line under the choice "${short(ch.text)}" is meant to be. Result text needs "Text:" in front of it.`);
        return;
      }

      if (/^(once|start|ending|hub|urgent)$/i.test(t)){ flushPara(); ev[t.toLowerCase()] = true; return; }
      if ((m = t.match(/^([a-z]+)\s*:\s*(.*)$/i)) && EVENT_KEYS.has(m[1].toLowerCase())){
        flushPara();
        const k = m[1].toLowerCase(), v = m[2].trim();
        if (k === 'title') ev.title = v;
        else if (k === 'place') ev.place = v.toLowerCase();
        else if (k === 'requires') ev.requires.push(...parseConds(v, where(i), prob));
        else if (k === 'weight'){
          const parts = v.split(','); ev.weight = parseFloat(parts.shift());
          if (!(ev.weight >= 0)){ prob('error', where(i), 'Weight should start with a number.'); ev.weight = 1; }
          ev.weightMods = parseMods(parts.join(','), where(i), prob);
        }
        else if (k === 'effects' || k === 'effect') ev.effects.push(...parseEffects(v, where(i), prob));
        else if (k === 'log') ev.effects.push({ op: 'log', text: v.replace(/^"|"$/g, '') });
        else if (k === 'tags') ev.tags = v.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        return;
      }
      if (!para.length) paraLine = i + 1;
      para.push(t);
    });
    flushPara();
  }
  for (const id of P.storeOrder){
    const d = P.stores[id];
    if (d.rationRaw){
      const rm = d.rationRaw.v.match(/^(.+?)\s+(every day|daily|on\s+(.+))$/i);
      const ms = rm && parseMeasure(rm[1], d.dim);
      if (!ms || ms.dim !== d.dim) prob('error', d.rationRaw.where, `I could not read the ration "${d.rationRaw.v}". Write it like "1 lb every day" or "2 lb on Tuesday and Saturday", in the same kind of measure as Holds.`);
      else {
        let days = null;
        if (rm[3]){
          days = rm[3].replace(/\band\b/gi, ',').split(',').map(x => x.trim()).filter(Boolean).map(x => x.charAt(0).toUpperCase() + x.slice(1).toLowerCase());
          const badDay = days.find(x => !DAYS.includes(x));
          if (badDay) prob('error', d.rationRaw.where, `"${badDay}" is not a day of the week.`);
        }
        d.ration = { amt: ms.base, days };
      }
    }
    if (!d.size) prob('error', d.where, `The store "${id}" has no "Holds:" line.`);
    if (d.instead && !P.stores[d.instead]) prob('error', d.where, `"Instead of: ${d.instead}" names a store that does not exist.`);
  }
  validate(P, prob);
  return P;
}

function allEffectsOf(ev){
  const out = [...ev.effects];
  for (const ch of ev.choices) out.push(...ch.base.effects, ...ch.success.effects, ...ch.failure.effects);
  return out;
}

function validate(P, prob){
  const ids = P.order;
  if (!ids.length){ prob('error', 'Content', 'There are no events at all.'); return; }
  const starts = ids.filter(id => P.events[id].start);
  if (starts.length > 1) prob('warn', P.events[starts[1]].where, 'More than one event is marked "Start"; the first one is used.');
  P.startId = starts[0] || ids[0];

  const incoming = {};
  const anyTags = new Set();
  const ordersUsed = new Set();
  for (const id of ids){
    const ev = P.events[id];
    const words = ev.paras.reduce((n, p) => n + p.text.split(/\s+/).length, 0);
    P.stats.words += words;
    if (!ev.title) prob('warn', ev.where, `The event "${id}" has no Title.`);
    if (words > 150 && !ev.hub) prob('warn', ev.where, `"${id}" runs to ${words} words; on a phone the choices may fall below the fold. Aim for 150 or fewer.`);
    if (!ev.ending && !ev.choices.length) prob('error', ev.where, `"${id}" has no choices and is not marked "Ending", so the player would be stuck.`);
    if (ev.ending && ev.choices.length) prob('warn', ev.where, `"${id}" is an Ending, so its choices are never shown.`);
    if (ev.choices.length > 4 && !ev.hub) prob('warn', ev.where, `"${id}" offers ${ev.choices.length} choices; the design calls for two to four.`);
    if (ev.hub && !ev.place) prob('error', ev.where, `"${id}" is a Hub but has no Place.`);
    for (const e of allEffectsOf(ev)) if ((e.op === 'store' || e.op === 'empty' || (e.op === 'fill' && e.name !== 'provisions')) && !P.stores[e.name])
      prob('error', e.where, `"${e.op} ${e.name}" names a store that does not exist.`);
    for (const e of allEffectsOf(ev)) if (e.op === 'orders'){
      ordersUsed.add(e.name);
      if (!P.orders[e.name]) prob('error', e.where, `"orders ${e.name}" names orders that have not been written.`);
    }
    for (const ch of ev.choices){
      const branches = [ch.base, ch.success, ch.failure];
      if (ch.chance != null && !ch.failure.text && !ch.failure.next && !ch.failure.effects.length)
        prob('warn', ch.where, `"${short(ch.text)}" has a Chance but no "Otherwise", so failing the roll does nothing special.`);
      if (ch.why && !ch.needs.length) prob('warn', ch.where, `"${short(ch.text)}" has a "Why not" but no "Needs", so the reason is never shown.`);
      let hasNext = false;
      for (const b of branches){
        if (!b.next) continue;
        hasNext = true;
        if (b.next.type === 'go'){
          if (!P.events[b.next.id]) prob('error', b.nextWhere, `"Next: ${b.next.id}" names an event that does not exist.`);
          else incoming[b.next.id] = true;
        }
        if (b.next.type === 'any') anyTags.add(b.next.tag);
        if (b.next.type === 'watches') anyTags.add('sea');
      }
      const goesSomewhere = ch.base.next || (ch.chance != null && ch.success.next && ch.failure.next);
      if (!goesSomewhere && !hasHub(P, ev.place))
        prob('error', ch.where, `"${short(ch.text)}" does not say where to go on every outcome, and there is no Hub for this place to fall back on.`);
    }
  }
  for (const id of ids){
    const ev = P.events[id];
    if (id === P.startId || incoming[id]) continue;
    if (ev.hub || ev.tags.some(t => anyTags.has(t))) continue;
    prob('warn', ev.where, `Nothing leads to "${id}" yet.`);
  }
  for (const t of anyTags){
    if (!ids.some(id => P.events[id].tags.includes(t)) && !hasHub(P, t))
      prob('error', 'Content', `Something says "Next: any ${t}", but no event has that tag and there is no Hub for that place.`);
  }
  for (const id of Object.keys(P.orders)){
    if (!ordersUsed.has(id)) prob('warn', P.orders[id].where, `The orders "${id}" are never given.`);
    if (!P.orders[id].heading) prob('warn', P.orders[id].where, `The orders "${id}" have no Heading.`);
  }
  const seen = {};
  for (const g of P.glossary) for (const t of g.terms){
    const k = normTerm(t);
    if (seen[k]) prob('warn', g.where, `The glossary term "${t}" appears twice.`);
    seen[k] = true;
  }
}
function hasHub(P, place){ return !!place && P.order.some(id => P.events[id].hub && P.events[id].place === place); }
function normTerm(t){ return String(t).toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim(); }

/* ============================================================
   GAME STATE AND RULES
   ============================================================ */
let content = null;
let state = null;
let downloadsApi = null;
let prefs = { scale: 1 };

function surname(){ const p = (state && state.name || '').trim().split(/\s+/); return p[p.length - 1] || 'Captain'; }
function placeName(p){
  const base = content.settings['place.' + p] || (p ? p.charAt(0).toUpperCase() + p.slice(1) : '');
  if (p === 'sea' && state.voyage) return `${base}, ${content.settings['voyage.' + state.voyage.name] || state.voyage.name}`;
  return base;
}
function getVar(name){
  if (name === 'money') return state.money;
  if (name === 'day') return Math.floor(state.minutes / 1440) + 1;
  if (name === 'hour') return clockOf(state.minutes).h;
  if (name in state.vars) return state.vars[name];
  if (content.stores[name]) return state.stores && state.stores[name] ? state.stores[name].book / content.stores[name].size : 0;
  const m = name.match(/^([a-z0-9_]+)_days$/);
  if (m && content.stores[m[1]]) return daysOf(m[1]);
  if (name === 'voyage_left') return state.voyage ? state.voyage.left : 0;
  return 0;
}
function setVar(name, v){ if (name === 'money') state.money = v; else state.vars[name] = v; }

function condMet(c){
  switch (c.type){
    case 'flag': return !!state.flags[c.name] !== c.neg;
    case 'place': return state.place === c.name;
    case 'voyage': return (!!state.voyage && state.voyage.name === c.name) !== !!c.neg;
    case 'tod': { const now = minuteOfDay(state.minutes); return c.op === 'before' ? now < c.at : now >= c.at; }
    case 'timer': {
      const s = state.timers[c.name]; if (s == null) return false;
      const el = state.minutes - s; return c.op === '>=' ? el >= c.mins : el <= c.mins;
    }
  }
  const v = getVar(c.name);
  switch (c.op){
    case '>=': return v >= c.value; case '<=': return v <= c.value;
    case '>': return v > c.value;   case '<': return v < c.value;
    default: return v === c.value;
  }
}
function condsMet(list){ return list.every(condMet); }
function modded(base, mods){
  let v = base;
  for (const m of mods || []){ if (m.per) v += m.n * getVar(m.per); else if (condsMet(m.conds)) v += m.n; }
  return v;
}
function whyNot(ch){
  if (ch.why) return subst(ch.why);
  const c = ch.needs.find(x => !condMet(x));
  if (c && c.type === 'cmp' && MONEY.has(c.name) && c.op.startsWith('>')) return `You have not ${fmtMoney(c.value)} to spare.`;
  return 'Not open to you now.';
}

function ordersHeading(){ const o = state.orders && content.orders[state.orders]; return o ? o.heading : 'none'; }
function subst(s){
  return String(s).replace(/\{(\w+)\}/g, (all, k0) => {
    const k = k0.toLowerCase();
    switch (k){
      case 'name': return state.name;
      case 'surname': return surname();
      case 'ship': return content.settings.ship || 'the sloop';
      case 'date': return fmtDate(state.minutes);
      case 'issued': return fmtDate(state.ordersAt != null ? state.ordersAt : state.minutes);
      case 'place': return placeName(state.place);
      case 'orders': return ordersHeading().replace(/^./, c => c.toLowerCase());
      case 'day': return String(getVar('day'));
    }
    if (MONEY.has(k)) return fmtMoney(getVar(k));
    const bad = state.lastBad && content.stores[state.lastBad.id];
    if (k === 'bad_item') return bad ? bad.name.toLowerCase() : 'stores';
    if (k === 'bad_no') return state.lastBad ? String(state.lastBad.no) : '';
    if (k === 'bad_word') return bad ? bad.badWord : 'bad';
    if (k === 'survey') return state.surveyText || '';
    if (k === 'voyage') return state.voyage ? (content.settings['voyage.' + state.voyage.name] || state.voyage.name) : 'in harbour';
    if ((k in state.vars) || content.stores[k] || /_days$/.test(k)) return String(Math.max(0, Math.floor(getVar(k))));
    return all;
  });
}

function record(acct, amt, what){
  if (!amt) return;
  state.accounts.push({ t: state.minutes, acct, amt, what: what || 'Sundries' });
}
function applyEffects(list, label){
  for (const e of list){
    switch (e.op){
      case 'flag': if (e.on) state.flags[e.name] = true; else delete state.flags[e.name]; break;
      case 'add': setVar(e.name, getVar(e.name) + e.value); if (MONEY.has(e.name)) record(e.name, e.value, subst(e.label || label)); break;
      case 'setvar': { const d = e.value - getVar(e.name); setVar(e.name, e.value); if (MONEY.has(e.name)) record(e.name, d, subst(e.label || label)); break; }
      case 'pass': advance(e.mins); break;
      case 'until': { const now = minuteOfDay(state.minutes); advance((e.at - now + 1440) % 1440); break; }
      case 'store': if (e.value > 0) receive(e.name, e.value, subst(e.label || label)); else takeOut(e.name, -e.value * content.stores[e.name].size, subst(e.label || label)); break;
      case 'empty': { const st = state.stores[e.name]; takeOut(e.name, realQty(e.name), ''); if (st.book > 0) book(e.name, -st.book, subst(e.label || label)); break; }
      case 'fill': fill(e.name, subst(e.label || label)); break;
      case 'condemn': condemn(); break;
      case 'survey': survey(); break;
      case 'allowance': if (e.short) state.flags.short_allowance = true; else delete state.flags.short_allowance; break;
      case 'voyage': startVoyage(e.name, e.watches); break;
      case 'roll': if (rand(state.rng) * 100 < e.chance) state.flags[e.name] = true; else delete state.flags[e.name]; break;
      case 'place': state.place = e.name; break;
      case 'start': state.timers[e.name] = state.minutes; break;
      case 'stop': delete state.timers[e.name]; break;
      case 'orders':
        for (const k of Object.keys(state.flags)) if (k.startsWith('orders_')) delete state.flags[k];
        state.orders = e.name; state.ordersAt = state.minutes;
        state.flags.has_orders = true; state.flags['orders_' + e.name] = true;
        break;
      case 'log': state.log.push({ t: state.minutes, text: subst(e.text) }); break;
    }
  }
}

function newGame(name, seed){
  state = {
    game: GAME_ID, v: 3, build: BUILD,
    name: (name || content.settings['default name'] || 'John Hartley').trim(),
    seed: (seed || makeSeed()).trim().toUpperCase(),
    rng: null, minutes: 0, money: parseMoney(content.settings['start money'] || '£20') || 0,
    vars: {}, flags: {}, seen: {}, timers: {}, orders: null, ordersAt: null, place: null, eventId: null,
    log: [], accounts: [], history: [], pending: null, ended: false, tested: false, startedAt: Date.now(),
    stores: null, storeLog: null, storeBad: null, lastBad: null, voyage: null, surveyText: ''
  };
  state.rng = seedRng(state.seed);
  state.minutes = startMinutes();
  state.accounts.push({ t: state.minutes, acct: 'money', amt: state.money, what: 'In hand on coming ashore', open: true });
  initShip();
  enterEvent(content.startId);
  persist();
}

function enterEvent(id){
  const ev = content.events[id];
  if (!ev){ state.nowhere = id; state.eventId = '__nowhere__'; return; }
  state.eventId = id;
  state.seen[id] = (state.seen[id] || 0) + 1;
  if (ev.place) state.place = ev.place;
  applyEffects(ev.effects, ev.title ? subst(ev.title).replace(/\*/g, '') : '');
  if (ev.ending) state.ended = true;
}

function hubFor(place){
  return content.order.find(id => content.events[id].hub && content.events[id].place === place) || null;
}
function eligible(ev){
  if (ev.once && state.seen[ev.id]) return false;
  if (ev.id === state.eventId) return false;
  return condsMet(ev.requires);
}
function pickFrom(tag, mode){
  let pool = content.order.map(id => content.events[id])
    .filter(ev => ev.tags.includes(tag) && !ev.hub && eligible(ev));
  const urgent = pool.filter(ev => ev.urgent);
  if (mode === 'urgent') pool = urgent;
  else if (mode === 'ordinary') pool = pool.filter(ev => !ev.urgent);
  else if (urgent.length) pool = urgent;
  const weighted = pool.map(ev => ({ ev, w: Math.max(0, modded(ev.weight, ev.weightMods)) })).filter(x => x.w > 0);
  const total = weighted.reduce((n, x) => n + x.w, 0);
  if (!weighted.length || total <= 0) return null;
  let r = rand(state.rng) * total;
  for (const x of weighted){ r -= x.w; if (r < 0) return x.ev.id; }
  return weighted[weighted.length - 1].ev.id;
}
function resolveNext(next){
  if (!next) return hubFor(state.place) || '__nowhere__';
  if (next.type === 'end') return '__end__';
  if (next.type === 'go') return next.id;
  if (next.type === 'watches') return sailWatches(next.n);
  return pickFrom(next.tag) || hubFor(next.tag) || hubFor(state.place) || '__nowhere__';
}
function goTo(id){
  if (id === '__end__'){ state.ended = true; state.eventId = '__end__'; return; }
  if (id === '__nowhere__'){ state.nowhere = state.eventId; state.eventId = '__nowhere__'; return; }
  enterEvent(id);
}

function choiceOpen(ch){ return condsMet(ch.requires) && condsMet(ch.needs); }
function choose(idx){
  const ev = content.events[state.eventId];
  if (!ev || state.pending || state.ended) return false;
  const ch = ev.choices[idx];
  if (!ch || !choiceOpen(ch)) return false;
  state.history.push({ e: ev.id, c: idx });
  const label = subst(ev.title || '').replace(/\*/g, '');
  let branch = null;
  applyEffects(ch.base.effects, label);
  if (ch.chance != null){
    const p = Math.max(0, Math.min(100, modded(ch.chance, ch.chanceMods)));
    branch = (rand(state.rng) * 100 < p) ? ch.success : ch.failure;
    applyEffects(branch.effects, label);
  }
  const text = (branch && branch.text) || ch.base.text;
  const next = (branch && branch.next) || ch.base.next;
  const nextId = resolveNext(next);
  if (text) state.pending = { text: subst(text), next: nextId, choice: ch.text };
  else goTo(nextId);
  persist();
  return true;
}
function carryOn(){
  if (!state.pending) return;
  const id = state.pending.next;
  state.pending = null;
  goTo(id);
  persist();
}

/* ============================================================
   SHIP, STORES AND TIME
   ============================================================ */
function dateToMin(str){ const d = str.split('-').map(Number); return (Date.UTC(d[0], d[1] - 1, d[2]) - startEpoch()) / 60000; }

/* time passes; at every noon at sea the day's allowance is issued */
function advance(mins){
  const end = state.minutes + Math.max(0, mins);
  let noon = Math.floor((state.minutes - 720) / 1440) * 1440 + 2160;
  while (noon <= end){
    state.minutes = noon;
    if (state.flags.at_sea && state.stores) dailyIssue();
    noon += 1440;
  }
  state.minutes = end;
}

function initShip(){
  for (const [k, raw] of Object.entries(content.ship)){
    const v = parseValue(k, raw);
    if (v == null) continue;
    setVar(k, v);
    if (MONEY.has(k) && k !== 'money') record(k, v, 'Balance on taking command');
  }
  state.stores = {}; state.storeLog = {}; state.storeBad = null; state.lastBad = null;
  for (const id of content.storeOrder){
    const d = content.stores[id];
    const st = state.stores[id] = { book: 0, lots: [], receipts: [], nextNo: 1 };
    state.storeLog[id] = [];
    if (d.only && !condsMet(d.only)) continue;
    let total = 0;
    for (const sk of d.stock){
      const recv = sk.date ? dateToMin(sk.date) : state.minutes;
      const first = sk.no || st.nextNo;
      st.lots.push({ units: sk.qty, opened: 0, rem: 0, recv, first });
      st.receipts.push({ t: recv, units: sk.qty, first, from: sk.from });
      st.nextNo = Math.max(st.nextNo, first + Math.ceil(sk.qty));
      total += sk.qty * d.size;
    }
    if (total) book(id, total, 'Remaining on board on taking command');
  }
  const chance = parseFloat(content.settings['purser dishonest'] || '0');
  if (rand(state.rng) * 100 < chance) state.flags.purser_skims = true;
}

function book(id, d, what){
  const st = state.stores[id];
  st.book = Math.max(0, st.book + d);
  if (Math.abs(d) > 1e-6) state.storeLog[id].push({ t: state.minutes, d, what, bal: st.book });
}
function realQty(id){
  const st = state.stores && state.stores[id]; if (!st) return 0;
  const size = content.stores[id].size;
  return st.lots.reduce((n, l) => n + (l.units - l.opened) * size + l.rem, 0);
}
function receive(id, units, from){
  const st = state.stores[id];
  const first = st.nextNo;
  st.lots.push({ units, opened: 0, rem: 0, recv: state.minutes, first });
  st.receipts.push({ t: state.minutes, units, first, from });
  st.nextNo += Math.ceil(units);
  book(id, units * content.stores[id].size, from || 'Received');
}
/* removes stores without opening casks in the ordinary way (losses, transfers, expenditure) */
function takeOut(id, amt, what){
  const st = state.stores[id], size = content.stores[id].size;
  let left = amt;
  for (const lot of st.lots){
    if (left <= 1e-9) break;
    const a = Math.min(lot.rem, left); lot.rem -= a; left -= a;
    const unopened = (lot.units - lot.opened) * size;
    const b = Math.min(unopened, left); lot.units -= b / size; left -= b;
  }
  st.lots = st.lots.filter(l => l.rem > 1e-9 || l.units - l.opened > 1e-9);
  if (what) book(id, -(amt - left), what);
  return amt - left;
}
function openCask(id, lot){
  const d = content.stores[id];
  const part = Math.min(1, lot.units - lot.opened);
  const no = lot.first + Math.floor(lot.opened + 1e-9);
  lot.opened += part; lot.rem = part * d.size;
  if (part < 0.999) return;
  let note = '';
  if (d.pieces && rand(state.rng) * 100 < d.short){
    const k = 1 + Math.floor(rand(state.rng) * 3);
    const lose = k * d.size / d.pieces;
    lot.rem -= lose;
    book(id, -lose, `Short in ${d.unit[0]} No. ${no}, ${k} ${k === 1 ? 'piece' : 'pieces'}`);
    note = `, short ${k}`;
  }
  if (d.logOpen) state.log.push({ t: state.minutes, text: `Opened a ${d.unit[0]} of ${d.name.toLowerCase()}, No. ${no}${d.pieces ? `, contents ${d.pieces} pieces${note}` : ''}.` });
  if (d.bad && !state.storeBad){
    const age = (state.minutes - lot.recv) / 1440;
    const p = d.bad * (d.keeps && age > d.keeps ? 3 : 1);
    if (rand(state.rng) * 100 < p){ state.storeBad = { id, no }; state.lastBad = { id, no }; state.flags.bad_cask = true; }
  }
}
/* the ordinary issue: draws from the oldest casks first, opening new ones as needed */
function draw(id, amt){
  const st = state.stores[id]; let got = 0;
  for (const lot of st.lots){
    while (amt - got > 1e-9){
      if (lot.rem > 1e-9){ const a = Math.min(lot.rem, amt - got); lot.rem -= a; got += a; continue; }
      if (lot.units - lot.opened > 1e-9){ openCask(id, lot); continue; }
      break;
    }
    if (amt - got <= 1e-9) break;
  }
  st.lots = st.lots.filter(l => l.rem > 1e-9 || l.units - l.opened > 1e-9);
  return got;
}
function dailyNeed(id, perDay){
  const d = content.stores[id];
  if (!d.ration) return 0;
  const frac = perDay ? 1 : (d.ration.days ? d.ration.days.length / 7 : 1);
  return d.ration.amt * getVar('victualled') * (state.flags.short_allowance ? 2 / 3 : 1) * frac;
}
function daysOf(id){
  const st = state.stores && state.stores[id]; if (!st) return 0;
  const need = dailyNeed(id);
  return need > 0 ? st.book / need : 9999;
}
function dailyIssue(){
  const day = clockOf(state.minutes).day, n = getVar('victualled'), shortA = !!state.flags.short_allowance;
  const skimPart = parseFloat(content.settings['purser skim'] || '0') / 100;
  for (const id of content.storeOrder){
    const d = content.stores[id], st = state.stores[id];
    if (!d.ration || !st) continue;
    if (d.ration.days && !d.ration.days.includes(day)) continue;
    if (d.instead && realQty(d.instead) > 1e-6) continue;
    const need = d.ration.amt * n * (shortA ? 2 / 3 : 1);
    if (need <= 0) continue;
    const skim = state.flags.purser_skims && d.officer === 'purser' ? skimPart : 0;
    const want = need * (1 - skim);
    const got = draw(id, want);
    const issued = (skim && got >= want - 1e-6) ? need : got;
    if (issued > st.book + 1e-6 && realQty(id) > 1e-6) book(id, realQty(id) + issued - st.book, 'Found in the hold, not before brought to account');
    if (issued > 1e-6) book(id, -issued, `${day}’s allowance to ${n} men${shortA ? ', at two-thirds' : ''}`);
    if (got < want - 1e-6) state.flags['out_' + id] = true; else delete state.flags['out_' + id];
  }
}
function fill(which, from){
  const ids = which === 'provisions'
    ? content.storeOrder.filter(id => content.stores[id].officer === 'purser' && content.stores[id].ration && !content.stores[id].bought)
    : [which];
  for (const id of ids){
    const d = content.stores[id];
    if (!d.capacity) continue;
    const units = Math.floor(d.capacity - realQty(id) / d.size + 1e-9);
    if (units > 0) receive(id, units, from || 'Received');
  }
}
function condemn(){
  const b = state.storeBad; if (!b) return;
  const st = state.stores[b.id];
  const lot = st.lots.find(l => b.no >= l.first && b.no < l.first + Math.ceil(l.opened - 1e-9) && l.rem > 1e-9 && l.first + Math.ceil(l.opened - 1e-9) - 1 === b.no);
  if (lot){ const lose = lot.rem; lot.rem = 0; book(b.id, -lose, `Condemned by survey, ${content.stores[b.id].unit[0]} No. ${b.no}`); }
  st.lots = st.lots.filter(l => l.rem > 1e-9 || l.units - l.opened > 1e-9);
  state.storeBad = null;
}
function listJoin(a){ return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function survey(){
  const found = [];
  for (const k of ['survey_over', 'survey_short', 'survey_right']) delete state.flags[k];
  for (const id of content.storeOrder){
    const d = content.stores[id], st = state.stores[id];
    if (!st || (d.officer !== 'purser' && d.officer !== 'master')) continue;
    const diff = realQty(id) - st.book;
    if (Math.abs(diff) < d.size * 0.05) continue;
    book(id, diff, diff > 0 ? 'Found over by survey' : 'Found short by survey');
    found.push(`the ${d.name.toLowerCase()} ${diff > 0 ? 'over' : 'short'} by ${fmtAmt(d, Math.abs(diff))}`);
    state.flags[diff > 0 ? 'survey_over' : 'survey_short'] = true;
  }
  if (!found.length) state.flags.survey_right = true;
  state.surveyText = found.length ? `The survey finds ${listJoin(found)}, against the purser’s books.` : 'The survey finds the purser’s books right, to within what a slate and a lantern can tell.';
}
function startVoyage(name, watches){
  const o = state.orders && content.orders[state.orders];
  const key = name === 'outward' ? 'passage' : name === 'homeward' ? 'return' : name;
  const w = watches != null ? watches : (o && o[key] != null ? o[key] : 0);
  for (const k of ['outward_done', 'station_done', 'homeward_done']) if (k === name + '_done') delete state.flags[k];
  if (w <= 0){ state.voyage = null; state.flags[name + '_done'] = true; return; }
  state.voyage = { name, left: Math.round(w) };
}
/* sail watch by watch; stop when something happens */
function sailWatches(n){
  const chance = parseFloat(content.settings['sea event chance'] || '0');
  for (let i = 0; i < n; i++){
    advance(240);
    if (state.voyage){
      state.voyage.left--;
      if (state.voyage.left <= 0){ state.flags[state.voyage.name + '_done'] = true; state.voyage = null; }
    }
    const urgent = pickFrom('sea', 'urgent'); if (urgent) return urgent;
    if (rand(state.rng) * 100 < chance){ const ev = pickFrom('sea', 'ordinary'); if (ev) return ev; }
  }
  return hubFor('sea') || hubFor(state.place) || '__nowhere__';
}

/* ---------- quantities, as a purser would write them ---------- */
function round1(x){ return Math.abs(x) >= 10 ? Math.round(x) : Math.round(x * 10) / 10; }
function fmtAmt(d, base){
  if (d.dim === 'w') return `${round1(base / 16)} lb`.replace('.0 ', ' ');
  if (d.dim === 'v') return d.size >= 8 * 128 ? `${round1(base / 128)} gallons`.replace('.0 ', ' ') : `${round1(base / 16)} pints`.replace('.0 ', ' ');
  return `${Math.round(base)} ${Math.round(base) === 1 ? d.unit[0] : d.unit[1]}`;
}
function fmtBal(d, base){
  if (d.dim === 'n' || d.size <= 1) return fmtAmt(d, base);
  const units = Math.floor(base / d.size + 1e-6), rem = base - units * d.size;
  const head = `${units} ${units === 1 ? d.unit[0] : d.unit[1]}`;
  if (rem <= d.size * 0.01) return head;
  return units ? `${head}, ${fmtAmt(d, rem)}` : fmtAmt(d, rem);
}

/* ---------- saving ---------- */
function persist(){ if (state) lsSet(SAVE_KEY, JSON.stringify({ game: GAME_ID, build: BUILD, state })); }
function normalise(s){
  s.vars = s.vars || {}; s.flags = s.flags || {}; s.seen = s.seen || {}; s.timers = s.timers || {};
  if (!('orders' in s)) { s.orders = null; s.ordersAt = null; }
  if (!Array.isArray(s.accounts)) s.accounts = [{ t: s.minutes, acct: 'money', amt: s.money, what: 'Balance brought forward', open: true }];
  if (!s.stores) s.needShip = true;
  if (!('voyage' in s)) s.voyage = null;
  /* a commission saved at the end of build 2 stands out to sea */
  if (s.eventId === 'ending_build2'){ s.ended = false; s.pending = null; s.continueAt = 'stand_out'; }
  /* a commission saved at the end of build 1 carries on into the second day */
  if (s.eventId === 'ending_build1'){
    if (s.seen.secretary_meeting) s.flags.presented = true;
    if (!('cabin_stores' in s.vars)) s.vars.cabin_stores = 2;
    s.ended = false; s.pending = null; s.continueAt = 'morning_after';
  }
  return s;
}
function adopt(s){
  state = normalise(s);
  if (state.needShip){ delete state.needShip; initShip(); }
  if (state.continueAt){ const id = state.continueAt; delete state.continueAt; enterEvent(id); }
  persist();
}
function loadAutosave(){
  const raw = lsGet(SAVE_KEY); if (!raw) return null;
  try { const d = JSON.parse(raw); return d && d.game === GAME_ID && d.state ? d.state : null; } catch(e){ return null; }
}
function readSave(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ throw new Error('That is not a saved commission: the file could not be read.'); }
  if (!d || d.game !== GAME_ID || !d.state) throw new Error('That file is not a Sloop of War save.');
  const s = d.state;
  if (!Array.isArray(s.rng) || s.rng.length !== 4 || typeof s.minutes !== 'number') throw new Error('That save is damaged and cannot be loaded.');
  return s;
}
function saveFileName(){ return `sloop-of-war-${surname().toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${state.seed.toLowerCase()}.json`; }

/* ============================================================
   RENDERING
   ============================================================ */
let glossIndex = null, glossRegex = null;
function buildGloss(){
  glossIndex = {};
  const alts = [];
  content.glossary.forEach((g, i) => g.terms.forEach(t => { glossIndex[normTerm(t)] = i; alts.push(t); }));
  alts.sort((a, b) => b.length - a.length);
  const pat = alts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/['’]/g, "['’]").replace(/\s+/g, '\\s+')).join('|');
  glossRegex = pat ? new RegExp(`(^|[^A-Za-z0-9’'-])(${pat})(?![A-Za-z0-9])`, 'gi') : null;
}
function smartQuotes(s){
  return s.replace(/(^|[\s(\[—–-])'/g, '$1‘').replace(/'/g, '’')
          .replace(/(^|[\s(\[—–-])"/g, '$1“').replace(/"/g, '”');
}
function inline(s){
  return esc(smartQuotes(subst(s))).replace(/\*([^*]+)\*/g, '<em>$1</em>');
}
function glossify(root){
  if (!glossRegex || !root) return;
  const used = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){ return n.parentElement && n.parentElement.closest('.gl, button, .noglossary') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue; let m, last = 0; const frag = document.createDocumentFragment(); let changed = false;
    glossRegex.lastIndex = 0;
    while ((m = glossRegex.exec(text))){
      const term = m[2], idx = glossIndex[normTerm(term)];
      const start = m.index + m[1].length;
      if (idx == null || used.has(idx)) continue;
      used.add(idx); changed = true;
      frag.append(text.slice(last, start));
      const b = document.createElement('span');
      b.className = 'gl'; b.dataset.g = idx; b.textContent = term;
      b.setAttribute('role', 'button'); b.tabIndex = 0;
      b.setAttribute('aria-label', `${term}: show meaning`);
      frag.append(b);
      last = start + term.length;
    }
    if (changed){ frag.append(text.slice(last)); node.parentNode.replaceChild(frag, node); }
  }
}

function stripHtml(){

  return `<div class="strip num" role="status">
    <span>${esc(fmtDate(state.minutes, true))}</span>
    <span>${esc(w.name)}, ${esc(w.bell)}</span>

function render(){
  hideTip();
  const app = $('#app');
  if (!state){ renderTitle(app); return; }
  if (state.ended){ renderEnding(app); return; }
  if (state.eventId === '__nowhere__' || !content.events[state.eventId]){ renderNowhere(app); return; }
  const ev = content.events[state.eventId];
  let body;
  if (state.pending){
    body = `<div class="prose result"><p>${inline(state.pending.text)}</p></div>
      <div class="cont"><button type="button" class="btn" data-act="continue" id="continue">Continue</button></div>`;
  } else {
    const paras = ev.paras.filter(p => !p.cond || condsMet(p.cond)).map(p => `<p>${inline(p.text)}</p>`).join('');
    let n = 0;
    const choices = ev.choices.map((ch, i) => {
      if (!condsMet(ch.requires)) return '';
      const ok = condsMet(ch.needs);
      n++;
      const why = ok ? '' : `<span class="why">${esc(whyNot(ch))}</span>`;
      return `<li><button type="button" class="choice" data-choice="${i}" ${ok ? '' : 'disabled'}>
        <span class="n" aria-hidden="true">${n}</span><span>${inline(ch.text)}${why}</span></button></li>`;
    }).join('');
    body = `<div class="prose">${paras}</div><ol class="choices">${choices}</ol>`;
  }
  app.innerHTML = `${headerHtml()}${stripHtml()}
    <section class="scene"><h2 tabindex="-1" id="scene-title">${inline(ev.title || '')}</h2>${body}</section>`;
  glossify($('.prose', app));
  focusTop();
}

function focusTop(){
  try { window.scrollTo(0, 0); } catch(e){}
  const h = $('#scene-title'); if (h) h.focus({ preventScroll: true });
}

function roseSvg(){
  let lines = '';
  for (let i = 0; i < 32; i++){
    const a = i * Math.PI / 16;
    const len = i % 8 === 0 ? 92 : i % 4 === 0 ? 70 : i % 2 === 0 ? 52 : 40;
    const w = i % 8 === 0 ? 1.6 : i % 4 === 0 ? 1.1 : .7;
    lines += `<line x1="0" y1="0" x2="${(Math.sin(a) * len).toFixed(2)}" y2="${(-Math.cos(a) * len).toFixed(2)}" stroke-width="${w}"/>`;
  }
  return `<svg class="rose" viewBox="-100 -112 200 212" aria-hidden="true" fill="none" stroke="var(--accent)">
    <circle r="96" stroke-width=".8"/><circle r="30" stroke-width=".6"/>${lines}
    <path d="M0,-92 L6,-30 L0,-36 L-6,-30 Z" fill="var(--accent)" stroke="none"/>
    <text x="0" y="-100" text-anchor="middle" font-family="IM Fell English SC, Georgia, serif" font-size="15" fill="var(--accent)" stroke="none">N</text></svg>`;
}

function logTableHtml(){
  if (!state.log.length) return `<p class="note">Nothing has been entered in the log yet.</p>`;
  let rows = '', lastDay = null;
  for (const e of state.log){
    const day = fmtDate(e.t);
    if (day !== lastDay){ rows += `<tr class="day"><td colspan="2">${esc(day)}</td></tr>`; lastDay = day; }
    rows += `<tr><td class="h">${esc(fmtHour(e.t))}</td><td>${inline(e.text)}</td></tr>`;
  }
  return `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">H</th><th scope="col">Remarks</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function ledgerHtml(acct, opts){
  const rows = state.accounts.filter(a => a.acct === acct);
  if (!rows.length) return '';
  let bal = 0, body = '';
  for (const r of rows){
    bal += r.amt;
    const c = clockOf(r.t);
    const amt = (r.amt < 0 ? '−' : '+') + fmtMoney(Math.abs(r.amt));
    body += `<tr><td class="h">${c.date} ${c.month.slice(0,3)}</td><td>${inline(r.what)}</td>
      <td class="amt">${esc(amt)}</td><td class="amt">${esc(fmtMoney(bal))}</td></tr>`;
  }
  return `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">Date</th><th scope="col">Particulars</th>
    <th scope="col" class="amt">Sum</th><th scope="col" class="amt">${opts.bal}</th></tr></thead>
    <tbody>${body}<tr class="total"><td></td><td>${opts.bal}</td><td></td><td class="amt">${esc(fmtMoney(bal))}</td></tr></tbody></table></div>`;
}
function accountsHtml(){
  if (!state) return `<p class="note">No commission is in hand.</p>`;
  const purse = ledgerHtml('money', { bal: 'In hand' });
  const debts = ledgerHtml('debt', { bal: 'Owing' });
  return `<p class="note">Your own money, kept by your own hand. The ship’s stores and the purser’s cash are under Books.</p>
    <h3>Your purse</h3>${purse}
    ${debts ? `<h3>Owing to agents</h3>${debts}<p class="note">Interest at five per cent is reckoned for a year and entered at the time of the advance.</p>` : ''}`;
}
function ordersHtml(){
  if (!state || !state.orders || !content.orders[state.orders]) return `<p class="note">You have no orders yet.</p>`;
  const o = content.orders[state.orders];
  return `<p class="heading">${inline(o.heading)}</p><article class="orders">${o.paras.map(p => `<p${p.sig ? ' class="sig"' : ''}>${inline(p.text)}</p>`).join('')}</article>`;
}

let booksTab = 'provisions';
function storeIds(officers){
  return content.storeOrder.filter(id => officers.includes(content.stores[id].officer) && state.stores[id] &&
    (state.stores[id].book > 1e-6 || state.storeLog[id].length || !content.stores[id].only || condsMet(content.stores[id].only)));
}
function storeLedgerHtml(id){
  const d = content.stores[id], st = state.stores[id], log = state.storeLog[id];
  const rec = st.receipts.map(r => {
    const last = r.first + Math.ceil(r.units) - 1;
    const nos = d.dim === 'n' || d.size <= 1 ? '' : (Math.ceil(r.units) > 1 ? `Nos ${r.first}–${last}` : `No. ${r.first}`);
    return `<li>${esc(fmtBal(d, r.units * d.size))}${nos ? ', ' + nos : ''}, received ${esc(fmtDate(r.t, true).replace(/^\w+ /, ''))}${r.from ? ', ' + inline(r.from.replace(/^(received |)(of |from )/i, '')) : ''}</li>`;
  }).join('');
  const rows = log.map(e => `<tr><td class="h">${clockOf(e.t).date} ${clockOf(e.t).month.slice(0, 3)}</td><td>${inline(e.what)}</td>
    <td class="amt">${e.d < 0 ? '−' : '+'}${esc(fmtAmt(d, Math.abs(e.d)))}</td><td class="amt">${esc(fmtBal(d, e.bal))}</td></tr>`).join('');
  return `<details class="ledger"><summary>${esc(d.name)}</summary>
    ${rec ? `<p class="note" style="margin:.4rem 0 .2rem">Received</p><ul class="receipts">${rec}</ul>` : ''}
    ${rows ? `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">Date</th><th scope="col">Particulars</th><th scope="col" class="amt">Sum</th><th scope="col" class="amt">Remains</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="note">No entries.</p>'}
    </details>`;
}
function storesSummary(ids, withDays){
  const rows = ids.map(id => {
    const d = content.stores[id], st = state.stores[id];
    const days = withDays && d.ration ? (d.instead ? 'in lieu' : String(Math.floor(daysOf(id)))) : '';
    return `<tr><td>${esc(d.name)}</td><td class="amt">${esc(fmtBal(d, st.book))}</td>${withDays ? `<td class="amt">${esc(days)}</td>` : ''}</tr>`;
  }).join('');
  return `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">Store</th><th scope="col" class="amt">Remains</th>${withDays ? '<th scope="col" class="amt">Days</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function word(v, bands){ for (const [min, w] of bands) if (v >= min) return w; return bands[bands.length - 1][1]; }
function shipHtml(){
  const v = k => getVar(k), f = k => !!state.flags[k];
  const leak = v('leak');
  const pumps = leak <= 2 ? 'a spell at the pumps in the morning watch keeps her free' : leak <= 5 ? 'the pumps are manned for a quarter of an hour in every watch' : leak <= 9 ? 'the pumps are going for half of every watch' : 'the pumps are never still';
  const hull = word(v('hull'), [[90, 'sound and tight in her frame'], [75, 'sound, though her seams work in a seaway'], [55, 'much strained, and her seams want caulking'], [0, 'badly strained, and weak in her frame']]);
  const mast = n => f(n + '_gone') ? 'gone' : f(n + '_sprung') ? 'sprung, and fished' : 'sound';
  const boat = n => f(n + '_lost') ? 'lost' : f(n + '_damaged') ? 'stove, and under repair' : 'sound';
  const standing = word(v('standing_rigging'), [[85, 'well set up'], [70, 'serviceable, though slack in places'], [50, 'much worn, and wants setting up'], [0, 'rotten in places, and not to be trusted in a blow']]);
  const running = word(v('running_rigging'), [[85, 'new and sound'], [70, 'serviceable'], [50, 'much chafed, and parting here and there'], [0, 'worn out']]);
  const sails = word(v('sails'), [[80, 'a good suit bent, and a second in the sail-room'], [60, 'the suit bent is old and much patched, and the second little better'], [40, 'worn thin; the sailmaker is never done with them'], [0, 'worn out; the sailmaker can do no more with them']]);
  const guns = `${v('guns')} ${f('carronades') ? 'eighteen-pounder carronades' : 'six-pounders'}`;
  return `<p class="note">As reported to you by the warrant officers.</p>
    <h3>The carpenter</h3>
    <p>She makes ${leak} ${leak === 1 ? 'inch' : 'inches'} of water an hour; ${pumps}. Her hull is ${hull}.</p>
    <p>Foremast ${mast('fore')}. Mainmast ${mast('main')}. Bowsprit ${mast('bowsprit')}.</p>
    <p>Boats: the launch ${boat('launch')}, the cutter ${boat('cutter')}, the jolly boat ${boat('jolly')}.</p>
    ${storesSummary(storeIds(['carpenter']), false)}
    <h3>The boatswain</h3>
    <p>Standing rigging ${standing}. Running rigging ${running}. Sails: ${sails}.</p>
    ${storesSummary(storeIds(['boatswain']), false)}
    ${storeIds(['carpenter', 'boatswain']).map(storeLedgerHtml).join('')}`;
}
function booksHtml(){
  if (!state || !state.stores) return `<p class="note">No commission is in hand.</p>`;
  const tabs = [['provisions', 'Provisions'], ['cash', 'Purser’s cash'], ['gunner', 'Gunner'], ['ship', 'Hull and rigging']];
  const nav = `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${k === booksTab}" data-act="books" data-tab="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (booksTab === 'provisions'){
    const ids = storeIds(['purser', 'master']);
    body = `<p class="note">The purser’s account of the provisions, and the master’s of the water, as they keep them. Victualled: ${getVar('victualled')} men${state.flags.short_allowance ? ', at two-thirds allowance' : ''}. Days are at the present allowance.</p>
      ${storesSummary(ids, true)}${ids.map(storeLedgerHtml).join('')}`;
  } else if (booksTab === 'cash'){
    const cash = ledgerHtml('cash', { bal: 'In hand' });
    body = `<p class="note">Money in the purser’s hands for the ship’s use, kept apart from your own.</p>${cash || '<p class="note">No entries.</p>'}`;
  } else if (booksTab === 'gunner'){
    const ids = storeIds(['gunner']);
    body = `<p>Mounted: ${getVar('guns')} ${state.flags.carronades ? 'eighteen-pounder carronades' : 'six-pounders'}, all serviceable.</p>${storesSummary(ids, false)}${ids.map(storeLedgerHtml).join('')}`;
  } else body = shipHtml();
  return nav + body;
}
