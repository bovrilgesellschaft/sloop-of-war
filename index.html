<script type="text/plain" class="content" data-name="Events: The opening">
# ------------------------------------------------------------
# The first day of the commission.
# ------------------------------------------------------------

EVENT: arrival
Title: Mahon, the Morning of Arrival
Place: mahon
Start

The storeship came in at first light, past the ruined fort at the harbour mouth and up the long reach to the white town on its cliff. You went ashore at the steps with your sea-chest, your sword, and a commission naming you Master and Commander of His Majesty's sloop *{ship}*.

You have not yet seen her. By your own reckoning you have {money} in the world.

The town is waking. A bumboat woman offers you oranges. Somewhere above the quay a bell is ringing for Mass.

CHOICE: Wait upon the Commander-in-Chief's secretary at once
Log: Came ashore from the storeship at Mahon. Waited upon the Commander-in-Chief's office.
Next: secretary_wait

CHOICE: Buy a coat fit for a commander before presenting yourself
Needs: money £8 or more
Effects: money -£8 "A commander's coat, of a tailor in the upper town"; set new_coat; pass 1 watch
Text: A tailor in the upper town, who learnt his trade under the old English garrison, puts you into a blue coat with a single epaulette on the left shoulder by the forenoon, and takes a painful part of what you have for it.
Log: Came ashore at Mahon. Fitted out at the tailor's, then waited upon the Commander-in-Chief's office.
Next: secretary_wait

CHOICE: Go straight out to the ship
Effects: set skipped_secretary
Text: Orders can wait an hour, you tell yourself. A ship cannot be taken by letter.
Log: Came ashore at Mahon and went directly out to the sloop.
Next: boat_out


EVENT: secretary_wait
Title: The Admiral's Office
Place: mahon

The office is a cool, high room in a merchant's house the Navy has taken over, with a sentry at the door and a clerk at a table who does not look up. Mr Pardoe, secretary to the Commander-in-Chief, is engaged.

He remains engaged through two bells, and then through four. Other men come and go: a purser with a sheaf of vouchers, a lieutenant of marines, a Minorcan contractor in black who is shown in at once.

CHOICE: Wait, with every appearance of patience
Effects: pass 1 watch; set waited_patiently
Next: secretary_meeting

CHOICE: Send in your name a second time
Chance 50:
Text: The clerk sighs, rises, goes in, and returns with word that Mr Pardoe will see you directly.
Next: secretary_meeting
Otherwise:
Effects: set pardoe_grudge; pass 1 watch
Text: The clerk takes your name in and brings it back. Mr Pardoe, it appears, will see you when Mr Pardoe is at leisure, and has noted that you were pressing.
Next: secretary_meeting

CHOICE: Slip the clerk a guinea
Needs: money 1gn or more
Effects: money -1gn "A guinea to the Admiral's clerk"
Chance 70:
Effects: set clerk_obliged
Text: The guinea goes where guineas go, and within the quarter-hour you are shown in ahead of the purser and his vouchers.
Next: secretary_meeting
Otherwise:
Effects: set pardoe_grudge; pass 1 watch
Text: The clerk looks at the coin, and then at you, and says that he is not that kind of clerk. He keeps it, all the same.
Next: secretary_meeting


EVENT: secretary_meeting
Title: Mr Pardoe
Place: mahon
Effects: set presented

Mr Pardoe is a narrow, careful man with ink on his second finger and the manner of one who has seen a great many young commanders and expects to see a great many more. He reads your commission through, though he must know every word of it.

[if pardoe_grudge] He does not offer you a chair.

[if new_coat] His eye rests for a moment on the new epaulette, and moves on.

'The *{ship}* lies off the hospital, Captain {surname}. Her late commander was carried ashore with a fever a fortnight since, and she is short of men. Mr Treharne, her lieutenant, is a sound officer of the old sort.' He lays the paper down. 'The Admiral will have orders for you when he has orders for you.'

CHOICE: Thank him, and go out to your ship
Next: boat_out

CHOICE: Ask when the Admiral will see you
Chance 40:
Effects: set admiral_appointment
Text: 'Tomorrow, perhaps,' says Mr Pardoe, and writes something down. 'Or the day after.'
Next: boat_out
Otherwise:
Effects: set pardoe_grudge
Text: 'When he sends for you, sir,' says Mr Pardoe, 'which he will do. I assure you of it.'
Next: boat_out

CHOICE: Ask whether men can be found to complete her complement
Effects: set hint_hospital_men
Text: Mr Pardoe smiles for the first time. 'Every commander on the station is short of men, Captain {surname}. The Admiral cannot conjure seamen. You might apply at the hospital, when the convalescents are discharged.'
Next: boat_out


EVENT: boat_out
Title: The Harbour
Place: harbour
Effects: pass 1 hour

A shore-boat takes you and your chest down the harbour, the boatman pulling a short, choppy stroke and talking to himself in the island tongue. The harbour is long and narrow and crowded: transports, a Neapolitan polacre, a dismasted prize with her guns out of her.

Then he rests on his oars and points with his chin. 'Allà. *{ship}*.'

She is low and black and smaller than the commission makes her sound. Her yards are not quite square, and a bumboat is hooked on alongside.

CHOICE: Have the boatman hail her, so that she may receive you properly
Next: reception_formal

CHOICE: Go up the side unannounced
Effects: set came_unannounced
Next: reception_unannounced


EVENT: reception_formal
Title: Coming Aboard
Place: ship

'Boat ahoy!' comes the hail from her deck. The boatman, coached, answers with the ship's own name, which is the answer that tells her that her captain is in the boat.

There is a great deal of running on deck. By the time you reach the side the side-boys are in their places, the boatswain's call is shrilling, and a weather-beaten officer in an old-fashioned coat takes off his hat to you at the gangway. 'Treharne, sir. Lieutenant. You are very welcome aboard.'

CHOICE: Read yourself in at once
Next: reading_in

CHOICE: Walk round the ship with Mr Treharne first
Next: walk_round


EVENT: reception_unannounced
Title: Coming Aboard Unlooked-For
Place: ship

Nobody hails the boat. You go up the battens and step aboard to find the waist full of bumboat women and their wares, two seamen asleep in the shade of the launch, and a midshipman in his shirt-sleeves fishing over the side.

For a moment nobody knows who you are. Then the midshipman does, and drops his line.

CHOICE: Say nothing, and see how long it takes them
Effects: set saw_her_slack
Text: It takes a full minute for the word to reach the gunroom, and a full minute is long enough. Mr Treharne comes up the ladder buttoning his coat, red to the ears. 'Treharne, sir. Lieutenant. You are very welcome aboard, sir.'
Log: Came aboard and found the ship in an indifferent state.
Next: walk_round

CHOICE: Call for the officer of the watch, in a voice to carry to the cable-tier
Effects: set saw_her_slack; set stern_start
Text: Your voice was made on the quarterdeck of a seventy-four, and it carries. The bumboat women are over the side before Mr Treharne is up the ladder, and the midshipman has found his coat.
Log: Came aboard and found the ship in an indifferent state. Cleared her of bumboats.
Next: reading_in


EVENT: walk_round
Title: Round the Ship
Place: ship

Mr Treharne takes you round her: the quarterdeck, eight paces long; the sixteen guns, their breechings sound; the boats; the galley; the berth-deck, low and dark and smelling of bilge and bread and men. He speaks plainly and well of the ship, and sparingly of her people.

[if saw_her_slack] He does not speak of what you found on deck, and neither do you; but it goes round the ship with you.

'She is short twenty men of her complement, sir,' he says at last, 'and of those she has, I would not give a farthing for thirty.'

CHOICE: Ask him which of the people are worth having
Effects: set knows_good_hands
Text: He names them without hesitation: the captains of the tops, the gunner's mates, a dozen prime seamen. 'The rest came to us from the receiving ship at Gibraltar, sir, and from the Plymouth press before that. They know it, and so do we.'
Next: reading_in

CHOICE: Ask him what her late commander was like
Effects: set late_captain_ashore
Text: 'A gentleman, sir,' says Mr Treharne, after a pause that is itself an answer. 'He was a good deal ashore.'
Next: reading_in

CHOICE: Tell him plainly that what you saw on deck will not happen again
Requires: saw_her_slack
Effects: set stern_start; set treharne_stung
Text: 'No, sir,' says Mr Treharne, and looks straight ahead of him. 'It will not.'
Next: reading_in


EVENT: reading_in
Title: Reading In
Place: ship
Effects: pass 1 hour

All hands are turned up. They come aft in a slow, uneven tide and stand in the waist, ninety-odd of them in every condition of dress: men who have seen a fleet action, and men taken up in a Plymouth gin-shop six months since. The marines are drawn up in their red coats at the break of the quarterdeck. Mr Treharne calls for silence, and gets it.

You unfold your commission and read it to them, from 'By the Commissioners for executing the Office of Lord High Admiral' to the end.

CHOICE: Fold it up and dismiss them without another word
Effects: set plain_reading_in
Text: It is the old way, and some of the older hands approve of it. The rest go forward knowing nothing more of you than your name.
Log: Read my commission to the ship's company and took command.
Next: first_night

CHOICE: Add a word about prize money
Effects: set promised_prizes; morale +1
Text: You tell them that the *{ship}* is going to sea to take French and Spanish merchantmen, and that you mean to take a great many. There is a stir at that: not a cheer, quite, but a stir. They will remember it, whichever way it falls out.
Log: Read my commission to the ship's company and took command. Spoke to the people of prizes.
Next: first_night

CHOICE: Add a word about the discipline you expect
Effects: set stern_start; morale -1
Text: You tell them how you mean the ship to be run. They hear you in silence, which may mean anything.
Log: Read my commission to the ship's company and took command. Spoke to the people of discipline.
Next: first_night


EVENT: first_night
Title: The Great Cabin
Place: ship
Effects: until 19:00; cabin_stores = 2

By evening your chest is in the great cabin, which is not great. It runs to a table, two chairs, a swinging cot, a quarter-gallery, and a gun on either side that you will share it with at quarters. Your steward, a silent Manxman named Kinvig, inherited with the ship, brings you a candle and a bottle of the late captain's wine, which the late captain has not yet sent for.

The ship moves a little at her moorings. Forward, somebody is playing a fiddle, badly.

CHOICE: Ask Mr Treharne to dine with you
Needs: money 15s or more
Effects: money -15s "Supper sent off from the shore for Mr Treharne"; set dined_treharne
Text: He comes, in his old-fashioned coat, and eats steadily, and over the second bottle tells you more about the ship than he did in the whole of the afternoon.
Log: Mr Treharne dined with me.
Next: morning_after

CHOICE: Write up your log and turn in
Log: Turned in at four bells in the first watch.
Next: morning_after

CHOICE: Write a letter home
Text: You write four pages, and cross them, and seal them, and do not read them over.
Log: Wrote home.
Next: morning_after
</script>

<script type="text/plain" class="content" data-name="Events: Aboard in harbour">
# ------------------------------------------------------------
# The ship in Mahon harbour. ship_hub is where the player
# returns whenever a choice aboard has no "Next:".
# ------------------------------------------------------------

EVENT: morning_after
Title: The Second Day
Place: ship
Effects: until 07:00

Mr Treharne makes his report at breakfast, standing, with his hat under his arm, until you ask him to sit.

The *{ship}* has water for three weeks, provisions for rather more, and no spare topmast. She wants twenty men. The late captain's accounts with the purser are, in Mr Treharne's phrase, a matter for the purser.

[if dined_treharne] He is easier with you than he was yesterday, and once, over the coffee, very nearly smiles.

CHOICE: Thank him, and turn to the business of the day
Next: any ship

CHOICE: Ask him what he would do first, in your place
Effects: set treharne_consulted
Text: Mr Treharne considers. 'I should get our orders, sir, before the Admiral gives the Catalan cruise to the *Petrel*. Everything else will keep a day.'
Next: any ship


EVENT: ship_hub
Title: Aboard the *{ship}*
Place: ship
Hub

[if before 20:00] The *{ship}* lies at her moorings off the hospital island. Forward, the people are at their work, and not much hurried about it.

[if after 20:00] The ship is quiet but for the sentry's tread and the slap of water under the counter. The lights of the town are going out one by one.

[if has_orders] Your orders lie in your desk: {orders}.

[if not has_orders] You have no orders yet.

CHOICE: Go ashore
Requires: before 22:00
Effects: pass 30 minutes
Next: any mahon

CHOICE: Send Kinvig ashore for cabin stores
Requires: before 18:00, not stores_bought
Next: steward_stores

CHOICE: Have a guest to dinner
Requires: after 12:00, before 17:00
Next: dine_invite

CHOICE: Keep to your cabin and your papers
Requires: before 20:00
Effects: pass 3 hours
Next: any ship

CHOICE: Turn in for the night
Requires: after 20:00
Effects: until 07:00
Next: any ship

CHOICE: Weigh and proceed to sea
Needs: has_orders
Why not: You have no orders yet.
Next: weigh


EVENT: summons_early
Title: A Note from the Office
Place: ship
Tags: ship
Urgent
Once
Requires: admiral_appointment, not summoned
Effects: set summoned

A boat comes off from the shore with a note in Mr Pardoe's narrow hand. The Commander-in-Chief will see Captain {surname} at his office this forenoon, and Mr Pardoe has the honour to be his most obedient humble servant.

CHOICE: Call away your boat
Effects: pass 30 minutes
Next: mahon_hub

CHOICE: Acknowledge it, and finish your coffee first
Next: ship_hub


EVENT: summons
Title: A Note from the Office
Place: ship
Tags: ship
Urgent
Once
Requires: presented, not summoned, day 3 or more
Effects: set summoned

A note comes off from the shore. The Commander-in-Chief desires to see Captain {surname} at his office, at Captain {surname}'s earliest convenience, which is to say at once. It is signed by Mr Pardoe, who has the honour to be his most obedient humble servant.

[if pardoe_grudge] It has come, you notice, by the slowest boat in the harbour.

CHOICE: Call away your boat
Effects: pass 30 minutes
Next: mahon_hub

CHOICE: Acknowledge it, and go when you are ready
Next: ship_hub


EVENT: pardoe_note
Title: Mr Pardoe's Compliments
Place: ship
Tags: ship
Urgent
Once
Requires: not presented, day 3 or more
Effects: set pardoe_grudge; standing -1

A note arrives from the Admiral's office. Mr Pardoe presents his compliments to Captain {surname}, and would be glad to learn whether Captain {surname} proposes, at any time convenient to himself, to wait upon the Commander-in-Chief.

Mr Treharne reads it over your shoulder, and then pretends that he has not.

CHOICE: Go ashore at once
Effects: pass 30 minutes
Next: mahon_hub

CHOICE: Put it in your pocket
Next: ship_hub


EVENT: governor_invitation
Title: A Card from the Governor's House
Place: ship
Tags: ship
Urgent
Once
Requires: called_governor, card_left 6 hours or more
Effects: set invited_governor

Among the letters brought off from the shore is a stiff card, engraved. His Excellency the Governor is at home this evening, and every evening this week, to the officers of the garrison and the fleet, from eight o'clock. There will be cards.

CHOICE: Tell Kinvig to brush your best coat
Next: ship_hub


EVENT: steward_stores
Title: Cabin Stores
Place: ship

Kinvig waits to be told. He is a man of very few words, all of them to the purpose.

[if cabin_stores 1 or less] The late captain's lockers, by his account, are as near bare as makes no difference.

[if cabin_stores 2 or more] The late captain's lockers, by his account, will run to a dinner or two and no more.

The market at Mahon will furnish the rest, at Mahon prices.

CHOICE: A modest provision: wine, a coop of fowls, coffee and cheese
Needs: money £6 or more
Effects: money -£6 "Cabin stores, a modest provision"; cabin_stores +4; set stores_bought; pass 2 hours
Text: Kinvig goes ashore with a list and comes back with all of it, and a little change.
Log: Laid in cabin stores.
Next: ship_hub

CHOICE: A handsome provision, fit to set before an admiral
Needs: money £14 or more
Effects: money -£14 "Cabin stores, a handsome provision"; cabin_stores +8; set stores_bought; set good_table; pass 3 hours
Text: Kinvig is gone the whole afternoon, and comes off at last in a hired boat deep with hampers, a pig, and two dozen of claret from a merchant who swore to its being French.
Log: Laid in cabin stores.
Next: ship_hub

CHOICE: Make do with what there is
Next: ship_hub


EVENT: dine_invite
Title: Dinner in the Great Cabin
Place: ship

Dinner aboard is at three o'clock. Kinvig wants to know, with his eyebrows, whether he is to lay for two.

[if cabin_stores 0 or less] He also wants you to know, with the same eyebrows, that there is nothing in the lockers to lay with.

CHOICE: Send an invitation to Mr Pardoe
Requires: presented, not dined_pardoe
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to a guest.
Effects: cabin_stores -1; set dined_pardoe; until 18:00
Chance 60, +20 if good_table, -20 if pardoe_grudge:
Effects: clear pardoe_grudge; standing +1
Text: Mr Pardoe comes, and eats very little, and drinks rather more, and on the second bottle tells you a long story about a former Admiral's cook. He takes his leave with something that is nearly warmth.
Log: Mr Pardoe, the Admiral's secretary, dined with me.
Next: ship_hub
Otherwise:
Text: Mr Pardoe comes, and is polite, and notices everything: the chipped decanter, the fowl that was not quite dead long enough. He goes ashore at five, exactly as he came.
Log: Mr Pardoe, the Admiral's secretary, dined with me.
Next: ship_hub

CHOICE: Send an invitation to Mr Gedge, the Master Attendant
Requires: met_gedge, not dined_gedge
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to a guest.
Effects: cabin_stores -1; set dined_gedge; yard_favour +1; until 18:00
Text: Mr Gedge comes off in the yard's own boat, eats everything, and finds fault with your rigging from the cabin windows. He leaves in high good humour, promising nothing.
Log: Mr Gedge, Master Attendant of the yard, dined with me.
Next: ship_hub

CHOICE: Send an invitation to Commander Dawe of the *Petrel*
Requires: met_dawe, not dined_dawe
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to a guest.
Effects: cabin_stores -1; set dined_dawe; set friend_dawe; clear dawe_rival; until 18:00
Text: Dawe comes, and talks, and drinks your health in your own wine a great many times. By the end of it he has decided that you are a capital fellow, and says so, loudly, to his boat's crew.
Log: Commander Dawe of the Petrel dined with me.
Next: ship_hub

CHOICE: Dine alone
Effects: until 18:00
Text: You dine alone, with a book propped against the decanter, as captains have dined since there were captains.
Next: ship_hub


EVENT: weigh
Title: Proceeding to Sea
Place: ship
Effects: until 06:00

At first light you unmoor. The capstan goes round to the fiddler's tune, the cable comes in dripping and stinking of harbour mud, and the *{ship}* falls off and gathers way down the long harbour, past the hospital and the ruined fort, towards the open sea.

[if carronades] The new carronades squat in her ports like toads. Mr Treharne has not yet said what he thinks of them, which is itself an opinion.

[if sail_by 3 days or more] Mr Pardoe's last note, received at the gangway, observed that the Commander-in-Chief had expected the *{ship}* at sea some days since.

CHOICE: Take her out under topsails, with every attention to the forms
Log: Unmoored and weighed. Proceeded to sea under topsails, in obedience to orders.
Next: ending_build2

CHOICE: Make all sail as soon as the harbour mouth is cleared
Log: Unmoored and weighed. Made all sail on clearing the harbour.
Next: ending_build2


EVENT: ending_build2
Title: Here the Log Breaks Off
Ending

The *{ship}* stands out to sea with her orders in your desk: {orders}.

The sea itself (the ship's stores, the wind and the weather, the chart) is still to be built. Your log stands below, and your accounts are under Accounts.
</script>

<script type="text/plain" class="content" data-name="Events: Mahon">
# ------------------------------------------------------------
# The town and its four places: the Admiral's office, the
# dockyard, Mr Crouch's counting-house, the Governor's house.
# ------------------------------------------------------------

EVENT: mahon_hub
Title: Port Mahon
Place: mahon
Hub

[if before 19:00] The town stands on its cliff above the harbour, white and shuttered against the sun, its streets steep and full of goats, soldiers, priests and women in black. Redcoats stand sentry where Spanish sentries stood two years since.

[if after 19:00] Lamps are lit along the quay, and there is music somewhere in the upper town. The offices are shut. The taverns are not.

CHOICE: The Admiral's office
Needs: before 16:00
Why not: The office is shut for the day.
Effects: pass 15 minutes
Next: any office

CHOICE: The dockyard, across the harbour
Needs: before 17:00
Why not: The yard has knocked off for the day.
Effects: pass 30 minutes
Next: any dockyard

CHOICE: Mr Crouch's counting-house
Needs: before 18:00
Why not: Mr Crouch has gone home to his dinner.
Effects: pass 15 minutes
Next: any agent

CHOICE: Leave your card at the Governor's house
Requires: not called_governor
Needs: before 18:00
Why not: It is too late in the day for calling.
Effects: set called_governor; start card_left; pass 30 minutes
Text: A footman in the Governor's livery takes your card at the door, lays it on a silver salver among a great many others, and shuts the door again. That is how it is done.
Log: Left my card at the Governor's.
Next: mahon_hub

CHOICE: The Governor's card party
Requires: invited_governor, not card_party_done
Needs: after 20:00
Why not: The rooms do not open until eight.
Next: card_party

CHOICE: Return aboard
Effects: pass 30 minutes
Next: any ship


EVENT: dawe_meeting
Title: Commander Dawe
Place: mahon
Tags: mahon
Once
Weight: 2
Requires: day 2 or more, before 19:00

On the quay you are hailed by a red-faced officer with one epaulette like your own and a great deal more lace. He is Commander Dawe of the *Petrel*, brig-sloop, and he is senior to you by two years and four months, which he mentions.

'You are come for the Catalan cruise, I suppose,' he says. 'Everybody is. The old gentleman as good as promised it me at Christmas.'

CHOICE: Stand him a bottle at the nearest tavern
Needs: money 10s or more
Effects: money -8s "A bottle with Commander Dawe"; set met_dawe; set friend_dawe; pass 1 hour
Text: He drinks most of it, and tells you which of the Admiral's followers are to be feared, which of the island's agents are to be trusted, and that none of them is.
Next: mahon_hub

CHOICE: Wish him joy of it, and walk on
Effects: set met_dawe
Next: mahon_hub

CHOICE: Tell him you mean to ask for it yourself
Effects: set met_dawe; set dawe_rival
Text: Commander Dawe stops smiling. 'Do you, by God,' he says, and walks off without another word.
Next: mahon_hub


EVENT: segui_offer
Title: Mr Seguí
Place: mahon
Tags: mahon
Once
Weight: 2
Requires: day 2 or more, before 19:00

At the head of the steps a gentleman in a good black coat falls in beside you and raises his hat. He is Jaume Seguí, of this island, and he has the honour to act for several officers of the fleet in the matter of prizes.

He has heard of your appointment. He knows Mr Crouch: a most respectable man, very slow. He himself will advance eighty pounds today against nothing but your name on a letter of attorney, and he names no interest at all.

[if agent_crouch] He has heard, too, that you have named Mr Crouch. These things, he says, may be undone.

CHOICE: Accept, and name him your agent
Needs: not agent_crouch
Why not: You have already named Mr Crouch your agent.
Effects: set agent_segui; money +£80 "Advanced by Mr Seguí on account of prizes"; debt +£80 "Mr Seguí, eighty pounds advanced on account of prizes"
Text: Mr Seguí has the letter of attorney in his pocket, ready drawn, and the money in a bag in a shop across the street. It takes ten minutes. He bows very low.
Log: Appointed Mr Seguí of Mahon my agent, and drew £80 on him.
Next: mahon_hub

CHOICE: Decline, civilly
Text: Mr Seguí is not in the least offended. He is always to be found, he says, at the sign of the Three Kings, and he hopes to have the honour.
Next: mahon_hub


EVENT: card_party
Title: The Governor's House
Place: governor
Effects: set card_party_done; pass 30 minutes

The rooms are hot and bright and crowded with scarlet: the garrison is here in force, and the fleet in rather less. His Excellency is at whist in an inner room and does not come out. A band of the regiment plays in the courtyard, and the island's gentry stand along the walls and watch the English as they might watch weather.

Mr Pardoe is here, in a plum-coloured coat. So is the Admiral's flag captain, and a Major Ancell of the regiment, who wants a fourth at whist and has heard that sea officers are rich.

CHOICE: Sit down to whist with Major Ancell, at half-crown points
Needs: money £6 or more
Why not: You have not the money to sit down with the Major.
Effects: until 23:00
Chance 50:
Effects: money +£4 4s "Won at whist of Major Ancell"
Text: The cards run your way from the first rubber, and the Major pays up with a soldier's good grace and a soldier's bad language.
Log: Passed the evening at the Governor's. Won at whist.
Next: any ship
Otherwise:
Effects: money -£5 5s "Lost at whist to Major Ancell"
Text: The Major plays a long, cautious, murderous game, and by eleven you owe him five guineas, which you pay on the spot as a gentleman must.
Log: Passed the evening at the Governor's. Lost at whist.
Next: any ship

CHOICE: Make yourself agreeable to the flag captain
Effects: until 23:00
Chance 50, +20 if new_coat:
Effects: interest +1; standing +1
Text: Captain Blane is a dry, quiet man who has heard every young commander's story twice. Yours, it appears, he has not heard, and he asks for more of it.
Log: Passed the evening at the Governor's.
Next: any ship
Otherwise:
Text: Captain Blane is a dry, quiet man who has heard every young commander's story twice, and he hears yours a third time with perfect civility.
Log: Passed the evening at the Governor's.
Next: any ship

CHOICE: Make your peace with Mr Pardoe
Requires: pardoe_grudge
Effects: until 23:00
Chance 60:
Effects: clear pardoe_grudge
Text: Away from his office Mr Pardoe is a different man, fond of music and very ready to be thought fond of it. You stand beside him through three quadrilles and say that the band is very fine. By the end he is calling you 'my dear Captain'.
Log: Passed the evening at the Governor's.
Next: any ship
Otherwise:
Text: Mr Pardoe receives your civilities as he receives everything, on file.
Log: Passed the evening at the Governor's.
Next: any ship

CHOICE: Stay an hour for form's sake, and go back aboard
Effects: pass 1 hour
Log: Passed an hour at the Governor's.
Next: any ship
</script>

<script type="text/plain" class="content" data-name="Events: The Admiral's office">
EVENT: secretary_late
Title: The Admiral's Office
Place: office
Tags: office
Urgent
Once
Requires: not presented
Effects: set presented; set pardoe_grudge; pass 2 hours

Mr Pardoe receives you at last, after a delay he does not explain, and reads your commission through without asking you to sit.

'You came out by the storeship, I think, Captain {surname}. On Monday.' He lays the paper down. 'The *{ship}* lies off the hospital, as no doubt you have discovered for yourself. The Admiral will send for you when he has occasion.'

CHOICE: Apologise for not waiting upon him sooner
Chance 40:
Effects: clear pardoe_grudge
Text: Mr Pardoe inclines his head a quarter of an inch. It is enough.
Next: office_hub
Otherwise:
Text: 'Not at all,' says Mr Pardoe, and writes something down.
Next: office_hub

CHOICE: Bow, and say nothing
Next: office_hub


EVENT: office_hub
Title: The Admiral's Office
Place: office
Hub

The anteroom is full, as it is always full: masters of transports, a Minorcan contractor in black, two lieutenants hoping for a vacancy and pretending not to know each other. The clerk writes, and does not look up.

[if summoned, not admiral_seen] Then he does look up. The Admiral will see you directly.

CHOICE: Go in to the Admiral
Requires: summoned, not admiral_seen
Next: admiral_audience

CHOICE: Send in your name to Mr Pardoe
Requires: not summoned
Effects: pass 1 hour
Chance 30, +25 if clerk_obliged, -20 if pardoe_grudge:
Effects: set summoned
Text: Mr Pardoe comes out himself, which is a mark of something. The Admiral, he says, will see you now, if you are at leisure.
Next: office_hub
Otherwise:
Text: The answer comes back that the Admiral is engaged, and will send.
Next: mahon_hub

CHOICE: Ask Mr Pardoe for an order to exchange your guns for carronades
Requires: admiral_seen, not gun_order, not gun_refused, not carronades
Effects: pass 1 hour
Chance 50, +20 if clerk_obliged, +20 if dined_pardoe, -30 if pardoe_grudge, +10 per standing:
Effects: set gun_order
Text: Mr Pardoe writes it out himself: an order to the Storekeeper of the Ordnance to receive the *{ship}*'s sixteen six-pounders and issue sixteen eighteen-pounder carronades in their room. 'He will not thank you for it,' he says, sanding it.
Log: Received an order for exchanging the guns.
Next: office_hub
Otherwise:
Effects: set gun_refused
Text: Mr Pardoe takes the request in to the Admiral, and brings back word that the Commander-in-Chief sees no occasion to alter the established armament of the sloop.
Next: office_hub

CHOICE: Leave
Next: mahon_hub


EVENT: admiral_audience
Title: The Commander-in-Chief
Place: office
Once
Effects: set admiral_seen; set issuing_orders; pass 1 hour

Vice-Admiral Sir Robert Lessingham receives you in a long room with the shutters half closed, his gouty foot on a stool and a chart of the coast of Spain spread across the table under a decanter. He is a large, slow-spoken man with the kindliest manner on the station, which deceives nobody who has served under him.

[if new_coat] 'Very fine,' he says of your coat. 'Very fine indeed.'

He asks about your passage, your last ship and your health, and listens to the answers. Then he looks at the chart.

CHOICE: Wait to be told your orders
Effects: standing +1
Next: any orders

CHOICE: Ask, with proper deference, for a cruise against the enemy's trade
Effects: set asked_cruise
Next: any orders

CHOICE: Speak of the ship's want of men
Effects: set spoke_of_men
Chance 50, +20 if hint_hospital_men:
Effects: set hospital_men_promised
Text: 'Men,' says the Admiral, as another man might say 'weather'. But he makes a note, and says that something may be done when the hospital discharges.
Next: any orders
Otherwise:
Effects: standing -1
Text: 'Every captain on the station is short of men, sir,' says the Admiral, without heat, 'and every one of them tells me so.'
Next: any orders


EVENT: orders_cruise
Title: Your Orders
Place: office
Tags: orders
Once
Requires: issuing_orders
Weight: 1, +3 if asked_cruise, +1 per standing, -1 if pardoe_grudge, -1 if dawe_rival
Effects: clear issuing_orders; orders cruise_catalan; start sail_by; pass 30 minutes

'The coast of Catalonia,' says the Admiral, laying a thick finger on it. 'Between Cape San Sebastián and Cape Salou. The Spaniards run their coasting trade along there in everything that will float, and they do not like it interrupted. Six weeks, and then come back to me.'

Mr Pardoe, who has been in the room all along, gives you your orders, sealed, and a look that you cannot read.

CHOICE: Thank the Admiral, and take your leave
Log: Received orders from the Commander-in-Chief to cruise on the coast of Catalonia.
Next: mahon_hub

CHOICE: Ask whether he has any particular wishes as to the cruise
Effects: standing +1
Text: 'Wishes?' The Admiral smiles. 'I wish you to take a great many prizes, Captain {surname}, of which I shall have my eighth. And I wish you not to fall in with the Toulon frigates. Good day to you.'
Log: Received orders from the Commander-in-Chief to cruise on the coast of Catalonia.
Next: mahon_hub


EVENT: orders_convoy
Title: Your Orders
Place: office
Tags: orders
Once
Requires: issuing_orders
Weight: 2, +2 if pardoe_grudge, +1 if spoke_of_men
Effects: clear issuing_orders; orders convoy_toulon; start sail_by; pass 30 minutes

'There are three victuallers lying in the harbour,' says the Admiral, 'full of beef and biscuit for the squadron off Toulon, and they have lain there a week for want of anybody to take them. You will take them.'

It is the dullest service on the station, and both of you know it. Mr Pardoe hands you your orders, sealed.

CHOICE: Take them, with thanks
Effects: standing +1
Log: Received orders from the Commander-in-Chief to see three victuallers safe to the squadron off Toulon.
Next: mahon_hub

CHOICE: Ask, if it may be, for a cruise instead
Chance 25, +15 per standing, +20 if dined_pardoe, -20 if pardoe_grudge:
Effects: orders cruise_catalan
Text: The Admiral looks at you for a long moment. 'Well, well. Dawe shall have the victuallers, and serve him right. Pardoe, write it out again.' Mr Pardoe writes it out again.
Log: Received orders from the Commander-in-Chief to cruise on the coast of Catalonia.
Next: mahon_hub
Otherwise:
Effects: standing -1
Text: 'Instead?' says the Admiral, pleasantly. 'No, Captain {surname}. Not instead. Good day to you.'
Log: Received orders from the Commander-in-Chief to see three victuallers safe to the squadron off Toulon.
Next: mahon_hub


EVENT: orders_despatches
Title: Your Orders
Place: office
Tags: orders
Once
Requires: issuing_orders
Weight: 2, +1 if asked_cruise
Effects: clear issuing_orders; orders despatches_hebe; start sail_by; pass 30 minutes

'I have a packet for Captain Wyatt of the *Hebe*, who is off Barcelona,' says the Admiral. 'Carry it to him with all dispatch. When you have put it into his hand you may cruise a fortnight on that coast before you come back, and take what you can.'

Mr Pardoe gives you your orders and the packet, both sealed, and makes you sign for the packet.

CHOICE: Take them, with thanks
Log: Received orders from the Commander-in-Chief to carry despatches to the Hebe off Barcelona.
Next: mahon_hub

CHOICE: Ask what the packet contains
Effects: standing -1
Text: 'Paper, Captain {surname},' says the Admiral, 'covered with writing.' Mr Pardoe permits himself to look at the ceiling.
Log: Received orders from the Commander-in-Chief to carry despatches to the Hebe off Barcelona.
Next: mahon_hub
</script>

<script type="text/plain" class="content" data-name="Events: The dockyard">
EVENT: yard_prize
Title: The Dockyard
Place: dockyard
Tags: dockyard
Once

The yard lies across the harbour from the town: storehouses, a mast pond, a sheer hulk, and the dismasted prize you passed on your first morning, hauled in to the wharf with her guns out of her.

She is a French privateer brig, the foreman of the shipwrights tells you, taken off Cape Bon in January. The surveyors are aboard her now. Half the commanders on the station have already asked who is to have her.

CHOICE: Look her over yourself
Effects: set saw_prize; pass 1 hour
Text: She is sharp and wet and over-sparred, built to run rather than to fight, and she would sail round the *{ship}* in a light air. You come away with tar on your breeches and a fair idea of her lines.
Next: dockyard_hub

CHOICE: Go on to the Master Attendant's office
Next: dockyard_hub


EVENT: dockyard_hub
Title: The Dockyard
Place: dockyard
Hub

Caulkers are at work on a transport's seams, and the smell of hot pitch hangs over everything. A gang of island labourers is rolling casks along the wharf, slowly, under the eye of a clerk who is slower still.

CHOICE: Call upon the Master Attendant
Requires: not met_gedge
Next: yard_gedge

CHOICE: Present your order at the Ordnance gun wharf
Requires: gun_order, not carronades, not kept_long_guns
Next: gun_exchange

CHOICE: Return to the town
Effects: pass 30 minutes
Next: mahon_hub


EVENT: yard_gedge
Title: The Master Attendant
Place: dockyard
Effects: set met_gedge; pass 1 hour

Mr Gedge, Master Attendant of the yard, is an old sea officer who has not been to sea in eleven years and has not forgiven it. His office looks out over the mast pond, and his desk is buried under requisitions from every ship on the station.

'Cordage,' he says, before you have sat down. 'Everybody wants cordage. There is no cordage. The Navy Board sends me pitch and Bibles.'

CHOICE: Lodge your requisitions in the proper form
Effects: set requisitions_lodged
Text: He takes them, and puts them on top of the pile, which is something. 'In their turn, Captain. Everything in its turn.'
Next: dockyard_hub

CHOICE: Have Kinvig send him over a dozen of wine
Needs: cabin_stores 1 or more
Why not: There is no wine to spare in the cabin.
Effects: cabin_stores -1; yard_favour +2; set requisitions_lodged
Text: Mr Gedge does not thank you, which would be improper. But your requisitions find their way, by some process of their own, rather nearer the top of the pile.
Next: dockyard_hub

CHOICE: Ask him which ships he served in
Chance 50:
Effects: yard_favour +1; set requisitions_lodged
Text: A good many, it appears, and he tells you about all of them. It takes most of an hour. By the end he is calling you 'my dear sir'.
Next: dockyard_hub
Otherwise:
Effects: pass 1 hour
Text: He served, it appears, in a great many ships under a great many fools, and he names most of them. Two were friends of your father's. You do not mention it.
Next: dockyard_hub


EVENT: gun_exchange
Title: The Gun Wharf
Place: dockyard

Mr Lusk, Storekeeper of the Ordnance, reads the Admiral's order twice and holds it up to the light, as though it might be forged.

'Carronades,' he says. 'Eighteen-pounders. Sixteen of them, with slides and fittings.' He has them, it emerges; he has had them since the autumn. What he has not got is anybody to sway your six-pounders out and the carronades in, nor a lighter to carry them, nor any wish to hurry.

CHOICE: Have the exchange made in the ordinary course
Effects: pass 3 days; set carronades
Text: It takes three days, the loan of half your people, and a great deal of language from Mr Treharne. At the end of it the *{ship}* mounts sixteen eighteen-pounder carronades, and rides an inch higher for the want of the long guns' weight.
Log: Exchanged the six-pounders for eighteen-pounder carronades at the Ordnance wharf.
Next: dockyard_hub

CHOICE: Ease the business with a present to his clerk
Needs: money £3 or more
Effects: money -£3 "A present to the Ordnance storekeeper's clerk"; pass 1 day; set carronades
Text: The lighter appears that afternoon with a working party, and the thing is done by the next day's dusk. Mr Lusk affects not to know how.
Log: Exchanged the six-pounders for eighteen-pounder carronades at the Ordnance wharf.
Next: dockyard_hub

CHOICE: Think better of it, and keep your long guns
Effects: set kept_long_guns
Text: Mr Lusk hands back the order with the look of a man whose afternoon has been restored to him.
Next: dockyard_hub
</script>

<script type="text/plain" class="content" data-name="Events: The agent">
EVENT: crouch_intro
Title: Mr Crouch
Place: agent
Tags: agent
Once
Effects: set met_crouch

Mr Abel Crouch, merchant, navy agent and agent for prizes, late of Gibraltar, keeps a counting-house on the quay with a brass plate and three clerks. He is stout and grey and very civil, and he has done business with sea officers for thirty years without, so far as anyone knows, ever once being in a hurry.

'Captain {surname}. I had heard. The *{ship}*. Sit down, sir, sit down.'

CHOICE: Sit down
Next: agent_hub


EVENT: agent_hub
Title: Mr Crouch's Counting-House
Place: agent
Hub

The clerks scratch at their ledgers. Mr Crouch folds his hands upon his waistcoat and waits to learn what you want, though he very likely knows already.

[if agent_crouch] He is, as he likes to say, your man of business now.

CHOICE: Ask for an advance against your pay
Requires: not advance_crouch
Next: crouch_advance

CHOICE: Appoint him your agent for prizes
Requires: not agent_crouch, not agent_segui
Effects: set agent_crouch
Text: Mr Crouch draws up the letter of attorney himself, and you sign it. 'Two and a half per cent, sir, and every penny accounted for,' he says. 'You will find me slow. You will not find me short.'
Log: Appointed Mr Crouch of Mahon my agent.
Next: agent_hub

CHOICE: Ask him for the news of the port
Requires: not heard_crouch_news
Effects: set heard_crouch_news; pass 30 minutes
Chance 50, +30 if agent_crouch:
Effects: set rumour_barcelona_convoy
Text: Mr Crouch lowers his voice, though there is nobody to hear but his clerks. A coaster in from Barcelona last week reports a number of vessels collecting there, laden with wine and oil and waiting on an escort. 'It may be nothing,' he says. 'It very often is.'
Next: agent_hub
Otherwise:
Text: Mr Crouch tells you the price of oil, the state of the exchange on London, and that the Governor's cook has left him for the Admiral's. None of it seems likely to be of use.
Next: agent_hub

CHOICE: Take your leave
Next: mahon_hub


EVENT: crouch_advance
Title: An Advance
Place: agent

Mr Crouch is perfectly willing. Sea officers' pay is a slow thing, as he says, and a commander on a foreign station must live meanwhile. He will advance against your pay at five per cent, the most the law allows, and charge it to your account.

[if agent_crouch] Since you have named him your agent, he will advance a little more freely.

CHOICE: Take thirty pounds
Effects: set advance_crouch; money +£30 "Advanced by Mr Crouch against pay"; debt +£31 10s "Mr Crouch, thirty pounds advanced, with a year's interest"
Log: Drew £30 on Mr Crouch.
Next: agent_hub

CHOICE: Take sixty pounds
Needs: agent_crouch

<script type="text/plain" class="content" data-name="Glossary">
GLOSSARY
Master and Commander | commander | commanders: The rank between lieutenant and post-captain, carrying command of a sloop. "Master and Commander" was the older title; the Admiralty shortened it to "Commander" in 1794, though the long form lingered in speech. Aboard his own ship a commander is called "Captain" by courtesy.
post-captain | made post: A captain on the Navy List, commanding a rated ship of twenty guns or more. Once posted, an officer rose by seniority alone towards an admiral's flag.
sloop: In Navy usage, any vessel commanded by a commander rather than a post-captain, usually of ten to eighteen guns, whether ship- or brig-rigged.
brig-sloop | brig: A sloop rigged as a brig: two masts, both square-rigged. Handier and cheaper than a ship-rigged sloop, and the commonest small cruiser of the war.
Commander-in-Chief | Admiral: The admiral commanding all the King's ships on a station, here the Mediterranean. He issues orders, fills vacancies, and takes a share of every prize taken under his command.
Vice-Admiral | Vice-Admiral of the White: The flag rank between rear-admiral and admiral. Each flag rank was divided by the colour of its squadron (Red, White and Blue), and an officer rose through them by seniority alone.
Order of the Bath | Most Honourable Order of the Bath: An order of knighthood given, among others, to admirals for distinguished service. It entitled the holder to "Sir".
flag captain: The captain of an admiral's flagship, and very often his right hand.
secretary: An admiral's secretary was a civilian who ran his correspondence and orders. A great deal of patronage passed through his hands.
commission: The written appointment of an officer to a particular ship. Read aloud to the ship's company, it gives him his authority over them.
reading in | read yourself in: Taking command by reading one's commission aloud to the assembled ship's company. Until he has done so, a new captain has no authority aboard.
orders | sealed: Written instructions from a superior. Every orders began "You are hereby required and directed", and an officer who departed from them answered for it.
all convenient dispatch | all possible dispatch: Formulas in orders. "Convenient" allowed a little latitude; "possible" allowed none.
in all respects ready: The phrase in orders meaning stored, watered, manned and fit for sea.
annoyance of the enemy: The phrase in cruising orders for attacking his trade and shipping.
in amity: At peace with. Neutral ships could be stopped and searched, but taking one without cause cost the captor heavy damages.
contraband of war: Goods a neutral may not carry to a belligerent, such as arms, powder, and naval stores. Their discovery made a neutral ship lawful prize.
coasting trade: Small vessels carrying goods from port to port along a coast. Spain, with bad roads, depended on it.
victualler | victuallers: A merchant ship hired to carry provisions out to the fleet.
squadron off Toulon: The British ships keeping watch on the French fleet in Toulon. Victuallers and despatches were forever being sent to it.
packet: A bundle of official letters. Despatches were weighted with lead, so that they could be sunk if capture threatened.
eighth: Under the prize rules, one eighth of every prize went to the flag officer under whose orders the captor sailed, whether he had been within a hundred miles of it or not.
storeship: A vessel carrying naval stores (cordage, canvas, spars, provisions) out to a foreign station.
bumboat: A shore boat that sells fruit, drink, tobacco and small wares to ships in harbour.
ruined fort: Fort St Philip at the mouth of Mahon harbour, demolished by the Spanish after they retook Minorca in 1782. The British found it in ruins when they captured the island again in 1798.
Mahon | Port Mahon: The capital and harbour of Minorca, one of the finest anchorages in the Mediterranean, and in British hands from 1798.
Minorcan: A native of Minorca. The islanders speak their own form of Catalan, and many remembered an earlier British occupation that ended in 1782.
island tongue: Minorcan, a form of Catalan. "Allà" means "there".
Governor | His Excellency: The general commanding the garrison of Minorca, who also governed the island. A distant and exalted figure to a sea officer.
garrison | regiment | redcoats: The British soldiers holding Minorca. The army and the navy dined together, gambled together, and did not much like one another.
card | leave your card: A newly arrived officer left his visiting card at the houses of people of consequence. An invitation, or nothing, followed.
whist | rubber: The favourite card game of officers of both services, played by four in two partnerships. A rubber is the best of three games.
half-crown points | half-crown: A half-crown was two shillings and sixpence. At half-crown points a bad evening could cost a commander a week's pay.
quadrilles: A dance for four couples in a square, newly fashionable.
lace: Gold lace on a uniform coat. The amount of it showed rank, and to some degree vanity.
epaulette: The gold shoulder ornament ordered for sea officers in 1795. A commander wore one on the left shoulder; a post-captain one on the right until he had three years' seniority, then two.
guinea | guineas: A gold coin worth twenty-one shillings.
prize agent | agent for prizes | navy agent | agent: A man of business who drew a sea officer's pay and saw his prizes through the courts and the sale, for a commission. Many advanced money against pay or prizes to come. Some failed, and took their clients' money with them.
letter of attorney: The paper by which an officer gave his agent power to act and receive money for him.
counting-house: A merchant's office, where his clerks kept his books.
five per cent | per cent: Five per cent a year was the most interest the usury laws allowed a lender to charge.
exchange on London: The rate at which bills of exchange drawn on London could be bought or sold abroad; the merchant's barometer.
Master Attendant: The officer of a dockyard in charge of the ships in harbour, their moorings, and the masting and rigging of them.
Navy Board: The board that built, repaired and stored the King's ships and ran the dockyards. It sent out stores, generally the wrong ones.
requisitions: Written demands for stores, made out in the proper form and countersigned. Without one, nothing could be issued.
mast pond: A pond where mast timber was kept under water so that it would not dry and split.
sheer hulk: An old hull fitted with sheers, a tall lifting frame, for stepping and taking out ships' masts.
caulkers | seams: Caulkers drive oakum into the seams between a ship's planks and pay them over with hot pitch to keep the water out.
Ordnance | Storekeeper of the Ordnance | Ordnance wharf | gun wharf: The Board of Ordnance, separate from the Navy, supplied the fleet's guns, powder and shot from its own gun wharfs, under its own storekeepers. A ship's guns could not be changed without an order.
carronade | carronades: A short, light gun of large bore, first cast by the Carron Company in Scotland. Devastating at close range, poor at long, and worked by fewer men than a long gun. Mounted on a slide rather than a wheeled carriage.
six-pounder | six-pounders | long guns: A long gun firing a six-pound ball: accurate, and good at long range, but light in weight of metal.
weight of metal: The total weight of shot a ship can fire in one broadside.
slides: The mounting of a carronade, which recoils along a slide pivoted at the ship's side rather than on wheels.
sway: To hoist something heavy, such as a gun or a mast.
lighter: A flat-bottomed barge for carrying goods and guns between ship and shore.
privateer: A privately owned ship of war, licensed by her government to take enemy merchant ships for profit.
surveyors: Dockyard officers who examined a captured ship to decide whether she was worth buying into the service.
over-sparred: Carrying masts and yards too large for her hull: fast, but crank and wet.
Navy List | followers: A senior officer's followers were the junior officers and men he took with him from ship to ship, and pushed for promotion.
most obedient humble servant: The ordinary close of a formal letter.
sanding: Sprinkling fine sand over wet ink to dry it.
claret: Red wine of Bordeaux. In wartime it came by prize, or by smugglers, or with a story attached.
Manxman: A native of the Isle of Man.
capstan: The great upright drum, turned by men pushing on bars, that heaves in the anchor cable.
cable: The great rope by which a ship rides to her anchor.
unmoor | moorings: A ship moored in harbour lay to two anchors or to a fixed mooring; unmooring was the first business of getting under way.
falls off | gathers way: A ship falls off when her head swings away from the wind, and gathers way as she begins to move through the water.
topsails: The second sails up each mast and the workhorse of the square rig; a ship under topsails alone is under easy control.
hospital: The naval hospital at Mahon, built by the British on its own island in the harbour in the early years of the century before.
polacre: A Mediterranean merchant vessel whose masts are single poles without tops. Common out of Naples, Genoa and the Levant.
prize: An enemy vessel captured at sea. Once condemned by a prize court, she and her cargo are sold and the proceeds shared among the captors.
yards: The spars across the masts from which the square sails hang. In harbour a smart ship keeps them "square", at exact right angles to the keel.
Boat ahoy: The hail to an approaching boat. The answer told the ship who was in it: an officer's boat answered "Aye aye", a captain's boat answered with the name of his ship.
side-boys: Boys or seamen stationed at the gangway to attend an officer coming aboard.
boatswain's call: The boatswain's silver pipe, used to pass orders and to pipe officers over the side.
gangway: The opening in the ship's side where people come aboard.
battens: Wooden steps fixed up the ship's side.
waist: The middle part of the upper deck, between the quarterdeck and the forecastle.
launch: The largest of a ship's boats, used for heavy work such as carrying out anchors and fetching water.
midshipman: A young gentleman serving as an officer in training. After six years at sea and an examination he might be made lieutenant.
gunroom: In a sloop, the mess of the lieutenant, master, surgeon and purser.
cable-tier: The place deep in the ship where the great anchor cables are coiled down.
seventy-four: A ship of the line of seventy-four guns, the backbone of the battle fleet.
quarterdeck: The raised deck aft, from which the ship is commanded. The captain's ground.
break of the quarterdeck: The forward edge of the quarterdeck, where it drops to the waist.
breechings: The heavy ropes that check a gun's recoil.
galley: The ship's kitchen.
berth-deck: The deck below, where the men sling their hammocks.
complement: The number of men a ship is established to carry.
the people | her people: The ship's company below the officers.
captains of the tops: Leading seamen, each in charge of the men working one mast's rigging aloft.
gunner's mates: Petty officers under the gunner, in charge of the guns and their crews.
prime seamen: Experienced sailors who can hand, reef and steer.
receiving ship: A hulk where pressed men and volunteers were held until drafted to ships.
press | pressed: The impressment service, which took seafaring men for the Navy by force.
all hands: The whole ship's company.
turned up: Called on deck by the boatswain and his mates.
fleet action: A battle between fleets of ships of the line.
marines: Soldiers carried aboard for sentry duty, musketry and boarding. A sloop had perhaps fifteen, under a sergeant.
great cabin: The captain's quarters at the stern.
swinging cot: A wooden-framed canvas bed slung from the deck beams.
quarter-gallery: A small enclosed gallery projecting from the stern quarter, holding the captain's privy.
at quarters: At action stations, when every man goes to his place for battle.
steward: The captain's servant, who keeps his table, wine and private stores.
cabin stores: A captain bought his own table: wine, poultry, livestock and delicacies, at his own expense. Entertaining was expected of him, and it ruined many.
cross them | crossed: Writing a second set of lines across the first, at right angles, to save paper and postage.
lieutenant of marines: A marine officer. A sloop rarely carried one.
vouchers: The receipts and certificates by which a purser accounted for every issue of stores.
officer of the watch: The officer in charge of the deck during a watch.
counter: The overhanging part of the stern, above the waterline.
topmast: The second section of a mast, above the lower mast. A spare was carried in case one was carried away.
purser: The warrant officer responsible for the ship's provisions and slops, who kept the accounts of them and was widely believed to profit by them.
forenoon: The forenoon watch, eight o'clock until noon.
two bells | four bells | eight bells: Time aboard is struck on the ship's bell every half hour, one stroke more each time, until eight bells ends the four-hour watch and the count begins again.
first watch: The watch from eight in the evening until midnight.
watch: One of the divisions of the ship's day, mostly of four hours: the first watch (8 p.m. to midnight), middle, morning, forenoon, afternoon, and the two short dog watches between 4 and 8 p.m.
fortnight: Two weeks.
</script>
