  const errs = content.problems.filter(p => p.sev === 'error').length;
  const savedLine = saved ? `<p class="muted" style="margin:0 0 .8rem">A commission is in hand: ${esc(saved.name)}, ${esc(fmtDate(saved.minutes))}.</p>` : '';
  app.innerHTML = `<section class="title">
    ${roseSvg()}
    <h1>Sloop of War</h1>
    <p class="sub">A commission in the Mediterranean</p>
    ${savedLine}
    ${saved ? `<div class="row" style="margin-bottom:1.6rem"><button type="button" class="btn" data-act="resume" id="resume">Continue the commission</button></div>
      <h2 class="sc" style="font-size:1.1rem;color:var(--ink-2);margin-bottom:.8rem">Or begin a new one</h2>` : ''}
    <div class="field"><label for="cmdr-name">Your name</label>
      <input id="cmdr-name" autocomplete="off" value="${esc(content.settings['default name'] || '')}"></div>
    <div class="field"><label for="seed">Seed</label>
      <input id="seed" autocomplete="off" class="num" value="${esc(makeSeed())}">
      <small>The same seed and the same choices always give the same commission.</small></div>
    <div class="row"><button type="button" class="btn ${saved ? 'quiet' : ''}" data-act="begin" id="begin">Take up the commission</button></div>
    <div class="foot"><span>${esc(BUILD)}</span>
      <button type="button" class="link" data-act="sandbox">Combat sandbox</button>
      <button type="button" class="link" data-act="glossary">Glossary</button>
      <button type="button" class="link" data-act="check">Content check${errs ? ` <span class="badge">(${errs})</span>` : ''}</button></div>
  </section>`;
}

function renderNowhere(app){
  const from = state.nowhere || state.eventId;
  app.innerHTML = `${headerHtml()}${stripHtml()}<section class="scene">
    <h2 tabindex="-1" id="scene-title">The Log Runs Out</h2>
    <div class="prose"><p>This passage leads nowhere yet. The writing after <b>${esc(from)}</b> has not been written, or a “Next:” line names something that does not exist. The Content check under Papers will say which.</p></div>
    <div class="row cont"><button type="button" class="btn" data-act="replay">Replay this commission</button>
    <button type="button" class="btn quiet" data-act="title">Return to the title</button></div></section>`;
  focusTop();
}

function logTableHtml(){
  if (!state.log.length) return `<p class="note">Nothing has been entered in the log yet.</p>`;
  let rows = '', lastDay = null;
  for (const e of state.log){
    const day = fmtDate(e.t);
    if (day !== lastDay){ rows += `<tr class="day"><td colspan="2">${esc(day)}</td></tr>`; lastDay = day; }
    rows += `<tr><td class="h">${esc(fmtHour(e.t))}</td><td>${inline(e.text)}</td></tr>`;
  }
  return `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">H</th><th scope="col">Remarks</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function ledgerHtml(acct, opts){
  const rows = state.accounts.filter(a => a.acct === acct);
  if (!rows.length) return '';
  let bal = 0, body = '';
  for (const r of rows){
    bal += r.amt;
    const c = clockOf(r.t);
    const amt = (r.amt < 0 ? '−' : '+') + fmtMoney(Math.abs(r.amt));
    body += `<tr><td class="h">${c.date} ${c.month.slice(0,3)}</td><td>${inline(r.what)}</td>
      <td class="amt">${esc(amt)}</td><td class="amt">${esc(fmtMoney(bal))}</td></tr>`;
  }
  return `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">Date</th><th scope="col">Particulars</th>
    <th scope="col" class="amt">Sum</th><th scope="col" class="amt">${opts.bal}</th></tr></thead>
    <tbody>${body}<tr class="total"><td></td><td>${opts.bal}</td><td></td><td class="amt">${esc(fmtMoney(bal))}</td></tr></tbody></table></div>`;
}
function accountsHtml(){
  if (!state) return `<p class="note">No commission is in hand.</p>`;
  const purse = ledgerHtml('money', { bal: 'In hand' });
  const debts = ledgerHtml('debt', { bal: 'Owing' });
  return `<p class="note">Your own money, kept by your own hand. The ship’s stores and the purser’s cash are under Books.</p>
    <h3>Your purse</h3>${purse}
    ${debts ? `<h3>Owing to agents</h3>${debts}<p class="note">Interest at five per cent is reckoned for a year and entered at the time of the advance.</p>` : ''}`;
}
function ordersHtml(){
  if (!state || !state.orders || !content.orders[state.orders]) return `<p class="note">You have no orders yet.</p>`;
  const o = content.orders[state.orders];
  return `<p class="heading">${inline(o.heading)}</p><article class="orders">${o.paras.map(p => `<p${p.sig ? ' class="sig"' : ''}>${inline(p.text)}</p>`).join('')}</article>`;
}

let booksTab = 'provisions';
function storeIds(officers){
  return content.storeOrder.filter(id => officers.includes(content.stores[id].officer) && state.stores[id] &&
    (state.stores[id].book > 1e-6 || state.storeLog[id].length || !content.stores[id].only || condsMet(content.stores[id].only)));
}
function storeLedgerHtml(id){
  const d = content.stores[id], st = state.stores[id], log = state.storeLog[id];
  const rec = st.receipts.map(r => {
    const last = r.first + Math.ceil(r.units) - 1;
    const nos = d.dim === 'n' || d.size <= 1 ? '' : (Math.ceil(r.units) > 1 ? `Nos ${r.first}–${last}` : `No. ${r.first}`);
    return `<li>${esc(fmtBal(d, r.units * d.size))}${nos ? ', ' + nos : ''}, received ${esc(fmtDate(r.t, true).replace(/^\w+ /, ''))}${r.from ? ', ' + inline(r.from.replace(/^(received |)(of |from )/i, '')) : ''}</li>`;
  }).join('');
  const rows = log.map(e => `<tr><td class="h">${clockOf(e.t).date} ${clockOf(e.t).month.slice(0, 3)}</td><td>${inline(e.what)}</td>
    <td class="amt">${e.d < 0 ? '−' : '+'}${esc(fmtAmt(d, Math.abs(e.d)))}</td><td class="amt">${esc(fmtBal(d, e.bal))}</td></tr>`).join('');
  return `<details class="ledger"><summary>${esc(d.name)}</summary>
    ${rec ? `<p class="note" style="margin:.4rem 0 .2rem">Received</p><ul class="receipts">${rec}</ul>` : ''}
    ${rows ? `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">Date</th><th scope="col">Particulars</th><th scope="col" class="amt">Sum</th><th scope="col" class="amt">Remains</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="note">No entries.</p>'}
    </details>`;
}
function storesSummary(ids, withDays){
  const rows = ids.map(id => {
    const d = content.stores[id], st = state.stores[id];
    const days = withDays && d.ration ? (d.instead ? 'in lieu' : String(Math.floor(daysOf(id)))) : '';
    return `<tr><td>${esc(d.name)}</td><td class="amt">${esc(fmtBal(d, st.book))}</td>${withDays ? `<td class="amt">${esc(days)}</td>` : ''}</tr>`;
  }).join('');
  return `<div class="scroll-x"><table class="log"><thead><tr><th scope="col">Store</th><th scope="col" class="amt">Remains</th>${withDays ? '<th scope="col" class="amt">Days</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function word(v, bands){ for (const [min, w] of bands) if (v >= min) return w; return bands[bands.length - 1][1]; }
function shipHtml(){
  const v = k => getVar(k), f = k => !!state.flags[k];
  const leak = v('leak');
  const pumps = leak <= 2 ? 'a spell at the pumps in the morning watch keeps her free' : leak <= 5 ? 'the pumps are manned for a quarter of an hour in every watch' : leak <= 9 ? 'the pumps are going for half of every watch' : 'the pumps are never still';
  const hull = word(v('hull'), [[90, 'sound and tight in her frame'], [75, 'sound, though her seams work in a seaway'], [55, 'much strained, and her seams want caulking'], [0, 'badly strained, and weak in her frame']]);
  const mast = n => f(n + '_gone') ? 'gone' : f(n + '_sprung') ? 'sprung, and fished' : 'sound';
  const boat = n => f(n + '_lost') ? 'lost' : f(n + '_damaged') ? 'stove, and under repair' : 'sound';
  const standing = word(v('standing_rigging'), [[85, 'well set up'], [70, 'serviceable, though slack in places'], [50, 'much worn, and wants setting up'], [0, 'rotten in places, and not to be trusted in a blow']]);
  const running = word(v('running_rigging'), [[85, 'new and sound'], [70, 'serviceable'], [50, 'much chafed, and parting here and there'], [0, 'worn out']]);
  const sails = word(v('sails'), [[80, 'a good suit bent, and a second in the sail-room'], [60, 'the suit bent is old and much patched, and the second little better'], [40, 'worn thin; the sailmaker is never done with them'], [0, 'worn out; the sailmaker can do no more with them']]);
  const guns = `${v('guns')} ${f('carronades') ? 'eighteen-pounder carronades' : 'six-pounders'}`;
  return `<p class="note">As reported to you by the warrant officers.</p>
    <h3>The carpenter</h3>
    <p>She makes ${leak} ${leak === 1 ? 'inch' : 'inches'} of water an hour; ${pumps}. Her hull is ${hull}.</p>
    <p>Foremast ${mast('fore')}. Mainmast ${mast('main')}. Bowsprit ${mast('bowsprit')}.</p>
    <p>Boats: the launch ${boat('launch')}, the cutter ${boat('cutter')}, the jolly boat ${boat('jolly')}.</p>
    ${storesSummary(storeIds(['carpenter']), false)}
    <h3>The boatswain</h3>
    <p>Standing rigging ${standing}. Running rigging ${running}. Sails: ${sails}.</p>
    ${storesSummary(storeIds(['boatswain']), false)}
    ${storeIds(['carpenter', 'boatswain']).map(storeLedgerHtml).join('')}`;
}
function booksHtml(){
  if (!state || !state.stores) return `<p class="note">No commission is in hand.</p>`;
  const tabs = [['provisions', 'Provisions'], ['cash', 'Purser’s cash'], ['gunner', 'Gunner'], ['ship', 'Hull and rigging']];
  const nav = `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${k === booksTab}" data-act="books" data-tab="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (booksTab === 'provisions'){
    const ids = storeIds(['purser', 'master']);
    body = `<p class="note">The purser’s account of the provisions, and the master’s of the water, as they keep them. Victualled: ${getVar('victualled')} men${state.flags.short_allowance ? ', at two-thirds allowance' : ''}. Days are at the present allowance.</p>
      ${storesSummary(ids, true)}${ids.map(storeLedgerHtml).join('')}`;
  } else if (booksTab === 'cash'){
    const cash = ledgerHtml('cash', { bal: 'In hand' });
    body = `<p class="note">Money in the purser’s hands for the ship’s use, kept apart from your own.</p>${cash || '<p class="note">No entries.</p>'}`;
  } else if (booksTab === 'gunner'){
    const ids = storeIds(['gunner']);
    body = `<p>Mounted: ${getVar('guns')} ${state.flags.carronades ? 'eighteen-pounder carronades' : 'six-pounders'}, all serviceable.</p>${storesSummary(ids, false)}${ids.map(storeLedgerHtml).join('')}`;
  } else body = shipHtml();
  return nav + body;
}

function renderEnding(app){
  const ev = content.events[state.eventId];
  const title = ev ? ev.title : 'The Commission Closes';
  const paras = ev ? ev.paras.filter(p => !p.cond || condsMet(p.cond)).map(p => `<p>${inline(p.text)}</p>`).join('') : '<p>The commission is at an end.</p>';
  app.innerHTML = `${headerHtml()}${stripHtml()}<section class="scene">
    <h2 tabindex="-1" id="scene-title">${inline(title)}</h2>
    <div class="prose">${paras}</div>
    <h3 class="sc" style="font-size:1.1rem;color:var(--ink-2);margin:1.6rem 0 .4rem">Log of His Majesty’s Sloop <em>${esc(content.settings.ship || '')}</em>, ${esc(state.name)}, Commander</h3>
    ${logTableHtml()}
    ${state.tested ? '<p class="note">Writer’s tools were used during this commission.</p>' : ''}
    <p class="note num">Seed ${esc(state.seed)} · ${state.history.length} choices</p>
    <div class="row cont">
      <button type="button" class="btn" data-act="replay">Replay this commission</button>
      <button type="button" class="btn quiet" data-act="title">New commission</button>
      <button type="button" class="btn quiet" data-act="savelog">Save the log</button>
    </div><p class="status" id="end-status" role="status"></p></section>`;
  glossify($('.prose', app));
  focusTop();
}

/* ---------- glossary tooltip ---------- */
let tipFor = null;
function showTip(btn){
  const g = content.glossary[+btn.dataset.g]; if (!g) return;
  const tip = $('#tip');
  tip.innerHTML = `<b>${esc(g.terms[0])}</b>${inline(g.def)}`;
  tip.hidden = false; tipFor = btn;
  const r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.max(12, Math.min(r.left, window.innerWidth - tw - 12));
  let top = r.bottom + 8;
  if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 8);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip(){ const tip = $('#tip'); if (tip){ tip.hidden = true; } tipFor = null; }

/* ============================================================
   PANELS: log, orders, accounts, glossary, papers, writer's view, content check
   ============================================================ */
let panelReturnFocus = null;
function openPanel(kind){
  hideTip();
  panelReturnFocus = document.activeElement;
  const p = $('#panel');
  let title = '', html = '';
  if (kind === 'log'){
    title = 'The Log';
    html = state ? `<p class="note">Kept by the commander. The record of this commission.</p>${logTableHtml()}
      <div class="row cont"><button type="button" class="btn quiet" data-act="savelog">Save the log</button></div><p class="status" id="log-status" role="status"></p>`
      : `<p class="note">No commission is in hand.</p>`;
  }
  else if (kind === 'orders'){ title = 'Orders'; html = ordersHtml(); }
  else if (kind === 'accounts'){ title = 'Your Purse'; html = accountsHtml(); }
  else if (kind === 'books'){ title = 'The Ship’s Books'; html = booksHtml(); }
  else if (kind === 'muster'){ title = 'The Muster'; html = musterHtml(); }
  else if (kind === 'chart'){
    title = 'The Chart';
    html = state && state.nav ? `${chips('chartzoom', chartZoom, [['ship', 'About the ship'], ['full', 'The whole station']])}
      <div class="panelchart">${chartSvg(chartZoom)}</div><p>${inline(reckoningWords())}</p>
      <p class="note">The ship is drawn where the master reckons her, with the dotted ellipse he would answer for. A noon sight of the sun gives the latitude, and narrows the ellipse north and south only; a headland, a light, or the lead narrows it all round.</p>` : '<p class="note">No commission is at sea.</p>';
  }
  else if (kind === 'glossary'){
    title = 'Glossary';
    const items = content.glossary.slice().sort((a, b) => a.terms[0].localeCompare(b.terms[0]));
    html = `<dl class="gloss">${items.map(g => `<dt>${esc(g.terms[0])}</dt><dd>${inline(g.def)}${g.terms.length > 1 ? `<div class="also">Also: ${g.terms.slice(1).map(esc).join(', ')}</div>` : ''}</dd>`).join('')}</dl>`;
  }
  else if (kind === 'papers') { title = 'Papers'; html = papersHtml(); }
  else if (kind === 'writer') { title = 'Writer’s View'; html = writerHtml(); }
  else if (kind === 'check') { title = 'Content Check'; html = checkHtml(); }
  p.innerHTML = `<div class="col panel" style="padding-top:0">
    <div class="phead"><h2 id="panel-title" tabindex="-1">${title}</h2><button type="button" class="link" data-act="close">Close</button></div>
    ${html}</div>`;
  p.hidden = false; p.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if (kind === 'orders') glossify($('.orders', p));
  $('#panel-title').focus({ preventScroll: true });
}
function closePanel(){
  const p = $('#panel'); p.hidden = true; p.innerHTML = '';
  document.body.style.overflow = '';
  if (panelReturnFocus && document.contains(panelReturnFocus)) panelReturnFocus.focus({ preventScroll: true });
}

function checkHtml(){
  const P = content.problems;
  const nEv = content.order.length, nCh = content.order.reduce((n, id) => n + content.events[id].choices.length, 0);

  if (!P.length) return `${stats}<p class="status good">The content reads cleanly: no mistakes and no cautions.</p>`;
  const order = { error: 0, warn: 1 };
  const items = P.slice().sort((a, b) => order[a.sev] - order[b.sev]).map(p =>
    `<li><span class="sev ${p.sev}">${p.sev === 'error' ? 'Mistake' : 'Caution'}</span>${esc(p.msg)}<span class="where">${esc(p.where)}</span></li>`).join('');
  return `${stats}<p class="note">Mistakes stop a scene working. Cautions are worth a look but do no harm.</p><ul class="problems">${items}</ul>`;
}

function setStatus(id, msg, good){ const el = $('#' + id); if (el){ el.textContent = msg; el.className = 'status ' + (good ? 'good' : 'bad'); } }

async function offerFile(filename, data, statusId, fallback){
  if (downloadsApi){
    try { await downloadsApi.save({ filename, data }); setStatus(statusId, 'Saved.', true); return; }
    catch(e){
      if (e && e.code === 'declined'){ setStatus(statusId, 'Not saved.', false); return; }
      if (e && e.code === 'rate_limited'){ setStatus(statusId, 'A save is already waiting for your answer.', false); return; }
    }
  }
  fallback();
}
function exportSave(){
  const data = JSON.stringify({ game: GAME_ID, build: BUILD, savedAt: new Date().toISOString(), state }, null, 1);
  offerFile(saveFileName(), data, 'papers-status', () => {
    const box = $('#export-fallback'); if (!box) return;
    box.hidden = false; $('#export-text').value = data;
  });
}
function logAsText(){
  let out = `Log of His Majesty's Sloop ${content.settings.ship}, ${state.name}, Commander\nSeed ${state.seed}\n`;
  let lastDay = null;
  for (const e of state.log){
    const day = fmtDate(e.t);
    if (day !== lastDay){ out += `\n${day}\n`; lastDay = day; }
    out += `  ${fmtHour(e.t)}. ${e.text.replace(/\*/g, '')}\n`;
  }
  return out;
}
function saveLog(statusId){
  const name = `log-${content.settings.ship.toLowerCase()}-${surname().toLowerCase().replace(/[^a-z0-9]+/g, '-')}.txt`;
  offerFile(name, logAsText(), statusId, () => {
    const el = $('#' + statusId); if (!el) return;
    el.className = 'status';
    el.innerHTML = `<span class="note">Saving files is not available here; copy the log below.</span><textarea readonly aria-label="Log text">${esc(logAsText())}</textarea>`;
  });
}
function importText(text, statusId){
  try {
    adopt(readSave(text));

}

/* ============================================================
   COMBAT SANDBOX
   A single action between two ships, fought on its own and not
   yet part of the campaign. Distances are in cables, headings in
   points of the compass, time in minutes from ten o'clock.
   ============================================================ */
let view = 'game';
let sb = null;
const sbSet = { action: '', arm: 0, drill: 'average', weather: 'random', start: 'random', seed: '' };
const DRILL_WORDS = { slack: 'Slack', average: 'Ordinary', crack: 'Crack' };
const SIDE_WORDS = { L: 'larboard', S: 'starboard' };
const BAND_WORDS = ['point-blank', 'close range', 'long range', 'extreme range', 'out of gunshot'];
const NUM_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
function numWord(n){ return NUM_WORDS[n] || String(n); }
function capFirst(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function gnum(k, d){ const v = parseFloat((content.gunnery || {})[k]); return isNaN(v) ? d : v; }
function glist(k, d){ const l = String((content.gunnery || {})[k] || '').split(',').map(x => parseFloat(x)).filter(x => !isNaN(x)); return l.length ? l : d; }
function reloadBase(drill){
  const m = String((content.gunnery || {}).reload || '').match(new RegExp(drill + '\\s+(\\d+(?:\\.\\d+)?)', 'i'));
  return m ? +m[1] : ({ crack: 3, average: 4, slack: 5 }[drill] || 4);
}
function bands(){ return glist('bands', [1, 3, 6, 10]); }
function bandOf(r){ const b = bands(); for (let i = 0; i < b.length; i++) if (r <= b[i]) return i; return b.length; }
function sr(){ return rand(sb.rng); }
function binom(n, p){ let k = 0; for (let i = 0; i < n; i++) if (sr() < p) k++; return k; }
function poisson(l){
  if (l <= 0) return 0;
  if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * (sr() * 2 - 1)));
  const L = Math.exp(-l); let k = 0, p = 1;
  do { k++; p *= sr(); } while (p > L);
  return k - 1;
}
function wrap32(a){ return ((a % 32) + 32) % 32; }
function wrap16(a){ a = wrap32(a); return a > 16 ? a - 32 : a; }
/* angle off the wind, signed: below zero the wind is on the starboard side (starboard tack) */
function sOf(h){ return wrap16(h - sb.wind.dir); }
function bearingTo(a, b){ return wrap32(Math.atan2(b.x - a.x, b.y - a.y) * 16 / Math.PI); }
function dist(a, b){ return Math.hypot(b.x - a.x, b.y - a.y); }
function relOf(s, t){ return wrap32(bearingTo(s, t) - s.h); }
function bearsSide(s, t){ const r = relOf(s, t); if (r >= 5 && r <= 11) return 'S'; if (r >= 21 && r <= 27) return 'L'; return null; }
function rakes(a, t){
  if (!bearsSide(a, t) || dist(a, t) > bands()[3]) return null;
  const r = relOf(t, a);
  if (r <= 2.5 || r >= 29.5) return 'bow';
  if (r >= 13.5 && r <= 18.5) return 'stern';
  return null;
}
function facingSide(t, a){ return relOf(t, a) < 16 ? 'S' : 'L'; }
function windward(a, b){ const w = sb.wind.dir * Math.PI / 16; return (a.x - b.x) * Math.sin(w) + (a.y - b.y) * Math.cos(w) > 0; }

/* ---------- the ships ---------- */
function parseArmament(str){
  const words = { four: 4, six: 6, eight: 8, nine: 9, twelve: 12, eighteen: 18, 'twenty-four': 24, 'thirty-two': 32 };
  return String(str).split(/\s+or\s+/i).map(part => {
    const m = part.trim().match(/^(\d+)\s+(long\s+)?([a-z-]+)-pounders?(\s+carronades?)?$/i);
    if (!m || !words[m[3].toLowerCase()]) return null;
    return { n: +m[1], w: words[m[3].toLowerCase()], carr: !!m[4], label: part.trim() };
  });
}
function sbVessel(v, armIdx, drill){
  const f = v.f, arm = v.arm[Math.min(armIdx, v.arm.length - 1)];
  const crew = parseInt(f.crew, 10) || 90;
  const n = (k, d) => { const x = parseFloat(f[k]); return isNaN(x) ? d : x; };
  return {
    vid: v.id, name: f.name || v.id, called: f.called || 'the enemy', colours: f.colours || '',
    arm, gunsSide: { L: Math.ceil(arm.n / 2), S: Math.floor(arm.n / 2) },
    crew0: crew, crew, killed: 0, wounded: 0,
    hull0: n('hull', 400), hull: n('hull', 400), leak: 1, water: 6, holesAbove: 0, holesBelow: 0,
    rig0: n('rigging', 100), rig: n('rigging', 100), rigStage: 0, topmast: '', dismasted: false,
    speedMul: n('speed', 1), closest: n('closest', 6), turnRate: n('turning', 2),
    drill: (drill || f.gunnery || 'average').toLowerCase(),
    temper: (f.temperament || 'bold').toLowerCase(), aimsAt: (f['aims at'] || 'hull').toLowerCase(),
    strikeAt: n('strikes at', 30) / 100,
    x: 0, y: 0, h: 0, speed: 0, turn: null, sail: 'plain', helm: 'steady',
    reload: { L: 0, S: 0 }, loadedWith: { L: 'round', S: 'round' }, charge: 'round', aim: 'hull', openAt: 1,
    powder: n('powder', 3000), broadsides: 0, slowTurns: 0, struck: false, track: [], mode: 'engage'
  };
}

function sbTargetSpeed(s){
  const a = Math.abs(sOf(s.h));
  if (a < s.closest - 0.01) return 0;
  const f = sailList('wind')[sb.wind.force] || 0;
  let v = polarSpeed(Math.max(a, 6)) * (a < 6 ? 0.85 : 1) * f * s.speedMul;
  v *= { fighting: 0.75, plain: 1, crowd: 1.12, backed: 0.1 }[s.sail] || 1;
  v *= 0.35 + 0.65 * Math.max(0, s.rig) / s.rig0;
  if (s.topmast) v *= 0.8;
  if (s.dismasted) v *= 0.2;
  if (s.water > 36) v *= 0.85;
  return v;
}
function maxTurn(s){
  return s.turnRate * Math.max(0.25, Math.min(1.2, s.speed / 4)) * (0.4 + 0.6 * Math.max(0, s.rig) / s.rig0) * (s.dismasted ? 0.4 : 1);
}
function sbMissChance(s){
  const base = sailList('missing stays')[sb.wind.force] || 0;
  let p = base * ({ crack: 0.6, average: 1, slack: 1.5 }[s.drill] || 1) + 3;
  if (s.speed < 3) p *= 1.6;
  if (s.rig / s.rig0 < 0.6) p *= 1.4;
  return Math.min(85, p);
}
/* how: 'auto' wears if it must cross the wind, 'tack' goes through the wind, 'wear' goes round by the stern, 'ai' picks the shorter */
function sbSetCourse(s, target, how){
  const sc = sOf(s.h) || -0.001;
  let st = sOf(target);
  if (how === 'wear' && Math.sign(st) === Math.sign(sc)) st = -st;
  if (Math.abs(st) < s.closest) st = (how === 'tack' ? -Math.sign(sc) : (how === 'ai' && st !== 0 ? Math.sign(st) : Math.sign(sc))) * s.closest;
  if (how === 'tack' && Math.sign(st) === Math.sign(sc)) st = -Math.sign(sc) * s.closest;
  let d, amt, tack = false, wear = false;
  if (Math.sign(st) === Math.sign(sc)){ const delta = st - sc; d = Math.sign(delta) || 1; amt = Math.abs(delta); }
  else {
    const tackAmt = Math.abs(sc) + Math.abs(st), wearAmt = (16 - Math.abs(sc)) + (16 - Math.abs(st));
    if (how === 'tack' || (how === 'ai' && tackAmt < wearAmt * 0.6)){ d = -Math.sign(sc); amt = tackAmt; tack = true; }
    else { d = Math.sign(sc); amt = wearAmt; wear = true; }
  }
  if (amt < 0.05){ s.turn = null; return; }
  const miss = tack && !sb.sim ? sr() * 100 < sbMissChance(s) : false;
  s.turn = { d, left: amt, tack, wear, miss, s0: Math.sign(sc) };
}
function sbMove(s){
  if (s.turn){
    const amt = Math.min(s.turn.left, maxTurn(s));
    s.h = wrap32(s.h + s.turn.d * amt); s.turn.left -= amt;
    if (s.turn.tack && s.turn.miss && Math.abs(sOf(s.h)) < 1){
      const cur = Math.abs(sOf(s.h)), wrong = Math.sign(sOf(s.h)) !== s.turn.s0;
      s.turn = { d: -s.turn.d, left: s.closest + 0.5 + (wrong ? cur : -cur), tack: false, wear: false, miss: false, s0: s.turn.s0 };
      s.missedNow = true;
    }
    if (s.turn && s.turn.left <= 1e-6){ s.turn = null; if (s.helm !== 'chase') s.helm = 'steady'; }
  }
  s.speed += (sbTargetSpeed(s) - s.speed) * 0.25;
  s.x += Math.sin(s.h * Math.PI / 16) * s.speed / 12;
  s.y += Math.cos(s.h * Math.PI / 16) * s.speed / 12;
}

/* ---------- gunnery ---------- */
function reloadTurns(s, charge){
  let n = reloadBase(s.drill);
  const frac = s.crew / s.crew0;
  if (frac < 0.7) n += 1;
  if (frac < 0.5) n += 1;
  if (charge === 'double') n += 1;
  if (s.slowTurns > 0) n += 1;
  return n;
}
function sbFire(a, t, side){
  const n0 = a.gunsSide[side];
  if (n0 <= 0 || a.reload[side] > 0 || a.struck) return null;
  const band = bandOf(dist(a, t));
  const manned = Math.max(1, Math.round(n0 * Math.min(1, (a.crew / a.crew0) / 0.7)));
  const charge = a.loadedWith[side];
  let p = (a.arm.carr ? glist('carronades', [0.75, 0.45, 0.1, 0.02]) : glist('long guns', [0.7, 0.45, 0.22, 0.07]))[band] || 0;
  p *= { crack: 1.2, average: 1, slack: 0.75 }[a.drill] || 1;
  if (sb.wind.force >= 6) p *= Math.max(0.4, 1 - 0.08 * (sb.wind.force - 5));
  if (charge === 'double' && band > 0) p *= 0.5;
  if (charge === 'grape' && band > 1) p *= 0.3;
  const hits = binom(manned, Math.min(0.95, p));
  const rk = rakes(a, t), R = rk ? gnum('raking', 3) : 1, W = a.arm.w;
  const res = { side, hits, manned, band, rake: rk, charge, aim: a.aim, cas: 0, dismount: 0, below: 0, rig: 0, hull: 0 };
  if (charge === 'grape'){
    res.cas = poisson(hits * W / 6 * gnum('grape', 0.9) * (band <= 1 ? 1 : 0.3) * (rk ? 1.5 : 1));
    res.rig = hits * W * 0.05;
  } else if (a.aim === 'rigging'){
    res.rig = hits * W * gnum('rigging damage', 0.35) * (rk ? 1.5 : 1) * (charge === 'double' ? 1.3 : 1);
    res.cas = poisson(hits * W / 6 * 0.12);
    res.hull = hits * W * 0.2;
  } else {
    const dbl = charge === 'double' ? gnum('double shot', 1.6) : 1;
    res.hull = hits * W * dbl * R;
    res.cas = poisson(hits * W / 6 * gnum('men per hit', 0.4) * dbl * (rk ? R * 0.8 : 1));
    for (let i = 0; i < hits; i++){ if (sr() < 0.05 * (rk ? 2 : 1)) res.dismount++; if (sr() < 0.18) res.below++; }
    res.rig = hits * W * 0.08;
  }
  a.powder = Math.max(0, a.powder - (a.arm.carr ? W / 12 : W / 3) * manned);
  a.loadedWith[side] = a.charge;
  a.reload[side] = reloadTurns(a, a.charge);
  a.broadsides++;
  sb.sinceFire = 0;
  return res;
}
function sbApply(t, res, a){
  const fs = facingSide(t, a);
  t.hull -= res.hull;
  t.holesBelow += res.below;

  else if (cmd === 'away') sbSetCourse(p, bearingTo(e, p), 'auto');
  else if (cmd === 'tack') sbSetCourse(p, sb.wind.dir - Math.sign(sc) * p.closest, 'tack');
  else if (cmd === 'wear') sbSetCourse(p, sb.wind.dir - sc, 'wear');
  else { p.turn = null; p.helm = 'steady'; }
  if (!p.turn) p.helm = 'steady';
}

function sbSvg(){
  const p = sb.player, e = sb.enemy;
  const W = 400, cx = (p.x + e.x) / 2, cy = (p.y + e.y) / 2;
  const ext = Math.min(60, Math.max(10, dist(p, e) * 1.5 + 4)), S = W / ext;
  const X = x => (x - (cx - ext / 2)) * S, Y = y => ((cy + ext / 2) - y) * S;
  const f = v => v.toFixed(1);
  const INK = '#3a2d1f', FAINT = 'rgba(58,45,31,0.22)', RED = '#8f2f22', OWN = '#26303f', PAPER = '#e9dbb4';
  const FONT = `font-family="'IM Fell English',Georgia,serif"`;

    rhumbs += `<line x1="${rx}" y1="${ry}" x2="${f(rx + Math.sin(a) * 700)}" y2="${f(ry - Math.cos(a) * 700)}" stroke="${INK}" stroke-opacity="${o}" stroke-width="${w}"/>`;
  }
  let rose = `<circle cx="${rx}" cy="${ry}" r="${rr}" fill="${PAPER}" stroke="${INK}" stroke-width="0.8"/><circle cx="${rx}" cy="${ry}" r="${rr * 0.84}" fill="none" stroke="${INK}" stroke-width="0.4"/>`;
  for (let i = 0; i < 32; i++){
    const a = i * Math.PI / 16, r1 = rr * (i % 2 ? 0.92 : 0.86);
    rose += `<line x1="${f(rx + Math.sin(a) * r1)}" y1="${f(ry - Math.cos(a) * r1)}" x2="${f(rx + Math.sin(a) * rr)}" y2="${f(ry - Math.cos(a) * rr)}" stroke="${INK}" stroke-width="0.5"/>`;
  }
  for (let i = 0; i < 8; i++){
    const a = i * Math.PI / 4, len = rr * (i % 2 ? 0.62 : 0.98), wd = rr * (i % 2 ? 0.1 : 0.14);
    const tip = [rx + Math.sin(a) * len, ry - Math.cos(a) * len];
    const l = [rx + Math.sin(a - Math.PI / 2) * wd, ry - Math.cos(a - Math.PI / 2) * wd], r = [rx + Math.sin(a + Math.PI / 2) * wd, ry - Math.cos(a + Math.PI / 2) * wd];
    rose += `<path d="M${rx},${ry} L${f(l[0])},${f(l[1])} L${f(tip[0])},${f(tip[1])} Z" fill="${INK}"/><path d="M${rx},${ry} L${f(r[0])},${f(r[1])} L${f(tip[0])},${f(tip[1])} Z" fill="${PAPER}" stroke="${INK}" stroke-width="0.5"/>`;
  }
  rose += `<circle cx="${rx}" cy="${ry}" r="2.2" fill="${INK}"/><text x="${rx}" y="${f(ry - rr - 5)}" text-anchor="middle" font-size="12" fill="${INK}" ${FONT}>N</text>`;
  /* the wind, as a fletched arrow */
  const wx = 338, wy = 78, wl = 26;
  const wind = `<g transform="translate(${wx} ${wy}) rotate(${((sb.wind.dir + 16) * 11.25).toFixed(1)})" stroke="${INK}" fill="none" stroke-width="1.1" stroke-linecap="round">
      <line x1="0" y1="${wl}" x2="0" y2="${-wl}"/><path d="M0,${-wl - 2} L-4.5,${-wl + 8} L4.5,${-wl + 8} Z" fill="${INK}"/>
      <path d="M0,${wl - 2} L-5,${wl + 4} M0,${wl - 7} L-5,${wl - 1} M0,${wl - 12} L-5,${wl - 6} M0,${wl - 2} L5,${wl + 4} M0,${wl - 7} L5,${wl - 1} M0,${wl - 12} L5,${wl - 6}" stroke-width="0.8"/></g>
    <text x="${wx}" y="${wy + wl + 20}" text-anchor="middle" font-size="11" font-style="italic" fill="${INK}" ${FONT}>The Wind</text>`;
  /* firing arcs, hatched when the guns are loaded */
  const R = bands()[2] * S;
  const arc = side => {
    const [r1, r2] = side === 'S' ? [5, 11] : [21, 27];
    const pt = rel => { const a = (p.h + rel) * Math.PI / 16; return `${f(X(p.x) + Math.sin(a) * R)},${f(Y(p.y) - Math.cos(a) * R)}`; };

    return `<path d="M${f(X(p.x))},${f(Y(p.y))} L${pt(r1)} A${f(R)},${f(R)} 0 0 1 ${pt(r2)} Z" fill="${ready ? 'url(#sb-hatch)' : 'none'}" stroke="${OWN}" stroke-opacity="${ready ? 0.5 : 0.35}" stroke-width="0.8" ${ready ? '' : 'stroke-dasharray="3 3"'}/>`;
  };
  const wake = (s, col) => s.track && s.track.length > 1 ? `<polyline points="${s.track.map(q => `${f(X(q[0]))},${f(Y(q[1]))}`).join(' ')}" fill="none" stroke="${col}" stroke-opacity="0.55" stroke-width="1.1" stroke-dasharray="0.1 4" stroke-linecap="round"/>` : '';

  };
  /* the scale of cables */

  for (let i = 0; i < 4; i++) scale += `<rect x="${f(W - 26 - seg * (4 - i))}" y="${W - 34}" width="${f(seg)}" height="4" fill="${i % 2 ? PAPER : INK}" stroke="${INK}" stroke-width="0.6"/>`;
  scale += `<text x="${f(W - 26 - seg * 2)}" y="${W - 40}" text-anchor="middle" font-size="10" font-style="italic" fill="${INK}" ${FONT}>Scale of cables</text>`;
  for (let i = 0; i <= 4; i++) scale += `<text x="${f(W - 26 - seg * (4 - i))}" y="${W - 20}" text-anchor="middle" font-size="9" fill="${INK}" ${FONT}>${String(i * g).replace('.5', '½').replace(/^0½/, '½')}</text>`;

  let border = '';
  for (let x = 12; x < W - 12; x += 16) border += `<rect x="${x}" y="8" width="8" height="3" fill="${INK}"/><rect x="${x}" y="${W - 11}" width="8" height="3" fill="${INK}"/>`;
  for (let y = 12; y < W - 12; y += 16) border += `<rect x="8" y="${y}" width="3" height="8" fill="${INK}"/><rect x="${W - 11}" y="${y}" width="3" height="8" fill="${INK}"/>`;
  const range = dist(p, e), dl = Math.hypot(X(e.x) - X(p.x), Y(e.y) - Y(p.y)) || 1;
  const nx = -(Y(e.y) - Y(p.y)) / dl, ny = (X(e.x) - X(p.x)) / dl, off = dl < 60 ? 22 : 10;
  const mx = (X(p.x) + X(e.x)) / 2 + nx * off, my = (Y(p.y) + Y(e.y)) / 2 + ny * off + 4;
  const enemyCol = e.struck ? INK : RED;
  return `<svg class="chart" viewBox="0 0 ${W} ${W}" role="img" aria-label="Plan of the action: ${esc(cablesWord(range))} between the ships.">
    <defs>
      <filter id="sb-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/><feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0 0.12  0 0 0 0.22 -0.02"/></filter>
      <filter id="sb-mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.12  0 0 0 0.5 -0.18"/></filter>
      <radialGradient id="sb-age" cx="50%" cy="48%" r="72%"><stop offset="55%" stop-color="#7a5528" stop-opacity="0"/><stop offset="100%" stop-color="#7a5528" stop-opacity="0.42"/></radialGradient>
      <radialGradient id="sb-fox"><stop offset="0" stop-color="#8a5a24" stop-opacity="0.35"/><stop offset="1" stop-color="#8a5a24" stop-opacity="0"/></radialGradient>
      <pattern id="sb-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="5" stroke="${OWN}" stroke-opacity="0.45" stroke-width="0.7"/></pattern>
      <clipPath id="sb-clip"><rect x="13" y="13" width="${W - 26}" height="${W - 26}"/></clipPath>
    </defs>

    <circle cx="308" cy="300" r="22" fill="url(#sb-fox)"/><circle cx="92" cy="338" r="13" fill="url(#sb-fox)"/><circle cx="250" cy="44" r="9" fill="url(#sb-fox)"/>
    <rect width="${W}" height="${W}" fill="url(#sb-age)"/>

      <text x="${f(mx)}" y="${f(my)}" text-anchor="middle" font-size="11" font-style="italic" fill="${INK}" ${FONT}>${esc(cablesWord(range))}</text>

      <text y="0" text-anchor="middle" font-size="12.5" fill="${INK}" ${FONT}>Plan of the Action</text>

    case 'sandbox': view = 'sandbox'; sb = null; break;
    case 'sb-title': view = 'game'; sb = null; break;
    case 'sb-setup': sb = null; break;
    case 'sb-pick-action': sbSet.action = v; break;
    case 'sb-pick-arm': sbSet.arm = +v; break;
    case 'sb-pick-drill': sbSet.drill = v; break;
    case 'sb-pick-weather': sbSet.weather = v; break;
    case 'sb-pick-start': sbSet.start = v; break;
    case 'sb-begin': sbSet.seed = ($('#sb-seed') && $('#sb-seed').value) || ''; sbBegin(); break;
    case 'sb-again': sbBegin(); break;
    case 'sb-helm': sbHelm(v); break;
    case 'sb-sail': sb.player.sail = v; break;
    case 'sb-aim': sb.player.aim = v; break;
    case 'sb-charge': sb.player.charge = v; break;
    case 'sb-open': sb.player.openAt = +v; break;
    case 'sb-report':
      if (v === 'opinion') sbOpinion();
      else {
        sbReports(v, true);
        if (v === 'carpenter') sb.player.leak += 1;
        else sb.player.slowTurns = 6;
      }
      break;
    case 'sb-fire':
      sb.fireNow = v;
      if (sb.mode !== 'firing'){ if (!sb.everFired) sbLog('The first gun is fired. From now each turn is half a minute.', true); sb.mode = 'firing'; sb.sinceFire = 0; }
      sbTurn(); break;
    case 'sb-turn': sbTurn(); break;
    case 'sb-five': sbCarryOn(10); break;
    case 'sb-half': sbCarryOn(6); break;
    case 'sb-strike': sb.confirmStrike = true; break;
    case 'sb-strike-no': sb.confirmStrike = false; break;
    case 'sb-strike-yes': sb.confirmStrike = false; sb.over = 'struck'; sbLog('You strike your colours.', true); break;
  }
  if (sb) sb.focus = /^sb-(turn|five|half|fire|again|begin)$/.test(a.dataset.act);
  render();
  if (sb && !sb.focus && /^sb-(helm|sail|aim|charge|open|report|strike)/.test(a.dataset.act)){
    const again = document.querySelector(`[data-act="${a.dataset.act}"][data-v="${CSS.escape(v || '')}"]`) || document.querySelector(`[data-act="${a.dataset.act}"]`);
    if (again) again.focus({ preventScroll: true });
  }
}
/* runs a whole action with a fixed policy, for the automated tests */
function sandboxRun(cfg){
  Object.assign(sbSet, { action: cfg.action, arm: cfg.arm || 0, drill: cfg.drill || 'average', weather: cfg.weather || 'random', start: cfg.start || 'random', seed: cfg.seed });
  sbBegin();
  const p = sb.player;
  p.sail = cfg.sail || 'fighting'; p.openAt = cfg.open == null ? 1 : cfg.open; p.aim = cfg.aim || 'hull';
  let n = 0;
  while (!sb.over && n < 3000){
    n++;
    if (!p.turn && cfg.policy){
      const want = sOf(bearingTo(p, sb.enemy)), cur = sOf(p.h);
      if (Math.abs(want) < p.closest && Math.abs(want) >= 2.5 && Math.sign(want) !== Math.sign(cur) && Math.abs(cur) <= p.closest + 2) sbHelm('tack');
      else sbHelm(cfg.policy);
    }
    if (cfg.sail === 'auto') p.sail = dist(p, sb.enemy) > bands()[Math.max(0, p.openAt)] + 0.5 ? 'crowd' : 'fighting';
    sbTurn();
  }
  return { over: sb.over, minutes: Math.round(sb.t - (sb.firstGun || 0)), pCas: p.crew0 - p.crew, eCas: e2c(sb.enemy), pb: p.broadsides, eb: sb.enemy.broadsides, turns: n, log: sb.log.length };
}
function e2c(e){ return e.crew0 - e.crew; }

/* ============================================================
   INPUT
   ============================================================ */
document.addEventListener('click', e => {
  const gl = e.target.closest('.gl');
  if (gl){ e.preventDefault(); if (tipFor === gl) hideTip(); else showTip(gl); return; }
  if (!e.target.closest('#tip')) hideTip();

  const c = e.target.closest('[data-choice]');
  if (c && !c.disabled){ if (choose(+c.dataset.choice)) render(); return; }

  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'sandbox' || a.dataset.act.startsWith('sb-')){ if (!a.disabled) sandboxAct(a); return; }
  switch (a.dataset.act){
    case 'continue': carryOn(); render(); break;
    case 'begin': newGame($('#cmdr-name').value, $('#seed').value); render(); break;
    case 'resume': { const s = loadAutosave(); if (s) adopt(s); render(); break; }
    case 'replay': { const n = state.name, s = state.seed; closePanelIfOpen(); newGame(n, s); render(); break; }
    case 'title': closePanelIfOpen(); state = null; render(); break;
    case 'log': openPanel('log'); break;
    case 'orders': openPanel('orders'); break;
    case 'accounts': openPanel('accounts'); break;
    case 'chart': openPanel('chart'); break;
    case 'muster': openPanel('muster'); break;
    case 'chartzoom': chartZoom = a.dataset.v; openPanel('chart'); break;
    case 'truth': prefs.showTruth = !prefs.showTruth; savePrefs(); openPanel('writer'); break;
    case 'books': booksTab = a.dataset.tab || booksTab; openPanel('books'); break;
    case 'glossary': openPanel('glossary'); break;
    case 'papers': openPanel('papers'); break;
    case 'writer': openPanel('writer'); break;
    case 'check': openPanel('check'); break;
    case 'close': closePanel(); break;
    case 'export': exportSave(); break;
    case 'copysave': copyFrom('export-text', 'papers-status'); break;
    case 'loadpaste': importText($('#paste-save').value, 'papers-status'); break;
    case 'savelog': saveLog($('#log-status') ? 'log-status' : 'end-status'); break;
    case 'askabandon': $('#abandon').hidden = false; break;
    case 'keep': $('#abandon').hidden = true; break;
    case 'abandon': lsDel(SAVE_KEY); state = null; closePanel(); render(); break;
    case 'smaller': prefs.scale = Math.max(.8, Math.round((prefs.scale - .1) * 10) / 10); applyPrefs(); savePrefs(); openPanel('papers'); break;
    case 'larger': prefs.scale = Math.min(1.5, Math.round((prefs.scale + .1) * 10) / 10); applyPrefs(); savePrefs(); openPanel('papers'); break;
    case 'jump': { const id = $('#jump').value; state.pending = null; state.ended = false; state.tested = true; enterEvent(id); persist(); closePanel(); render(); break; }
  }
});
function closePanelIfOpen(){ if (!$('#panel').hidden) closePanel(); }
function copyFrom(id, statusId){
  const ta = $('#' + id); if (!ta) return;
  const done = () => setStatus(statusId, 'Copied.', true);
  try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); setStatus(statusId, 'Selected: press copy to take it.', true); }); }
  catch(e){ ta.select(); }
}
document.addEventListener('change', e => {
  if (e.target.id === 'import-file' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => importText(String(r.result), 'papers-status');
    r.onerror = () => setStatus('papers-status', 'That file could not be read.', false);
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('mouseover', e => { const gl = e.target.closest && e.target.closest('.gl'); if (gl && matchMedia('(hover: hover)').matches) showTip(gl); });
document.addEventListener('mouseout', e => { const gl = e.target.closest && e.target.closest('.gl'); if (gl && gl === tipFor && !gl.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('gl')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target === tipFor) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!$('#tip').hidden) hideTip(); else if (!$('#panel').hidden) closePanel(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gl')){
    e.preventDefault(); if (tipFor === e.target) hideTip(); else showTip(e.target); return;
  }
  if (!$('#panel').hidden) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)){
    const btns = [...document.querySelectorAll('.choice')];
    const b = btns[+e.key - 1];
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
  } else if ((e.key === 'Enter' || e.key === ' ') && state && state.pending && !e.target.closest('button')){
    e.preventDefault(); carryOn(); render();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  const blocks = [...document.querySelectorAll('script.content')].map(s => ({ name: s.dataset.name || 'Content', text: s.textContent }));
  content = parseContent(blocks);
  buildGloss();
  loadPrefs();
  state = null;   /* always open on the title, offering to continue */
  render();
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(d => { downloadsApi = d; }).catch(() => {});
  }
}

/* test hooks, used to check that replays are deterministic */
window.SloopTest = {
  newGame: (n, s) => { newGame(n, s); render(); },
  choose: i => { const r = choose(i); render(); return r; },
  carryOn: () => { carryOn(); render(); },
  /* the same without redrawing the page, for fast automated playthroughs */
  chooseQuiet: i => choose(i),
  carryOnQuiet: () => carryOn(),
  adopt: s => { adopt(s); render(); },
  open: () => content.events[state.eventId] ? content.events[state.eventId].choices.map((c, i) => condsMet(c.requires) && condsMet(c.needs) ? i : -1).filter(i => i >= 0) : [],
  get state(){ return clone(state); },
  get content(){ return content; },
  real: id => realQty(id),
  speedAt: a => speedAt(a),
  sandboxRun: cfg => sandboxRun(cfg),
  chartSvg: m => chartSvg(m),
  stepWatch: () => { const b = { x: state.nav.tx, y: state.nav.ty }; sailOneWatch(); advance(240); return { tgt: navTarget(), course: state.nav.course, speed: state.lastSpeed, moved: hyp(b, { x: state.nav.tx, y: state.nav.ty }), flags: Object.keys(state.flags) }; },
  landDist: (x, y) => landDist({ x, y }, false),
  get sb(){ return sb; },
  parseMoney, fmtMoney, watchOf: m => watchOf(m)
};

boot();
})();
</script>
