    if (k === 'voyage') return state.voyage ? (content.settings['voyage.' + state.voyage.name] || state.voyage.name) : 'in harbour';
    if (k === 'wind') return windProse();
    if (k === 'sky') return state.weather ? (content.weather[state.weather.sys].sky || '') : '';
    if (k === 'sea') return state.weather ? SEA_WORDS[state.weather.force] : '';
    if (k === 'weather') return state.weather ? content.weather[state.weather.sys].called : '';
    if (k === 'forecast') return state.forecastText || '';
    if (k === 'destination'){ const v = state.voyage; const id = v && (v.cruise ? v.cruise[v.leg || 0] : v.dest); return id && content.places[id] ? content.places[id].name : 'your station'; }
    if (k === 'distance') return leaguesWord(getVar('miles_to_run'));
    if (k === 'reckoning') return reckoningWords();
    if (k === 'soundings') return state.soundingText || '';
    if (k === 'lee_distance') return leaguesWord(state.leeDist || 0);
    if (k === 'circle') return state.nav ? leaguesWord(Math.max(state.nav.ex, state.nav.ey) * 2) : '';
    if (k === 'current'){ if (!state.nav) return 'nowhere'; const c = currentAt({ x: state.nav.rx, y: state.nav.ry }); const pt = Math.round(brgDeg({ x: 0, y: 0 }, c) / 11.25) % 32; return `to the ${pointWords(pt)}`; }
    if (k === 'position') return state.nav ? `${fmtLat(xy2ll(state.nav.rx, state.nav.ry).lat)}, ${fmtLon(xy2ll(state.nav.rx, state.nav.ry).lon)}` : '';
    if ((k in state.vars) || content.stores[k] || /_days$/.test(k)) return String(Math.max(0, Math.floor(getVar(k))));

}

function record(acct, amt, what){
  if (!amt) return;
  state.accounts.push({ t: state.minutes, acct, amt, what: what || 'Sundries' });
}
function applyEffects(list, label){
  for (const e of list){
    switch (e.op){
      case 'flag': if (e.on) state.flags[e.name] = true; else delete state.flags[e.name]; break;
      case 'add': setVar(e.name, getVar(e.name) + e.value); if (MONEY.has(e.name)) record(e.name, e.value, subst(e.label || label)); break;
      case 'setvar': { const d = e.value - getVar(e.name); setVar(e.name, e.value); if (MONEY.has(e.name)) record(e.name, d, subst(e.label || label)); break; }
      case 'pass': advance(e.mins); break;
      case 'until': { const now = minuteOfDay(state.minutes); advance((e.at - now + 1440) % 1440); break; }
      case 'store': if (e.value > 0) receive(e.name, e.value, subst(e.label || label)); else takeOut(e.name, -e.value * content.stores[e.name].size, subst(e.label || label)); break;
      case 'empty': { const st = state.stores[e.name]; takeOut(e.name, realQty(e.name), ''); if (st.book > 0) book(e.name, -st.book, subst(e.label || label)); break; }
      case 'fill': fill(e.name, subst(e.label || label)); break;
      case 'condemn': condemn(); break;
      case 'survey': survey(); break;
      case 'forecast': forecast(); break;
      case 'puttosea': state.flags.at_sea = true; navInit(); state.timers.put_to_sea = state.minutes; break;
      case 'drill': drill(e.what, e.n); break;
      case 'reveal': { const x = officer(e.post); if (x && x.o.traits.includes(e.trait)) x.o.known[e.trait] = true; break; }
      case 'revealflag': state.flags['known_' + e.name] = true; break;
      case 'gunroom': if (state.officers) for (const post of POSTS) if (state.officers[post]) state.officers[post].loyalty = Math.max(-3, Math.min(3, state.officers[post].loyalty + e.n)); break;
      case 'pickman': pickMan(); break;
      case 'gossip': gossip(); break;
      case 'punish': { state.punish = state.punish || {}; state.punish[e.how] = (state.punish[e.how] || 0) + 1; const sev = { flog: 1, start: 0.5, grog: 0.3, pass: 0 }[e.how]; setVar('severity', getVar('severity') + sev); if (e.how === 'pass') setVar('leniency', getVar('leniency') + 1); break; }
      case 'sound': if (state.nav) sound(); break;
      case 'standoff': if (state.nav) state.nav.standoff = 2; break;
      case 'refloat': if (state.nav){ const N = state.nav, n = landDist({ x: N.tx, y: N.ty }, false); let a = brgDeg(n, { x: N.tx, y: N.ty }); if (n.d === 0) a = (state.weather.dir * 11.25) % 360; for (let k = 0; k < 20 && landDist({ x: N.tx, y: N.ty }, false).d <= 0.3; k++){ N.tx += Math.sin(a * Math.PI / 180) * 0.3; N.ty += Math.cos(a * Math.PI / 180) * 0.3; } } delete state.flags.aground; break;
      case 'allowance': if (e.short) state.flags.short_allowance = true; else delete state.flags.short_allowance; break;
      case 'voyage': startVoyage(e.name, e.watches); break;
      case 'roll': if (rand(state.rng) * 100 < e.chance) state.flags[e.name] = true; else delete state.flags[e.name]; break;
      case 'place': state.place = e.name; break;
      case 'start': state.timers[e.name] = state.minutes; break;
      case 'stop': delete state.timers[e.name]; break;
      case 'orders':
        for (const k of Object.keys(state.flags)) if (k.startsWith('orders_')) delete state.flags[k];
        state.orders = e.name; state.ordersAt = state.minutes;
        state.flags.has_orders = true; state.flags['orders_' + e.name] = true;
        break;
      case 'log': state.log.push({ t: state.minutes, text: subst(e.text) }); break;
    }
  }
}

function newGame(name, seed){
  state = {
    game: GAME_ID, v: 7, build: BUILD,
    name: (name || content.settings['default name'] || 'John Hartley').trim(),
    seed: (seed || makeSeed()).trim().toUpperCase(),
    rng: null, minutes: 0, money: parseMoney(content.settings['start money'] || '£20') || 0,
    vars: {}, flags: {}, seen: {}, timers: {}, orders: null, ordersAt: null, place: null, eventId: null,
    log: [], accounts: [], history: [], pending: null, ended: false, tested: false, startedAt: Date.now(),
    stores: null, storeLog: null, storeBad: null, lastBad: null, voyage: null, surveyText: '',
    weather: null, spellSeen: {}, forecastText: '', lastSpeed: 0, dayRun: 0, dayMissed: 0,

function enterEvent(id){
  const ev = content.events[id];
  if (!ev){ state.nowhere = id; state.eventId = '__nowhere__'; return; }
  state.eventId = id;
  state.seen[id] = (state.seen[id] || 0) + 1;
  if (ev.oncePerSpell && state.weather){ state.spellSeen = state.spellSeen || {}; state.spellSeen[id] = state.weather.spell; }
  if (ev.place) state.place = ev.place;
  applyEffects(ev.effects, ev.title ? subst(ev.title).replace(/\*/g, '') : '');
  if (ev.ending) state.ended = true;
}

function hubFor(place){
  return content.order.find(id => content.events[id].hub && content.events[id].place === place) || null;
}
function eligible(ev){
  if (ev.once && state.seen[ev.id]) return false;
  if (ev.oncePerSpell && state.weather && state.spellSeen && state.spellSeen[ev.id] === state.weather.spell) return false;
  if (ev.id === state.eventId) return false;
  return condsMet(ev.requires);
}
function pickFrom(tag, mode){
  let pool = content.order.map(id => content.events[id])
    .filter(ev => ev.tags.includes(tag) && !ev.hub && eligible(ev));
  const urgent = pool.filter(ev => ev.urgent);
  if (mode === 'urgent') pool = urgent;
  else if (mode === 'ordinary') pool = pool.filter(ev => !ev.urgent && ev.watchChance == null);
  else if (urgent.length) pool = urgent;
  const weighted = pool.map(ev => ({ ev, w: Math.max(0, modded(ev.weight, ev.weightMods)) })).filter(x => x.w > 0);
  const total = weighted.reduce((n, x) => n + x.w, 0);
  if (!weighted.length || total <= 0) return null;
  let r = rand(state.rng) * total;
  for (const x of weighted){ r -= x.w; if (r < 0) return x.ev.id; }
  return weighted[weighted.length - 1].ev.id;
}
function resolveNext(next){
  if (!next) return hubFor(state.place) || '__nowhere__';
  if (next.type === 'end') return '__end__';
  if (next.type === 'go') return next.id;
  if (next.type === 'watches') return sailWatches(next.n);
  const id = pickFrom(next.tag);
  if (id && !content.events[id].place && hubFor(next.tag)) state.place = next.tag;
  return id || hubFor(next.tag) || hubFor(state.place) || '__nowhere__';
}
function goTo(id){
  if (id === '__end__'){ state.ended = true; state.eventId = '__end__'; return; }
  if (id === '__nowhere__'){ state.nowhere = state.eventId; state.eventId = '__nowhere__'; return; }
  enterEvent(id);
}

function choiceOpen(ch){ return condsMet(ch.requires) && condsMet(ch.needs); }
function choose(idx){
  const ev = content.events[state.eventId];
  if (!ev || state.pending || state.ended) return false;
  const ch = ev.choices[idx];
  if (!ch || !choiceOpen(ch)) return false;
  state.history.push({ e: ev.id, c: idx });
  const label = subst(ev.title || '').replace(/\*/g, '');
  let branch = null;
  applyEffects(ch.base.effects, label);
  if (ch.chance != null){
    const p = Math.max(0, Math.min(100, modded(ch.chance, ch.chanceMods)));
    branch = (rand(state.rng) * 100 < p) ? ch.success : ch.failure;
    applyEffects(branch.effects, label);
  }
  const text = (branch && branch.text) || ch.base.text;
  const next = (branch && branch.next) || ch.base.next;
  const nextId = resolveNext(next);
  if (text) state.pending = { text: subst(text), next: nextId, choice: ch.text };
  else goTo(nextId);
  persist();
  return true;
}
function carryOn(){
  if (!state.pending) return;
  const id = state.pending.next;
  state.pending = null;
  goTo(id);
  persist();
}

/* ============================================================
   SHIP, STORES AND TIME
   ============================================================ */
function dateToMin(str){ const d = str.split('-').map(Number); return (Date.UTC(d[0], d[1] - 1, d[2]) - startEpoch()) / 60000; }

/* time passes; at every noon at sea the day's allowance is issued */
/* time passes; the weather changes at every change of the watch, and at noon at sea the day's allowance is issued and the day's run entered */
function advance(mins){
  const end = state.minutes + Math.max(0, mins);
  let t = Math.floor(state.minutes / 240) * 240 + 240;
  while (t <= end){
    state.minutes = t;
    if (state.weather) weatherStep();
    if (((t % 1440) + 1440) % 1440 === 360) dawn();
    if (((t % 1440) + 1440) % 1440 === 720 && state.flags.at_sea && state.stores){ dailyIssue(); noonLog(); }
    if (((t % 1440) + 1440) % 1440 === 720) dailyPeople();
    t += 240;
  }
  state.minutes = end;
}

/* ============================================================
   WIND AND WEATHER
   ============================================================ */
function randInt(a, b){ return a + Math.floor(rand(state.rng) * (b - a + 1)); }
function pickWeighted(list){
  const total = list.reduce((n, x) => n + x.w, 0); if (total <= 0) return null;
  let r = rand(state.rng) * total;
  for (const x of list){ r -= x.w; if (r < 0) return x.id; }
  return list[list.length - 1].id;
}
function initWeather(){
  const first = (content.settings['first weather'] || '').toLowerCase();
  state.weather = { spell: 0 };
  enterWeather(content.weather[first] ? first : Object.keys(content.weather)[0]);
}
function enterWeather(id){
  const d = content.weather[id], w = state.weather;
  w.sys = id;
  w.left = Math.max(1, Math.round((d.lasts[0] + rand(state.rng) * (d.lasts[1] - d.lasts[0])) * 6));
  w.off = randInt(0, d.span);
  w.dir = (d.from + w.off) % 32;
  w.force = randInt(d.force[0], d.force[1]);
  w.spell = (w.spell || 0) + 1;
  w.next = pickWeighted(d.follows.filter(f => content.weather[f.id])) || id;
}
function weatherStep(){
  const w = state.weather; if (!w || !content.weather[w.sys]) return;
  w.left--;
  if (w.left <= 0) enterWeather(w.next);
  else {
    const d = content.weather[w.sys];
    if (rand(state.rng) < 0.3) w.off = Math.max(0, Math.min(d.span, w.off + (rand(state.rng) < 0.5 ? -1 : 1)));
    w.dir = (d.from + w.off) % 32;
    if (rand(state.rng) < 0.35) w.force = Math.max(d.force[0], Math.min(d.force[1], w.force + (rand(state.rng) < 0.5 ? -1 : 1)));
  }
  if (w.force < 7) delete state.flags.hove_to;
  if (w.force >= 3) delete state.flags.sweeps;
}
function windProse(){
  const w = state.weather; if (!w) return '';
  return w.force === 0 ? 'a flat calm' : `${FORCE_PROSE[w.force]} from the ${pointWords(w.dir)}`;
}
function forecast(){
  const w = state.weather, cur = content.weather[w.sys], nxt = content.weather[w.next] || cur;
  const right = rand(state.rng) * 100 < 45 + 10 * getVar('master_skill') + (hasTrait('surgeon', 'natural_philosopher') ? 8 : 0);
  const changing = w.left <= 3 && w.next !== w.sys;
  const saysChange = right ? changing : !changing;
  if (!saysChange){ state.forecastText = `He looks for ${cur.called} to hold for the next three watches at the least.`; return; }
  let said = nxt, inWatches = w.left;
  if (!right){
    const others = Object.keys(content.weather).filter(k => k !== w.sys);
    said = content.weather[others[Math.floor(rand(state.rng) * others.length)]] || nxt;
    inWatches = randInt(1, 3);
  }
  const when = watchOf(Math.floor(state.minutes / 240) * 240 + inWatches * 240).name.toLowerCase();
  state.forecastText = `He does not like the look of it: ${said.signs}. He looks for ${said.called} by the ${when}.`;
}
function noonLog(){
  const w = state.weather; if (!w) return;
  const d = content.weather[w.sys];
  let text = w.force === 0 ? 'Calm' : `${FORCE_LOG[w.force]} ${POINTS[w.dir]}`;
  if (d.log) text += `, ${d.log}`;
  text += '.';
  if (state.nav) text += noonSight();
  if (state.flags.hove_to) text += ' Lying to.';
  if (state.dayRun >= 1) text += ` Made ${Math.round(state.dayRun)} miles.`;
  if (state.dayMissed) text += ` Missed stays ${state.dayMissed === 1 ? 'once' : state.dayMissed === 2 ? 'twice' : state.dayMissed + ' times'}.`;
  state.log.push({ t: state.minutes, text });
  state.dayRun = 0; state.dayMissed = 0;
}

/* ---------- sailing: the polar table, beating, missing stays ---------- */
function sailNum(key, dflt){ const v = parseFloat(content.sailing[key]); return isNaN(v) ? dflt : v; }
function sailList(key){ return String(content.sailing[key] || '').split(',').map(x => parseFloat(x)).filter(x => !isNaN(x)); }
function polarSpeed(a){
  const pts = String(content.sailing.speed || '').split(',').map(x => x.trim().match(/^(\d+)\s*points?\s+(\d+(?:\.\d+)?)$/i)).filter(Boolean).map(m => [+m[1], +m[2]]);
  if (!pts.length || a < pts[0][0]) return 0;
  for (let i = 1; i < pts.length; i++){
    if (a <= pts[i][0]){ const [a0, v0] = pts[i - 1], [a1, v1] = pts[i]; return v0 + (v1 - v0) * (a - a0) / (a1 - a0); }
  }
  return pts[pts.length - 1][1];
}
function closest(){ return sailNum('closest', 6); }
function speedAt(a){
  const w = state.weather, f = sailList('wind')[w.force] || 0;
  let v = polarSpeed(a) * f;
  if (state.flags.press_of_sail) v *= sailNum('press of sail', 1.12);
  else if (state.flags.snug) v *= sailNum('snug', 0.85);
  if (a <= closest() + 1 && w.force >= 7) v *= Math.max(0.2, 1 - sailNum('close-hauled in a blow', 12) / 100 * (w.force - 6));
  v *= 0.8 + 0.2 * Math.min(100, getVar('sails')) / 100;
  if (state.flags.fore_sprung || state.flags.main_sprung) v *= 0.85;
  return v;
}
function missChance(){
  const base = sailList('missing stays')[state.weather.force] || 0;
  let p = base * (1.3 - 0.1 * handsSeamanship());
  if (getVar('running_rigging') < 60) p *= 1.3;
  if (state.flags.press_of_sail) p *= 0.85;
  return Math.max(0, Math.min(90, p));
}
function initShip(){
  for (const [k, raw] of Object.entries(content.ship)){
    const v = parseValue(k, raw);
    if (v == null) continue;
    setVar(k, v);
    if (MONEY.has(k) && k !== 'money') record(k, v, 'Balance on taking command');
  }
  state.stores = {}; state.storeLog = {}; state.storeBad = null; state.lastBad = null;
  for (const id of content.storeOrder){
    const d = content.stores[id];
    const st = state.stores[id] = { book: 0, lots: [], receipts: [], nextNo: 1 };
    state.storeLog[id] = [];
    if (d.only && !condsMet(d.only)) continue;
    let total = 0;
    for (const sk of d.stock){
      const recv = sk.date ? dateToMin(sk.date) : state.minutes;
      const first = sk.no || st.nextNo;
      st.lots.push({ units: sk.qty, opened: 0, rem: 0, recv, first });
      st.receipts.push({ t: recv, units: sk.qty, first, from: sk.from });
      st.nextNo = Math.max(st.nextNo, first + Math.ceil(sk.qty));
      total += sk.qty * d.size;
    }
    if (total) book(id, total, 'Remaining on board on taking command');
  }
}

function book(id, d, what){
  const st = state.stores[id];
  st.book = Math.max(0, st.book + d);
  if (Math.abs(d) > 1e-6) state.storeLog[id].push({ t: state.minutes, d, what, bal: st.book });
}
function realQty(id){
  const st = state.stores && state.stores[id]; if (!st) return 0;
  const size = content.stores[id].size;
  return st.lots.reduce((n, l) => n + (l.units - l.opened) * size + l.rem, 0);
}
function receive(id, units, from){
  const st = state.stores[id];
  const first = st.nextNo;
  st.lots.push({ units, opened: 0, rem: 0, recv: state.minutes, first });
  st.receipts.push({ t: state.minutes, units, first, from });
  st.nextNo += Math.ceil(units);
  book(id, units * content.stores[id].size, from || 'Received');
}
/* removes stores without opening casks in the ordinary way (losses, transfers, expenditure) */
function takeOut(id, amt, what){
  const st = state.stores[id], size = content.stores[id].size;
  let left = amt;
  for (const lot of st.lots){
    if (left <= 1e-9) break;
    const a = Math.min(lot.rem, left); lot.rem -= a; left -= a;
    const unopened = (lot.units - lot.opened) * size;
    const b = Math.min(unopened, left); lot.units -= b / size; left -= b;
  }
  st.lots = st.lots.filter(l => l.rem > 1e-9 || l.units - l.opened > 1e-9);
  if (what) book(id, -(amt - left), what);
  return amt - left;
}
function openCask(id, lot){
  const d = content.stores[id];
  const part = Math.min(1, lot.units - lot.opened);
  const no = lot.first + Math.floor(lot.opened + 1e-9);
  lot.opened += part; lot.rem = part * d.size;
  if (part < 0.999) return;
  let note = '';
  if (d.pieces && rand(state.rng) * 100 < d.short){
    const k = 1 + Math.floor(rand(state.rng) * 3);
    const lose = k * d.size / d.pieces;
    lot.rem -= lose;
    book(id, -lose, `Short in ${d.unit[0]} No. ${no}, ${k} ${k === 1 ? 'piece' : 'pieces'}`);
    note = `, short ${k}`;
  }
  if (d.logOpen) state.log.push({ t: state.minutes, text: `Opened a ${d.unit[0]} of ${d.name.toLowerCase()}, No. ${no}${d.pieces ? `, contents ${d.pieces} pieces${note}` : ''}.` });
  if (d.bad && !state.storeBad){
    const age = (state.minutes - lot.recv) / 1440;
    const p = d.bad * (d.keeps && age > d.keeps ? 3 : 1);
    if (rand(state.rng) * 100 < p){ state.storeBad = { id, no }; state.lastBad = { id, no }; state.flags.bad_cask = true; }
  }
}
/* the ordinary issue: draws from the oldest casks first, opening new ones as needed */
function draw(id, amt){
  const st = state.stores[id]; let got = 0;
  for (const lot of st.lots){
    while (amt - got > 1e-9){
      if (lot.rem > 1e-9){ const a = Math.min(lot.rem, amt - got); lot.rem -= a; got += a; continue; }
      if (lot.units - lot.opened > 1e-9){ openCask(id, lot); continue; }
      break;
    }
    if (amt - got <= 1e-9) break;
  }
  st.lots = st.lots.filter(l => l.rem > 1e-9 || l.units - l.opened > 1e-9);
  return got;
}
function dailyNeed(id, perDay){
  const d = content.stores[id];
  if (!d.ration) return 0;
  const frac = perDay ? 1 : (d.ration.days ? d.ration.days.length / 7 : 1);
  return d.ration.amt * getVar('victualled') * (state.flags.short_allowance ? 2 / 3 : 1) * frac;
}
function daysOf(id){
  const st = state.stores && state.stores[id]; if (!st) return 0;
  const need = dailyNeed(id);
  return need > 0 ? st.book / need : 9999;
}
function dailyIssue(){
  const day = clockOf(state.minutes).day, n = getVar('victualled'), shortA = !!state.flags.short_allowance;
  const skimPart = parseFloat(content.settings['purser skim'] || '0') / 100;
  for (const id of content.storeOrder){
    const d = content.stores[id], st = state.stores[id];
    if (!d.ration || !st) continue;
    if (d.ration.days && !d.ration.days.includes(day)) continue;
    if (d.instead && realQty(d.instead) > 1e-6) continue;
    const need = d.ration.amt * n * (shortA ? 2 / 3 : 1);
    if (need <= 0) continue;
    const skim = state.flags.purser_skims && d.officer === 'purser' ? skimPart : 0;
    const want = need * (1 - skim);
    const got = draw(id, want);
    const issued = (skim && got >= want - 1e-6) ? need : got;
    if (issued > st.book + 1e-6 && realQty(id) > 1e-6) book(id, realQty(id) + issued - st.book, 'Found in the hold, not before brought to account');
    if (issued > 1e-6) book(id, -issued, `${day}’s allowance to ${n} men${shortA ? ', at two-thirds' : ''}`);
    if (got < want - 1e-6) state.flags['out_' + id] = true; else delete state.flags['out_' + id];
  }
}
function fill(which, from){
  const ids = which === 'provisions'
    ? content.storeOrder.filter(id => content.stores[id].officer === 'purser' && content.stores[id].ration && !content.stores[id].bought)
    : [which];
  for (const id of ids){
    const d = content.stores[id];
    if (!d.capacity) continue;
    const units = Math.floor(d.capacity - realQty(id) / d.size + 1e-9);
    if (units > 0) receive(id, units, from || 'Received');
  }
}
function condemn(){
  const b = state.storeBad; if (!b) return;
  const st = state.stores[b.id];
  const lot = st.lots.find(l => b.no >= l.first && b.no < l.first + Math.ceil(l.opened - 1e-9) && l.rem > 1e-9 && l.first + Math.ceil(l.opened - 1e-9) - 1 === b.no);
  if (lot){ const lose = lot.rem; lot.rem = 0; book(b.id, -lose, `Condemned by survey, ${content.stores[b.id].unit[0]} No. ${b.no}`); }
  st.lots = st.lots.filter(l => l.rem > 1e-9 || l.units - l.opened > 1e-9);
  state.storeBad = null;
}
function listJoin(a){ return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function survey(){
  const found = [];
  for (const k of ['survey_over', 'survey_short', 'survey_right']) delete state.flags[k];
  for (const id of content.storeOrder){
    const d = content.stores[id], st = state.stores[id];
    if (!st || (d.officer !== 'purser' && d.officer !== 'master')) continue;
    const diff = realQty(id) - st.book;
    if (Math.abs(diff) < d.size * 0.05) continue;
    book(id, diff, diff > 0 ? 'Found over by survey' : 'Found short by survey');
    found.push(`the ${d.name.toLowerCase()} ${diff > 0 ? 'over' : 'short'} by ${fmtAmt(d, Math.abs(diff))}`);
    state.flags[diff > 0 ? 'survey_over' : 'survey_short'] = true;
  }
  if (!found.length) state.flags.survey_right = true;
  state.surveyText = found.length ? `The survey finds ${listJoin(found)}, against the purser’s books.` : 'The survey finds the purser’s books right, to within what a slate and a lantern can tell.';
}
/* ============================================================
   THE CHART AND NAVIGATION
   Positions are sea miles east and north of the chart's south-west
   corner. The ship has a true position, which only the sea knows, and
   a reckoned one, which is the master's. The player sees the second.
   ============================================================ */
function navK(){ return 60 * Math.cos(content.chart.midLat * Math.PI / 180); }
function ll2xy(lat, lon){ const b = content.chart; return { x: (lon - b.lon0) * navK(), y: (lat - b.lat0) * 60 }; }
function xy2ll(x, y){ const b = content.chart; return { lat: b.lat0 + y / 60, lon: b.lon0 + x / navK() }; }
function fmtLat(lat){ const d = Math.floor(Math.abs(lat)), m = Math.round((Math.abs(lat) - d) * 60); return m === 60 ? `${d + 1}°00′ ${lat < 0 ? 'S' : 'N'}` : `${d}°${String(m).padStart(2, '0')}′ ${lat < 0 ? 'S' : 'N'}`; }
function fmtLon(lon){ const d = Math.floor(Math.abs(lon)), m = Math.round((Math.abs(lon) - d) * 60); return m === 60 ? `${d + 1}°00′ ${lon < 0 ? 'W' : 'E'}` : `${d}°${String(m).padStart(2, '0')}′ ${lon < 0 ? 'W' : 'E'}`; }
function brgDeg(a, b){ return ((Math.atan2(b.x - a.x, b.y - a.y) * 180 / Math.PI) + 360) % 360; }
function hyp(a, b){ return Math.hypot(b.x - a.x, b.y - a.y); }
function gauss(){ let u = 0; for (let i = 0; i < 6; i++) u += rand(state.rng); return (u - 3) / Math.sqrt(0.5); }
function leaguesWord(nm){ return nm < 2 ? 'a mile or less' : nm < 6 ? 'a few miles' : `some ${Math.max(2, Math.round(nm / 3))} leagues`; }

/* ---------- geometry against the land ---------- */
function inPoly(p, pts){
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const a = pts[i], b = pts[j];
    if (((a.y > p.y) !== (b.y > p.y)) && (p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x)) c = !c;
  }
  return c;
}
function segDist(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
  let t = l ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  const qx = a.x + t * dx, qy = a.y + t * dy;
  return { d: Math.hypot(p.x - qx, p.y - qy), x: qx, y: qy };
}
/* distance to the nearest land or danger: 0 if aground. chartedOnly: what the master's chart shows */
function landDist(p, chartedOnly){
  let best = { d: Infinity, x: p.x, y: p.y };
  for (const L of content.lands){
    if (p.x < L.minX - best.d || p.x > L.maxX + best.d || p.y < L.minY - best.d || p.y > L.maxY + best.d) continue;
    if (inPoly(p, L.pts)) return { d: 0, x: p.x, y: p.y };
    for (let i = 0, j = L.pts.length - 1; i < L.pts.length; j = i++){
      const s = segDist(p, L.pts[j], L.pts[i]); if (s.d < best.d) best = s;
    }
  }
  for (const D of content.dangers){
    if (chartedOnly && !D.charted) continue;
    const d = Math.hypot(p.x - D.x, p.y - D.y) - D.r;
    if (d <= 0) return { d: 0, x: p.x, y: p.y };
    if (d < best.d) best = { d, x: D.x, y: D.y };
  }
  return best;
}
function rayHit(p, deg, maxD, margin, chartedOnly){
  const sx = Math.sin(deg * Math.PI / 180), sy = Math.cos(deg * Math.PI / 180);
  const d0 = landDist(p, chartedOnly).d, lim = d0 < margin ? Math.max(0.3, d0 - 0.3) : margin;
  for (let s = 1; s <= maxD; s += 1){
    if (landDist({ x: p.x + sx * s, y: p.y + sy * s }, chartedOnly).d < lim) return s;
  }
  return null;
}
function depthAt(p){
  const d = landDist(p, false).d;
  if (d <= 0) return 0;
  const shelf = (content.chart.shelf || []).some(z => p.y >= z.y0 && p.y <= z.y1 && p.x >= z.x0 && p.x <= z.x1);
  return Math.round(Math.min(400, 2 + d * (shelf ? 3 : 14)));
}
function currentAt(p){
  const ll = xy2ll(p.x, p.y);
  for (const c of content.currents){
    const ok = c.cond === 'elsewhere' || (c.cond === 'north' && ll.lat >= c.v) || (c.cond === 'south' && ll.lat < c.v) || (c.cond === 'east' && ll.lon >= c.v) || (c.cond === 'west' && ll.lon < c.v);
    if (ok){ const a = c.toward * Math.PI / 180; return { x: Math.sin(a) * c.knots, y: Math.cos(a) * c.knots }; }
  }
  return { x: 0, y: 0 };
}
function isNight(min){ const h = clockOf(min).h; return h < 6 || h >= 19; }
function seeing(){ const w = state.weather; return w ? (content.weather[w.sys].seeing || 100) / 100 : 1; }

/* ---------- the master's reckoning ---------- */
function navInit(){
  const home = content.places[content.chart.home];
  const p = home ? placeOff(home.id) : { x: 0, y: 0 };
  state.nav = { tx: p.x, ty: p.y, rx: p.x, ry: p.y, ex: 0.5, ey: 0.5, course: 180, track: [[p.x, p.y]], sighted: {}, fix: { t: state.minutes, how: 'the land' }, standoff: 0 };
}
function placeOff(id){ const P = content.places[id]; return P ? (P.off || P.at) : null; }
function navTarget(){
  const v = state.voyage, N = state.nav;
  if (N.standoff > 0) return 'standoff';
  if (!v) return null;
  if (state.flags.run_west || state.flags.run_east){
    const d = v.cruise ? placeOff(v.cruise[v.leg || 0]) : placeOff(v.dest);
    return { x: N.rx + (state.flags.run_west ? -80 : 80), y: d ? d.y : N.ry, lat: true };
  }
  if (v.name === 'station' && v.cruise) return placeOff(v.cruise[v.leg || 0]);
  if (v.dest) return placeOff(v.dest);
  return null;
}
function fixAt(err, how){
  const N = state.nav;
  N.rx = N.tx + gauss() * err; N.ry = N.ty + gauss() * err;
  N.ex = N.ey = Math.max(0.8, err * 2);
  N.fix = { t: state.minutes, how };
  delete state.flags.lying_off; delete state.flags.nothing_in_sight;
  if (how !== 'the lead'){ delete state.flags.run_west; delete state.flags.run_east; }
}
function drift(nm){
  const N = state.nav, w = state.weather, a = (w.dir * 11.25 + 180) * Math.PI / 180;
  N.tx += Math.sin(a) * nm; N.ty += Math.cos(a) * nm;
  N.rx += Math.sin(a) * nm * 0.7; N.ry += Math.cos(a) * nm * 0.7;
  N.ex += nm * 0.4; N.ey += nm * 0.4;
  const c = currentAt({ x: N.tx, y: N.ty }); N.tx += c.x * 4; N.ty += c.y * 4; N.rx += c.x * 4 * 0.65; N.ry += c.y * 4 * 0.65;
  N.ex += 0.6; N.ey += 0.6;
  checkGround();
}
function checkGround(){
  const N = state.nav;
  if (landDist({ x: N.tx, y: N.ty }, false).d <= 0){
    state.flags.aground = true; delete state.flags.anchored; delete state.flags.hove_to; delete state.flags.lying_off;
    setVar('hull', getVar('hull') - 10); setVar('leak', getVar('leak') + 6);
    return true;
  }
  return false;
}
/* the master steers clear of the land as his chart and his reckoning show it */
function clearCourse(from, deg, dist){
  const N = state.nav;
  const margin = state.flags.good_offing ? Math.min(10, 4 + Math.max(N.ex, N.ey) * 0.5) : 2.5;
  const look = Math.max(2, Math.min(24, dist - 3));
  for (const k of [0, 10, -10, 20, -20, 30, -30, 45, -45, 60, -60, 80, -80, 100, -100]){
    const d = (deg + k + 360) % 360;
    if (!rayHit(from, d, look, margin, true)) return d;
  }
  return deg;
}
function sightings(){
  const N = state.nav, night = isNight(state.minutes), see = seeing(), t = { x: N.tx, y: N.ty };
  let any = false;
  for (const P of Object.values(content.places)){
    if (!P.visible && !P.light) continue;
    const V = night ? (P.light || P.visible * 0.15) : P.visible * see;
    const d = hyp(t, P.at);
    if (d <= V){
      any = true;
      if (!N.sighted[P.id]){
        N.sighted[P.id] = true;
        const b = brgDeg(t, P.at), out = hyp(t, { x: N.rx, y: N.ry });
        state.log.push({ t: state.minutes, text: `${P.name} in sight${night && P.light ? ' (the light)' : ''}, bearing ${POINTS[Math.round(b / 11.25) % 32]}, distant ${leaguesWord(d)}.${out >= 3 ? ` By it the reckoning is found out by ${leaguesWord(out)}.` : ''}` });
        if (out >= Math.max(N.ex, N.ey) * 1.2 && out >= 5) state.flags.reckoning_out = true;
        state.flags.landfall = true;
      }
      fixAt(0.5 + d * 0.04, P.name);
    } else if (d > V * 1.2) delete N.sighted[P.id];
  }
  const near = landDist(t, false).d;
  if (any || near <= (night ? 1 : 10 * see)) state.flags.land_in_sight = true; else delete state.flags.land_in_sight;
}
function noonSight(){
  const N = state.nav; if (!N || !state.flags.at_sea) return '';
  const w = state.weather, chance = w ? (content.weather[w.sys].sight == null ? 80 : content.weather[w.sys].sight) : 0;
  if (rand(state.rng) * 100 >= chance) return ' No observation.';
  const err = (0.6 + Math.max(0, 5 - getVar('master_skill')) * 0.4) * (hasTrait('master', 'mathematical') ? 0.6 : 1);
  N.ry = N.ty + gauss() * err; N.ey = Math.max(0.8, err * 2);
  N.fix = { t: state.minutes, how: 'a meridian altitude of the sun' };
  delete state.flags.nothing_in_sight; if (state.flags.lying_off && !isNight(state.minutes)) delete state.flags.lying_off;
  return ` Observed latitude ${fmtLat(xy2ll(N.rx, N.ry).lat)}.`;
}
function leeShore(){
  const N = state.nav, w = state.weather;
  delete state.flags.lee_shore;
  if (!w || w.force < 7) return;
  const d = rayHit({ x: N.tx, y: N.ty }, (w.dir * 11.25 + 180) % 360, 15, 0.5, false);
  if (d != null){ state.flags.lee_shore = true; state.leeDist = d; }
}
function sound(){
  const N = state.nav, t = { x: N.tx, y: N.ty }, d = depthAt(t);
  const bottoms = content.chart.bottoms || ['sand'];
  const bottom = bottoms[Math.floor(rand(state.rng) * bottoms.length)];
  if (d > 110){ state.soundingText = 'The deep-sea lead goes down with a hundred and twenty fathoms of line, and finds no bottom.'; state.flags.no_bottom = true; return; }
  delete state.flags.no_bottom;
  state.soundingText = d <= 20 ? `The leadsman sings out: ${d <= 10 ? `by the mark ${numWord(d)}` : `${numWord(Math.min(d, 20))} fathoms`}, ${bottom}.` : `The deep-sea lead finds bottom in ${d} fathoms, ${bottom}.`;
  N.rx += (N.tx - N.rx) * 0.3; N.ry += (N.ty - N.ry) * 0.3; N.ex *= 0.75; N.ey *= 0.75;
  if (d <= 12) state.flags.shoal_water = true; else delete state.flags.shoal_water;
}
function arrive(v){
  if (v.name === 'station' && v.cruise){ v.leg = (v.leg || 0) ? 0 : 1; return; }
  if (v.name === 'homeward' && isNight(state.minutes)){ state.flags.off_port_night = true; return; }
  state.flags[v.name + '_done'] = true; state.voyage = null;
}
/* one watch's sailing */
function sailOneWatch(){
  const w = state.weather;
  delete state.flags.beating; delete state.flags.lying_course; delete state.flags.closing_land;
  state.lastSpeed = 0;
  if (!w) return;
  if (!state.nav) navInit();
  const N = state.nav, v = state.voyage;
  if (state.flags.aground) return;
  if (state.flags.anchored){
    if (w.force >= 8 && state.flags.lee_shore && rand(state.rng) < 0.25){ delete state.flags.anchored; state.log.push({ t: state.minutes, text: 'The anchors came home; she is driving.' }); drift(2); }
    return finishWatch(0);
  }
  if (state.flags.hove_to || state.flags.lying_off){ drift(state.flags.hove_to ? (w.force >= 8 ? 2.5 : 1.5) : 0.6); return finishWatch(0); }
  let tgt = navTarget();
  if (!tgt) return finishWatch(0);
  const R = { x: N.rx, y: N.ry };
  let deg;
  if (tgt === 'standoff'){ const n = landDist({ x: N.tx, y: N.ty }, false); deg = brgDeg(n, { x: N.tx, y: N.ty }); N.standoff--; }
  else {
    const dist = hyp(R, tgt);
    if (dist < 2 && !tgt.lat && v){
      if (v.cruise){ v.leg = (v.leg || 0) ? 0 : 1; return sailOneWatch(); }
      if (isNight(state.minutes)){ state.flags.lying_off = true; state.log.push({ t: state.minutes, text: 'By the reckoning up with the land; lay off and on till daylight.' }); }
      else state.flags.nothing_in_sight = true;
      return finishWatch(0);
    }
    deg = clearCourse(R, brgDeg(R, tgt), dist);
  }
  N.course = deg;
  /* closing the land in the dark: ask before going on */
  if (isNight(state.minutes) && !state.flags.standing_on && tgt !== 'standoff'){
    const doubt = Math.max(N.ex, N.ey) + 4, here = landDist(R, true).d;
    const next = landDist({ x: R.x + Math.sin(deg * Math.PI / 180) * 4, y: R.y + Math.cos(deg * Math.PI / 180) * 4 }, true).d;
    if (here < doubt && next < here){ state.flags.closing_land = true; return finishWatch(0); }
  }
  /* speed, from the polar table, as before */
  const pts = deg / 11.25;
  let speed, made;
  if (w.force <= 1 && state.flags.sweeps){ speed = sailNum('sweeps', 1.5); made = speed * 4; }
  else {
    const a = pointsApart(pts, w.dir);
    if (a >= closest()){ state.flags.lying_course = true; speed = speedAt(a); made = speed * 4; }
    else {
      state.flags.beating = true;
      speed = speedAt(closest());
      made = speed * Math.cos((closest() - a) * Math.PI / 16) * 4;
      if (state.flags.wear_ship) made *= 0.85;
      else if (rand(state.rng) * 100 < missChance()){
        made *= 0.55; state.dayMissed = (state.dayMissed || 0) + 1;
        if (w.force >= 6) state.flags.missed_stays = true;
      }
    }
  }
  if (v && v.cap){ speed = Math.min(speed, v.cap); made = Math.min(made, v.cap * 4); }
  if (state.flags.lead_going){ speed *= 0.6; made *= 0.6; }
  state.lastSpeed = speed;
  /* eight half-hours, watching for the land */
  const sx = Math.sin(deg * Math.PI / 180), sy = Math.cos(deg * Math.PI / 180);
  const down = (w.dir * 11.25 + 180) * Math.PI / 180;
  const leeway = state.flags.beating ? (w.force >= 8 ? 0.15 : w.force >= 6 ? 0.08 : 0.05) : 0.02;
  const night = isNight(state.minutes), see = seeing();
  let run = 0;
  for (let i = 0; i < 8; i++){
    const step = made / 8, cur = currentAt({ x: N.tx, y: N.ty });
    const before = landDist({ x: N.tx, y: N.ty }, false).d;
    N.tx += sx * step + Math.sin(down) * step * leeway + cur.x * 0.5 + gauss() * step * 0.04;
    N.ty += sy * step + Math.cos(down) * step * leeway + cur.y * 0.5 + gauss() * step * 0.04;
    N.rx += sx * step + Math.sin(down) * step * leeway * 0.6 + cur.x * 0.5 * 0.65;
    N.ry += sy * step + Math.cos(down) * step * leeway * 0.6 + cur.y * 0.5 * 0.65;
    run += step;
    if (checkGround()){ state.log.push({ t: state.minutes, text: 'The ship took the ground.' }); break; }
    const now = landDist({ x: N.tx, y: N.ty }, false).d;
    const warn = state.flags.lead_going ? 1.5 : (!night && see >= 0.5) ? 1 : night ? (rand(state.rng) < 0.35 ? 0.7 : 0) : 0.8;
    if (now < warn && now < before){ state.flags.breakers = true; break; }
    const t2 = navTarget();
    if (t2 && t2 !== 'standoff' && v && hyp({ x: N.tx, y: N.ty }, t2) < (content.chart.arrive || 6)){ arrive(v); break; }
  }
  /* a drunk master keeps the reckoning carelessly: one steady mistake for the day (the log misread, the leeway forgotten), and slips besides */
  if (isDrunk('master') && !state.flags.master_relieved && !state.flags.master_arrested){
    if (N.slip == null) N.slip = rand(state.rng) * Math.PI * 2;
    N.rx += Math.sin(N.slip) * run * 0.12 + gauss() * run * 0.05; N.ry += Math.cos(N.slip) * run * 0.12 + gauss() * run * 0.05;
  } else delete N.slip;
  N.ex += 0.4 + run * 0.06 * (1.3 - 0.1 * getVar('master_skill'));
  N.ey += 0.4 + run * 0.06 * (1.3 - 0.1 * getVar('master_skill'));
  state.dayRun = (state.dayRun || 0) + run;
  finishWatch(run);
}
function finishWatch(){
  const N = state.nav;
  if (!N) return;
  /* run off the chart, and she raises land that is not on it, and takes a fresh departure */
  const C = content.chart, spanX = (C.lon1 - C.lon0) * navK(), spanY = (C.lat1 - C.lat0) * 60;
  const out = N.tx > spanX + 8 ? 'the coast of Sardinia, to the eastward' : N.ty < -8 ? 'the coast of Barbary, to the southward' : N.tx < -8 ? 'the coast of Spain, to the westward' : null;
  if (out){
    state.log.push({ t: state.minutes, text: `Raised the land, which the master makes out to be ${out}; took a fresh departure from it.` });
    N.tx = Math.max(-2, Math.min(spanX + 2, N.tx)); N.ty = Math.max(-2, N.ty);
    fixAt(3, out.replace(/,.*$/, ''));
  }
  N.track.push([N.rx, N.ry]); if (N.track.length > 400) N.track.shift();
  sightings();
  leeShore();
  if (N.ex > 40) N.ex = 40; if (N.ey > 40) N.ey = 40;
}
function startVoyage(name, watches){
  const o = (state.orders && content.orders[state.orders]) || {};
  delete state.flags[name + '_done']; delete state.flags.nothing_in_sight; delete state.flags.off_port_night;
  if (!state.nav) navInit();
  if (name === 'outward' && o.goTo){ state.voyage = { name, dest: o.goTo, cap: o.cap || 0 }; return; }
  if (name === 'homeward'){ state.voyage = { name, dest: content.chart.home }; return; }
  const w = watches != null ? watches : (o[name] != null ? o[name] : 0);
  if (w <= 0){ state.voyage = null; state.flags[name + '_done'] = true; return; }
  state.voyage = { name, left: Math.round(w), cruise: name === 'station' ? (o.cruise || null) : null, leg: 0 };
}
/* sail watch by watch; stop when something happens */
function sailWatches(n){
  const chance = parseFloat(content.settings['sea event chance'] || '0');
  for (let i = 0; i < n; i++){
    sailOneWatch();
    advance(240);
    if (state.voyage && state.voyage.left != null){
      state.voyage.left--;
      if (state.voyage.left <= 0){ state.flags[state.voyage.name + '_done'] = true; state.voyage = null; }
    }
    const urgent = pickFrom('sea', 'urgent'); if (urgent) return urgent;
    for (const id of content.order){
      const ev = content.events[id];
      if (ev.watchChance == null || !ev.tags.includes('sea') || ev.hub || !eligible(ev)) continue;
      if (rand(state.rng) * 100 < modded(ev.watchChance, ev.watchMods)) return id;
    }
    if (rand(state.rng) * 100 < chance){ const ev = pickFrom('sea', 'ordinary'); if (ev) return ev; }
  }
  return hubFor('sea') || hubFor(state.place) || '__nowhere__';
}
/* at the change of the watch: daylight clears the night's precautions */
function dawn(){
  for (const k of ['lying_off', 'standing_on', 'lead_going', 'nothing_in_sight']) delete state.flags[k];
  if (state.flags.anchored && !state.flags.lee_shore){ delete state.flags.anchored; state.log.push({ t: state.minutes, text: 'Weighed at daylight.' }); }
}

/* ============================================================
   THE PEOPLE AND THE OFFICERS
   Each post is filled at the start of a commission from the
   candidates written for it. Officers' qualities run from 1 to 5,
   and are never shown as numbers: the captain forms impressions.
   ============================================================ */
const POSTS = ['lieutenant', 'master', 'surgeon', 'purser', 'boatswain', 'gunner', 'carpenter'];
const QUALITIES = ['seamanship', 'gunnery', 'leadership', 'sobriety', 'skill'];
function initCrew(){
  state.officers = {};
  for (const post of POSTS){
    const pool = content.officerOrder.filter(id => content.officers[id].post === post);
    if (!pool.length) continue;
    const id = pool[Math.floor(rand(state.rng) * pool.length)], d = content.officers[id];
    const traits = d.traits.filter(t => rand(state.rng) * 100 < t.chance).map(t => t.id);
    const o = state.officers[post] = { id, traits, loyalty: d.loyalty, known: {}, drunk: false };
    for (const t of traits){
      const T = content.traits[t]; if (!T) continue;
      if (!T.hidden) o.known[t] = true;
      if (T.sets) state.flags[T.sets] = true;
    }
  }
  for (const F of Object.values(content.crewFlags)) if (rand(state.rng) * 100 < F.chance) state.flags[F.id] = true;
  state.punish = { flog: 0, start: 0, grog: 0, pass: 0 };
  for (const [k, v] of Object.entries({ health: 4, sick: 2, gunnery: 2, morale: 0, leniency: 0, severity: 0, scurvy_days: 0 })) if (!(k in state.vars)) state.vars[k] = v;
}
function officer(post){ const o = state.officers && state.officers[post]; return o && content.officers[o.id] ? { o, d: content.officers[o.id] } : null; }
function offAttr(post, attr){
  const x = officer(post); if (!x) return 3;
  if (attr === 'loyalty') return x.o.loyalty;
  let v = x.d[attr] != null ? x.d[attr] : (attr === 'skill' ? (x.d.seamanship || 3) : 3);
  for (const t of x.o.traits){ const T = content.traits[t]; if (T && T.mods[attr]) v += T.mods[attr]; }
  return Math.max(1, Math.min(5, v));
}
function hasTrait(post, t){ const x = officer(post); return !!x && x.o.traits.includes(t); }
function offName(post){ const x = officer(post); return x ? x.d.name : `the ${post}`; }
function isDrunk(post){ const x = officer(post); return !!x && x.o.drunk; }
function masterSkill(){
  if (!state.officers) return state.vars.master_skill || 3;
  if (state.flags.master_relieved || state.flags.master_arrested) return Math.max(1, offAttr('lieutenant', 'seamanship') - 1);
  return Math.max(1, offAttr('master', 'seamanship') - (isDrunk('master') ? 2 : 0));
}
function handsSeamanship(){
  return getVar('seamanship') + 0.4 * (offAttr('boatswain', 'seamanship') - 3) + 0.4 * (offAttr('lieutenant', 'seamanship') - 3)
    - (getVar('sick') > getVar('victualled') * 0.12 ? 0.5 : 0);
}
function pickMan(){
  const men = content.crew.men || ['John Smith'];
  state.man = men[Math.floor(rand(state.rng) * men.length)];
  return state.man;
}
function drill(what, n){
  const g = getVar(what);
  const teacher = what === 'gunnery' ? 0.6 + 0.2 * offAttr('gunner', 'gunnery') * (hasTrait('gunner', 'gun_crank') ? 1.4 : 1)
                                     : 0.6 + 0.2 * offAttr('boatswain', 'seamanship') * (hasTrait('boatswain', 'hard_horse') ? 1.3 : 1);
  setVar(what, Math.min(5, g + n * 0.12 * teacher * Math.max(0.15, (5 - g) / 3)));
}
function gossip(){
  const cands = [];
  for (const post of POSTS){
    const x = officer(post); if (!x) continue;
    for (const t of x.o.traits){ const T = content.traits[t]; if (T && T.hidden && !x.o.known[t] && T.gossip) cands.push({ text: T.gossip.replace(/\{name\}/g, x.d.name), reveal: () => { x.o.known[t] = true; } }); }
  }
  for (const F of Object.values(content.crewFlags)){
    if (state.flags[F.id] && !state.flags['known_' + F.id] && F.gossip) cands.push({ text: F.gossip, reveal: () => { state.flags['known_' + F.id] = true; } });
  }
  if (!cands.length){ state.gossipText = content.crew.idle || 'The talk is all of prize money.'; return; }
  const c = cands[Math.floor(rand(state.rng) * cands.length)];
  pickMan(); c.reveal();
  state.gossipText = subst(c.text);
}
/* once a day, at noon: drink, sickness, the scurvy, deaths, the people's temper, and the warrant officers' work */
function dailyPeople(){
  if (!state.officers) return;
  const atSea = !!state.flags.at_sea, n = getVar('victualled'), r = () => rand(state.rng);
  for (const post of POSTS){
    const x = officer(post); if (!x) continue;
    const p = [45, 22, 9, 3, 0][offAttr(post, 'sobriety') - 1] * (atSea ? 1 : 1.5);
    x.o.drunk = r() * 100 < p;
    if (x.o.drunk) state.flags[post + '_drunk'] = true; else delete state.flags[post + '_drunk'];
  }
  delete state.flags.master_relieved;
  /* the scurvy clock: lemon juice or fresh food stops it */
  const lemons = atSea && realQty('lemon_juice') > 0;
  const fresh = state.timers.fresh_food != null && state.minutes - state.timers.fresh_food < 10 * 1440;
  let sd = getVar('scurvy_days');
  sd = (lemons || fresh || !atSea) ? Math.max(0, sd - (atSea ? 1 : 4)) : sd + 1;
  setVar('scurvy_days', sd);
  let sick = getVar('sick'), health = getVar('health'), mor = getVar('morale');
  const after = parseFloat(content.crew.scurvy) || 35;
  if (sd > after){ state.flags.scurvy = true; sick += Math.floor(r() * 3); health -= 0.08; }
  else if (sd < after * 0.6) delete state.flags.scurvy;
  if (atSea && state.weather && state.weather.force >= 8 && r() < 0.4) sick += 1;
  if (state.flags.out_water){ health -= 0.3; sick += 1; }
  if (state.flags.issued_bad){ sick += Math.floor(r() * 3); delete state.flags.issued_bad; }
  if (r() < 0.06) sick += 1;
  /* the surgeon's work */
  let cure = 0.3 + 0.3 * offAttr('surgeon', 'skill');
  if (isDrunk('surgeon')) cure *= 0.4;
  if (state.flags.scurvy && !lemons && !fresh) cure *= 0.3;
  if (hasTrait('surgeon', 'sawbones')) cure *= 0.8;
  sick -= Math.min(sick, Math.floor(cure + r()));
  sick = Math.max(0, Math.min(n, sick));
  health += sick <= n * 0.05 ? 0.05 : -0.25 * sick / Math.max(1, n) * 4;
  health = Math.max(1, Math.min(5, health));
  if (sick > 0 && health < 2.2 && r() < (2.4 - health) * 0.12){
    sick--; setVar('victualled', n - 1);
    state.dead = pickMan(); state.flags.death = true;
    state.log.push({ t: state.minutes, text: `Departed this life, ${state.dead}, seaman.` });
  }
  /* the people's temper */
  if (state.flags.short_allowance) mor -= 0.08;
  if (state.flags.scurvy) mor -= 0.05;
  if (atSea && state.timers.put_to_sea != null && state.minutes - state.timers.put_to_sea > 28 * 1440) mor -= 0.04;
  mor -= Math.max(0, getVar('severity') - 3) * 0.015;
  if (hasTrait('boatswain', 'hard_horse')) mor -= 0.02;
  if (fresh) mor += 0.03;
  mor = Math.max(-4, Math.min(5, mor));
  /* time at sea makes seamen */
  if (atSea) setVar('seamanship', Math.min(4.5, getVar('seamanship') + 0.02 * (0.5 + 0.25 * offAttr('boatswain', 'seamanship'))));
  /* the boatswain and the carpenter at their trades */
  if (atSea){
    const b = offAttr('boatswain', 'skill') * (isDrunk('boatswain') ? 0.5 : 1);
    let used = false;
    for (const k of ['standing_rigging', 'running_rigging']) if (getVar(k) < 92 && realQty('cordage') > 0.5){ setVar(k, Math.min(92, getVar(k) + 0.35 * b)); used = true; }
    if (getVar('sails') < 85 && realQty('canvas') > 0.5){ setVar('sails', Math.min(85, getVar('sails') + 0.3 * b)); used = true; }
    if (used && r() < 0.12) takeOut(r() < 0.5 ? 'cordage' : 'canvas', 1, 'Expended by the boatswain in repairs');
    const c = offAttr('carpenter', 'skill') * (isDrunk('carpenter') ? 0.5 : 1);
    if (getVar('leak') > 2 && r() < 0.04 * c) setVar('leak', getVar('leak') - 1);
    if (getVar('hull') < 85 && realQty('oakum') > 0) setVar('hull', Math.min(85, getVar('hull') + 0.1 * c));
  }
  setVar('sick', sick); setVar('health', health); setVar('morale', mor);
}
function gaugeWord(id, v){
  const G = content.gauges[id]; if (!G) return String(v);
  let w = G.words[0] ? G.words[0][1] : '';
  for (const [t, word] of G.words) if (v >= t) w = word;
  return w;
}
const IMPRESSIONS = {
  seamanship: ['no seaman', 'an indifferent seaman', 'a fair seaman', 'a good seaman', 'a prime seaman'],
  gunnery: ['knows nothing of guns', 'knows little of guns', 'knows his guns', 'knows his guns thoroughly', 'a master of his guns'],
  leadership: ['the men laugh at him behind his back', 'the men do not mind him', 'the men do as he says', 'the men follow him', 'the men would follow him anywhere'],
  skill: ['clumsy at his trade', 'indifferent at his trade', 'competent at his trade', 'skilful at his trade', 'uncommonly able at his trade']
};
const SHOWN = { lieutenant: ['seamanship', 'leadership'], master: ['seamanship'], surgeon: ['skill'], purser: [], boatswain: ['seamanship', 'leadership'], gunner: ['gunnery'], carpenter: ['skill'] };

function musterHtml(){
  if (!state || !state.officers) return '<p class="note">No commission is in hand.</p>';
  const v = k => getVar(k), n = v('victualled'), sick = Math.round(v('sick'));
  const flags = Object.values(content.crewFlags).filter(F => state.flags[F.id] && state.flags['known_' + F.id] && F.known).map(F => `<p>${inline(F.known)}</p>`).join('');
  const people = `<dl class="kv"><dt>Numbers</dt><dd>${n} victualled, of a complement of ${v('complement')}${sick ? `; ${numWord(sick)} on the sick list` : ''}</dd>
    <dt>Seamanship</dt><dd>${esc(gaugeWord('seamanship', v('seamanship')))}</dd><dt>Gunnery</dt><dd>${esc(gaugeWord('gunnery', v('gunnery')))}</dd>
    <dt>Temper</dt><dd>${esc(gaugeWord('morale', v('morale')))}</dd><dt>Health</dt><dd>${esc(gaugeWord('health', v('health')))}${state.flags.scurvy ? ', with the scurvy among them' : ''}</dd></dl>${flags}`;
  const cards = POSTS.map(post => {

      <p class="about">${inline(x.d.about || '')}</p>
      ${imp.length ? `<p>${esc(capFirst(imp.join('; ')))}.${drink}</p>` : (drink ? `<p>${drink.trim()}</p>` : '')}
      ${known.length ? `<p class="traits">${known.join(' ')}</p>` : ''}
      <p class="note">His manner to you: ${esc(mannerWord(x.o.loyalty))}.</p></div>`;
  }).join('');
  const P = state.punish || {};
  const total = (P.flog || 0) + (P.start || 0) + (P.grog || 0);
  const rep = v('severity') > 6 ? 'a hard ship' : v('severity') > 3 ? 'a taut ship' : v('leniency') > v('severity') + 3 ? 'a slack ship' : 'a fair ship';
  return `<h3>The people</h3>${people}<h3>The officers</h3><div class="officers">${cards}</div>
    <h3>Discipline</h3><p>${total ? `${numWord(P.flog || 0)} ${P.flog === 1 ? 'man flogged' : 'men flogged'}, ${numWord(P.start || 0)} started, ${numWord(P.grog || 0)} with their grog stopped; ${numWord(P.pass || 0)} let off.` : 'No man has yet been punished this commission.'} The forecastle calls her ${esc(rep)}.</p>`;
}

  const inView = p => p.x >= V.x0 - 2 && p.x <= V.x0 + V.w + 2 && p.y >= V.y0 - 2 && p.y <= V.y0 + V.h + 2;
  let stat;
  if (V.full && chartStaticCache) stat = chartStaticCache;
  else {
    /* graticule */
    let grat = '';
    const step = V.full ? 1 : 1 / 3;
    const ll0 = xy2ll(V.x0, V.y0), ll1 = xy2ll(V.x0 + V.w, V.y0 + V.h);
    for (let lat = Math.ceil(ll0.lat / step) * step; lat <= ll1.lat; lat += step){ const y = Y(ll2xy(lat, 0).y); grat += `<line x1="${M}" y1="${f(y)}" x2="${W - M}" y2="${f(y)}"/>`; }
    for (let lon = Math.ceil(ll0.lon / step) * step; lon <= ll1.lon; lon += step){ const x = X(ll2xy(0, lon).x); grat += `<line x1="${f(x)}" y1="${M}" x2="${f(x)}" y2="${H - M}"/>`; }
    /* rhumb lines from the rose */
    let rhumbs = '', rose = '';
    const R = C.rose ? ll2xy(C.rose[0], C.rose[1]) : null;
    if (R && inView(R)){
      const rx = X(R.x), ry = Y(R.y), rr = V.full ? 34 : 30;
      for (let i = 0; i < 32; i++){
        const a = i * Math.PI / 16, o = i % 4 === 0 ? 0.36 : 0.2, w = i % 8 === 0 ? 0.7 : 0.4;
        rhumbs += `<line x1="${f(rx)}" y1="${f(ry)}" x2="${f(rx + Math.sin(a) * 900)}" y2="${f(ry - Math.cos(a) * 900)}" stroke-opacity="${o}" stroke-width="${w}"/>`;
      }
      rose = `<circle cx="${f(rx)}" cy="${f(ry)}" r="${rr}" fill="${CH.PAPER}" stroke="${CH.INK}" stroke-width="0.8"/><circle cx="${f(rx)}" cy="${f(ry)}" r="${rr * 0.84}" fill="none" stroke="${CH.INK}" stroke-width="0.4"/>`;
      for (let i = 0; i < 8; i++){
        const a = i * Math.PI / 4, len = rr * (i % 2 ? 0.62 : 0.98), wd = rr * (i % 2 ? 0.1 : 0.14);
        const tip = [rx + Math.sin(a) * len, ry - Math.cos(a) * len];
        const l = [rx + Math.sin(a - Math.PI / 2) * wd, ry - Math.cos(a - Math.PI / 2) * wd], r = [rx + Math.sin(a + Math.PI / 2) * wd, ry - Math.cos(a + Math.PI / 2) * wd];
        rose += `<path d="M${f(rx)},${f(ry)} L${f(l[0])},${f(l[1])} L${f(tip[0])},${f(tip[1])} Z" fill="${CH.INK}"/><path d="M${f(rx)},${f(ry)} L${f(r[0])},${f(r[1])} L${f(tip[0])},${f(tip[1])} Z" fill="${CH.PAPER}" stroke="${CH.INK}" stroke-width="0.5"/>`;
      }
      rose += `<circle cx="${f(rx)}" cy="${f(ry)}" r="2" fill="${CH.INK}"/><text x="${f(rx)}" y="${f(ry - rr - 5)}" text-anchor="middle" font-size="12" fill="${CH.INK}" ${CH.FONT}>N</text>`;
    }
    /* soundings, as the surveyors left them */
    let snd = '';
    const sp = V.full ? 13 : 5.5;
    for (let gx = Math.floor(V.x0 / sp) * sp; gx < V.x0 + V.w; gx += sp){
      for (let gy = Math.floor(V.y0 / sp) * sp; gy < V.y0 + V.h; gy += sp){
        const jx = gx + ((Math.sin(gx * 12.9 + gy * 78.2) * 43758.5) % 1) * sp * 0.6, jy = gy + ((Math.sin(gx * 39.3 + gy * 11.1) * 24634.6) % 1) * sp * 0.6;
        const p = { x: jx, y: jy }; if (!inView(p)) continue;
        const d = depthAt(p);
        if (d < 3 || d > 120) continue;
        snd += `<text x="${f(X(jx))}" y="${f(Y(jy))}" text-anchor="middle">${d}</text>`;
      }
    }
    /* the land, water-lined as the engravers did it */
    let wl = '', fill = '', outline = '';
    for (const L of content.lands){
      if (L.maxX < V.x0 || L.minX > V.x0 + V.w || L.maxY < V.y0 || L.minY > V.y0 + V.h) continue;
      const d = 'M' + L.pts.map(p => `${f(X(p.x))},${f(Y(p.y))}`).join(' L') + ' Z';
      wl += `<path d="${d}" stroke-width="13" stroke-opacity="0.05"/><path d="${d}" stroke-width="8" stroke-opacity="0.07"/><path d="${d}" stroke-width="4" stroke-opacity="0.1"/>`;
      fill += `<path d="${d}"/>`;
      outline += `<path d="${d}"/>`;
    }
    /* dangers, where the chart shows them */
    let dang = '';
    for (const D of content.dangers){
      if (!D.charted || !inView(D)) continue;
      const cx = X(D.x), cy = Y(D.y), r = Math.max(1.6, D.r * S);
      if (D.kind === 'island') dang += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${CH.LAND}" stroke="${CH.INK}" stroke-width="0.9"/>`;
      else if (D.kind === 'bank') dang += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${CH.INK}" stroke-width="0.8" stroke-dasharray="1 2"/>`;
      else dang += `<g stroke="${CH.INK}" stroke-width="0.9"><line x1="${f(cx - 3)}" y1="${f(cy)}" x2="${f(cx + 3)}" y2="${f(cy)}"/><line x1="${f(cx)}" y1="${f(cy - 3)}" x2="${f(cx)}" y2="${f(cy + 3)}"/></g><circle cx="${f(cx + 2)}" cy="${f(cy + 2)}" r="0.7" fill="${CH.INK}"/><circle cx="${f(cx - 2)}" cy="${f(cy - 2)}" r="0.7" fill="${CH.INK}"/>`;
      if (D.name && !V.full) dang += `<text x="${f(cx)}" y="${f(cy + r + 9)}" text-anchor="middle" font-size="8.5" font-style="italic" fill="${CH.INK}" ${CH.FONT}>${esc(D.name)}</text>`;
    }
    /* names */
    let names = '';
    const off = { N: [0, -7, 'middle'], S: [0, 12, 'middle'], E: [6, 3.5, 'start'], W: [-6, 3.5, 'end'], NE: [5, -5, 'start'], NW: [-5, -5, 'end'], SE: [5, 10, 'start'], SW: [-5, 10, 'end'] };
    for (const P of Object.values(content.places)){
      if (!inView(P.at) || (V.full && P.minor)) continue;
      const cx = X(P.at.x), cy = Y(P.at.y), o = off[P.label] || off.E;
      const big = P.kind === 'island' || P.kind === 'region';
      const mark = P.kind === 'port' ? `<circle cx="${f(cx)}" cy="${f(cy)}" r="2" fill="${CH.PAPER}" stroke="${CH.INK}" stroke-width="0.9"/>`
        : P.light ? `<path d="M${f(cx)},${f(cy - 4)} L${f(cx + 1.2)},${f(cy - 1.2)} L${f(cx + 4)},${f(cy)} L${f(cx + 1.2)},${f(cy + 1.2)} L${f(cx)},${f(cy + 4)} L${f(cx - 1.2)},${f(cy + 1.2)} L${f(cx - 4)},${f(cy)} L${f(cx - 1.2)},${f(cy - 1.2)} Z" fill="${CH.RED}"/>` : '';
      if (P.kind === 'region' && !V.full) continue;
      names += `${big ? '' : mark}<text x="${f(cx + (big ? 0 : o[0]))}" y="${f(cy + (big ? 4 : o[1]))}" text-anchor="${big ? 'middle' : o[2]}" font-size="${big ? (V.full ? 13 : 15) : (V.full ? 9 : 10.5)}" ${big ? 'letter-spacing="1.5"' : 'font-style="italic"'} fill="${CH.INK}" ${CH.FONT}>${esc(big ? P.name.toUpperCase() : P.name)}</text>`;
    }
    /* the border, graduated in degrees and minutes */
    let border = '';
    const tick = V.full ? 1 / 6 : 1 / 12;
    for (let lat = Math.ceil(ll0.lat / tick) * tick; lat <= ll1.lat; lat += tick){
      const y = Y(ll2xy(lat, 0).y), major = Math.abs(lat - Math.round(lat)) < 1e-6;
      border += `<line x1="${M - (major ? 7 : 4)}" y1="${f(y)}" x2="${M}" y2="${f(y)}"/><line x1="${W - M}" y1="${f(y)}" x2="${W - M + (major ? 7 : 4)}" y2="${f(y)}"/>`;
      if (major || (!V.full && Math.abs(lat * 3 - Math.round(lat * 3)) < 1e-6)) border += `<text x="${M - 9}" y="${f(y + 3)}" text-anchor="end" font-size="8.5" stroke="none" fill="${CH.INK}" ${CH.FONT}>${fmtLat(lat).replace(' N', '').replace('°00′', '°')}</text>`;
    }
    for (let lon = Math.ceil(ll0.lon / tick) * tick; lon <= ll1.lon; lon += tick){
      const x = X(ll2xy(0, lon).x), major = Math.abs(lon - Math.round(lon)) < 1e-6;
      border += `<line x1="${f(x)}" y1="${M - (major ? 7 : 4)}" x2="${f(x)}" y2="${M}"/><line x1="${f(x)}" y1="${H - M}" x2="${f(x)}" y2="${H - M + (major ? 7 : 4)}"/>`;
      if (major || (!V.full && Math.abs(lon * 3 - Math.round(lon * 3)) < 1e-6)) border += `<text x="${f(x)}" y="${H - M + 17}" text-anchor="middle" font-size="8.5" stroke="none" fill="${CH.INK}" ${CH.FONT}>${fmtLon(lon).replace(/ [EW]$/, '').replace('°00′', '°')}</text>`;
    }
    /* scale of leagues and the cartouche */
    const lg = V.full ? 10 : 3, segs = 4, seg = lg * 3 * S;
    let scale = '';
    const sx0 = W - M - 14 - seg * segs, sy0 = H - M - 16;
    scale += `<rect x="${f(sx0 - 10)}" y="${sy0 - 16}" width="${f(seg * segs + 20)}" height="34" fill="${CH.PAPER}" fill-opacity="0.92" stroke="${CH.INK}" stroke-width="0.5"/>`;
    for (let i = 0; i < segs; i++) scale += `<rect x="${f(sx0 + seg * i)}" y="${sy0}" width="${f(seg)}" height="4" fill="${i % 2 ? CH.PAPER : CH.INK}" stroke="${CH.INK}" stroke-width="0.6"/>`;
    for (let i = 0; i <= segs; i++) scale += `<text x="${f(sx0 + seg * i)}" y="${sy0 + 13}" text-anchor="middle" font-size="8.5" fill="${CH.INK}" ${CH.FONT}>${i * lg}</text>`;
    scale += `<text x="${f(sx0 + seg * segs / 2)}" y="${sy0 - 5}" text-anchor="middle" font-size="9.5" font-style="italic" fill="${CH.INK}" ${CH.FONT}>Sea Leagues, of three miles</text>`;
    let cart = '';
    if (V.full && C.cartouche){
      const c = ll2xy(C.cartouche[0], C.cartouche[1]), cx = X(c.x), cy = Y(c.y);
      const lines = (C.title || '').split('|').map(s => s.trim());
      cart = `<g transform="translate(${f(cx)} ${f(cy)})"><rect x="-128" y="-30" width="256" height="${24 + lines.length * 14}" fill="${CH.PAPER}" stroke="${CH.INK}" stroke-width="0.9"/><rect x="-124" y="-26" width="248" height="${16 + lines.length * 14}" fill="none" stroke="${CH.INK}" stroke-width="0.4"/>
        ${lines.map((l, i) => `<text y="${-10 + i * 14}" text-anchor="middle" font-size="${i === 0 ? 13 : 10}" ${i === 0 ? '' : 'font-style="italic"'} fill="${CH.INK}" ${CH.FONT}>${esc(l)}</text>`).join('')}</g>`;
    }
    stat = { W, H, M, body: `
      <rect width="${W}" height="${H}" fill="${CH.PAPER}"/><rect width="${W}" height="${H}" filter="url(#${px}mottle)"/><rect width="${W}" height="${H}" filter="url(#${px}grain)"/>
      <circle cx="${f(W * 0.78)}" cy="${f(H * 0.7)}" r="24" fill="url(#${px}fox)"/><circle cx="${f(W * 0.15)}" cy="${f(H * 0.86)}" r="14" fill="url(#${px}fox)"/>
      <rect width="${W}" height="${H}" fill="url(#${px}age)"/>
      <g clip-path="url(#${px}clip)">
        <g stroke="${CH.INK}" stroke-opacity="0.3" stroke-width="0.5">${grat}</g>
        <g stroke="${CH.INK}">${rhumbs}</g>
        <g font-size="${V.full ? 6.5 : 7.5}" font-style="italic" fill="${CH.INK}" fill-opacity="0.7" ${CH.FONT}>${snd}</g>
        <g fill="none" stroke="${CH.INK}" stroke-linejoin="round">${wl}</g>
        <g fill="${CH.LAND}">${fill}</g><g fill="url(#${px}landhatch)">${fill}</g>
        <g fill="none" stroke="${CH.INK}" stroke-width="1" stroke-linejoin="round">${outline}</g>
        ${dang}${names}${rose}${cart}
      </g>
      ${scale}
      <rect x="${M - 0.5}" y="${M - 0.5}" width="${W - 2 * M + 1}" height="${H - 2 * M + 1}" fill="none" stroke="${CH.INK}" stroke-width="0.8"/>
      <rect x="5" y="5" width="${W - 10}" height="${H - 10}" fill="none" stroke="${CH.INK}" stroke-width="1.3"/>
      <g stroke="${CH.INK}" stroke-width="0.7">${border}</g>` };
    if (V.full) chartStaticCache = stat;
  }
  /* the ship, as the master reckons her */
  let dyn = '';
  if (state && state.nav){
    const N = state.nav, v = state.voyage;
    if (v && v.name === 'station' && v.cruise){
      const a = placeOff(v.cruise[0]), b = placeOff(v.cruise[1]);
      if (a && b) dyn += `<line x1="${f(X(a.x))}" y1="${f(Y(a.y))}" x2="${f(X(b.x))}" y2="${f(Y(b.y))}" stroke="${CH.RED}" stroke-width="1.2" stroke-dasharray="5 3" stroke-opacity="0.7"/>`;
    }
    const tr = N.track.filter((p, i) => i % 1 === 0);
    if (tr.length > 1) dyn += `<polyline points="${tr.map(p => `${f(X(p[0]))},${f(Y(p[1]))}`).join(' ')}" fill="none" stroke="${CH.OWN}" stroke-width="1.1" stroke-dasharray="0.1 3.5" stroke-linecap="round"/>`;
    const tgt = navTarget();
    if (tgt && tgt !== 'standoff') dyn += `<line x1="${f(X(N.rx))}" y1="${f(Y(N.ry))}" x2="${f(X(tgt.x))}" y2="${f(Y(tgt.y))}" stroke="${CH.OWN}" stroke-width="0.8" stroke-dasharray="6 4" stroke-opacity="0.6"/>
      <circle cx="${f(X(tgt.x))}" cy="${f(Y(tgt.y))}" r="4" fill="none" stroke="${CH.OWN}" stroke-width="0.9"/><circle cx="${f(X(tgt.x))}" cy="${f(Y(tgt.y))}" r="1.2" fill="${CH.OWN}"/>`;
    dyn += `<ellipse cx="${f(X(N.rx))}" cy="${f(Y(N.ry))}" rx="${f(Math.max(3, N.ex * S))}" ry="${f(Math.max(3, N.ey * S))}" fill="${CH.OWN}" fill-opacity="0.06" stroke="${CH.OWN}" stroke-width="0.9" stroke-dasharray="3 2"/>`;
    dyn += `<g transform="translate(${f(X(N.rx))} ${f(Y(N.ry))}) rotate(${(N.course || 0).toFixed(1)})"><path d="M0,-8 C3,-4 3,2.6 2.3,6.6 L-2.3,6.6 C-3,2.6 -3,-4 0,-8 Z" fill="${CH.OWN}"/><g stroke="${CH.INK}" stroke-width="0.8"><line x1="-5" y1="-3.5" x2="5" y2="-3.5"/><line x1="-5.8" y1="0.5" x2="5.8" y2="0.5"/><line x1="-4" y1="4" x2="4" y2="4"/></g></g>`;
    if (prefs.showTruth) dyn += `<g stroke="${CH.RED}" stroke-width="1.4"><line x1="${f(X(N.tx) - 5)}" y1="${f(Y(N.ty) - 5)}" x2="${f(X(N.tx) + 5)}" y2="${f(Y(N.ty) + 5)}"/><line x1="${f(X(N.tx) - 5)}" y1="${f(Y(N.ty) + 5)}" x2="${f(X(N.tx) + 5)}" y2="${f(Y(N.ty) - 5)}"/></g>`;
  }
  return `<svg class="seachart" viewBox="0 0 ${stat.W} ${stat.H}" role="img" aria-label="Chart of the station, with the ship where the master reckons her.">
    ${chartDefs(px)}<defs><clipPath id="${px}clip"><rect x="${stat.M}" y="${stat.M}" width="${stat.W - 2 * stat.M}" height="${stat.H - 2 * stat.M}"/></clipPath></defs>
    ${stat.body}<g clip-path="url(#${px}clip)">${dyn}</g></svg>`;
}
function reckoningWords(){
  const N = state.nav; if (!N) return '';
  const ll = xy2ll(N.rx, N.ry);
  const ew = Math.round(N.ex), ns = Math.round(N.ey);
  const span = n => n <= 2 ? 'a mile or two' : n < 6 ? `${numWord(n)} miles` : `${numWord(Math.round(n / 3))} leagues`;
  const hours = Math.round((state.minutes - N.fix.t) / 60);
  const since = hours < 1 ? 'within the hour' : hours === 1 ? 'an hour since' : hours < 48 ? `${numWord(hours)} hours since` : `${numWord(Math.round(hours / 24))} days since`;
  return `By the master’s reckoning she is in ${fmtLat(ll.lat)}, ${fmtLon(ll.lon)}. He will answer for it within ${span(ns)} north and south, and ${span(ew)} east and west. Last fixed by ${N.fix.how}, ${since}.`;
}

/* ---------- quantities, as a purser would write them ---------- */
function round1(x){ return Math.abs(x) >= 10 ? Math.round(x) : Math.round(x * 10) / 10; }
function fmtAmt(d, base){
  if (d.dim === 'w') return `${round1(base / 16)} lb`.replace('.0 ', ' ');
  if (d.dim === 'v') return d.size >= 8 * 128 ? `${round1(base / 128)} gallons`.replace('.0 ', ' ') : `${round1(base / 16)} pints`.replace('.0 ', ' ');
  return `${Math.round(base)} ${Math.round(base) === 1 ? d.unit[0] : d.unit[1]}`;
}
function fmtBal(d, base){
  if (d.dim === 'n' || d.size <= 1) return fmtAmt(d, base);
  const units = Math.floor(base / d.size + 1e-6), rem = base - units * d.size;
  const head = `${units} ${units === 1 ? d.unit[0] : d.unit[1]}`;
  if (rem <= d.size * 0.01) return head;
  return units ? `${head}, ${fmtAmt(d, rem)}` : fmtAmt(d, rem);
}

/* ---------- saving ---------- */
function persist(){ if (state) lsSet(SAVE_KEY, JSON.stringify({ game: GAME_ID, build: BUILD, state })); }
function normalise(s){
  s.v = 7;
  s.vars = s.vars || {}; s.flags = s.flags || {}; s.seen = s.seen || {}; s.timers = s.timers || {};
  if (!('orders' in s)) { s.orders = null; s.ordersAt = null; }
  if (!Array.isArray(s.accounts)) s.accounts = [{ t: s.minutes, acct: 'money', amt: s.money, what: 'Balance brought forward', open: true }];
  if (!s.stores) s.needShip = true;
  if (!('voyage' in s)) s.voyage = null;
  if (!s.weather) s.needWeather = true;
  s.spellSeen = s.spellSeen || {};
  /* passages in builds before 4 were counted in watches; turn the watches left into miles */
  if (s.voyage && s.voyage.dist == null && s.voyage.left != null && !s.voyage.dest && (s.voyage.name === 'outward' || s.voyage.name === 'homeward')){
    const o = (s.orders && content.orders[s.orders]) || {};
    const leg = s.voyage.name === 'outward' ? o.passage : (o.return || (o.passage && { dist: o.passage.dist, bearing: (o.passage.bearing + 16) % 32, to: 'Mahon' }));
    s.voyage = { name: s.voyage.name, dist: s.voyage.left * 20, bearing: leg ? leg.bearing : 0, to: leg ? leg.to : 'Mahon', cap: s.voyage.name === 'outward' ? (o.cap || 0) : 0 };
  }
  /* a commission saved at the end of build 2 stands out to sea */
  if (s.eventId === 'ending_build2'){ s.ended = false; s.pending = null; s.continueAt = 'stand_out'; }
  /* a commission saved at the end of build 1 carries on into the second day */
  if (s.eventId === 'ending_build1'){
    if (s.seen.secretary_meeting) s.flags.presented = true;
    if (!('cabin_stores' in s.vars)) s.vars.cabin_stores = 2;
    s.ended = false; s.pending = null; s.continueAt = 'morning_after';
  }
  return s;
}
function adopt(s){
  state = normalise(s);
  if (state.needShip){ delete state.needShip; initShip(); }
  if (state.needWeather){ delete state.needWeather; initWeather(); }
  if (!state.officers){
    const g = state.vars.gunnery || 0; delete state.vars.gunnery; delete state.vars.master_skill;
    initCrew(); state.vars.gunnery = Math.min(5, 2 + g * 0.25);
  }
  if (state.flags.at_sea && !state.nav){
    navInit();
    const v = state.voyage, o = content.orders[state.orders] || {};
    if (v && v.dist != null && (v.name === 'outward' || v.name === 'homeward')){
      const orig = { cruise_catalan: 130, convoy_toulon: 205, despatches_hebe: 130 }[state.orders] || 150, fr = Math.max(0, Math.min(1, 1 - v.dist / orig));
      startVoyage(v.name);
      const home = placeOff(content.chart.home), far = placeOff(o.goTo || content.chart.home);
      const a = v.name === 'outward' ? home : far, b2 = v.name === 'outward' ? far : home, N = state.nav;
      if (a && b2){ N.tx = N.rx = a.x + (b2.x - a.x) * fr; N.ty = N.ry = a.y + (b2.y - a.y) * fr; N.ex = N.ey = 4; N.track = [[N.rx, N.ry]]; }
      if (landDist({ x: N.tx, y: N.ty }, false).d < 2){ N.tx = N.rx = home.x; N.ty = N.ry = home.y; }
    } else if (v && v.name === 'station'){
      const at = placeOff(o.goTo || content.chart.home), N = state.nav;
      N.tx = N.rx = at.x; N.ty = N.ry = at.y; N.track = [[at.x, at.y]];
      v.cruise = o.cruise || null; v.leg = 0;
    }
  }
  if (state.continueAt){ const id = state.continueAt; delete state.continueAt; enterEvent(id); }
  persist();
}
function loadAutosave(){
  const raw = lsGet(SAVE_KEY); if (!raw) return null;
  try { const d = JSON.parse(raw); return d && d.game === GAME_ID && d.state ? d.state : null; } catch(e){ return null; }
}
function readSave(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ throw new Error('That is not a saved commission: the file could not be read.'); }
  if (!d || d.game !== GAME_ID || !d.state) throw new Error('That file is not a Sloop of War save.');
  const s = d.state;
  if (!Array.isArray(s.rng) || s.rng.length !== 4 || typeof s.minutes !== 'number') throw new Error('That save is damaged and cannot be loaded.');
  return s;
}
function saveFileName(){ return `sloop-of-war-${surname().toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${state.seed.toLowerCase()}.json`; }

/* ============================================================
   RENDERING
   ============================================================ */
let glossIndex = null, glossRegex = null;
function buildGloss(){
  glossIndex = {};
  const alts = [];
  content.glossary.forEach((g, i) => g.terms.forEach(t => { glossIndex[normTerm(t)] = i; alts.push(t); }));
  alts.sort((a, b) => b.length - a.length);
  const pat = alts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/['’]/g, "['’]").replace(/\s+/g, '\\s+')).join('|');
  glossRegex = pat ? new RegExp(`(^|[^A-Za-z0-9’'-])(${pat})(?![A-Za-z0-9])`, 'gi') : null;
}
function smartQuotes(s){
  return s.replace(/(^|[\s(\[—–-])'/g, '$1‘').replace(/'/g, '’')
          .replace(/(^|[\s(\[—–-])"/g, '$1“').replace(/"/g, '”');
}
function inline(s){
  return esc(smartQuotes(subst(s))).replace(/\*([^*]+)\*/g, '<em>$1</em>');
}
function glossify(root){
  if (!glossRegex || !root) return;
  const used = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){ return n.parentElement && n.parentElement.closest('.gl, button, .noglossary') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue; let m, last = 0; const frag = document.createDocumentFragment(); let changed = false;
    glossRegex.lastIndex = 0;
    while ((m = glossRegex.exec(text))){
      const term = m[2], idx = glossIndex[normTerm(term)];
      const start = m.index + m[1].length;
      if (idx == null || used.has(idx)) continue;
      used.add(idx); changed = true;
      frag.append(text.slice(last, start));
      const b = document.createElement('span');
      b.className = 'gl'; b.dataset.g = idx; b.textContent = term;
      b.setAttribute('role', 'button'); b.tabIndex = 0;
      b.setAttribute('aria-label', `${term}: show meaning`);
      frag.append(b);
      last = start + term.length;
    }
    if (changed){ frag.append(text.slice(last)); node.parentNode.replaceChild(frag, node); }
  }
}

function headerHtml(){
  const errs = content.problems.filter(p => p.sev === 'error').length;
  return `<div class="top">
    <div class="ship">His Majesty’s Sloop <em>${esc(content.settings.ship || '')}</em></div>
    <nav class="nav" aria-label="Ship’s papers">
      <button type="button" data-act="log">Log</button>
      ${state && state.orders ? '<button type="button" data-act="orders">Orders</button>' : ''}
      ${state && state.nav && state.flags.at_sea ? '<button type="button" data-act="chart">Chart</button>' : ''}
      ${state && state.officers ? '<button type="button" data-act="muster">Muster</button>' : ''}
      <button type="button" data-act="books">Books</button>
      <button type="button" data-act="accounts">Purse</button>
      <button type="button" data-act="glossary">Glossary</button>
      <button type="button" data-act="papers">Papers${errs ? ` <span class="badge">(${errs})</span>` : ''}</button>
    </nav></div>`;
}
function stripHtml(){
  const w = watchOf(state.minutes);
  return `<div class="strip num" role="status">
    <span>${esc(fmtDate(state.minutes, true))}</span>
    <span>${esc(w.name)}, ${esc(w.bell)}</span>
    <span>${esc(placeName(state.place))}</span>
    ${windHtml()}
    <span class="purse" title="Your own purse">Purse ${esc(fmtMoney(state.money))}</span>
  </div>`;
}
function windHtml(){
  const w = state.weather; if (!w) return '';
  const atSea = state.place === 'sea';
  const deg = w.dir * 11.25;
  const arrow = w.force === 0 ? '<circle r="2.2" fill="var(--accent)"/>' :
    `<g transform="rotate(${deg})"><line x1="0" y1="-9" x2="0" y2="7" stroke="var(--accent)" stroke-width="1.6"/><path d="M0,9 L-3.2,3.5 L3.2,3.5 Z" fill="var(--accent)"/></g>`;
  const head = atSea && state.voyage && state.voyage.bearing != null ? `<g transform="rotate(${state.voyage.bearing * 11.25})"><line x1="0" y1="0" x2="0" y2="-8" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="1.5 1.5"/></g>` : '';
  const label = w.force === 0 ? 'Calm' : `${eightPoint(w.dir)}, ${FORCE_LOG[w.force].toLowerCase()}`;
  const knots = atSea ? `<span>${state.flags.hove_to ? 'Lying to' : Math.round(state.lastSpeed || 0) + ' knots'}</span>` : '';
  return `<span class="wind" title="${esc(w.force === 0 ? 'Calm' : 'Wind from the ' + pointWords(w.dir) + ', ' + FORCE_LOG[w.force].toLowerCase())}">
    <svg viewBox="-11 -11 22 22" width="22" height="22" aria-hidden="true"><circle r="10" fill="none" stroke="var(--rule)"/><text y="-5.5" text-anchor="middle" font-size="5" fill="var(--ink-2)" font-family="Georgia,serif">N</text>${head}${arrow}</svg>${esc(label)}</span>${knots}`;
}

function render(){
  hideTip();
  const app = $('#app');
  app.classList.toggle('wide', view === 'sandbox' && !!sb);
  if (view === 'sandbox'){ renderSandbox(app); return; }
  if (!state){ renderTitle(app); return; }
  if (state.ended){ renderEnding(app); return; }
  if (state.eventId === '__nowhere__' || !content.events[state.eventId]){ renderNowhere(app); return; }
  const ev = content.events[state.eventId];
  let body;
  if (state.pending){
    body = `<div class="prose result"><p>${inline(state.pending.text)}</p></div>
      <div class="cont"><button type="button" class="btn" data-act="continue" id="continue">Continue</button></div>`;
  } else {
    const paras = ev.paras.filter(p => !p.cond || condsMet(p.cond)).map(p => `<p>${inline(p.text)}</p>`).join('');
    let n = 0;
    const choices = ev.choices.map((ch, i) => {
      if (!condsMet(ch.requires)) return '';
      const ok = condsMet(ch.needs);
      n++;
      const why = ok ? '' : `<span class="why">${esc(whyNot(ch))}</span>`;
      return `<li><button type="button" class="choice" data-choice="${i}" ${ok ? '' : 'disabled'}>
        <span class="n" aria-hidden="true">${n}</span><span>${inline(ch.text)}${why}</span></button></li>`;
    }).join('');
    body = `${ev.chart && state.nav ? `<div class="scenechart">${chartSvg('ship')}</div>` : ''}<div class="prose">${paras}</div><ol class="choices">${choices}</ol>`;
  }
  app.innerHTML = `${headerHtml()}${stripHtml()}
    <section class="scene"><h2 tabindex="-1" id="scene-title">${inline(ev.title || '')}</h2>${body}</section>`;
  glossify($('.prose', app));
  focusTop();
}

function focusTop(){
  try { window.scrollTo(0, 0); } catch(e){}
  const h = $('#scene-title'); if (h) h.focus({ preventScroll: true });
}

function roseSvg(){
  let lines = '';
  for (let i = 0; i < 32; i++){
    const a = i * Math.PI / 16;
    const len = i % 8 === 0 ? 92 : i % 4 === 0 ? 70 : i % 2 === 0 ? 52 : 40;
    const w = i % 8 === 0 ? 1.6 : i % 4 === 0 ? 1.1 : .7;
    lines += `<line x1="0" y1="0" x2="${(Math.sin(a) * len).toFixed(2)}" y2="${(-Math.cos(a) * len).toFixed(2)}" stroke-width="${w}"/>`;
  }
  return `<svg class="rose" viewBox="-100 -112 200 212" aria-hidden="true" fill="none" stroke="var(--accent)">
    <circle r="96" stroke-width=".8"/><circle r="30" stroke-width=".6"/>${lines}
    <path d="M0,-92 L6,-30 L0,-36 L-6,-30 Z" fill="var(--accent)" stroke="none"/>
    <text x="0" y="-100" text-anchor="middle" font-family="IM Fell English SC, Georgia, serif" font-size="15" fill="var(--accent)" stroke="none">N</text></svg>`;
}
