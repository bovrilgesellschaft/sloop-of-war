<title>Sloop of War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow log-book column; prose at the centre, the instruments in a ruled strip above it, choices ruled like log entries below. */
:root{
  --paper:#ECEFE8; --paper-2:#E0E5DA; --ink:#23241F; --ink-2:#585D53; --rule:#B7BFB0;
  --accent:#1F4C69; --warn:#9A2E26; --ok:#2F6B3F; --tip-bg:#23241F; --tip-fg:#ECEFE8;
  --display:"IM Fell English","Iowan Old Style",Georgia,"Times New Roman",serif;
  --display-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --body:"Libre Caslon Text",Baskerville,"Iowan Old Style",Georgia,serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F151A; --paper-2:#18222A; --ink:#E5DDC9; --ink-2:#9BA39F; --rule:#2F3B44;
  --accent:#D2AE66; --warn:#E3836F; --ok:#8DBF8A; --tip-bg:#E5DDC9; --tip-fg:#0F151A; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F151A; --paper-2:#18222A; --ink:#E5DDC9; --ink-2:#9BA39F; --rule:#2F3B44;
  --accent:#D2AE66; --warn:#E3836F; --ok:#8DBF8A; --tip-bg:#E5DDC9; --tip-fg:#0F151A; color-scheme:dark }

html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:calc(17px * var(--scale));line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.col{max-width:38rem;margin:0 auto;padding-block:1rem 3rem}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sc{font-family:var(--display-sc);letter-spacing:.03em}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums lining-nums}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.4rem 1rem;padding-block:.25rem .4rem}
.ship{font-family:var(--display);font-size:1.05rem}
.ship em{font-style:italic}
.nav{display:flex;gap:.1rem;flex-wrap:wrap;margin-left:-.45rem}
.nav button,.link{background:none;border:0;padding:.25rem .45rem;cursor:pointer;font-family:var(--display-sc);font-size:.95rem;letter-spacing:.03em;color:var(--accent)}
.nav button:hover,.link:hover{text-decoration:underline;text-underline-offset:.2em}
.badge{color:var(--warn)}

/* instrument strip */
.strip{display:flex;flex-wrap:wrap;gap:.1rem 1.1rem;font-family:var(--display-sc);font-size:.92rem;letter-spacing:.03em;color:var(--ink-2);
  border-top:1px solid var(--rule);border-bottom:3px double var(--rule);padding-block:.4rem}
.strip .purse{margin-left:auto}

/* scene */
.scene h2{font-size:1.85rem;margin:1.3rem 0 .8rem}
.prose p{margin:0 0 .85rem;max-width:65ch}
.result{font-style:italic}
.choices{list-style:none;margin:1.3rem 0 0;padding:0;border-top:1px solid var(--rule)}
.choice{display:flex;gap:.85rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:.7rem .3rem;cursor:pointer;line-height:1.45}
.choice .n{font-family:var(--display-sc);color:var(--accent);min-width:1rem;flex:none}
.choice:hover:not(:disabled){background:var(--paper-2)}
.choice:disabled{color:var(--ink-2);cursor:not-allowed}
.choice:disabled .n{color:var(--rule)}
.choice .why{display:block;font-style:italic;font-size:.85em;color:var(--ink-2)}
.cont{margin-top:1.2rem}

/* glossary terms */
.gl{cursor:help;
  text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:.24em}
#tip{position:fixed;z-index:60;max-width:min(22rem, calc(100vw - 24px));background:var(--tip-bg);color:var(--tip-fg);
  font-family:var(--body);font-size:.88rem;line-height:1.45;padding:.6rem .75rem;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#tip b{font-family:var(--display-sc);font-weight:400;letter-spacing:.03em;display:block;margin-bottom:.15rem}

/* buttons */
.btn{background:var(--accent);color:var(--paper);border:0;border-radius:2px;padding:.55rem 1rem;cursor:pointer;font-family:var(--display-sc);letter-spacing:.04em;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.quiet{background:none;color:var(--accent);border:1px solid var(--rule)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* title screen */
.title{text-align:left;padding-top:1.5rem}
.rose{width:8.5rem;height:8.5rem;display:block;margin:0 0 .5rem -0.3rem}
.title h1{font-size:clamp(2.6rem, 9vw, 3.6rem);letter-spacing:.01em}
.title .sub{font-family:var(--display);font-style:italic;font-size:1.2rem;color:var(--ink-2);margin:.2rem 0 1.6rem}
.field{display:grid;gap:.25rem;margin-bottom:.9rem;max-width:22rem}
.field label{font-family:var(--display-sc);letter-spacing:.03em;font-size:.95rem;color:var(--ink-2)}
.field input,textarea{font:inherit;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:.45rem .6rem;width:100%;box-sizing:border-box}
.field small{color:var(--ink-2);font-size:.82rem}
.foot{margin-top:2.2rem;font-size:.85rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline}

/* panels */
#panel{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:3px double var(--rule);padding-block:.6rem .4rem;margin-bottom:1rem}
.phead h2{font-size:1.6rem}
.panel h3{font-family:var(--display-sc);font-size:1.05rem;letter-spacing:.04em;color:var(--ink-2);margin:1.4rem 0 .5rem}
.scroll-x{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:.95rem}
table.log th{font-family:var(--display-sc);font-weight:400;letter-spacing:.04em;text-align:left;color:var(--ink-2);border-bottom:1px solid var(--rule);padding:.3rem .5rem}
table.log td{border-bottom:1px solid var(--rule);padding:.4rem .5rem;vertical-align:top}
table.log td.h{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
table.log tr.day td{font-family:var(--display);font-style:italic;color:var(--accent);border-bottom:0;padding-top:.8rem}
table.log th.amt,table.log td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
table.log tr.total td{border-top:2px solid var(--rule);border-bottom:0;font-family:var(--display-sc);letter-spacing:.03em}
dl.gloss dt{font-family:var(--display-sc);letter-spacing:.03em;font-size:1.05rem;margin-top:.9rem}
dl.gloss dd{margin:.1rem 0 0}
dl.gloss .also{color:var(--ink-2);font-size:.85rem;font-style:italic}
.problems{list-style:none;padding:0;margin:0}
.problems li{border-bottom:1px solid var(--rule);padding:.55rem 0}
.sev{font-family:var(--display-sc);letter-spacing:.04em;font-size:.85rem;margin-right:.4rem}
.sev.error{color:var(--warn)} .sev.warn{color:var(--accent)}
.where{display:block;color:var(--ink-2);font-size:.82rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;font-size:.95rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{font-size:.9rem;color:var(--ink-2);font-style:italic}
.status{font-size:.9rem;margin-top:.5rem}
.status.bad{color:var(--warn)} .status.good{color:var(--ok)}
.confirm{border:1px solid var(--rule);padding:.6rem .8rem;margin-top:.5rem}
textarea{min-height:7rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}

/* wind in the strip */
.strip .wind{display:inline-flex;align-items:center;gap:.3rem}
.strip .wind svg{flex:none}

/* the muster */
.officers{display:grid;gap:.8rem}
.officer{border:1px solid var(--rule);padding:.6rem .8rem;background:var(--paper-2)}
.officer p{margin:.25rem 0}
.ohead{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.ohead .post{color:var(--ink-2);font-size:.9rem}
.officer .about{font-style:italic;color:var(--ink-2)}
.trait{display:inline-block;border:1px solid var(--rule);border-radius:2px;padding:0 .4rem;margin-right:.3rem;font-family:var(--display-sc);font-size:.85rem;letter-spacing:.03em;color:var(--accent)}
@media (min-width: 640px){ .officers{grid-template-columns:1fr 1fr} }

/* the sea chart */
.seachart{width:100%;height:auto;display:block;box-shadow:0 1px 6px rgba(60,40,15,.28)}
.scenechart{width:min(100%, 36vh);margin:.2rem auto .9rem}
.panelchart{margin:.7rem 0}

/* combat sandbox */
.sandbox .chart{width:min(100%, 46vh);aspect-ratio:1;height:auto;display:block;margin:.4rem auto 0;box-shadow:0 1px 6px rgba(60,40,15,.28)}
.sb-chartcol{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper)}
.sb-sticky{padding-block:.2rem .6rem;border-bottom:3px double var(--rule)}
.sb-sticky .strip{border-bottom:1px solid var(--rule)}
.sb-textcol{min-width:0;padding-top:.6rem}
@media (min-width: 900px){
  #app.wide{max-width:76rem}
  .sb-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2.2rem;align-items:start}
  .sb-sticky{border-bottom:0;padding-top:.6rem}
  .sandbox .chart{width:min(100%, calc(100vh - 7rem))}
  .sb-textcol{padding-top:1rem}
}
.sbh{font-size:1.05rem;color:var(--ink-2);margin:1.2rem 0 .45rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--rule);background:none;padding:.28rem .55rem;font-family:var(--display-sc);letter-spacing:.03em;color:var(--accent);border-radius:2px;cursor:pointer;font-size:.92rem;line-height:1.3}
.chip:hover:not(:disabled){background:var(--paper-2)}
.chip[aria-pressed="true"],.chip[aria-pressed="true"]:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sborders{border-top:3px double var(--rule);margin-top:1rem;padding-top:.4rem}
.ogroup{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:.4rem .6rem;align-items:baseline;margin:.55rem 0}
.olabel{font-family:var(--display-sc);letter-spacing:.03em;color:var(--ink-2);font-size:.95rem}
.seen p{margin:0 0 .55rem}
.seen .guns{font-size:.92rem;color:var(--ink-2)}
ol.alog{list-style:none;margin:.6rem 0;padding:0;border-top:1px solid var(--rule);font-size:.93rem}
ol.alog li{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:.5rem;padding:.3rem 0;border-bottom:1px solid var(--rule)}
ol.alog .h{color:var(--ink-2);font-variant-numeric:tabular-nums}
.brief p{font-style:italic;color:var(--ink-2)}
@media (max-width: 420px){ .ogroup{grid-template-columns:minmax(0,1fr)} .olabel{margin-bottom:-.2rem} }

/* ship's books */
.tabs{display:flex;flex-wrap:wrap;gap:.2rem;margin:0 0 1rem;border-bottom:1px solid var(--rule)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:.35rem .6rem;cursor:pointer;font-family:var(--display-sc);letter-spacing:.03em;color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
details.ledger{border-bottom:1px solid var(--rule);padding:.45rem 0}
details.ledger summary{cursor:pointer;color:var(--accent);font-family:var(--display-sc);letter-spacing:.03em}
ul.receipts{margin:.1rem 0 .6rem;padding-left:1.1rem;font-size:.92rem}
.panel table.log + details.ledger{margin-top:.8rem}

/* orders: a written document */
.orders{background:var(--paper-2);border:1px solid var(--rule);padding:1.1rem 1.2rem;font-size:.95rem;line-height:1.65}
.orders p{margin:0 0 .75rem;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.orders p:first-child{font-family:var(--display);font-size:1.05rem;text-align:left}
.orders p.sig{text-align:right;font-style:italic;margin-bottom:.2rem}
.orders .heading{font-family:var(--display-sc);letter-spacing:.04em;color:var(--ink-2);margin-bottom:.5rem}
@media (prefers-reduced-motion: no-preference){ .scene{animation:ink .35s ease-out} @keyframes ink{from{opacity:.4}to{opacity:1}} }
</style>

<div id="app" class="col" aria-live="polite"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden></div>

<script type="text/plain" class="content" data-name="Wind and weather">
# ------------------------------------------------------------
# How the sloop sails, and the weather of the western
# Mediterranean in spring. Wind is given in points of the
# compass (32 to the circle) and force from 0 (calm) to 11
# (storm). The player sees force only as words.
# ------------------------------------------------------------

SAILING
# knots at each angle off the wind, in a moderate breeze, plain sail
speed: 6 points 4.5, 8 points 6.5, 10 points 7.5, 12 points 8, 14 points 7.5, 16 points 6.5
# the closest she will lie to the wind
closest: 6
# multiplier on speed for each force, calm to storm
wind: 0, 0.15, 0.4, 0.65, 0.85, 1, 1.1, 1.1, 0.95, 0.75, 0.5, 0.3
press of sail: 1.12
snug: 0.85
# speed lost close-hauled for each force above strong breezes, per cent
close-hauled in a blow: 12
sweeps: 1.5
# chance in 100 of missing stays at each tack, calm to storm, for an ordinary crew
missing stays: 0, 2, 3, 4, 6, 8, 12, 18, 28, 40, 55, 70

WEATHER: settled
Called: the present weather
Wind: any
Force: 2 to 4
Lasts: 1 to 3 days
Sky: fair, with a few high clouds
Log: and fine weather
Signs: a clear sky at sunset and the wind falling light
Seeing: 100
Noon sight: 90
Follows: mistral 3, tramontana 2, levanter 2, sirocco 2, westerly 2, calm 1

WEATHER: mistral
Called: the Mistral
Wind: NW to N
Force: 6 to 9
Lasts: 1 to 3 days
Sky: hard and clear, and bitter cold
Log: with a hard clear sky and a heavy sea
Signs: a long swell getting up from the north-west under a sky scoured hard and clear
Seeing: 130
Noon sight: 95
Follows: settled 4, tramontana 1, westerly 1

WEATHER: tramontana
Called: a Tramontana
Wind: N to NE
Force: 5 to 7
Lasts: 1 to 2 days
Sky: clear and cold
Log: and clear cold weather
Signs: cloud banking up over the mountains to the northward
Seeing: 115
Noon sight: 90
Follows: settled 3, mistral 1, levanter 1

WEATHER: levanter
Called: a Levanter
Wind: NE to ESE
Force: 4 to 7
Lasts: 1 to 3 days
Sky: overcast and hazy, with rain at times
Log: and hazy, with rain at times
Signs: a damp haze, and a swell coming in from the eastward against the wind
Seeing: 30
Noon sight: 30
Follows: settled 3, sirocco 1, calm 1

WEATHER: sirocco
Called: the Sirocco
Wind: SE to SSW
Force: 3 to 6
Lasts: 1 to 3 days
Sky: hot, thick and hazy, with a red dust on everything
Log: and thick hazy weather
Signs: a hot, heavy air, and a yellow haze to the southward
Seeing: 45
Noon sight: 40
Follows: settled 3, levanter 1, westerly 1

Title: A privateer brig
Enemy: privateer_brig
Captain: bold
Range: 26

A brig under French colours, fourteen ports and a deck crowded with men: a privateer out of Marseille, as near your own size as makes no difference. Privateers fight for prizes, not for glory, and she will try to cripple you aloft and carry you by boarding. Her captain has the reputation of a bold one.

ACTION: corvette
Title: A corvette from Toulon
Enemy: corvette
Captain: cunning
Range: 28

A ship-corvette of the French navy, twenty eight-pounders and half as many men again as you, out on a cruise of her own. She outweighs you in metal and in men, and her captain knows it, and knows his trade: he will fight at the range that suits his guns, not yours. There is no disgrace in declining an action with her, and a great deal of credit in winning one.

ACTION: letter_of_marque
Title: A Spanish letter of marque
Enemy: polacre
Captain: cautious
Range: 16

A polacre-ship under Spanish colours, armed and commissioned as a letter of marque, deep with wine and oil for Barcelona. She has a dozen small guns, and every reason to avoid a fight. She is quick, and her master knows these waters. The trick is to catch her.

<script type="text/plain" class="content" data-name="Events: The opening">
# ------------------------------------------------------------
# The first day of the commission.
# ------------------------------------------------------------

EVENT: arrival
Title: Mahon, the Morning of Arrival
Place: mahon
Start

The storeship came in at first light, past the ruined fort at the harbour mouth and up the long reach to the white town on its cliff. You went ashore at the steps with your sea-chest, your sword, and a commission naming you Master and Commander of His Majesty's sloop *{ship}*.

You have not yet seen her. By your own reckoning you have {money} in the world.

The town is waking. A bumboat woman offers you oranges. Somewhere above the quay a bell is ringing for Mass.

CHOICE: Wait upon the Commander-in-Chief's secretary at once
Log: Came ashore from the storeship at Mahon. Waited upon the Commander-in-Chief's office.
Next: secretary_wait

CHOICE: Buy a coat fit for a commander before presenting yourself
Needs: money £8 or more
Effects: money -£8 "A commander's coat, of a tailor in the upper town"; set new_coat; pass 1 watch
Text: A tailor in the upper town, who learnt his trade under the old English garrison, puts you into a blue coat with a single epaulette on the left shoulder by the forenoon, and takes a painful part of what you have for it.
Log: Came ashore at Mahon. Fitted out at the tailor's, then waited upon the Commander-in-Chief's office.
Next: secretary_wait

CHOICE: Go straight out to the ship
Effects: set skipped_secretary
Text: Orders can wait an hour, you tell yourself. A ship cannot be taken by letter.
Log: Came ashore at Mahon and went directly out to the sloop.
Next: boat_out


EVENT: secretary_wait
Title: The Admiral's Office
Place: mahon

The office is a cool, high room in a merchant's house the Navy has taken over, with a sentry at the door and a clerk at a table who does not look up. Mr Pardoe, secretary to the Commander-in-Chief, is engaged.

He remains engaged through two bells, and then through four. Other men come and go: a purser with a sheaf of vouchers, a lieutenant of marines, a Minorcan contractor in black who is shown in at once.

CHOICE: Wait, with every appearance of patience
Effects: pass 1 watch; set waited_patiently
Next: secretary_meeting

CHOICE: Send in your name a second time
Chance 50:
Text: The clerk sighs, rises, goes in, and returns with word that Mr Pardoe will see you directly.
Next: secretary_meeting
Otherwise:
Effects: set pardoe_grudge; pass 1 watch
Text: The clerk takes your name in and brings it back. Mr Pardoe, it appears, will see you when Mr Pardoe is at leisure, and has noted that you were pressing.
Next: secretary_meeting

CHOICE: Slip the clerk a guinea
Needs: money 1gn or more
Effects: money -1gn "A guinea to the Admiral's clerk"
Chance 70:
Effects: set clerk_obliged
Text: The guinea goes where guineas go, and within the quarter-hour you are shown in ahead of the purser and his vouchers.
Next: secretary_meeting
Otherwise:
Effects: set pardoe_grudge; pass 1 watch
Text: The clerk looks at the coin, and then at you, and says that he is not that kind of clerk. He keeps it, all the same.
Next: secretary_meeting


EVENT: secretary_meeting
Title: Mr Pardoe
Place: mahon
Effects: set presented

Mr Pardoe is a narrow, careful man with ink on his second finger and the manner of one who has seen a great many young commanders and expects to see a great many more. He reads your commission through, though he must know every word of it.

[if pardoe_grudge] He does not offer you a chair.

[if new_coat] His eye rests for a moment on the new epaulette, and moves on.

'The *{ship}* lies off the hospital, Captain {surname}. Her late commander was carried ashore with a fever a fortnight since, and she is short of men. Mr Treharne, her lieutenant, is a sound officer of the old sort.' He lays the paper down. 'The Admiral will have orders for you when he has orders for you.'

CHOICE: Thank him, and go out to your ship
Next: boat_out

CHOICE: Ask when the Admiral will see you
Chance 40:
Effects: set admiral_appointment
Text: 'Tomorrow, perhaps,' says Mr Pardoe, and writes something down. 'Or the day after.'
Next: boat_out
Otherwise:
Effects: set pardoe_grudge
Text: 'When he sends for you, sir,' says Mr Pardoe, 'which he will do. I assure you of it.'
Next: boat_out

CHOICE: Ask whether men can be found to complete her complement
Effects: set hint_hospital_men
Text: Mr Pardoe smiles for the first time. 'Every commander on the station is short of men, Captain {surname}. The Admiral cannot conjure seamen. You might apply at the hospital, when the convalescents are discharged.'
Next: boat_out


EVENT: boat_out
Title: The Harbour
Place: harbour
Effects: pass 1 hour

A shore-boat takes you and your chest down the harbour, the boatman pulling a short, choppy stroke and talking to himself in the island tongue. The harbour is long and narrow and crowded: transports, a Neapolitan polacre, a dismasted prize with her guns out of her.

Then he rests on his oars and points with his chin. 'Allà. *{ship}*.'

She is low and black and smaller than the commission makes her sound. Her yards are not quite square, and a bumboat is hooked on alongside.

CHOICE: Have the boatman hail her, so that she may receive you properly
Next: reception_formal

CHOICE: Go up the side unannounced
Effects: set came_unannounced
Next: reception_unannounced


EVENT: reception_formal
Title: Coming Aboard
Place: ship

'Boat ahoy!' comes the hail from her deck. The boatman, coached, answers with the ship's own name, which is the answer that tells her that her captain is in the boat.

There is a great deal of running on deck. By the time you reach the side the side-boys are in their places, the boatswain's call is shrilling, and a weather-beaten officer in an old-fashioned coat takes off his hat to you at the gangway. 'Treharne, sir. Lieutenant. You are very welcome aboard.'

CHOICE: Read yourself in at once
Next: reading_in

CHOICE: Walk round the ship with Mr Treharne first
Next: walk_round


EVENT: reception_unannounced
Title: Coming Aboard Unlooked-For
Place: ship

Nobody hails the boat. You go up the battens and step aboard to find the waist full of bumboat women and their wares, two seamen asleep in the shade of the launch, and a midshipman in his shirt-sleeves fishing over the side.

For a moment nobody knows who you are. Then the midshipman does, and drops his line.

CHOICE: Say nothing, and see how long it takes them
Effects: set saw_her_slack
Text: It takes a full minute for the word to reach the gunroom, and a full minute is long enough. Mr Treharne comes up the ladder buttoning his coat, red to the ears. 'Treharne, sir. Lieutenant. You are very welcome aboard, sir.'
Log: Came aboard and found the ship in an indifferent state.
Next: walk_round

CHOICE: Call for the officer of the watch, in a voice to carry to the cable-tier
Effects: set saw_her_slack; set stern_start
Text: Your voice was made on the quarterdeck of a seventy-four, and it carries. The bumboat women are over the side before Mr Treharne is up the ladder, and the midshipman has found his coat.
Log: Came aboard and found the ship in an indifferent state. Cleared her of bumboats.
Next: reading_in


EVENT: walk_round
Title: Round the Ship
Place: ship

Mr Treharne takes you round her: the quarterdeck, eight paces long; the sixteen guns, their breechings sound; the boats; the galley; the berth-deck, low and dark and smelling of bilge and bread and men. He speaks plainly and well of the ship, and sparingly of her people.

[if saw_her_slack] He does not speak of what you found on deck, and neither do you; but it goes round the ship with you.

'She is short twenty men of her complement, sir,' he says at last, 'and of those she has, I would not give a farthing for thirty.'

CHOICE: Ask him which of the people are worth having
Effects: set knows_good_hands
Text: He names them without hesitation: the captains of the tops, the gunner's mates, a dozen prime seamen. 'The rest came to us from the receiving ship at Gibraltar, sir, and from the Plymouth press before that. They know it, and so do we.'
Next: reading_in

CHOICE: Ask him what her late commander was like
Effects: set late_captain_ashore
Text: 'A gentleman, sir,' says Mr Treharne, after a pause that is itself an answer. 'He was a good deal ashore.'
Next: reading_in

CHOICE: Tell him plainly that what you saw on deck will not happen again
Requires: saw_her_slack
Effects: set stern_start; set treharne_stung
Text: 'No, sir,' says Mr Treharne, and looks straight ahead of him. 'It will not.'
Next: reading_in


EVENT: reading_in
Title: Reading In
Place: ship
Effects: pass 1 hour

All hands are turned up. They come aft in a slow, uneven tide and stand in the waist, ninety-odd of them in every condition of dress: men who have seen a fleet action, and men taken up in a Plymouth gin-shop six months since. The marines are drawn up in their red coats at the break of the quarterdeck. Mr Treharne calls for silence, and gets it.

You unfold your commission and read it to them, from 'By the Commissioners for executing the Office of Lord High Admiral' to the end.

CHOICE: Fold it up and dismiss them without another word
Effects: set plain_reading_in
Text: It is the old way, and some of the older hands approve of it. The rest go forward knowing nothing more of you than your name.
Log: Read my commission to the ship's company and took command.
Next: first_night

CHOICE: Add a word about prize money
Effects: set promised_prizes; morale +1
Text: You tell them that the *{ship}* is going to sea to take French and Spanish merchantmen, and that you mean to take a great many. There is a stir at that: not a cheer, quite, but a stir. They will remember it, whichever way it falls out.
Log: Read my commission to the ship's company and took command. Spoke to the people of prizes.
Next: first_night

CHOICE: Add a word about the discipline you expect
Effects: set stern_start; morale -1
Text: You tell them how you mean the ship to be run. They hear you in silence, which may mean anything.
Log: Read my commission to the ship's company and took command. Spoke to the people of discipline.
Next: first_night


EVENT: first_night
Title: The Great Cabin
Place: ship
Effects: until 19:00; cabin_stores = 2

By evening your chest is in the great cabin, which is not great. It runs to a table, two chairs, a swinging cot, a quarter-gallery, and a gun on either side that you will share it with at quarters. Your steward, a silent Manxman named Kinvig, inherited with the ship, brings you a candle and a bottle of the late captain's wine, which the late captain has not yet sent for.

The ship moves a little at her moorings. Forward, somebody is playing a fiddle, badly.

CHOICE: Ask Mr Treharne to dine with you
Needs: money 15s or more
Effects: money -15s "Supper sent off from the shore for Mr Treharne"; set dined_treharne
Text: He comes, in his old-fashioned coat, and eats steadily, and over the second bottle tells you more about the ship than he did in the whole of the afternoon.
Log: Mr Treharne dined with me.
Next: morning_after

CHOICE: Write up your log and turn in
Log: Turned in at four bells in the first watch.
Next: morning_after

CHOICE: Write a letter home
Text: You write four pages, and cross them, and seal them, and do not read them over.
Log: Wrote home.
Next: morning_after
</script>

<script type="text/plain" class="content" data-name="Events: Aboard in harbour">
# ------------------------------------------------------------
# The ship in Mahon harbour. ship_hub is where the player
# returns whenever a choice aboard has no "Next:".
# ------------------------------------------------------------

EVENT: morning_after
Title: The Second Day
Place: ship
Effects: until 07:00

Mr Treharne makes his report at breakfast, standing, with his hat under his arm, until you ask him to sit.

The *{ship}* has water for three weeks, provisions for rather more, and no spare topmast. She wants twenty men. The late captain's accounts with the purser are, in Mr Treharne's phrase, a matter for the purser.

[if dined_treharne] He is easier with you than he was yesterday, and once, over the coffee, very nearly smiles.

CHOICE: Thank him, and turn to the business of the day
Next: any ship

CHOICE: Ask him what he would do first, in your place
Effects: set treharne_consulted
Text: Mr Treharne considers. 'I should get our orders, sir, before the Admiral gives the Catalan cruise to the *Petrel*. Everything else will keep a day.'
Next: any ship


EVENT: ship_hub
Title: Aboard the *{ship}*
Place: ship
Hub

[if before 20:00] The *{ship}* lies at her moorings off the hospital island. Forward, the people are at their work, and not much hurried about it.

[if after 20:00] The ship is quiet but for the sentry's tread and the slap of water under the counter. The lights of the town are going out one by one.

The wind is {wind}; the sky {sky}.

[if has_orders] Your orders lie in your desk: {orders}.

[if not has_orders] You have no orders yet.

CHOICE: Go ashore
Requires: before 22:00
Effects: pass 30 minutes
Next: any mahon

CHOICE: Send Kinvig ashore for cabin stores
Requires: before 18:00, not stores_bought
Next: steward_stores

CHOICE: Have a guest to dinner
Requires: after 12:00, before 17:00
Next: dine_invite

CHOICE: Keep to your cabin and your papers
Requires: before 20:00
Effects: pass 3 hours
Next: any ship

CHOICE: Turn in for the night
Requires: after 20:00
Effects: until 07:00
Next: any ship

CHOICE: Weigh and proceed to sea
Requires: not has_orders
Needs: has_orders
Why not: You have no orders yet.
Next: weigh

CHOICE: Weigh and proceed to sea
Requires: has_orders
Needs: force 2 or more, force 7 or less, not wind from SE
Why not: There is no getting out of the harbour with the wind as it is. The master looks for a slant.

Tags: ship
Urgent
Once

Effects: set summoned; start summoned_at

A boat comes off from the shore with a note in Mr Pardoe's narrow hand. The Commander-in-Chief will see Captain {surname} at his office this forenoon, and Mr Pardoe has the honour to be his most obedient humble servant.

CHOICE: Call away your boat
Effects: pass 30 minutes
Next: mahon_hub

CHOICE: Acknowledge it, and finish your coffee first
Next: ship_hub


EVENT: summons
Title: A Note from the Office
Place: ship
Tags: ship
Urgent
Once
Requires: presented, not summoned, day 3 or more
Effects: set summoned; start summoned_at

A note comes off from the shore. The Commander-in-Chief desires to see Captain {surname} at his office, at Captain {surname}'s earliest convenience, which is to say at once. It is signed by Mr Pardoe, who has the honour to be his most obedient humble servant.

[if pardoe_grudge] It has come, you notice, by the slowest boat in the harbour.

CHOICE: Call away your boat
Effects: pass 30 minutes
Next: mahon_hub

CHOICE: Acknowledge it, and go when you are ready
Next: ship_hub


EVENT: pardoe_note
Title: Mr Pardoe's Compliments
Place: ship
Tags: ship
Urgent
Once
Requires: not presented, day 3 or more
Effects: set pardoe_grudge; standing -1

A note arrives from the Admiral's office. Mr Pardoe presents his compliments to Captain {surname}, and would be glad to learn whether Captain {surname} proposes, at any time convenient to himself, to wait upon the Commander-in-Chief.

Mr Treharne reads it over your shoulder, and then pretends that he has not.

CHOICE: Go ashore at once
Effects: pass 30 minutes
Next: mahon_hub

CHOICE: Put it in your pocket
Next: ship_hub


EVENT: purser_books
Title: The Purser's Books
Place: ship
Tags: ship
Urgent
Once
Requires: day 2 or more, after 09:00, before 18:00

Mr Hosken, the purser, waits upon you with his books under his arm: a soft-spoken Cornishman, neat in black, with a careful eye and a pencil behind his ear. The books want your signature, as they want every captain's, and he has marked the places.

CHOICE: Sign where he has marked
Effects: set signed_blind
Text: You sign. Mr Hosken blots each signature as you make it, thanks you, and is gone.

CHOICE: Read them through before you sign
Effects: set read_books; pass 2 hours
Text: You read them through, which takes the whole of the forenoon. The figures agree with one another, which proves that Mr Hosken can add. You sign.

CHOICE: Ask him about the late captain's stores
Text: The late captain's stores, says Mr Hosken, were the late captain's affair. He has an account of them, which he will be happy to show you at some convenient time.


EVENT: orders_by_hand
Title: Orders by Hand
Place: ship
Tags: ship
Urgent
Once
Requires: summoned, not admiral_seen, summoned_at 2 days or more
Effects: set admiral_seen; orders convoy_toulon; start sail_by; standing -2

A midshipman from the flagship comes up the side with a sealed packet and a face carefully empty of expression. It contains your orders, which are to take three victuallers to the squadron off Toulon, and a note in Mr Pardoe's hand observing that the Commander-in-Chief had hoped for the pleasure of seeing Captain {surname} in person, and has given up hoping.

CHOICE: Acknowledge them
Log: Received orders from the Commander-in-Chief, by hand, to see three victuallers safe to the squadron off Toulon.


EVENT: orders_unpresented
Title: Orders, Unasked For
Place: ship
Tags: ship
Urgent
Once
Requires: not presented, day 7 or more
Effects: set presented; set summoned; set admiral_seen; set pardoe_grudge; orders convoy_toulon; start sail_by; standing -3

A packet comes off from the flagship, addressed in Mr Pardoe's hand. It contains your orders, which are to take three victuallers to the squadron off Toulon, and a covering note. The Commander-in-Chief, Mr Pardoe writes, has been given to understand that Captain {surname} is in Mahon, and has thought it convenient to send his orders to him, since Captain {surname} has not found it convenient to come for them.

CHOICE: Acknowledge them
Log: Received orders from the Commander-in-Chief, by hand, to see three victuallers safe to the squadron off Toulon.
