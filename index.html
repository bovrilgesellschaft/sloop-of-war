Place: ship
Tags: ship
Urgent
Once
Requires: has_orders, not at_sea, sail_by 5 days or more
Effects: standing -2; set ordered_to_sail

A note from the flagship, unsealed, so that the midshipman who brings it, and the officer of the watch who receives it, and very likely the whole ship, may know what it says. The Commander-in-Chief directs Captain {surname} to put to sea in His Majesty's sloop *{ship}* at first light tomorrow, in execution of the orders he has already received.

CHOICE: Weigh at first light, as ordered
Next: weigh


EVENT: governor_invitation
Title: A Card from the Governor's House
Place: ship
Tags: ship
Urgent
Once
Requires: called_governor, card_left 6 hours or more
Effects: set invited_governor

Among the letters brought off from the shore is a stiff card, engraved. His Excellency the Governor is at home this evening, and every evening this week, to the officers of the garrison and the fleet, from eight o'clock. There will be cards.

CHOICE: Tell Kinvig to brush your best coat
Next: ship_hub


EVENT: steward_stores
Title: Cabin Stores
Place: ship

Kinvig waits to be told. He is a man of very few words, all of them to the purpose.

[if cabin_stores 1 or less] The late captain's lockers, by his account, are as near bare as makes no difference.

[if cabin_stores 2 or more] The late captain's lockers, by his account, will run to a dinner or two and no more.

The market at Mahon will furnish the rest, at Mahon prices.

CHOICE: A modest provision: wine, a coop of fowls, coffee and cheese
Needs: money £6 or more
Effects: money -£6 "Cabin stores, a modest provision"; cabin_stores +4; set stores_bought; pass 2 hours
Text: Kinvig goes ashore with a list and comes back with all of it, and a little change.
Log: Laid in cabin stores.
Next: ship_hub

CHOICE: A handsome provision, fit to set before an admiral
Needs: money £14 or more
Effects: money -£14 "Cabin stores, a handsome provision"; cabin_stores +8; set stores_bought; set good_table; pass 3 hours
Text: Kinvig is gone the whole afternoon, and comes off at last in a hired boat deep with hampers, a pig, and two dozen of claret from a merchant who swore to its being French.
Log: Laid in cabin stores.
Next: ship_hub

CHOICE: Make do with what there is
Next: ship_hub


EVENT: dine_invite
Title: Dinner in the Great Cabin
Place: ship

Dinner aboard is at three o'clock. Kinvig wants to know, with his eyebrows, whether he is to lay for two.

[if cabin_stores 0 or less] He also wants you to know, with the same eyebrows, that there is nothing in the lockers to lay with.

CHOICE: Send an invitation to Mr Pardoe
Requires: presented, not dined_pardoe
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to a guest.
Effects: cabin_stores -1; set dined_pardoe; until 18:00
Chance 60, +20 if good_table, -20 if pardoe_grudge:
Effects: clear pardoe_grudge; standing +1
Text: Mr Pardoe comes, and eats very little, and drinks rather more, and on the second bottle tells you a long story about a former Admiral's cook. He takes his leave with something that is nearly warmth.
Log: Mr Pardoe, the Admiral's secretary, dined with me.
Next: ship_hub
Otherwise:
Text: Mr Pardoe comes, and is polite, and notices everything: the chipped decanter, the fowl that was not quite dead long enough. He goes ashore at five, exactly as he came.
Log: Mr Pardoe, the Admiral's secretary, dined with me.
Next: ship_hub

CHOICE: Send an invitation to Mr Gedge, the Master Attendant
Requires: met_gedge, not dined_gedge
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to a guest.
Effects: cabin_stores -1; set dined_gedge; yard_favour +1; until 18:00
Text: Mr Gedge comes off in the yard's own boat, eats everything, and finds fault with your rigging from the cabin windows. He leaves in high good humour, promising nothing.
Log: Mr Gedge, Master Attendant of the yard, dined with me.
Next: ship_hub

CHOICE: Send an invitation to Commander Dawe of the *Petrel*
Requires: met_dawe, not dined_dawe
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to a guest.
Effects: cabin_stores -1; set dined_dawe; set friend_dawe; clear dawe_rival; until 18:00
Text: Dawe comes, and talks, and drinks your health in your own wine a great many times. By the end of it he has decided that you are a capital fellow, and says so, loudly, to his boat's crew.
Log: Commander Dawe of the Petrel dined with me.
Next: ship_hub

CHOICE: Invite the gunroom
Needs: cabin_stores 1 or more
Why not: The cabin stores will not run to the whole gunroom.
Next: gunroom_dinner

CHOICE: Dine alone
Effects: until 18:00
Text: You dine alone, with a book propped against the decanter, as captains have dined since there were captains.
Next: ship_hub


EVENT: weigh
Title: Proceeding to Sea
Place: ship
Effects: until 06:00

At first light you unmoor. The capstan goes round to the fiddler's tune, the cable comes in dripping and stinking of harbour mud, and the *{ship}* falls off and gathers way down the long harbour, past the hospital and the ruined fort, towards the open sea.

[if carronades] The new carronades squat in her ports like toads. Mr Treharne has not yet said what he thinks of them, which is itself an opinion.

[if sail_by 3 days or more] Mr Pardoe's last note, received at the gangway, observed that the Commander-in-Chief had expected the *{ship}* at sea some days since.

[if not water_completed] Mr Treharne observes, to nobody in particular, that the water was never completed.

CHOICE: Take her out under topsails, with every attention to the forms
Log: Unmoored and weighed. Proceeded to sea under topsails, in obedience to orders.
Next: stand_out

CHOICE: Make all sail as soon as the harbour mouth is cleared
Log: Unmoored and weighed. Made all sail on clearing the harbour.
Next: stand_out
</script>

<script type="text/plain" class="content" data-name="Events: Mahon">
# ------------------------------------------------------------
# The town and its four places: the Admiral's office, the
# dockyard, Mr Crouch's counting-house, the Governor's house.
# ------------------------------------------------------------

EVENT: mahon_hub
Title: Port Mahon
Place: mahon
Hub

[if before 19:00] The town stands on its cliff above the harbour, white and shuttered against the sun, its streets steep and full of goats, soldiers, priests and women in black. Redcoats stand sentry where Spanish sentries stood two years since.

[if after 19:00] Lamps are lit along the quay, and there is music somewhere in the upper town. The offices are shut. The taverns are not.

[if weather mistral] The Mistral is blowing down the harbour, rattling the shutters and driving the dust along the quay in clouds.

[if weather sirocco] The Sirocco has laid a hot, yellow haze over the town, and everyone in it is short-tempered.

CHOICE: The Admiral's office
Needs: before 16:00
Why not: The office is shut for the day.
Effects: pass 15 minutes
Next: any office

CHOICE: The dockyard, across the harbour
Needs: before 17:00
Why not: The yard has knocked off for the day.
Effects: pass 30 minutes
Next: any dockyard

CHOICE: Mr Crouch's counting-house
Needs: before 18:00
Why not: Mr Crouch has gone home to his dinner.
Effects: pass 15 minutes
Next: any agent

CHOICE: Leave your card at the Governor's house
Requires: not called_governor
Needs: before 18:00
Why not: It is too late in the day for calling.
Effects: set called_governor; start card_left; pass 30 minutes
Text: A footman in the Governor's livery takes your card at the door, lays it on a silver salver among a great many others, and shuts the door again. That is how it is done.
Log: Left my card at the Governor's.
Next: mahon_hub

CHOICE: The Governor's card party
Requires: invited_governor, not card_party_done
Needs: after 20:00
Why not: The rooms do not open until eight.
Next: card_party

CHOICE: Return aboard
Effects: pass 30 minutes
Next: any ship


EVENT: dawe_meeting
Title: Commander Dawe
Place: mahon
Tags: mahon
Once
Weight: 2
Requires: day 2 or more, before 19:00

On the quay you are hailed by a red-faced officer with one epaulette like your own and a great deal more lace. He is Commander Dawe of the *Petrel*, brig-sloop, and he is senior to you by two years and four months, which he mentions.

'You are come for the Catalan cruise, I suppose,' he says. 'Everybody is. The old gentleman as good as promised it me at Christmas.'

CHOICE: Stand him a bottle at the nearest tavern
Needs: money 10s or more
Effects: money -8s "A bottle with Commander Dawe"; set met_dawe; set friend_dawe; pass 1 hour
Text: He drinks most of it, and tells you which of the Admiral's followers are to be feared, which of the island's agents are to be trusted, and that none of them is.
Next: mahon_hub

CHOICE: Wish him joy of it, and walk on
Effects: set met_dawe
Next: mahon_hub

CHOICE: Tell him you mean to ask for it yourself
Effects: set met_dawe; set dawe_rival
Text: Commander Dawe stops smiling. 'Do you, by God,' he says, and walks off without another word.
Next: mahon_hub


EVENT: segui_offer
Title: Mr Seguí
Place: mahon
Tags: mahon
Once
Weight: 2
Requires: day 2 or more, before 19:00

At the head of the steps a gentleman in a good black coat falls in beside you and raises his hat. He is Jaume Seguí, of this island, and he has the honour to act for several officers of the fleet in the matter of prizes.

He has heard of your appointment. He knows Mr Crouch: a most respectable man, very slow. He himself will advance eighty pounds today against nothing but your name on a letter of attorney, and he names no interest at all.

[if agent_crouch] He has heard, too, that you have named Mr Crouch. These things, he says, may be undone.

CHOICE: Accept, and name him your agent
Needs: not agent_crouch
Why not: You have already named Mr Crouch your agent.
Effects: set agent_segui; money +£80 "Advanced by Mr Seguí on account of prizes"; debt +£80 "Mr Seguí, eighty pounds advanced on account of prizes"
Text: Mr Seguí has the letter of attorney in his pocket, ready drawn, and the money in a bag in a shop across the street. It takes ten minutes. He bows very low.
Log: Appointed Mr Seguí of Mahon my agent, and drew £80 on him.
Next: mahon_hub

CHOICE: Decline, civilly
Text: Mr Seguí is not in the least offended. He is always to be found, he says, at the sign of the Three Kings, and he hopes to have the honour.
Next: mahon_hub


EVENT: card_party
Title: The Governor's House
Place: governor
Effects: set card_party_done; pass 30 minutes

The rooms are hot and bright and crowded with scarlet: the garrison is here in force, and the fleet in rather less. His Excellency is at whist in an inner room and does not come out. A band of the regiment plays in the courtyard, and the island's gentry stand along the walls and watch the English as they might watch weather.

Mr Pardoe is here, in a plum-coloured coat. So is the Admiral's flag captain, and a Major Ancell of the regiment, who wants a fourth at whist and has heard that sea officers are rich.

CHOICE: Sit down to whist with Major Ancell, at half-crown points
Needs: money £6 or more
Why not: You have not the money to sit down with the Major.
Effects: until 23:00
Chance 50:
Effects: money +£4 4s "Won at whist of Major Ancell"
Text: The cards run your way from the first rubber, and the Major pays up with a soldier's good grace and a soldier's bad language.
Log: Passed the evening at the Governor's. Won at whist.
Next: any ship
Otherwise:
Effects: money -£5 5s "Lost at whist to Major Ancell"
Text: The Major plays a long, cautious, murderous game, and by eleven you owe him five guineas, which you pay on the spot as a gentleman must.
Log: Passed the evening at the Governor's. Lost at whist.
Next: any ship

CHOICE: Make yourself agreeable to the flag captain
Effects: until 23:00
Chance 50, +20 if new_coat:
Effects: interest +1; standing +1
Text: Captain Blane is a dry, quiet man who has heard every young commander's story twice. Yours, it appears, he has not heard, and he asks for more of it.
Log: Passed the evening at the Governor's.
Next: any ship
Otherwise:
Text: Captain Blane is a dry, quiet man who has heard every young commander's story twice, and he hears yours a third time with perfect civility.
Log: Passed the evening at the Governor's.
Next: any ship

CHOICE: Make your peace with Mr Pardoe
Requires: pardoe_grudge
Effects: until 23:00
Chance 60:
Effects: clear pardoe_grudge
Text: Away from his office Mr Pardoe is a different man, fond of music and very ready to be thought fond of it. You stand beside him through three quadrilles and say that the band is very fine. By the end he is calling you 'my dear Captain'.
Log: Passed the evening at the Governor's.
Next: any ship
Otherwise:
Text: Mr Pardoe receives your civilities as he receives everything, on file.
Log: Passed the evening at the Governor's.
Next: any ship

CHOICE: Stay an hour for form's sake, and go back aboard
Effects: pass 1 hour
Log: Passed an hour at the Governor's.
Next: any ship
</script>

<script type="text/plain" class="content" data-name="Events: The Admiral's office">
EVENT: secretary_late
Title: The Admiral's Office
Place: office
Tags: office
Urgent
Once
Requires: not presented
Effects: set presented; set pardoe_grudge; pass 2 hours

Mr Pardoe receives you at last, after a delay he does not explain, and reads your commission through without asking you to sit.

'You came out by the storeship, I think, Captain {surname}. On Monday.' He lays the paper down. 'The *{ship}* lies off the hospital, as no doubt you have discovered for yourself. The Admiral will send for you when he has occasion.'

CHOICE: Apologise for not waiting upon him sooner
Chance 40:
Effects: clear pardoe_grudge
Text: Mr Pardoe inclines his head a quarter of an inch. It is enough.
Next: office_hub
Otherwise:
Text: 'Not at all,' says Mr Pardoe, and writes something down.
Next: office_hub

CHOICE: Bow, and say nothing
Next: office_hub


EVENT: office_hub
Title: The Admiral's Office
Place: office
Hub

The anteroom is full, as it is always full: masters of transports, a Minorcan contractor in black, two lieutenants hoping for a vacancy and pretending not to know each other. The clerk writes, and does not look up.

[if summoned, not admiral_seen] Then he does look up. The Admiral will see you directly.

CHOICE: Go in to the Admiral
Requires: summoned, not admiral_seen
Next: admiral_audience

CHOICE: Send in your name to Mr Pardoe
Requires: not summoned
Effects: pass 1 hour
Chance 30, +25 if clerk_obliged, -20 if pardoe_grudge:
Effects: set summoned; start summoned_at
Text: Mr Pardoe comes out himself, which is a mark of something. The Admiral, he says, will see you now, if you are at leisure.
Next: office_hub
Otherwise:
Text: The answer comes back that the Admiral is engaged, and will send.
Next: mahon_hub

CHOICE: Ask Mr Pardoe for an order to exchange your guns for carronades
Requires: admiral_seen, not gun_order, not gun_refused, not carronades
Effects: pass 1 hour
Chance 50, +20 if clerk_obliged, +20 if dined_pardoe, -30 if pardoe_grudge, +10 per standing:
Effects: set gun_order
Text: Mr Pardoe writes it out himself: an order to the Storekeeper of the Ordnance to receive the *{ship}*'s sixteen six-pounders and issue sixteen eighteen-pounder carronades in their room. 'He will not thank you for it,' he says, sanding it.
Log: Received an order for exchanging the guns.
Next: office_hub
Otherwise:
Effects: set gun_refused
Text: Mr Pardoe takes the request in to the Admiral, and brings back word that the Commander-in-Chief sees no occasion to alter the established armament of the sloop.
Next: office_hub

CHOICE: Leave
Next: mahon_hub


EVENT: admiral_audience
Title: The Commander-in-Chief
Place: office
Once
Effects: set admiral_seen; set issuing_orders; pass 1 hour

Vice-Admiral Sir Robert Lessingham receives you in a long room with the shutters half closed, his gouty foot on a stool and a chart of the coast of Spain spread across the table under a decanter. He is a large, slow-spoken man with the kindliest manner on the station, which deceives nobody who has served under him.

[if new_coat] 'Very fine,' he says of your coat. 'Very fine indeed.'

He asks about your passage, your last ship and your health, and listens to the answers. Then he looks at the chart.

CHOICE: Wait to be told your orders
Effects: standing +1
Next: any orders

CHOICE: Ask, with proper deference, for a cruise against the enemy's trade
Effects: set asked_cruise
Next: any orders

CHOICE: Speak of the ship's want of men
Effects: set spoke_of_men
Chance 50, +20 if hint_hospital_men:
Effects: set hospital_men_promised
Text: 'Men,' says the Admiral, as another man might say 'weather'. But he makes a note, and says that something may be done when the hospital discharges.
Next: any orders
Otherwise:
Effects: standing -1
Text: 'Every captain on the station is short of men, sir,' says the Admiral, without heat, 'and every one of them tells me so.'
Next: any orders


EVENT: orders_cruise
Title: Your Orders
Place: office
Tags: orders
Once
Requires: issuing_orders
Weight: 1, +3 if asked_cruise, +1 per standing, -1 if pardoe_grudge, -1 if dawe_rival
Effects: clear issuing_orders; orders cruise_catalan; start sail_by; pass 30 minutes

'The coast of Catalonia,' says the Admiral, laying a thick finger on it. 'Between Cape San Sebastián and Cape Salou. The Spaniards run their coasting trade along there in everything that will float, and they do not like it interrupted. Six weeks, and then come back to me.'

Mr Pardoe, who has been in the room all along, gives you your orders, sealed, and a look that you cannot read.

CHOICE: Thank the Admiral, and take your leave
Log: Received orders from the Commander-in-Chief to cruise on the coast of Catalonia.
Next: mahon_hub

CHOICE: Ask whether he has any particular wishes as to the cruise
Effects: standing +1
Text: 'Wishes?' The Admiral smiles. 'I wish you to take a great many prizes, Captain {surname}, of which I shall have my eighth. And I wish you not to fall in with the Toulon frigates. Good day to you.'
Log: Received orders from the Commander-in-Chief to cruise on the coast of Catalonia.
Next: mahon_hub


EVENT: orders_convoy
Title: Your Orders
Place: office
Tags: orders
Once
Requires: issuing_orders
Weight: 2, +2 if pardoe_grudge, +1 if spoke_of_men
Effects: clear issuing_orders; orders convoy_toulon; start sail_by; pass 30 minutes

'There are three victuallers lying in the harbour,' says the Admiral, 'full of beef and biscuit for the squadron off Toulon, and they have lain there a week for want of anybody to take them. You will take them.'

It is the dullest service on the station, and both of you know it. Mr Pardoe hands you your orders, sealed.

CHOICE: Take them, with thanks
Effects: standing +1
Log: Received orders from the Commander-in-Chief to see three victuallers safe to the squadron off Toulon.
Next: mahon_hub

CHOICE: Ask, if it may be, for a cruise instead
Chance 25, +15 per standing, +20 if dined_pardoe, -20 if pardoe_grudge:
Effects: orders cruise_catalan
Text: The Admiral looks at you for a long moment. 'Well, well. Dawe shall have the victuallers, and serve him right. Pardoe, write it out again.' Mr Pardoe writes it out again.
Log: Received orders from the Commander-in-Chief to cruise on the coast of Catalonia.
Next: mahon_hub
Otherwise:
Effects: standing -1
Text: 'Instead?' says the Admiral, pleasantly. 'No, Captain {surname}. Not instead. Good day to you.'
Log: Received orders from the Commander-in-Chief to see three victuallers safe to the squadron off Toulon.
Next: mahon_hub


EVENT: orders_despatches
Title: Your Orders
Place: office
Tags: orders
Once
Requires: issuing_orders
Weight: 2, +1 if asked_cruise
Effects: clear issuing_orders; orders despatches_hebe; start sail_by; pass 30 minutes

'I have a packet for Captain Wyatt of the *Hebe*, who is off Barcelona,' says the Admiral. 'Carry it to him with all dispatch. When you have put it into his hand you may cruise a fortnight on that coast before you come back, and take what you can.'

Mr Pardoe gives you your orders and the packet, both sealed, and makes you sign for the packet.

CHOICE: Take them, with thanks
Log: Received orders from the Commander-in-Chief to carry despatches to the Hebe off Barcelona.
Next: mahon_hub

CHOICE: Ask what the packet contains
Effects: standing -1
Text: 'Paper, Captain {surname},' says the Admiral, 'covered with writing.' Mr Pardoe permits himself to look at the ceiling.
Log: Received orders from the Commander-in-Chief to carry despatches to the Hebe off Barcelona.
Next: mahon_hub
</script>

<script type="text/plain" class="content" data-name="Events: The dockyard">
EVENT: yard_prize
Title: The Dockyard
Place: dockyard
Tags: dockyard
Once

The yard lies across the harbour from the town: storehouses, a mast pond, a sheer hulk, and the dismasted prize you passed on your first morning, hauled in to the wharf with her guns out of her.

She is a French privateer brig, the foreman of the shipwrights tells you, taken off Cape Bon in January. The surveyors are aboard her now. Half the commanders on the station have already asked who is to have her.

CHOICE: Look her over yourself
Effects: set saw_prize; pass 1 hour
Text: She is sharp and wet and over-sparred, built to run rather than to fight, and she would sail round the *{ship}* in a light air. You come away with tar on your breeches and a fair idea of her lines.
Next: dockyard_hub

CHOICE: Go on to the Master Attendant's office
Next: dockyard_hub


EVENT: dockyard_hub
Title: The Dockyard
Place: dockyard
Hub

Caulkers are at work on a transport's seams, and the smell of hot pitch hangs over everything. A gang of island labourers is rolling casks along the wharf, slowly, under the eye of a clerk who is slower still.

CHOICE: Call upon the Master Attendant
Requires: not met_gedge
Next: yard_gedge

CHOICE: Present your order at the Ordnance gun wharf
Requires: gun_order, not carronades, not kept_long_guns
Next: gun_exchange

CHOICE: The agent victualler's storehouses
Needs: before 16:00
Why not: The storehouses are shut for the day.
Effects: pass 15 minutes
Next: victualling

CHOICE: Return to the town
Effects: pass 30 minutes
Next: mahon_hub


EVENT: yard_gedge
Title: The Master Attendant
Place: dockyard
Effects: set met_gedge; pass 1 hour

Mr Gedge, Master Attendant of the yard, is an old sea officer who has not been to sea in eleven years and has not forgiven it. His office looks out over the mast pond, and his desk is buried under requisitions from every ship on the station.

'Cordage,' he says, before you have sat down. 'Everybody wants cordage. There is no cordage. The Navy Board sends me pitch and Bibles.'

CHOICE: Lodge your requisitions in the proper form
Effects: set requisitions_lodged
Text: He takes them, and puts them on top of the pile, which is something. 'In their turn, Captain. Everything in its turn.'
Next: dockyard_hub

CHOICE: Have Kinvig send him over a dozen of wine
Needs: cabin_stores 1 or more
Why not: There is no wine to spare in the cabin.
Effects: cabin_stores -1; yard_favour +2; set requisitions_lodged
Text: Mr Gedge does not thank you, which would be improper. But your requisitions find their way, by some process of their own, rather nearer the top of the pile.
Next: dockyard_hub

CHOICE: Ask him which ships he served in
Chance 50:
Effects: yard_favour +1; set requisitions_lodged
Text: A good many, it appears, and he tells you about all of them. It takes most of an hour. By the end he is calling you 'my dear sir'.
Next: dockyard_hub
Otherwise:
Effects: pass 1 hour
Text: He served, it appears, in a great many ships under a great many fools, and he names most of them. Two were friends of your father's. You do not mention it.
Next: dockyard_hub


EVENT: gun_exchange
Title: The Gun Wharf
Place: dockyard

Mr Lusk, Storekeeper of the Ordnance, reads the Admiral's order twice and holds it up to the light, as though it might be forged.

'Carronades,' he says. 'Eighteen-pounders. Sixteen of them, with slides and fittings.' He has them, it emerges; he has had them since the autumn. What he has not got is anybody to sway your six-pounders out and the carronades in, nor a lighter to carry them, nor any wish to hurry.

CHOICE: Have the exchange made in the ordinary course
Effects: pass 3 days; set carronades; empty shot6 "Returned into the Ordnance stores"; empty grape6 "Returned into the Ordnance stores"; store shot18 +600 "Received of the Ordnance stores at Mahon"; store grape18 +128 "Received of the Ordnance stores at Mahon"
Text: It takes three days, the loan of half your people, and a great deal of language from Mr Treharne. At the end of it the *{ship}* mounts sixteen eighteen-pounder carronades, and rides an inch higher for the want of the long guns' weight.
Log: Exchanged the six-pounders for eighteen-pounder carronades at the Ordnance wharf.
Next: dockyard_hub

CHOICE: Ease the business with a present to his clerk
Needs: money £3 or more
Effects: money -£3 "A present to the Ordnance storekeeper's clerk"; pass 1 day; set carronades; empty shot6 "Returned into the Ordnance stores"; empty grape6 "Returned into the Ordnance stores"; store shot18 +600 "Received of the Ordnance stores at Mahon"; store grape18 +128 "Received of the Ordnance stores at Mahon"
Text: The lighter appears that afternoon with a working party, and the thing is done by the next day's dusk. Mr Lusk affects not to know how.
Log: Exchanged the six-pounders for eighteen-pounder carronades at the Ordnance wharf.
Next: dockyard_hub

CHOICE: Think better of it, and keep your long guns
Effects: set kept_long_guns
Text: Mr Lusk hands back the order with the look of a man whose afternoon has been restored to him.
Next: dockyard_hub


EVENT: victualling
Title: The Victualling Stores
Place: victualling
Hub

The agent victualler's storehouses stand on the quay below the dockyard, cool and dark and smelling of salt meat and tar. Mr Hosken, the purser, has come with you, with his steward and his books.

[if provisions_completed, water_completed] The *{ship}* is stored and watered for as long as she can stow.

CHOICE: Complete provisions to the ship's capacity
Requires: not provisions_completed
Effects: fill provisions "Received of the agent victualler at Mahon"; set provisions_completed; pass 1 day
Text: It takes a day, the launch and two hired lighters. Mr Hosken counts every cask over the side and signs for every one, and the hold fills to the beams.
Log: Received provisions from the agent victualler at Mahon.

CHOICE: Complete the water
Requires: not water_completed
Effects: fill water "Filled by the launch at the watering place"; set water_completed; pass 1 day
Text: The launch goes to and fro all day between the ship and the watering place with her empty butts, and comes back each time low in the water with full ones. By dusk the master reports the water complete.
Log: Completed water.

CHOICE: Buy lemon juice of the contractor, on the purser's cash
Requires: not lemons_bought
Needs: cash £6 or more
Why not: The purser's cash will not run to it.
Effects: cash -£6 "Lemon juice, three kegs, of the contractor at Mahon"; store lemon_juice +3 "Bought of the contractor at Mahon"; set lemons_bought
Text: The contractor, the same Minorcan gentleman in black, has lemon juice in kegs at a price he describes as a kindness. Mr Hosken pays it out of the ship's money, and enters it.
Log: Bought lemon juice for the ship's company.

CHOICE: Buy onions and greens for the people, at your own charge
Requires: not greens_bought
Needs: money £3 or more
Effects: money -£3 "Onions and greens for the ship's company"; set greens_bought; start fresh_food; morale +1
Text: A boatload of onions and cabbages comes off to the ship that evening. The people eat them as if they had never seen a cabbage, which some of them have not, for months.

CHOICE: Return to the dockyard
Effects: pass 15 minutes
Next: dockyard_hub
</script>

<script type="text/plain" class="content" data-name="Events: The agent">
EVENT: crouch_intro
Title: Mr Crouch
Place: agent
Tags: agent
Once
Effects: set met_crouch

Mr Abel Crouch, merchant, navy agent and agent for prizes, late of Gibraltar, keeps a counting-house on the quay with a brass plate and three clerks. He is stout and grey and very civil, and he has done business with sea officers for thirty years without, so far as anyone knows, ever once being in a hurry.

'Captain {surname}. I had heard. The *{ship}*. Sit down, sir, sit down.'

CHOICE: Sit down
Next: agent_hub


EVENT: agent_hub
Title: Mr Crouch's Counting-House
Place: agent
Hub

The clerks scratch at their ledgers. Mr Crouch folds his hands upon his waistcoat and waits to learn what you want, though he very likely knows already.

[if agent_crouch] He is, as he likes to say, your man of business now.

CHOICE: Ask for an advance against your pay
Requires: not advance_crouch
Next: crouch_advance

CHOICE: Appoint him your agent for prizes
Requires: not agent_crouch, not agent_segui
Effects: set agent_crouch
Text: Mr Crouch draws up the letter of attorney himself, and you sign it. 'Two and a half per cent, sir, and every penny accounted for,' he says. 'You will find me slow. You will not find me short.'
Log: Appointed Mr Crouch of Mahon my agent.
Next: agent_hub

CHOICE: Ask him for the news of the port
Requires: not heard_crouch_news
Effects: set heard_crouch_news; pass 30 minutes
Chance 50, +30 if agent_crouch:
Effects: set rumour_barcelona_convoy
Text: Mr Crouch lowers his voice, though there is nobody to hear but his clerks. A coaster in from Barcelona last week reports a number of vessels collecting there, laden with wine and oil and waiting on an escort. 'It may be nothing,' he says. 'It very often is.'
Next: agent_hub
Otherwise:
Text: Mr Crouch tells you the price of oil, the state of the exchange on London, and that the Governor's cook has left him for the Admiral's. None of it seems likely to be of use.
Next: agent_hub

CHOICE: Take your leave
Next: mahon_hub


EVENT: crouch_advance
Title: An Advance
Place: agent

Mr Crouch is perfectly willing. Sea officers' pay is a slow thing, as he says, and a commander on a foreign station must live meanwhile. He will advance against your pay at five per cent, the most the law allows, and charge it to your account.

[if agent_crouch] Since you have named him your agent, he will advance a little more freely.

CHOICE: Take thirty pounds
Effects: set advance_crouch; money +£30 "Advanced by Mr Crouch against pay"; debt +£31 10s "Mr Crouch, thirty pounds advanced, with a year's interest"
Log: Drew £30 on Mr Crouch.
Next: agent_hub

CHOICE: Take sixty pounds
Needs: agent_crouch
Why not: He will advance so much only to an officer who has named him his agent.
Effects: set advance_crouch; money +£60 "Advanced by Mr Crouch against pay"; debt +£63 "Mr Crouch, sixty pounds advanced, with a year's interest"
Log: Drew £60 on Mr Crouch.
Next: agent_hub

CHOICE: Thank him, and take nothing
Next: agent_hub
</script>

<script type="text/plain" class="content" data-name="Events: At sea">
# ------------------------------------------------------------
# At sea. Time passes watch by watch. "Next: watches 6" sails
# up to six watches, stopping if anything tagged "sea" happens.
# Choices with no "Next:" come back to sea_hub.
# ------------------------------------------------------------

EVENT: stand_out
Title: Standing Out
Place: sea
Effects: put to sea; set good_offing; voyage outward; pass 2 hours

By the forenoon Mahon is a white smudge on the quarter, and the *{ship}* has {wind} and {sea}. The watches are set. The master lays off the course, and the purser's steward goes below to his casks.

[if not provisions_completed] Mr Hosken has made no complaint about the provisions, which is unlike a purser.

CHOICE: Stand on
Next: watches 1

CHOICE: Exercise the great guns while the light serves
Requires: after 08:00, before 16:00
Next: exercise_guns


EVENT: sea_hub
Title: At Sea
Place: sea
Hub
Chart

[if voyage outward, orders_convoy_toulon] She keeps company with her three victuallers, shortening sail every hour for the slowest of them, which is always the *Three Brothers*.

[if voyage outward, orders_despatches_hebe] The Admiral's packet is in your desk.

[if lying_course] She has {wind}, and is lying her course for {destination}: {distance} to run, by the master's reckoning.

[if beating] She has {wind}, dead foul for {destination}, and is beating up against it, board and board: {distance} to run, by the master's reckoning.

[if hove_to] She is hove to under a close-reefed main topsail, riding it out, with {wind} and {sea}.

[if sweeps] The sweeps are out, and the people are toiling at them in the heat.

[if voyage station] She is on her cruising ground, with {wind}, standing towards {destination}. There is not a sail in sight from the masthead, nor has there been all day.

[if anchored] She lies at anchor.

[if lying_off] She is lying off and on, waiting for daylight or a sight of the land.

[if land_in_sight, not voyage station] The land is in sight.

[if not voyage outward, not voyage homeward, not voyage station] She has {wind}, and {sea}.

[if press_of_sail] She is carrying a press of sail.

[if snug] She is snugged down under reefed topsails.

[if short_allowance] The people are on two-thirds allowance, and know it.

CHOICE: Stand on for a watch
Next: watches 1

CHOICE: Stand on until something happens
Next: watches 42

CHOICE: Make or shorten sail
Next: sail_orders

CHOICE: Ask the master what he makes of the weather
Next: master_forecast

CHOICE: Cast the lead
Next: sounding

CHOICE: Exercise the people aloft
Needs: day, force 6 or less
Why not: Not by night, nor in a seaway like this.
Effects: drill seamanship 1; pass 2 hours
Text: The people are sent aloft to loose and furl, reef and shake out, send down the topgallant yards and sway them up again, with {boatswain} timing every evolution and saying what he thinks of it.
Log: Exercised the people at making and shortening sail.

CHOICE: Invite the gunroom to dinner
Needs: after 12:00, before 17:00, cabin_stores 1 or more
Why not: Dinner is at three, and the cabin stores must run to it.
Next: gunroom_dinner

CHOICE: Release the master from arrest
Requires: master_arrested
Effects: clear master_arrested; master_loyalty +0.5
Text: {master} returns to his duty, sober, silent and correct.

CHOICE: Keep a good offing from the land
Requires: not good_offing
Effects: set good_offing
Text: The master is told to give every headland a wide berth, allowing for all the doubt in his reckoning. It will cost time. It will save the ship, one day.

CHOICE: Stand in closer to the land
Requires: good_offing
Effects: clear good_offing
Text: The master is told he may stand in as close as his chart allows.

CHOICE: Weigh anchor
Requires: anchored
Effects: clear anchored; pass 1 hour
Log: Weighed.

CHOICE: Make sail again
Requires: lying_off
Effects: clear lying_off

CHOICE: Exercise the great guns
Needs: after 08:00, before 16:00, force 5 or less
Why not: Not by night, nor in a seaway like this.
Next: exercise_guns

CHOICE: Order a survey of the provisions
Requires: not surveyed
Next: provisions_survey

CHOICE: Put the people to two-thirds allowance
Requires: not short_allowance
Effects: allowance short; set short_allowance; morale -1
Text: The order is given at dinner. Six men now draw what four drew before, and every one of them can do the sum. They will be paid the difference in money, eventually, which is something, and is not dinner.
Log: Put the ship's company to two-thirds allowance of all species.

CHOICE: Restore full allowance
Requires: short_allowance
Effects: allowance full; morale +1
Text: Full allowance is restored at dinner. It is the most popular order you have given.
Log: Restored the ship's company to full allowance.

CHOICE: Bear up for Mahon
Requires: not voyage homeward
Next: bear_up


EVENT: exercise_guns
Title: Exercising the Great Guns
Place: sea

The drum beats to quarters. The guns are cast loose, the gun captains take their stations, and Mr Treharne stands by you with his watch in his hand.

[if gunnery 2.2 or less] It is not a quick business. Half the crews are landmen who have never seen a gun fired, and the other half remember the late captain, who never fired one.

[if gunnery 3 or more] They are quicker than they were, and they know it.

[if gunner is gun_crank] {gunner} is everywhere at once, happier than you have seen him.

CHOICE: Go through the motions without powder
Effects: drill gunnery 1; pass 2 hours
Text: The guns are run in, sponged, loaded with nothing, run out and pointed at nothing, over and over, until the men can do it in the dark. It is dull, and it answers, up to a point.
Log: Exercised the great guns.

CHOICE: Fire three broadsides at a cask
Requires: not carronades
Needs: powder 1 or more
Effects: store powder -0.48 "Expended in exercising the great guns"; store shot6 -24 "Expended in exercising the great guns"; drill gunnery 2; pass 2 hours
Text: A cask with a flag on it is dropped astern. The first broadside is ragged and wide, the second less so, and the third knocks the flag away, though nobody will swear which gun did it.
Log: Exercised the great guns. Fired three broadsides at a mark.

CHOICE: Fire three broadsides at a cask
Requires: carronades
Needs: powder 1 or more
Effects: store powder -0.36 "Expended in exercising the great guns"; store shot18 -24 "Expended in exercising the great guns"; drill gunnery 2; pass 2 hours
Text: A cask with a flag on it is dropped astern. The carronades go off with a short, flat bang and a great deal of recoil. At three cables they throw wide; at one cable they would have smashed it to staves, as the gunner observes.
Log: Exercised the great guns. Fired three broadsides at a mark.

CHOICE: Pipe down; another day
Text: The guns are secured again. The people go back to their work, not all of them sorry.


EVENT: provisions_survey
Title: A Survey of the Provisions
Place: sea
Effects: survey; set surveyed; pass 2 hours

Mr Treharne, the master and the boatswain go down into the hold with the purser's steward, a lantern and a slate, and spend the watch among the casks. The purser goes with them, and does not enjoy it.

{survey}

[if survey_over] The hold holds more than the purser's books allow. Nobody says what that means. Nobody needs to.

CHOICE: Send for Mr Hosken
Requires: survey_over
Next: purser_confronted

CHOICE: Have the books corrected, and say nothing
Requires: survey_over
Effects: set purser_tolerated
Log: Held a survey on the provisions.

CHOICE: Sign the survey
Requires: not survey_over
Log: Held a survey on the provisions.


EVENT: purser_confronted
Title: Mr Hosken
Place: sea

Mr Hosken comes aft with his books, and stands with his hat in his hand while you put the question to him. He has his explanation ready: leakage allowed for and not suffered, the purser's eighth, the custom of the service, and the late captain, who understood these things.

CHOICE: Order the surplus issued to the people, as theirs by right
Effects: clear purser_skims; set purser_checked; morale +2
Text: He bows, and it is done, and the people know of it within the hour, as the people know of everything.
Log: Held a survey on the provisions. Ordered the provisions found over to be issued to the ship's company.

CHOICE: Tell him privately that it will stop
Chance 70:
Effects: clear purser_skims; set purser_checked
Text: 'Certainly, sir,' says Mr Hosken. And, so far as anyone can tell, it does.
Log: Held a survey on the provisions.
Otherwise:
Text: 'Certainly, sir,' says Mr Hosken.
Log: Held a survey on the provisions.

CHOICE: Accept his explanation
Effects: set purser_tolerated
Text: Mr Hosken thanks you. He has served under a great many captains, he says, and few have understood the business so well.
Log: Held a survey on the provisions.


EVENT: bear_up
Title: Bearing Up for Mahon
Place: sea

To leave your station before your time is a thing the Commander-in-Chief will want explained, in writing, at length.

[if water_days 10 or less] With the water as it stands, the explanation writes itself.

CHOICE: Bear up for Mahon
Requires: water_days 11 or more
Effects: voyage homeward; set left_station_early
Log: Bore up for Mahon.

CHOICE: Bear up for Mahon, for want of water
Requires: water_days 10 or less
Effects: voyage homeward; set returned_for_water
Log: Bore up for Mahon, for want of water.

CHOICE: Think better of it


EVENT: cruise_station
Title: The Coast of Catalonia
Place: sea
Tags: sea
Urgent
Once
Requires: outward_done, orders_cruise_catalan
Effects: voyage station

The masthead hails the deck: land, fine on the bow. By the change of the watch it is the coast of Catalonia, brown hills and a white town and a church on a headland, which the master names as near Cape San Sebastián, though he will not swear to it.

This is your cruising ground for six weeks. There is not a sail in sight.

CHOICE: Begin the cruise
Log: Made the coast of Catalonia. Began to cruise according to orders.


EVENT: despatches_delivered
Title: The Hebe
Place: sea
Tags: sea
Urgent
Once
Requires: outward_done, orders_despatches_hebe
Effects: voyage station

Off Barcelona you raise a frigate under easy sail and exchange the private signal, and she is the *Hebe*. You go across in the cutter with the packet in your coat. Captain Wyatt, a tall, grey, hurried man, signs for it on the capstan head, asks for the news of Mahon, and does not listen to the answer.

You are free now to cruise a fortnight on this coast.

CHOICE: Return aboard, and begin the cruise
Log: Spoke His Majesty's Ship Hebe off Barcelona. Delivered the Commander-in-Chief's packet into Captain Wyatt's hand and received his receipt.


EVENT: convoy_delivered
Title: The Squadron off Toulon
Place: sea
Tags: sea
Urgent
Once
Requires: outward_done, orders_convoy_toulon
Effects: voyage homeward

The topsails of the squadron rise over the horizon at last: four sail of the line and a frigate, standing off and on before a harbour you cannot see. The victuallers are delivered to the senior officer, who signs for three ships, so much beef and biscuit, and no great opinion of the escort.

CHOICE: Make sail for Mahon
Log: Joined the squadron off Toulon and delivered the victuallers to the senior officer.


EVENT: station_done
Title: Time Expired
Place: sea
Tags: sea
Urgent
Once
Requires: station_done
Effects: voyage homeward

Your time on the station is up. The master lays off the course for Mahon without being asked, and the people, who can count days as well as anyone, are cheerful at their work for the first time in a week.

CHOICE: Bear up for Mahon
Log: The time of cruising being expired, bore up for Mahon.


EVENT: sail_orders
Title: Sail and Helm
Place: sea

The officer of the watch waits for your orders. The ship has {wind} and {sea}.

[if beating] She is close-hauled, beating to windward, and the question is how she is to go about: tacking is quicker, if she will come round; wearing is surer, and loses ground.

CHOICE: Crack on: carry every stitch she will bear
Requires: not press_of_sail, force 1 or more
Effects: set press_of_sail; clear snug; clear hove_to
Text: Topgallants and royals go up, the reefs are shaken out, and she lies down to it with the water roaring under her lee bow. Mr Treharne looks aloft, and then at you, and says nothing.

CHOICE: Plain sail, reefed as the weather requires
Requires: press_of_sail
Effects: clear press_of_sail
Text: The light sails come in, and she rides easier at once.

CHOICE: Snug her down under reefed topsails
Requires: not snug, force 4 or more
Effects: set snug; clear press_of_sail; clear hove_to
Text: Topsails are reefed and the light yards sent down on deck. She goes slower, and a great deal more comfortably.

CHOICE: Make plain sail again
Requires: snug
Effects: clear snug
Text: The reefs are shaken out.

CHOICE: Heave to, and ride it out
Requires: force 7 or more, not hove_to
Effects: set hove_to; clear press_of_sail; set snug
Text: She is brought to under a close-reefed main topsail, her head a few points off the wind, and lies there like a gull, rising and falling, making no way at all.
Log: Hove to.

CHOICE: Get out the sweeps
Requires: force 1 or less, not sweeps
Effects: set sweeps
Text: The sweeps are got out through the ports, and the people are told off to them by watches. She moves, at something better than a mile and a half an hour, and the men at the looms curse every yard of it.

CHOICE: Tack when she must go about
Requires: wear_ship
Effects: clear wear_ship
Text: She will tack, and take her chance of missing stays.

CHOICE: Wear rather than tack, while this lasts
Requires: not wear_ship
Effects: set wear_ship
Text: She will wear round, which is slow and certain, rather than tack, which is quick and is not.


EVENT: master_forecast
Title: The Master's Opinion
Place: sea
Effects: forecast

{master} comes up and looks at the sky, the sea, the set of the clouds and the dog-vane, in that order, and sucks his teeth.

[if surgeon is natural_philosopher] {surgeon}, who has followed him up with his barometer, adds a remark about the mercury, which the master ignores.

{forecast}

CHOICE: Thank him


EVENT: missed_stays
Title: Missed Stays
Place: sea
Tags: sea
Urgent
Requires: missed_stays

'Ready about!' The helm goes down, and the *{ship}* comes up into the wind, the sails shivering, the sea slamming at her bows; and there she hangs, losing way, until the sails fill aback and she falls off again on the old tack. She has missed stays, and lost the best part of a mile.

CHOICE: Wear her round, and lose the ground
Effects: clear missed_stays
Text: She is put before the wind and brought round on the other tack in a long, slow circle. It is not seamanlike, and it answers.

CHOICE: Try her again
Effects: clear missed_stays
Chance 55, +8 per seamanship, -15 if force 8 or more:
Text: This time the headsails are let fly at the right moment, and she comes round like a lady.
Otherwise:
Effects: running_rigging -3; sails -3
Text: She misses again, and this time she is taken aback, with her sails pressed back against the masts and her stern going astern, and everything aloft groaning. She is got round in the end, at the cost of some cordage and a good deal of canvas.

CHOICE: Wear rather than tack, while this lasts
Effects: clear missed_stays; set wear_ship
Text: The order is passed: she will wear in future, until the weather moderates. Nobody aboard is sorry.


EVENT: gale
Title: Blowing Hard
Place: sea
Tags: sea
Urgent
Once per spell
Requires: at_sea, force 8 or more, not hove_to

It is blowing a gale, and getting up. The sea is high and steep, the decks are never dry, and every so often a green sea comes aboard over the bows and goes aft knee-deep along the waist.

[if press_of_sail] She is still carrying a press of sail, and Mr Treharne has been looking aloft for the last half-hour with an expression you know well.

CHOICE: Heave to under a close-reefed main topsail
Effects: set hove_to; set snug; clear press_of_sail
Text: She is brought to, and lies there, rising to the seas, making no way and taking no harm.
Log: Hove to.

CHOICE: Snug her down and keep her going
Effects: set snug; clear press_of_sail
Text: Topsails are close-reefed and the topgallant masts got down on deck. She goes on, wet and labouring, but she goes.

CHOICE: Crack on regardless
Effects: set press_of_sail; clear snug
Text: She goes on under all the canvas she will bear and a little more. Everything aloft is complaining, and so is Mr Treharne, under his breath.


EVENT: carried_away
Title: Carried Away
Place: sea
Tags: sea
Watch chance: 10, +12 if force 9 or more, +12 if press_of_sail
Requires: at_sea, force 7 or more, not snug, not hove_to, not fore_sprung

There is a crack like a gun from forward. The fore-topmast is sprung just above the cap, and the whole top-hamper of the foremast is swaying in a way that makes everyone below it look up.

CHOICE: Fish it where it stands
Effects: set fore_sprung; set snug; clear press_of_sail; pass 1 hour
Text: The carpenter and the boatswain splint it with a pair of capstan bars and woolding, and the fore-topsail is set again close-reefed. It will hold, says the carpenter, if nobody asks too much of it.
Log: Sprung the fore-topmast. Fished it.

CHOICE: Send it down and get up the spare
Needs: spars 1 or more
Why not: There is no spare spar left to get up.
Effects: store spars -1 "Expended in replacing the fore-topmast"; pass 1 watch
Text: It takes the whole watch, in that sea, and a man is nearly lost from the fore-top doing it; but by the change of the watch the new topmast is fidded and rigged, and the old one is lashed on the booms.
Log: Sprung the fore-topmast. Sent it down and got up a new one.


EVENT: strained
Title: She Is Working
Place: sea
Tags: sea
Watch chance: 6, +8 if press_of_sail
Requires: at_sea, force 8 or more, not hove_to
Effects: leak +2; hull -3

The carpenter comes aft, wet to the skin, to report that she is working badly in this sea: the seams are opening along the waterline and she makes {leak} inches an hour.

CHOICE: Ease her
Effects: set snug; clear press_of_sail
Text: Sail is shortened, and she rides easier, though the pumps do not stop.

CHOICE: Keep her as she is, and keep the pumps going
Text: The pumps go on clanking through the watch.


EVENT: sail_blown
Title: A Sail Blown Out
Place: sea
Tags: sea
Watch chance: 6, +10 if press_of_sail
Requires: at_sea, force 7 or more, not snug, not hove_to
Effects: sails -5; store canvas -1 "Expended in repairing sails blown out"

A heavy gust strikes her, and the main-topsail goes out of its bolt-ropes with a report like a broadside, and streams away to leeward in ribbons.

CHOICE: Bend another, and shorten sail
Effects: set snug; clear press_of_sail; pass 1 hour
Log: Split and lost the main-topsail. Bent another.

CHOICE: Bend another, and carry on
Effects: pass 1 hour
Log: Split and lost the main-topsail. Bent another.


EVENT: becalmed
Title: Becalmed
Place: sea
Tags: sea
Urgent
Once per spell
Requires: at_sea, force 1 or less, not voyage station

The wind has died away to nothing. The sails hang from the yards, slatting as she rolls on the long oily swell; the tar softens in the seams, and the pitch bubbles. She has not steerage way.

CHOICE: Get out the sweeps
Effects: set sweeps
Text: The sweeps are got out, and the people are told off to them by watches. She creeps on.

CHOICE: Wait for a wind
Text: The old hands whistle for one, softly, over the taffrail. Nothing comes.


EVENT: mistral_comes
Title: The Mistral
Place: sea
Tags: sea
Urgent
Once per spell
Requires: at_sea, weather mistral

It comes down out of the north-west with very little warning: a line of white water on the horizon, then a cold so sharp it makes the eyes water, then the wind, all at once, laying her over until her lee guns are under. The sky is scoured clean and hard as glass.

[if snug] She is already snugged down, and takes it well.

CHOICE: Shorten sail in good time
Effects: set snug; clear press_of_sail
Text: Topsails are reefed and topgallant yards sent down. She steadies.

CHOICE: Hold on as you are
Text: She holds on, labouring.


EVENT: levanter_haze
Title: A Levanter
Place: sea
Tags: sea
Urgent
Once per spell
Requires: at_sea, weather levanter

The wind has gone round into the east, damp and gusty, and brought a haze with it that shuts in the horizon to a mile or two. The masthead can see no further than the deck. Anything might be out there, and nothing can be seen.

CHOICE: Double the lookouts
Text: Lookouts are doubled. They see the haze in more detail.


EVENT: sirocco_heat
Title: The Sirocco
Place: sea
Tags: sea
Urgent
Once per spell
Requires: at_sea, weather sirocco

The wind has come round into the south, hot and heavy, straight off Africa. Everything is damp and nothing dries; a fine red dust settles on the sails and the decks, and the people go about their work in a sullen, listless way that has nothing to do with discipline.

CHOICE: Rig awnings and windsails
Text: Awnings are spread over the quarterdeck and the waist, and windsails rigged to send a little air down into the berth-deck. It is not much. It is noticed.


EVENT: sounding
Title: The Lead
Place: sea
Effects: sound; pass 30 minutes

The leadsman goes into the chains, the line is coiled down, and the lead goes over with its hollow armed with tallow, to bring up a sample of the bottom.

{soundings}

[if no_bottom] It tells you only that she is well off the land, which is something.

[if not no_bottom] The master compares it with the soundings on his chart, and marks her position afresh. He seems a little easier.

CHOICE: Very good


EVENT: closing_land
Title: Closing the Land in the Dark
Place: sea
Tags: sea
Urgent
Requires: closing_land, night

It is dark, and by the master's reckoning the land lies close ahead of her. His reckoning may be out by {circle} either way, and he says so.

[if weather levanter] The haze is so thick you cannot see the bowsprit end.

[if land_in_sight] There is something darker than the dark to leeward, which may be land or may be cloud.

CHOICE: Heave to, and lie off and on until daylight
Effects: set lying_off; clear closing_land
Log: Hauled off, and lay off and on till daylight.

CHOICE: Stand on under easy sail, with the lead going
Effects: set standing_on; set lead_going; clear closing_land
Text: The leadsman takes his place in the chains, and the deep-sea lead is hove at every glass. She goes on slowly, feeling her way.

CHOICE: Stand on as you are
Effects: set standing_on; clear closing_land
Text: You give the order. The master says nothing, which says a good deal.


EVENT: breakers
Title: Breakers Ahead
Place: sea
Tags: sea
Urgent
Requires: breakers, not aground

'Breakers ahead!' The cry comes from the forecastle, high and sharp, and then you hear them yourself: the long roar and suck of the sea on rocks, somewhere close under the lee bow.

CHOICE: Wear her round, and stand off
Effects: clear breakers; stand off; clear standing_on
Text: The helm goes up, the yards are braced round, and she pays off and comes round, heeling, with the noise of the surf going away astern. Nobody speaks for some time.
Log: Breakers ahead. Wore, and stood off.

CHOICE: Let go the anchor
Effects: clear breakers; set anchored; sound; clear standing_on
Text: The anchor goes down with a roar of cable, and brings her up all standing. {soundings}
Log: Breakers ahead. Let go the best bower.


EVENT: aground
Title: She Strikes
Place: sea
Tags: sea
Urgent
Requires: aground

There is a long, grinding shudder through the whole ship, a crash from forward as something carries away aloft, and she stops. She is aground. The carpenter is already on his way to the well.

[if lee_shore] And the wind is driving her harder on with every sea.

CHOICE: Carry out a kedge in the launch and heave her off
Chance 50, +8 per seamanship, -25 if lee_shore, -15 if force 7 or more:
Effects: refloat; pass 2 hours
Text: The kedge is carried out astern, the hawser brought to the capstan, and the people heave until their hearts crack. Slowly, then all at once, she slides off into deep water.
Log: Got the ship off, by carrying out a kedge.
Otherwise:
Effects: pass 2 hours
Text: The kedge comes home through the bottom, twice. She will not move.
Next: aground_hard

CHOICE: Lighten her: start the water and heave guns overboard
Chance 80, -25 if lee_shore, -15 if force 8 or more:
Effects: store water -12 "Started overboard to lighten the ship"; guns -4; refloat; pass 3 hours
Text: The water is started and pumped over the side, and four guns go after it, one by one, with the gunner watching every one. Lightened, she lifts on a sea and comes off.
Log: Got the ship off, by starting the water and heaving four guns overboard.
Otherwise:
Effects: store water -12 "Started overboard to lighten the ship"; guns -4; pass 3 hours
Text: The water goes, and four guns after it, and still she does not lift.
Next: aground_hard


EVENT: aground_hard
Title: Hard and Fast
Place: sea
Effects: hull -10; leak +6

She lies hard and fast, working on the bottom with every sea, and the carpenter reports {leak} inches of water an hour and rising.

CHOICE: Try again with everything you have
Chance 40, +8 per seamanship, -25 if lee_shore:
Effects: refloat; pass 3 hours
Text: With the kedge, the capstan, the boats towing ahead and every man on the bars, she comes off at last at the top of a sea, leaking badly but afloat.
Log: Got the ship off with great difficulty, much damaged.
Otherwise:
Next: wrecked

CHOICE: Get the people ashore while she holds together
Next: wrecked


EVENT: wrecked
Title: The Loss of the Ship
Place: sea
Ending
Effects: log "The ship was lost."

The *{ship}* is gone. She broke her back on the second night, and what the sea left of her the people of the coast have had since.

A court-martial will sit on the loss of the King's ship, as one always does. That is still to be built. Your log stands below, and the court will read every word of it.


EVENT: lee_shore
Title: A Lee Shore
Place: sea
Tags: sea
Urgent
Once per spell
Requires: lee_shore, at_sea, not aground

It is blowing hard, and the land is under her lee: {lee_distance} off, by the master's best guess, and every sea setting her nearer. She must claw off to windward, against the gale, or go ashore.

CHOICE: Claw off under a press of sail
Effects: set press_of_sail; clear snug; clear hove_to; stand off
Text: Close-reefed topsails and courses are set, more than she ought to carry, and she lies over with her lee rail in the sea, clawing up to windward a cable at a time.

CHOICE: Let go both anchors, and ride it out
Effects: set anchored; clear hove_to; sound
Text: Both bowers go down. {soundings} She brings up, snubbing at her cables, with the surf in plain hearing astern.

CHOICE: Heave to, and trust to her drift
Effects: set hove_to
Text: She is hove to. She drifts to leeward, slowly, towards the land.


EVENT: nothing_in_sight
Title: Nothing in Sight
Place: sea
Tags: sea
Urgent
Requires: nothing_in_sight, not lying_off, not run_west, not run_east

By the master's reckoning she should be up with {destination} by now. There is nothing in sight from the masthead but sea.

The master's noon sight has given him his latitude, near enough; it is the longitude he cannot answer for. He believes the current hereabouts sets {current}.

CHOICE: Run down the latitude to the westward
Effects: set run_west; clear run_east; clear nothing_in_sight
Text: She bears up and runs due west along the parallel, with a good lookout at every masthead. Sooner or later, if the latitude is right, the land must come up ahead.
Log: Not having made the land, ran down the latitude to the westward.

CHOICE: Run down the latitude to the eastward
Effects: set run_east; clear run_west; clear nothing_in_sight
Text: She bears away and runs due east along the parallel, with a good lookout at every masthead.
Log: Not having made the land, ran down the latitude to the eastward.

CHOICE: Lie off and on until you can make the land
Effects: set lying_off; clear nothing_in_sight
Log: Not having made the land, lay off and on.

CHOICE: Cast the lead
Effects: clear nothing_in_sight
Next: sounding


EVENT: off_mahon_night
Title: Mahon in the Dark
Place: sea
Tags: sea
Urgent
Requires: off_port_night, night, not lying_off

The *{ship}* is off Mahon, by the reckoning and by the loom of the land, but it is dark, and the entrance is narrow and has a rock in the middle of it.

CHOICE: Lie off and on until daylight
Effects: set lying_off; clear off_port_night
Log: Off Port Mahon. Lay off and on till daylight.

CHOICE: Run in by night
Chance 50, +10 per master_skill:
Effects: set homeward_done; clear off_port_night
Text: The master takes her in himself, by the lead and the loom of the cliffs, and she comes to in the harbour with a foot to spare and nobody breathing.
Otherwise:
Effects: set aground; clear off_port_night; hull -10; leak +6
Text: She touches on the ledge at the harbour mouth, hard, and sticks.


EVENT: bad_cask
Title: A Cask Found Bad
Place: sea
Tags: sea
Urgent
Requires: bad_cask

The purser's steward comes aft with his hat in his hand. The {bad_item}, No. {bad_no}, is found on opening to be {bad_word}.

He would like to know whether it is to be surveyed and condemned, or issued, it being, as he says, no worse than some.

CHOICE: Order a survey, and have it condemned
Effects: condemn; clear bad_cask; pass 1 hour
Text: Mr Treharne, the master and the boatswain survey it with their noses and condemn it in writing. It goes over the side, and the purser's account is the lighter by what was left in it.
Log: Surveyed and condemned {bad_item}, No. {bad_no}.

CHOICE: Have it issued all the same
Effects: clear bad_cask; set issued_bad; morale -1
Text: It is issued. The people say what they think of it, at length, and the Navy is the richer by what it would have cost.


EVENT: water_low
Title: The Water
Place: sea
Tags: sea
Urgent
Once
Requires: at_sea, water_days 10 or less, not voyage homeward

The master reports that there are {water_days} days' water remaining at the present allowance, and not a drop more, and that he thought you would wish to know.

CHOICE: Put the people to two-thirds allowance
Requires: not short_allowance
Effects: allowance short; set short_allowance; morale -1
Log: Put the ship's company to two-thirds allowance, the water being short.

CHOICE: Bear up for Mahon
Effects: voyage homeward; set returned_for_water
Log: Bore up for Mahon, for want of water.

CHOICE: Stand on as you are


EVENT: water_out
Title: The Last of the Water
Place: sea
Tags: sea
Urgent
Once
Requires: at_sea, water_days 0 or less
Effects: set water_ran_out; morale -2; standing -1

The master reports that the last butt was started this forenoon and is now empty. The people have wine, and the wine will last a while; but there is no water to boil the beef in, and they are already saying so.

CHOICE: Crack on for Mahon with every stitch she will carry
Requires: not voyage homeward
Effects: voyage homeward
Log: The water being expended, bore up for Mahon.

CHOICE: Crack on for Mahon with every stitch she will carry
Requires: voyage homeward


EVENT: bread_low
Title: The Bread
Place: sea
Tags: sea
Urgent
Once
Requires: at_sea, biscuit_days 7 or less, not voyage homeward

Mr Hosken reports, with every appearance of regret, that there is bread for {biscuit_days} days at the present allowance, and no more.

CHOICE: Put the people to two-thirds allowance
Requires: not short_allowance
Effects: allowance short; set short_allowance; morale -1
Log: Put the ship's company to two-thirds allowance, the bread being short.

CHOICE: Bear up for Mahon
Effects: voyage homeward; set returned_for_bread
Log: Bore up for Mahon, for want of bread.

CHOICE: Stand on as you are


EVENT: short_weight
Title: Short Weight
Place: sea
Tags: sea
Once
Weight: 2
Requires: purser_skims, day 4 or more, not purser_checked

At dinner the cooks of three messes come aft together, which is itself a thing to notice, and stand at the break of the quarterdeck with a piece of beef on a platter. It is, they say, a four-pound piece, and it is not.

CHOICE: Have it weighed in your presence
Effects: set short_weight_proved; morale +1
Text: The purser's steward brings his scales. The piece weighs three pounds and a little over. The steward says that meat shrinks in the boiling, which is true, and that the scales are the Navy's, which is also true. The messes go forward satisfied that they have been heard, if nothing else.
Log: Heard a complaint of the ship's company of short weight in the beef.

CHOICE: Refer them to the purser
Effects: morale -1
Text: They go, and Mr Hosken explains the purser's eighth to them, and they come away knowing exactly what they knew before.

CHOICE: Send them forward with a flea in their ear
Effects: morale -2; set men_rebuffed
Text: They go forward. Complaining in a body is near enough to mutiny that they will not try it twice. They will not forget it, either.


EVENT: leak_found
Title: The Carpenter's Report
Place: sea
Tags: sea
Once
Requires: day 4 or more
Effects: leak +3

{carpenter} comes aft at the change of the watch to report that she is making more water than she did: {leak} inches an hour, and the pumps going for half of every watch to keep her free.

CHOICE: Have him search for it
Effects: pass 1 watch
Chance 30, +8 per carpenter_skill:
Effects: leak -3
Text: He finds it at last in the fore peak: a treenail started under the bows, and the sea coming in round it in a thin, steady stream. He plugs it, and she is easier at once.
Log: The carpenter found and stopped a leak in the bows.
Otherwise:
Text: He searches for a whole watch with a candle and a mallet, and finds nothing he can come at from inside the ship.

CHOICE: Keep the pumps going
Text: The pumps go on clanking. The people pump, and say what people at pumps say.


EVENT: rats_bread
Title: Rats in the Bread-Room
Place: sea
Tags: sea
Once
Requires: day 3 or more
Effects: store biscuit -1 "Destroyed by rats in the bread-room"

The purser's steward reports that the rats have got into the bread-room, through a hole nobody knew of, and have spoilt a whole bag of biscuit before anyone found them out.

CHOICE: Have the bread-room cleared and smoked
Effects: pass 1 watch; set bread_room_smoked
Text: The bread is got up, the bread-room smoked with brimstone, and the hole nailed over with tin. A good many rats come out of it. The ship's boys are paid a penny a tail.

CHOICE: Ask whether there is a cat aboard
Text: There are, it emerges, three, all of them belonging to the gunroom and none of them interested.


EVENT: topsail_split
Title: A Split Topsail
Place: sea
Tags: sea
Once
Requires: day 2 or more, force 5 or more
Effects: sails -4

In a sudden squall the fore-topsail splits from head to foot with a noise like a gun, and flogs itself to rags before the men aloft can master it.

CHOICE: Bend the spare topsail, and set the sailmaker to the old one
Effects: store canvas -1 "Expended in repairing the fore-topsail"; pass 1 hour
Text: The new sail is bent and set within the hour, which is not bad for this crew. The sailmaker sits in the waist with the old one across his knees for three days.
Log: In a squall split the fore-topsail. Bent another.


EVENT: home_arrival
Title: Here the Log Breaks Off
Place: harbour
Tags: sea
Urgent
Once
Ending
Requires: homeward_done
Effects: clear at_sea; log "Came to in Mahon harbour, and moored."

The *{ship}* comes up the long harbour of Mahon and moors off the hospital on {date}.

[if left_station_early] Mr Pardoe will want to know why she is back before her time.

[if returned_for_water] She has come back for water, which is a reason the Admiral has heard before.

[if water_ran_out] She came in with her water out, and the people know whose fault that is.

The wind, the chart and the enemy are still to be built. Your log stands below, and the ship's books are under Books.
